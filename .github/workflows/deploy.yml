name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build Docusaurus docs
      - name: Install docs dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build docs website
        working-directory: ./docs
        run: npm run build
        env:
          NODE_ENV: production

      # Build HonKit book
      - name: Install book dependencies
        working-directory: ./book
        run: npm install

      - name: Build book
        working-directory: ./book
        run: npx honkit build

      # Combine outputs: docs at root, book at /book
      - name: Combine sites
        run: |
          mkdir -p ./combined
          cp -r ./docs/build/* ./combined/
          cp -r ./book/_book ./combined/book

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
