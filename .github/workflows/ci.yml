name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  field-guide-lint:
    name: Field Guide Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run field guide linter
        run: |
          set +e
          uv run --project scripts scripts/lint_field_guides.py --lint-only --quiet
          exit_code=$?
          set -e
          # Exit 0 = clean, 1 = errors (fail), 2 = warnings only (pass)
          if [ $exit_code -eq 1 ]; then
            echo "::error::Field guide lint found errors"
            exit 1
          fi
