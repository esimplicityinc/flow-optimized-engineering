apiVersion: katalyst.taxonomy.plugins.commitguard/v1alpha
kind: CommitGuardBinding
metadata:
  name: pre-commit-k8s-kustomize
  labels:
    tool: pre-commit
    layerType: k8s-kustomize
spec:
  description: Pre-commit hooks for Kustomize Kubernetes manifest layers.
  actions:
    - action: lint
      stage: pre-commit
    - action: validate
      stage: pre-commit
---
