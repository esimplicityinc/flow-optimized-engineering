apiVersion: katalyst.taxonomy.plugins.commitguard/v1alpha
kind: CommitGuardBinding
metadata:
  name: pre-commit-app-docker
  labels:
    tool: pre-commit
    layerType: app-docker
spec:
  description: Pre-commit hooks for Docker container build layers.
  actions:
    - action: lint
      stage: pre-commit
    - action: security-scan
      stage: pre-commit
    - action: build
      stage: pre-push
  additionalHooks:
    - name: hadolint
      run: hadolint base/Dockerfile
      files: "Dockerfile"
      stage: pre-commit
---
