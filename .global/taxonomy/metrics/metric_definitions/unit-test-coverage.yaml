apiVersion: katalyst.taxonomy/v2alpha
kind: metric_definition
metadata:
  name: unit-test-coverage
  annotations:
    foe.source: 'QDAS practices: Development - Standards, Measures'
spec:
  title: Unit test coverage
  unit: percentage
  direction: higher_is_better
  category: quality
  aggregation: mean
  description: 'The percentage of production code that unit tests cover, for each
    deployable component of a team. Why: code without unit tests can change without
    control, and nobody knows.'
  owners:
  - aaron.west@esimplicity.com
