apiVersion: katalyst.taxonomy/v2alpha
kind: metric_definition
metadata:
  name: resource-naming-compliance
  annotations:
    foe.source: 'QDAS practices: DevOps - Standards, Measures'
spec:
  title: Resource naming compliance
  unit: percentage
  direction: higher_is_better
  category: consistency
  aggregation: mean
  description: 'The percentage of cloud resources that obey the standard naming rules.
    Why: standard names let people and tools find the owner and the purpose of each
    resource.'
  owners:
  - aaron.west@esimplicity.com
