apiVersion: katalyst.taxonomy/v2alpha
kind: metric_definition
metadata:
  name: resources-as-code
  annotations:
    foe.source: 'QDAS practices: DevOps - Standards, Measures'
spec:
  title: Resources implemented as code
  unit: percentage
  direction: higher_is_better
  category: automation
  aggregation: mean
  description: 'The percentage of the resources and configuration of a system that
    infrastructure code makes. Why: a resource that a person made by hand cannot be
    reviewed, made again or rolled back.'
  owners:
  - aaron.west@esimplicity.com
