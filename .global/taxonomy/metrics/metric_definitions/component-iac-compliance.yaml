apiVersion: katalyst.taxonomy/v2alpha
kind: metric_definition
metadata:
  name: component-iac-compliance
  annotations:
    foe.source: 'QDAS practices: DevOps - Standards, Measures'
spec:
  title: Component infrastructure code compliance
  unit: percentage
  direction: higher_is_better
  category: consistency
  aggregation: mean
  description: 'The percentage of the infrastructure code of a deployable component
    that obeys the infrastructure-as-code standards: pinned modules, shared modules,
    and no modules from public repositories. Why: infrastructure code that does not
    obey the standards loses the safety of shared, pinned modules.'
  owners:
  - aaron.west@esimplicity.com
