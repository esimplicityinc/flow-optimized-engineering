apiVersion: katalyst.taxonomy/v2alpha
kind: standard
metadata:
  name: "terraform-standards"
  annotations:
    foe.source: "QDAS practices: Terraform / Terragrunt Standards"
spec:
  title: "Terraform and Terragrunt standards"
  category: "operability"
  status: "active"
  priority: "high"
  enforcement: "review"
  rationale: "A composite module per stack keeps environments identical except where they are meant to differ, and makes that difference reviewable."
  description: "- **Module sourcing.** Modules are never sourced directly from the internet. They come from the\n  shared module library, pinned to a stable version.\n- **Style.** Terraform follows the\n  [Gruntwork Terraform style guide](https://docs.gruntwork.io/guides/style/terraform-style-guide/).\n- **Layout.** Each stack has an IaC layer that holds all of its IaC. Within it, one *composite*\n  Terraform module applies to every environment, and a folder per environment holds what differs.\n  Where Terragrunt's YAML files go depends on how the repositories are organised.\n\n### Requirements\n\n| Requirement | Detail | Enforcement | Threshold |\n|---|---|---|---|\n| Each stack has one composite module and a folder per environment | A stack's IaC layer has a composite module applied to all environments, and a folder per environment. | advisory |  |\n| Terraform follows the style guide | Terraform follows the Gruntwork Terraform style guide. | advisory |  |\n"
  owners:
    - "aaron.west@esimplicity.com"
