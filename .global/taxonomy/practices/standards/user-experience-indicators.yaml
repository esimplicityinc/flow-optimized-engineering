apiVersion: katalyst.taxonomy/v2alpha
kind: standard
metadata:
  name: user-experience-indicators
  annotations:
    foe.source: 'QDAS practices: Observability Standards'
spec:
  title: Each deployable component must measure the user experience
  category: observability
  status: active
  priority: high
  enforcement: review
  rationale: The infrastructure can be healthy when users cannot do their tasks. Only
    the user experience shows this problem.
  description: '**Standard.** Each deployable component must have an availability/status
    indicator and a performance/health indicator, measured as its users or client
    systems see it.


    **Applies to:** each deployable component that users or other systems call.


    **Conforms when:** the two indicators collect data from the side of the user (for
    example, with a synthetic monitor), and the dashboard of the component shows them.


    **Terms:**


    - **Deployable component:** a service, application, job or pipeline that you build,
    deploy and run as one unit.

    - **Indicator:** a type of measurement: availability/status, performance/health,
    capacity or usage. See [Indicators](indicators).

    - **Synthetic monitor:** an automated test that examines the live system on a
    schedule.

    '
  owners:
  - aaron.west@esimplicity.com
