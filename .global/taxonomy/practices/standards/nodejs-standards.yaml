apiVersion: katalyst.taxonomy/v2alpha
kind: standard
metadata:
  name: "nodejs-standards"
  annotations:
    foe.source: "QDAS practices: Node.js Standards"
spec:
  title: "Node.js and TypeScript standards"
  category: "maintainability"
  status: "active"
  priority: "high"
  enforcement: "review"
  rationale: "One way of writing and packaging Node services means a developer moving between them changes nothing but the code they came to change."
  description: "A Node.js project is written in TypeScript, linted and formatted by tools that run on save and on\ncommit, and packaged so that its deployment carries only what it runs.\n\n- **TypeScript only.** Static typing catches errors early, improves tooling (completion,\n  navigation) and allows modern ECMAScript while staying compatible. A project contains no `*.js`\n  source files.\n- **Shared editor settings.** A `.vscode` folder at the root holds workspace settings (tab size,\n  format on save, update imports on move) and recommended extensions, so every developer starts\n  from the same configuration.\n- **Lint and format.** ESLint (the XO style guide is recommended: strict and readable) with\n  Prettier. Their configuration may live in `package.json`.\n- **Git hooks.** `husky` runs `lint-staged` on commit, so only staged files are checked. Disable\n  the hooks in CI, Docker and production installs.\n- **Frameworks.** Fastify is the recommended backend framework; React (or a framework built on it)\n  for frontends; Vitest for unit tests.\n- **package.json.** Has a `build` script that compiles TypeScript. `dependencies` holds only what a\n  deployment needs; testing, typing and build libraries go in `devDependencies`.\n- **Docker.** Order the Dockerfile to make the most of layer caching, and expose the port for\n  isolated development. Docker Compose supplies the environment variables a developer would\n  otherwise set up by hand.\n- **Monorepos.** The linter, formatter and git-hook packages live in the root `package.json`.\n\n### Requirements\n\n| Requirement | Detail | Enforcement | Threshold |\n|---|---|---|---|\n| Projects are 100% TypeScript | A Node.js project contains no *.js source files. | required |  |\n| ESLint and Prettier lint and format | Projects lint with ESLint and format with Prettier. | required |  |\n| Staged files are linted on commit | husky and lint-staged lint and format staged files on commit. | advisory |  |\n| dependencies holds only runtime packages | A deployment installs only what it runs: test, typing and build libraries are devDependencies. | required |  |\n"
  owners:
    - "aaron.west@esimplicity.com"
