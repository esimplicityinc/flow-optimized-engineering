apiVersion: katalyst.taxonomy/v2alpha
kind: standard
metadata:
  name: "ci-cd-standards"
  annotations:
    foe.source: "QDAS practices: CI/CD - Standards"
spec:
  title: "CI/CD standards"
  category: "delivery"
  status: "active"
  priority: "high"
  enforcement: "review"
  rationale: "Small changes, integrated often, through pipelines that are always green, are what make it safe to deploy many times a day."
  description: "How change moves through pipelines. Each item is either a **requirement** (`required`), which teams\nmust meet, or a **standard** (`advisory`), the target teams work towards.\n\n| Area | Requirement | Standard |\n|---|---|---|\n| Commit early, commit often | Commit and integrate to main at least once per sprint | Commit and integrate to main daily |\n| Pipeline run frequency | Run pipelines often enough to keep them healthy | Run dev pipelines once a day |\n| Keep pipelines green | Fix a broken pipeline within an agreed time; commit nothing else until it is green; roll back if it cannot be fixed in time | |\n| Branching | Never deploy to production without testing in a lower environment | Use trunk-based development |\n| Build once | | Build an artifact (image, library, package) once, upload it to a registry, and deploy that artifact to every environment |\n| Clean non-production environments | Non-production environments can be destroyed and re-created with minimal (preferably no) manual effort | |\n| DRY configuration | Configuration is written once, in a composite file, and parameterised per environment | |\n| Secret management | Secrets are never stored in git repositories | Secrets live in a managed secret store |\n"
  owners:
    - "aaron.west@esimplicity.com"
