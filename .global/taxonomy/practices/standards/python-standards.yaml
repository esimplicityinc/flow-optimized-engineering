apiVersion: katalyst.taxonomy/v2alpha
kind: standard
metadata:
  name: "python-standards"
  annotations:
    foe.source: "QDAS practices: Python Standards"
spec:
  title: "Python standards"
  category: "maintainability"
  status: "active"
  priority: "high"
  enforcement: "review"
  rationale: "One toolchain for every Python stack means any developer can build, test and lint any of them with the same commands."
  description: "Python follows **PEP 8** as its style guide, applied by an auto-formatter (such as `autopep8`) in\nthe editor and on the command line, so style is never a review comment.\n\n| Concern | Tool |\n|---|---|\n| Python version | `pyenv` |\n| Packaging and dependencies | `poetry` |\n| Tests across environments | `tox` (wrapping `pytest`) |\n| Hooks before commit | `pre-commit` |\n"
  owners:
    - "aaron.west@esimplicity.com"
