apiVersion: katalyst.taxonomy/v2alpha
kind: practice
metadata:
  name: "infrastructure-as-code-delivery"
  annotations:
    foe.source: "QDAS practices: DevOps - Strategy; DevOps - Framework; DevOps - Standards; Terraform / Terragrunt Standards (layout)"
spec:
  title: "Infrastructure as code"
  practice_area: "platform-operations"
  enforcement: "required"
  standards:
    - "iac-standards"
  methods:
    - "system-taxonomy"
    - "infrastructure-as-code"
    - "shared-iac-modules"
  measures:
    - "resources-as-code"
    - "resource-naming-compliance"
    - "stack-iac-compliance"
    - "security-findings-on-resources"
  description: "Every resource and configuration created as code, from shared, pinned modules, laid out the same way\nin every stack, and organised by the system taxonomy.\n\n**Measures.** Teams are assessed once per program increment. The percentage of system resources and configuration implemented as code;\nresources that meet the naming standard; stacks whose IaC meets the standards; and resources with\nopen security findings.\n"
  owners:
    - "aaron.west@esimplicity.com"
