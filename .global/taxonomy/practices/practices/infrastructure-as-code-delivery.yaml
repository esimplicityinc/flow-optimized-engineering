apiVersion: katalyst.taxonomy/v2alpha
kind: practice
metadata:
  name: infrastructure-as-code-delivery
  annotations:
    foe.source: 'QDAS practices: DevOps - Strategy; DevOps - Framework; DevOps - Standards;
      Terraform / Terragrunt Standards (layout)'
spec:
  title: Infrastructure as code
  enforcement: required
  standards:
  - iac-standards
  methods:
  - system-taxonomy
  - infrastructure-as-code
  - shared-iac-modules
  measures:
  - resources-as-code
  - resource-naming-compliance
  - component-iac-compliance
  - security-findings-on-resources
  description: 'Make each resource and each configuration with code. Use shared modules
    with fixed versions. Use the same layout in each deployable component. Organise
    all of it with the system taxonomy.


    ## Why


    Infrastructure that code makes is the same in each environment. You can review
    it, make it again and roll it back. Shared modules give each team the tests and
    security work of the other teams.


    **Measures.** Assess each team one time in each planning period (for example,
    each quarter). The measures are:


    - The percentage of the resources and configuration of each system that code makes.

    - The percentage of resources that obey the naming rules.

    - The percentage of deployable components whose infrastructure code obeys the
    standards.

    - The number of resources that have open security findings.

    '
  owners:
  - aaron.west@esimplicity.com
