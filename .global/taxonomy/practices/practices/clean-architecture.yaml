    - [Clean Architecture: A Craftsman''s Guide to Software Structure and Design (Robert
    C. Martin, 2017)](https://www.amazon.com/Clean-Architecture-Craftsmans-Software-Structure/dp/0134494164)

    - [Hexagonal Architecture Explained (2024)](https://medium.com/idealo-tech-blog/hexagonal-ports-adapters-architecture-e3617bcf00a)'
