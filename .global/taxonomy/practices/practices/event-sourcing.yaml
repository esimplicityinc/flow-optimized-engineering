  description: "Event Sourcing is an architectural pattern where the state of an application is determined by a sequence of events. Instead of storing just the current state in a database, every change to the state is captured as an immutable event in an append-only event store. The current state can be reconstructed by replaying these events from the beginning of time.\n\n## Key Concepts\n\n### Events as Source of Truth\n\nIn traditional systems, the database holds the current state as the source of truth. In Event Sourcing, the event store is the source of truth, and the current state is a **derived view** created by applying all events in sequence.\n\nThis inversion has profound implications:\n- **Complete audit trail** - Every change is permanently recorded with full context\n- **Temporal queries** - You can ask \"what was the state at time X?\"\n- **Debugging capability** - Replay events to reproduce bugs or understand system behavior\n- **Analytics** - Rich historical data for business intelligence\n\n### State Reconstruction\n\nThe current state is computed by applying a **left fold** (reduce) operation over the event stream:\n\n```\nCurrentState = foldl(applyEvent, initialState, events)\n```\n\nEach event represents a state transition function that transforms the state from one version to the next.\n\n### Append-Only Storage\n\nEvents are never updated or deleted—they are only appended to the event stream. This immutability provides:\n- **Strong audit capabilities** - Complete history preserved\n- **Concurrency safety** - No conflicts from updates\n- **Caching opportunities** - Immutable data can be cached indefinitely\n\n### Temporal Modeling\n\nEvent Sourcing naturally models business processes that unfold over time:\n- Business events happen at specific moments\n- State evolves as a sequence of facts\n- The domain model reflects the temporal nature of reality\n\n## Event Sourcing vs CQRS\n\n**Event Sourcing and CQRS are independent patterns that are often used together but should not be conflated:**\n\n| Aspect | Event Sourcing | CQRS |\n|--------|---------------|------|\n| **Focus** | How state is stored (as events) | Separating read and write models |\n| **Data Storage** | Append-only event store | Can use any storage |\n| **State Access** | Replay events to reconstruct | Direct queries on read model |\n| **Relationship** | ES often uses CQRS for queries | CQRS doesn't require ES |\n\nYou can use Event Sourcing without CQRS (by projecting events into a single read/write model), and you can use CQRS without Event Sourcing (with traditional CRUD storage).\n\n## When to Use Event Sourcing\n\n### Good Fit For:\n\n- **Audit-heavy domains** - Financial systems, healthcare, compliance requirements\n- **Complex business processes** - Workflows with many states and transitions\n- **Temporal analysis needs** - Understanding how things changed over time\n- **Event-driven architectures** - Systems already using events for communication\n- **Collaborative domains** - Multiple users modifying shared state\n\n### NOT Recommended For:\n\n- **Simple CRUD applications** - The complexity may not be justified\n- **High-write, low-read scenarios** - Storage costs grow continuously\n- **Teams new to DDD** - Requires strong domain modeling skills\n- **Tight deadline projects** - Learning curve is significant\n- **Systems requiring complex ad-hoc queries** - Event stores are poor for querying\n\n## Complexity Considerations\n\n:::caution Complexity Warning\n\nEvent Sourcing significantly increases system complexity. Before adopting, ensure:\n\n1. **Team expertise** - At least some team members have prior ES experience\n2. **Infrastructure readiness** - Event store, projection systems, monitoring\n3. **Domain complexity** - The domain justifies the investment\n4. **Long-term commitment** - ES is hard to remove once adopted\n\n:::\n\n## FOE Alignment\n\nEvent Sourcing strongly supports Flow Optimized Engineering principles:\n\n- **Understanding** - Events make implicit domain concepts explicit. The complete history provides unprecedented visibility into system behavior. Debugging becomes \"replay and observe\" rather than \"guess and check.\"\n\n- **Confidence** - Immutable events eliminate entire categories of bugs related to state mutation. The audit trail provides confidence in compliance and regulatory scenarios.\n\n- **Fast Feedback** - Events enable reactive architectures and real-time projections. Changes propagate immediately to interested parties without polling.\n\n## Further Reading\n\n- [Martin Fowler - Event Sourcing](https://martinfowler.com/eaaDev/EventSourcing.html) - Original article defining the pattern\n- [Microsoft - Exploring CQRS and Event Sourcing](https://docs.microsoft.com/en-us/previous-versions/msp-n-p/jj554200(v=pandp.10)) - Comprehensive guide with patterns and practices\n- [Event Store Documentation](https://developers.eventstore.com/) - Documentation for Kurrent (formerly Event Store)\n- [Greg Young's CQRS Documents](https://cqrs.wordpress.com/documents/) - Original materials on CQRS and Event Sourcing\n- [Vaughn Vernon - Implementing Domain-Driven Design](https://www.informit.com/store/implementing-domain-driven-design-9780321834577) - Practical DDD including Event Sourcing"
