    - The original "Blue Book"

    - [Implementing Domain-Driven Design](https://www.informit.com/store/implementing-domain-driven-design-9780321834577)
    - Vaughn Vernon''s practical guide (the "Red Book")

    - [Martin Fowler''s DDD articles](https://martinfowler.com/tags/domain%20driven%20design.html)
    - Accessible explanations of key concepts'
