apiVersion: katalyst.taxonomy/v2alpha
kind: practice
metadata:
  name: "kubernetes-delivery"
  annotations:
    foe.source: "QDAS practices: k8s Standards"
spec:
  title: "Kubernetes delivery"
  practice_area: "platform-operations"
  enforcement: "required"
  standards:
    - "kubernetes-standards"
  tools:
