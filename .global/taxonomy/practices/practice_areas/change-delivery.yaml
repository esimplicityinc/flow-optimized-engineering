apiVersion: katalyst.taxonomy/v2alpha
kind: practice_area
metadata:
  name: change-delivery
spec:
  description: 'How change gets into a system: the pipeline every change travels to
    production, integrating on trunk, releasing safely, and measuring how fast and
    how often change flows.'
  owners:
  - aaron.west@esimplicity.com
  title: Change Delivery
  practices:
  - change-delivery-continuous-delivery
  - change-delivery-dora
  - continuous-delivery
  - dora
  - ci-cd-pipelines
  strategy: '**Primary goal: implement change to our systems as quickly and safely
    as possible.**


    - Fast feedback for developers

    - Promote small changes over big-bang approaches

    - Lower the maintenance burden

    - Shift security left, to eliminate patching

    - Remove manual steps, to make deployments simple

    - Provide modular, shareable workflows and actions, to make pipelines simple to
    implement


    ### Key goals


    - Zero-downtime deployment

    - Deploy multiple times a day

    - Minimal manual configuration

    '
