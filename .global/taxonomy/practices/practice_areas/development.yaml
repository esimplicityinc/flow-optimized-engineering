  strategy: '### Continuous integration


    Teams don''t wait for completed iterations; they integrate constantly, often several
    times a day.


    ### Communication


    Development relies on quick reactivity and effective communication, so the team
    has to be open and

    honest with one another. When a problem arises, speak up: someone else often already
    has a solution,

    and if not, the group will find one faster than one person alone.


    ### Iterative development


    Working in [small batches](https://cloud.google.com/architecture/devops/devops-process-working-in-small-batches)

    is essential wherever feedback loops matter or you want to learn quickly from
    your decisions. It lets

    you rapidly test whether a change has the effect you want, and if it doesn''t,
    course-correct or

    revisit your assumptions.


    ### Trunk-based development


    Developers work in small batches and merge frequently into a shared trunk. High
    performers are far

    more likely to work this way, and see lower change failure rates than teams using
    feature branches.

    See [trunk-based development](trunk-based-development).


    ### Collective ownership


    Any pair can change any code at any time, whether or not they wrote it. Code is
    produced by the team,

    and everyone''s work is held to the higher collective standard.


    ### Test-driven development


    Relying on feedback requires heavy testing: in short cycles, programmers write
    automated tests and

    react to them immediately. TDD is generally misunderstood because of the word
    *test*. It is much less

    about testing than about specifying requirements, showing your working (as in
    maths), and the effect

    that has on design. Robert C. Martin likens it to double-entry bookkeeping:


    > Software is a remarkably sensitive discipline. If you reach into a base of code
    and you change one

    > bit you can crash the software. […] Very few disciplines are that sensitive.
    But there is one other

    > that is, and that''s Accounting. […] How do accountants deal with that sensitivity?
    Well, they have

    > disciplines. And one of the primary disciplines is dual-entry bookkeeping. Everything
    is said

    > twice. […] This is what test-driven development is: dual-entry bookkeeping.
    Everything is said

    > twice — once on the test side and once on the production code side and everything
    runs in an

    > execution that yields either a green bar or a red bar just like the zero on
    the balance sheet.

    >

    > — Robert C. Martin


    ### Coding standards


    Teams follow one standard. As writers take on a brand''s voice so that it always
    sounds like the same

    person, developers code in one unified way so that the code reads as if one developer
    wrote it.

    '
