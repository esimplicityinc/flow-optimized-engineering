spec:
  description: 'This area is about how teams write and change code together. Teams
    merge their changes frequently, in small parts, into one shared branch. The team
    owns all the code. Tests specify the behaviour of the code. All code obeys one
    standard, at all times.


    ## What this area contains


    ### Development standards


    The rules that each change must obey before you deploy it.


    ### Team practices


    Behaviour-driven development, Team Topologies, and the general methods of FOE:
    find the root cause before you fix a problem, prevent conceptual debt, share knowledge,
    and make feedback loops early.


    Work with AI coding agents is in a different area: [Agent-Assisted Development](agent-assisted-development).

    '
