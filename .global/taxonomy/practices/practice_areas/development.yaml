  description: 'How teams write and change code together: integrating constantly,
    in small batches, on a shared

    trunk; owning the code collectively; specifying behaviour in tests; and holding
    all code to one

    standard, whoever wrote it.


    ## What this area covers


    ### Development standards


    The bar every change meets before it is deployed, and the language standards for
    Python and Node.js

    stacks.


    ### Team practice


    Behaviour-driven development, Team Topologies, and FOE''s own general methods:
    root-cause-first

    debugging, preventing conceptual debt, distributing knowledge, and investing early
    in feedback loops.


    Working with AI coding agents has its own area,

    [Agent-Assisted Development](agent-assisted-development).

    '
