spec:
  description: Prose for Service Discovery.
  body: "**Pillar:** Communication Patterns\n\nService Discovery enables microservices\
    \ to find and communicate with each other without hardcoding network locations\
    \ (IP addresses and ports). As services scale up, down, or move across hosts,\
    \ clients automatically discover the current locations of service instances.\n\
    \n## Definition\n\n> \"Service discovery is the automatic detection of devices\
    \ and services offered by these devices on a computer network. A service discovery\
    \ protocol is a network protocol that helps accomplish service discovery.\"\n\
    > — Chris Richardson, Microservices Patterns\n\n## Why It Matters\n\nIn dynamic\
    \ cloud environments, service instances come and go constantly:\n\n- **Auto-scaling**\
    \ adds and removes instances based on load\n- **Failures** cause instances to\
    \ become unhealthy and be replaced\n- **Deployments** roll out new versions gradually\n\
    - **Container orchestration** schedules instances across hosts dynamically\n\n\
    Without service discovery, clients would need:\n- Hardcoded IP addresses (breaks\
    \ on scaling)\n- Load balancer configuration updates (operational burden)\n- Manual\
    \ intervention for every change (not scalable)\n\n## Discovery Patterns\n\n###\
    \ 1. Client-Side Discovery\n\nThe client queries a service registry and directly\
    \ calls service instances.\n\n```\n┌─────────────┐\n│   Client    │\n└──────┬──────┘\n\
    \       │ 1. Query: Where is Payment Service?\n       ▼\n┌────────────────┐\n\
    │ Service Registry│  (Consul, Eureka, etcd)\n│                │\n│ Payment:  \
    \     │\n│  - 10.0.1.5:8080\n│  - 10.0.1.6:8080\n└───────┬────────┘\n        │\
    \ 2. Return instances\n        ▼\n┌─────────────┐\n│   Client    │──┐\n└─────────────┘\
    \  │ 3. Choose & Call\n                 │\n        ┌────────┴────────┐\n     \
    \   ▼                 ▼\n┌───────────────┐  ┌───────────────┐\n│ Payment     \
    \  │  │ Payment       │\n│ Instance #1   │  │ Instance #2   │\n│ 10.0.1.5:8080\
    \ │  │ 10.0.1.6:8080 │\n└───────────────┘  └───────────────┘\n```\n\n**Components:**\n\
    - **Service Registry** - Database of service instances (Consul, Eureka, etcd)\n\
    - **Self-Registration** - Services register themselves on startup\n- **Client-Side\
    \ Load Balancer** - Client chooses which instance to call\n\n**Pros:**\n- Simple\
    \ infrastructure (no intermediate hop)\n- Client has full control over load balancing\
    \ algorithm\n- Lower latency (no proxy)\n\n**Cons:**\n- Client complexity (must\
    \ implement discovery logic)\n- Language-specific libraries needed\n- Tight coupling\
    \ to service registry\n\n### 2. Server-Side Discovery\n\nClients call a router/load\
    \ balancer that queries the registry and forwards requests.\n\n```\n┌─────────────┐\n\
    │   Client    │\n└──────┬──────┘\n       │ 1. Call: payment-service\n       ▼\n\
    ┌────────────────────┐\n│  Router/Load       │\n│  Balancer          │  (NGINX,\
    \ AWS ELB, Kubernetes Service)\n└───────┬────────────┘\n        │ 2. Query: Where\
    \ is Payment Service?\n        ▼\n┌────────────────┐\n│ Service Registry│\n└───────┬────────┘\n\
    \        │ 3. Return instances\n        ▼\n┌────────────────────┐\n│  Router/Load\
    \       │──┐\n└────────────────────┘  │ 4. Forward\n                        │\n\
    \           ┌────────────┴────────┐\n           ▼                     ▼\n┌───────────────┐\
    \      ┌───────────────┐\n│ Payment       │      │ Payment       │\n│ Instance\
    \ #1   │      │ Instance #2   │\n└───────────────┘      └───────────────┘\n```\n\
    \n**Components:**\n- **Router/Load Balancer** - Intercepts requests and routes\
    \ to instances\n- **Service Registry** - Optional, or router maintains its own\
    \ registry\n\n**Pros:**\n- Client simplicity (just call a URL)\n- Centralized\
    \ load balancing logic\n- Language-agnostic\n\n**Cons:**\n- Additional network\
    \ hop (latency)\n- Router becomes potential bottleneck\n- Less flexible load balancing\n\
    \n## Implementation\n\n### Service Registration\n\nServices must register on startup\
    \ and deregister on shutdown:\n\n```javascript\nclass ServiceRegistry {\n  constructor(registryClient,\
    \ serviceInfo) {\n    this.registry = registryClient;\n    this.serviceInfo =\
    \ serviceInfo;\n  }\n  \n  async register() {\n    await this.registry.register({\n\
    \      serviceName: this.serviceInfo.name,\n      instanceId: this.serviceInfo.instanceId,\n\
    \      host: this.serviceInfo.host,\n      port: this.serviceInfo.port,\n    \
    \  healthCheckUrl: `http://${this.serviceInfo.host}:${this.serviceInfo.port}/health`,\n\
    \      metadata: {\n        version: this.serviceInfo.version,\n        region:\
    \ this.serviceInfo.region\n      }\n    });\n    \n    // Setup health check heartbeats\n\
    \    this.heartbeatInterval = setInterval(\n      () => this.sendHeartbeat(),\n\
    \      30000 // 30 seconds\n    );\n  }\n  \n  async deregister() {\n    clearInterval(this.heartbeatInterval);\n\
    \    await this.registry.deregister(\n      this.serviceInfo.name,\n      this.serviceInfo.instanceId\n\
    \    );\n  }\n}\n\n// Graceful shutdown\nprocess.on('SIGTERM', async () => {\n\
    \  await registry.deregister();\n  process.exit(0);\n});\n```\n\n### Client-Side\
    \ Discovery Implementation\n\n```javascript\nclass ServiceClient {\n  constructor(serviceRegistry,\
    \ serviceName) {\n    this.registry = serviceRegistry;\n    this.serviceName =\
    \ serviceName;\n    this.loadBalancer = new RoundRobinBalancer();\n  }\n  \n \
    \ async call(endpoint, options = {}) {\n    // Get healthy instances\n    const\
    \ instances = await this.registry.getHealthyInstances(\n      this.serviceName\n\
    \    );\n    \n    if (instances.length === 0) {\n      throw new ServiceUnavailableError(this.serviceName);\n\
    \    }\n    \n    // Select instance using load balancer\n    const instance =\
    \ this.loadBalancer.select(instances);\n    \n    // Make the request\n    const\
    \ url = `http://${instance.host}:${instance.port}${endpoint}`;\n    return await\
    \ httpClient.request(url, options);\n  }\n}\n\n// Usage\nconst paymentClient =\
    \ new ServiceClient(consul, 'payment-service');\nconst result = await paymentClient.call('/process',\
    \ { body: paymentData });\n```\n\n### Load Balancing Strategies\n\n| Strategy\
    \ | Description | Best For |\n|----------|-------------|----------|\n| **Round\
    \ Robin** | Cycle through instances sequentially | Even load, equal capacity |\n\
    | **Random** | Random selection | Simple, no state |\n| **Least Connections**\
    \ | Route to instance with fewest active connections | Variable request duration\
    \ |\n| **Weighted** | Route based on capacity weights | Heterogeneous instances\
    \ |\n| **Latency-Based** | Route to lowest latency instance | Geographic distribution\
    \ |\n| **Consistent Hashing** | Hash-based routing for cache affinity | Session\
    \ affinity needs |\n\n### Health Checking\n\nServices must report health so unhealthy\
    \ instances are removed:\n\n```javascript\n// Health check endpoint\napp.get('/health',\
    \ async (req, res) => {\n  const checks = await Promise.all([\n    checkDatabase(),\n\
    \    checkCache(),\n    checkExternalService()\n  ]);\n  \n  const allHealthy\
    \ = checks.every(c => c.healthy);\n  \n  res.status(allHealthy ? 200 : 503).json({\n\
    \    status: allHealthy ? 'healthy' : 'unhealthy',\n    checks: checks,\n    timestamp:\
    \ new Date().toISOString()\n  });\n});\n```\n\n**Health Check Types:**\n- **Passing**\
    \ - Instance is healthy and receiving traffic\n- **Warning** - Instance is experiencing\
    \ issues but still serving\n- **Critical** - Instance is unhealthy and removed\
    \ from pool\n\n## FOE Alignment\n\n**Primary: Fast Feedback Loops**\n\nService\
    \ discovery enables rapid response to changes in the system. When a new instance\
    \ comes online, it's immediately available for traffic. When an instance fails,\
    \ it's quickly removed from the pool. This dynamic nature provides fast feedback\
    \ about system health and capacity.\n\n**Secondary: Confidence to Act**\n\nAutomatic\
    \ service registration and health checking provides confidence that the system\
    \ will route around failures. Teams can deploy with confidence knowing that unhealthy\
    \ instances will be automatically detected and bypassed.\n\n## Service Registry\
    \ Technologies\n\n### Self-Hosted\n\n| Registry | Type | Best For |\n|----------|------|----------|\n\
    | **Consul** | Client & Server | Full-featured, multi-datacenter |\n| **Eureka**\
    \ | Client-side | Netflix OSS ecosystem |\n| **etcd** | Key-value | Kubernetes-native\
    \ |\n| **ZooKeeper** | Coordination | Hadoop ecosystem |\n\n### Cloud-Managed\n\
    \n| Service | Platform | Features |\n|---------|----------|----------|\n| **AWS\
    \ Cloud Map** | AWS | Service discovery for ECS, EKS, Lambda |\n| **Azure Service\
    \ Fabric** | Azure | Integrated naming service |\n| **Google Cloud Service Directory**\
    \ | GCP | Cross-project service discovery |\n\n### Kubernetes Native\n\nKubernetes\
    \ provides built-in service discovery:\n\n```yaml\n# Service definition\napiVersion:\
    \ v1\nkind: Service\nmetadata:\n  name: payment-service\nspec:\n  selector:\n\
    \    app: payment-service\n  ports:\n    - port: 80\n      targetPort: 8080\n\
    ```\n\n```javascript\n// Kubernetes DNS-based discovery\nconst paymentServiceUrl\
    \ = 'http://payment-service.default.svc.cluster.local';\n```\n\n## Implementation\
    \ Checklist\n\n- [ ] **Service Registration** - Services register on startup\n\
    - [ ] **Health Checks** - Regular health endpoint checks\n- [ ] **Graceful Deregistration**\
    \ - Clean shutdown removes instances\n- [ ] **Client-Side Load Balancing** - Distribute\
    \ requests across instances\n- [ ] **Caching** - Cache registry entries to reduce\
    \ lookup latency\n- [ ] **Failure Handling** - Retry and failover when instances\
    \ unavailable\n- [ ] **Observability** - Track instance counts, health status,\
    \ traffic distribution\n\n## Benefits\n\n- ✅ **Dynamic scaling** - Instances added/removed\
    \ automatically\n- ✅ **Failure resilience** - Unhealthy instances bypassed automatically\n\
    - ✅ **Deployment flexibility** - Deploy new versions without client changes\n\
    - ✅ **Load distribution** - Spread traffic across healthy instances\n- ✅ **Location\
    \ transparency** - Clients don't need to know instance locations\n\n## Trade-offs\n\
    \n- ⚠️ **Operational complexity** - Additional infrastructure to manage\n- ⚠️\
    \ **Consistency delays** - Brief inconsistency during instance changes\n- ⚠️ **Split-brain\
    \ risk** - Network partitions can cause incorrect routing\n- ⚠️ **Extra latency**\
    \ - Registry lookups add overhead (mitigated with caching)\n\n## When to Use\n\
    \n✅ **Essential for:**\n- Any multi-instance service deployment\n- Auto-scaling\
    \ environments\n- Cloud-native applications\n- Dynamic container orchestration\n\
    \n❌ **Can simplify when:**\n- Single-instance services\n- Static infrastructure\n\
    - Development environments (use environment variables)\n\n## Anti-Patterns\n\n\
    ### ❌ Hardcoded URLs\n\n```javascript\n// WRONG: Breaks when instances move\n\
    const PAYMENT_SERVICE_URL = 'http://10.0.1.5:8080';\n\n// RIGHT: Use service discovery\n\
    const paymentService = await serviceDiscovery.get('payment-service');\n```\n\n\
    ### ❌ Ignoring Health Status\n\n```javascript\n// WRONG: Route to unhealthy instances\n\
    const instances = await registry.getAll('payment-service');\n\n// RIGHT: Filter\
    \ for healthy only\nconst instances = await registry.getHealthy('payment-service');\n\
    ```\n\n### ❌ No Deregistration on Shutdown\n\n```javascript\n// WRONG: Instances\
    \ remain registered after shutdown\nprocess.on('SIGTERM', () => {\n  server.close();\n\
    \  process.exit(0);\n});\n\n// RIGHT: Deregister first\nprocess.on('SIGTERM',\
    \ async () => {\n  await registry.deregister();\n  server.close();\n  process.exit(0);\n\
    });\n```\n\n## Known Uses\n\n- **Netflix** - Eureka with Ribbon client-side load\
    \ balancing\n- **Airbnb** - SmartStack (HAProxy + ZooKeeper)\n- **Spotify** -\
    \ DNS-based discovery with custom load balancing\n- **Kubernetes** - DNS and environment\
    \ variable-based discovery\n- **AWS** - Cloud Map for ECS/EKS service discovery\n\
    \n## References\n\n- Richardson, C. (2018). *Microservices Patterns*. Chapter\
    \ 3: Interprocess Communication.\n- Newman, S. (2021). *Building Microservices*\
    \ (2nd ed.). Chapter 5: Splitting the Monolith.\n- [Client-Side Discovery - microservices.io](https://microservices.io/patterns/client-side-discovery.html)\n\
    - [Server-Side Discovery - microservices.io](https://microservices.io/patterns/server-side-discovery.html)\n\
    - [Consul Documentation](https://www.consul.io/docs)\n- [Netflix Eureka](https://github.com/Netflix/eureka)"
