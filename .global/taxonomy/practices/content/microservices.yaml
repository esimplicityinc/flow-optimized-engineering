  description: Prose for Microservices.
  body: 'Microservices Architecture is an approach to building software applications
    as suites of independently deployable services, where each service runs in its
    own process and communicates via lightweight mechanisms such as HTTP APIs or message
    queues. First articulated by Martin Fowler and James Lewis in 2014, this architectural
    style has become an industry standard for building scalable, resilient systems.


    The core premise of microservices is that large, complex applications are easier
    to build and maintain when broken down into smaller, cohesive services that align
    with business capabilities. Each service can be developed, deployed, and scaled
    independently by small, autonomous teams.


    :::warning The Microservices Premium


    Martin Fowler famously warned of the "Microservices Premium"—the additional cost
    and complexity of distributed systems. Organizations should start with monolithic
    architectures and only decompose when the benefits outweigh the costs.


    **Prerequisites for success:**

    - Rapid provisioning (cloud infrastructure)

    - Basic monitoring and observability

    - Rapid application deployment (CI/CD pipelines)

    - DevOps culture and team autonomy


    :::


    ## Key Characteristics


    Microservices are defined by several key characteristics:


    | Characteristic | Description |

    |----------------|-------------|

    | **Componentization via Services** | Services are independently replaceable and
    upgradeable units |

    | **Organized Around Business Capabilities** | Services align with business domains,
    not technical layers |

    | **Products not Projects** | Teams own services throughout their entire lifecycle
    |

    | **Smart Endpoints, Dumb Pipes** | Logic lives in services, communication is
    simple |

    | **Decentralized Governance** | Teams choose the right tools for their services
    |

    | **Decentralized Data Management** | Each service owns its data persistence |

    | **Infrastructure Automation** | CI/CD pipelines for rapid, reliable deployment
    |

    | **Design for Failure** | Services must handle failure of dependencies gracefully
    |

    | **Evolutionary Design** | Services can be rewritten or retired independently
    |


    ## The Monolith First Principle


    Despite the popularity of microservices, the default starting point should often
    be a monolith:


    > "You shouldn''t start a new project with microservices, even if you''re sure
    your application will be big enough to make it worthwhile."

    > — Martin Fowler


    **Start with a monolith when:**

    - The team is small (< 10 developers)

    - The domain boundaries are unclear

    - Speed of delivery is the primary concern

    - Infrastructure automation is immature


    **Consider microservices when:**

    - Different parts of the system need to scale independently

    - Teams can be organized around business capabilities

    - The cost of coordination exceeds the cost of distribution

    - Infrastructure and DevOps practices are mature


    :::info The Monolith Revival


    Recent case studies (Amazon Prime Video, 2023) have shown teams migrating _back_
    from microservices to monoliths for specific workloads. This isn''t a rejection
    of microservices—it''s a reminder to choose the right architecture for the context.
    Serverless functions and modular monoliths offer middle-ground approaches.


    :::


    ## Pillars of Microservices


    ### Foundational Patterns


    Core patterns that define the microservices approach:


    - **[Decompose by Business Capability](./methods/M234-decompose-by-business-capability)**
    - Identify service boundaries aligned with business domains

    - **[Database Per Service](./methods/M225-database-per-service)** - Ensure service
    autonomy through private data ownership

    - **[API Gateway](./methods/M223-api-gateway)** - Provide unified entry point
    for clients


    ### Communication Patterns


    Patterns for inter-service communication and integration:


    - **[Circuit Breaker](./methods/M224-circuit-breaker)** - Prevent cascade failures
    through fault isolation

    - **[Saga Pattern](./methods/M226-saga-pattern)** - Manage distributed transactions
    without two-phase commit

    - **[Service Discovery](./methods/M227-service-discovery)** - Enable dynamic service
    location


    ### Data Patterns


    Patterns for managing data in distributed systems:


    - **[CQRS](./methods/M229-cqrs-microservices)** - Separate read and write models

    - **[Event Sourcing](./methods/M230-event-sourcing-microservices)** - Use events
    as the source of truth


    ### Operational Patterns


    Patterns for running microservices in production:


    - **[Distributed Tracing](./methods/M231-distributed-tracing)** - Visualize request
    flows across services

    - **[Bulkhead Pattern](./methods/M232-bulkhead-pattern)** - Isolate resources
    to prevent failure spread

    - **[Backpressure](./methods/M233-backpressure)** - Maintain system stability
    under load

    - **[Strangler Fig Pattern](./methods/M228-strangler-fig-pattern)** - Incrementally
    migrate from monoliths


    ## Relationship to Domain-Driven Design


    Microservices and Domain-Driven Design (DDD) are deeply connected:


    **Bounded Contexts as Service Boundaries:**

    - Each bounded context is a natural candidate for a microservice

    - The context map shows service dependencies and integration patterns

    - Ubiquitous language within each service ensures clarity


    **Strategic DDD Patterns:**

    - **Context Mapping** - Defines how services interact (partnerships, customer-supplier,
    etc.)

    - **Anti-Corruption Layer** - Protects services from external model changes

    - **Shared Kernel** - When multiple services must share a common model


    ## Why Microservices Matter for FOE


    Microservices Architecture aligns strongly with Flow Optimized Engineering principles:


    ### Optimize for Understanding


    - **Bounded contexts** create natural boundaries for understanding—each service
    has a focused, comprehensible scope

    - **Service autonomy** means teams can fully understand and own their domain without
    needing to understand the entire system

    - **Decentralized data** ensures that data models are owned and understood by
    the service team


    ### Fast Feedback Loops


    - **Independent deployment** enables teams to deploy changes without coordinating
    with other teams

    - **Service isolation** means failures are contained, allowing rapid experimentation

    - **CI/CD automation** provides immediate feedback on changes


    ### Confidence to Act


    - **Design for failure** patterns (circuit breakers, bulkheads) give confidence
    that failures won''t cascade

    - **Consumer contract testing** ensures changes don''t break dependencies

    - **Observability** (distributed tracing, monitoring) provides confidence in system
    behavior


    ## When to Use Microservices


    | When to Use | When NOT to Use |

    |-------------|-----------------|

    | Large, complex domains with clear boundaries | Small teams with unclear domain
    boundaries |

    | Need for independent scalability | Infrastructure automation is immature |

    | Multiple teams that can be aligned to services | Network latency is unacceptable
    |

    | Organizational readiness for DevOps practices | Simple CRUD applications |

    | Existing monolith is slowing delivery | Team lacks distributed systems experience
    |


    ## The Distributed Systems Challenge


    Microservices trade code complexity for operational complexity:


    **New challenges you''ll face:**

    - **Distributed transactions** - No simple ACID across services

    - **Eventual consistency** - Data may be temporarily inconsistent

    - **Network failures** - Services must handle communication failures

    - **Observability** - Harder to trace requests across service boundaries

    - **Testing** - Integration testing becomes more complex

    - **Deployment coordination** - Managing dependent service deployments


