  description: Prose for Dependency Direction Enforcement.
  body: "## Why This Matters for Software Architecture\n\nThe direction of dependencies\
    \ determines how easily your code can change. When dependencies point outward\
    \ from the domain, business logic becomes coupled to frameworks, databases, and\
    \ UI libraries. When dependencies point inward, the domain remains pure and stable\
    \ while outer layers can be swapped or upgraded without touching core business\
    \ rules.\n\n**Architecture Benefits:**\n- Core business logic remains framework-independent\n\
    - Easier to test business rules in isolation\n- Can swap databases, UIs, or frameworks\
    \ without rewriting domain code\n- Changes in infrastructure don't cascade to\
    \ domain\n\n**FOE Alignment:**\n- **Understanding** - Clear dependency direction\
    \ makes coupling visible\n- **Confidence** - Changes are contained; you know what\
    \ might break\n- **Fast Feedback** - Domain tests run fast without infrastructure\
    \ setup\n\n## Definition\n\n> Dependencies in a layered architecture should only\
    \ point inward, toward the core domain. Outer layers may depend on inner layers,\
    \ but inner layers must never depend on outer layers. This is achieved through\
    \ the Dependency Inversion Principle—depending on abstractions rather than concretions.\n\
    >\n> — Based on Dependency Inversion Principle (Martin, 1996)\n\n## The Dependency\
    \ Rule\n\n### Correct Direction\n```\nPresentation → Application → Domain ← Infrastructure\n\
    \                                    ↓\n                              (Domain\
    \ knows nothing of outer layers)\n```\n\n### Wrong Direction (Layer Violation)\n\
    ```\nPresentation → Application → Domain → Database Driver\n                 \
    \             ↑\n                    (Domain now coupled to infrastructure)\n\
    ```\n\n## How to Enforce Dependency Direction\n\n### 1. Define Interfaces in Inner\
    \ Layers\nPlace interfaces (contracts) in the domain or application layers:\n\n\
    ```java\n// In domain layer - domain defines what it needs\npublic interface OrderRepository\
    \ {\n    Order save(Order order);\n    Optional<Order> findById(OrderId id);\n\
    \    List<Order> findByCustomer(CustomerId customerId);\n}\n\n// In domain layer\
    \ - domain defines the contract\npublic interface PaymentGateway {\n    PaymentResult\
    \ process(Payment payment);\n}\n```\n\n### 2. Implement in Outer Layers\nConcrete\
    \ implementations live in infrastructure:\n\n```java\n// In infrastructure layer\
    \ - implements domain's interface\n@Repository\npublic class PostgresOrderRepository\
    \ implements OrderRepository {\n    private final JdbcTemplate jdbcTemplate;\n\
    \    \n    @Override\n    public Order save(Order order) {\n        // Postgres-specific\
    \ implementation\n    }\n    \n    @Override\n    public Optional<Order> findById(OrderId\
    \ id) {\n        // Postgres-specific implementation\n    }\n}\n\n// In infrastructure\
    \ layer\n@Component\npublic class StripePaymentGateway implements PaymentGateway\
    \ {\n    private final StripeClient stripeClient;\n    \n    @Override\n    public\
    \ PaymentResult process(Payment payment) {\n        // Stripe-specific implementation\n\
    \    }\n}\n```\n\n### 3. Use Dependency Injection\nFrameworks inject concrete\
    \ implementations:\n\n```java\n// Application service depends on interfaces only\n\
    @Service\npublic class OrderService {\n    private final OrderRepository orderRepository;\
    \  // Interface\n    private final PaymentGateway paymentGateway;    // Interface\n\
    \    \n    // Framework injects concrete implementations\n    public OrderService(OrderRepository\
    \ orderRepository, \n                        PaymentGateway paymentGateway) {\n\
    \        this.orderRepository = orderRepository;\n        this.paymentGateway\
    \ = paymentGateway;\n    }\n}\n```\n\n## Architecture Approaches\n\n### Traditional\
    \ Layered (Practical)\nDependencies mostly point inward, with some pragmatic exceptions:\n\
    ```\nWeb Layer → Service Layer → Repository Layer\n                ↓\n       \
    \  Domain Model (shared)\n```\n\n### Strict Layered (Clean Architecture)\nNo dependencies\
    \ skip layers; domain has zero external dependencies:\n```\nFrameworks & Drivers\
    \ → Interface Adapters → Use Cases → Entities\n                              \
    \                            ↑\n                                             \
    \ (Pure domain, no imports)\n```\n\n### Relaxed Layered (Pragmatic)\nPresentation\
    \ can skip application layer for simple queries:\n```\nWeb Layer ─┬─→ Service\
    \ Layer → Repository Layer\n           └─→ Repository Layer (for simple reads)\n\
    ```\n\n## Enforcement Mechanisms\n\n### 1. Package/Module Boundaries\nUse Java\
    \ modules, package-private visibility, or architectural testing:\n\n```java\n\
    // In domain module - package-private constructor\n// Forces creation through\
    \ factory/repository\nclass Order {\n    private OrderId id;\n    \n    // Package-private\
    \ - only domain can create\n    Order(OrderId id, CustomerId customerId) {\n \
    \       this.id = id;\n    }\n}\n```\n\n### 2. ArchUnit Tests\nAutomated architecture\
    \ testing:\n\n```java\n@AnalyzeClasses(packages = \"com.example\")\nclass LayerDependencyTest\
    \ {\n    \n    @ArchTest\n    static final ArchRule domain_should_not_depend_on_infrastructure\
    \ = \n        noClasses()\n            .that()\n            .resideInAPackage(\"\
    ..domain..\")\n            .should()\n            .dependOnClassesThat()\n   \
    \         .resideInAPackage(\"..infrastructure..\");\n    \n    @ArchTest\n  \
    \  static final ArchRule dependency_direction_should_be_inward =\n        layeredArchitecture()\n\
    \            .layer(\"Domain\").definedBy(\"..domain..\")\n            .layer(\"\
    Application\").definedBy(\"..application..\")\n            .layer(\"Infrastructure\"\
    ).definedBy(\"..infrastructure..\")\n            .layer(\"Presentation\").definedBy(\"\
    ..presentation..\")\n            .whereLayer(\"Domain\").mayNotAccessAnyLayer()\n\
    \            .whereLayer(\"Application\").mayOnlyAccessLayers(\"Domain\")\n  \
    \          .whereLayer(\"Infrastructure\").mayOnlyAccessLayers(\"Application\"\
    , \"Domain\")\n            .whereLayer(\"Presentation\").mayOnlyAccessLayers(\"\
    Application\", \"Domain\");\n}\n```\n\n### 3. Import Linter Tools\n- **Checkstyle**\
    \ - Restrict imports between packages\n- **SpotBugs** - Findbugs rules for dependency\
    \ checking\n- **Structure101** - Visualize and enforce architecture\n\n## Common\
    \ Mistakes\n\n### Direct Dependency on Framework\n```java\n// WRONG: Domain depends\
    \ on Spring\n@Entity  // JPA annotation in domain\npublic class Order {\n    @Id\
    \ @GeneratedValue  // Database-specific\n    private Long id;\n}\n```\n\n**Solution:**\
    \ Use separate entities or ignore annotations in domain:\n```java\n// CORRECT:\
    \ Domain is pure\npublic class Order {\n    private OrderId id;  // Domain concept,\
    \ not database type\n    \n    public Order(OrderId id, CustomerId customerId)\
    \ {\n        this.id = id;\n    }\n}\n\n// Infrastructure maps domain to persistence\n\
    @Entity\nclass OrderJpaEntity {\n    @Id\n    private Long id;\n    \n    static\
    \ OrderJpaEntity fromDomain(Order order) { ... }\n    Order toDomain() { ... }\n\
    }\n```\n\n### Service Locator Anti-Pattern\n```java\n// WRONG: Domain depends\
    \ on service locator\npublic class Order {\n    public void process() {\n    \
    \    RepositoryFactory.getOrderRepository().save(this);\n    }\n}\n```\n\n**Solution:**\
    \ Pass dependencies explicitly:\n```java\n// CORRECT: Dependencies injected\n\
    public class OrderService {\n    private final OrderRepository repository;\n \
    \   \n    public void processOrder(OrderId id) {\n        Order order = repository.findById(id);\n\
    \        order.process();\n        repository.save(order);\n    }\n}\n```\n\n\
    ### Framework Coupling in Domain\n```java\n// WRONG: Domain uses Spring events\n\
    public class Order {\n    @Autowired\n    private ApplicationEventPublisher publisher;\
    \  // Spring dependency!\n    \n    public void confirm() {\n        this.status\
    \ = CONFIRMED;\n        publisher.publishEvent(new OrderConfirmedEvent(this));\n\
    \    }\n}\n```\n\n**Solution:** Return events from domain:\n```java\n// CORRECT:\
    \ Domain returns events, doesn't publish them\npublic class Order {\n    private\
    \ List<DomainEvent> events = new ArrayList<>();\n    \n    public void confirm()\
    \ {\n        this.status = CONFIRMED;\n        events.add(new OrderConfirmedEvent(this.id));\n\
    \    }\n    \n    public List<DomainEvent> getEvents() {\n        return Collections.unmodifiableList(events);\n\
    \    }\n}\n```\n\n## When to Use / When Not to Use\n\n### Use Strict Dependency\
    \ Direction When:\n- Building long-lived systems that will outlast frameworks\n\
    - Need to switch databases or external services\n- Domain logic is complex and\
    \ valuable\n- Testing without infrastructure is critical\n- Multiple UIs share\
    \ the same domain (web, mobile, API)\n\n### Relaxed Approach May Be OK When:\n\
    - Building CRUD applications with minimal business logic\n- Prototypes or short-lived\
    \ projects\n- Team has limited DDD/architecture experience\n- Framework is unlikely\
    \ to change (e.g., standard Spring stack)\n\n## Evolution to Modern Patterns\n\
    \n| Approach | Dependencies | Flexibility | Complexity |\n|----------|--------------|-------------|------------|\n\
    | **Traditional Layered** | Mostly inward | Medium | Low |\n| **Clean Architecture**\
    \ | Strictly inward | High | Medium |\n| **Hexagonal** | Explicit ports/adapters\
    \ | High | Medium |\n| **Vertical Slice** | Feature-organized | High | Low |\n\
    \n## FOE Alignment\n\nThis method directly supports **Optimize for Understanding**\
    \ by:\n- Making dependencies explicit and visible\n- Creating clear rules about\
    \ what can depend on what\n- Enabling developers to reason about change impact\n\
    \nIt supports **Fast Feedback Loops** through:\n- Fast unit tests that don't need\
    \ infrastructure\n- Clear boundaries that limit regression scope\n\nIt supports\
    \ **Confidence Through Evidence** by:\n- Enabling architectural testing\n- Making\
    \ coupling violations detectable automatically\n\n## References\n\n- Martin, R.\
    \ C. (1996). [The Dependency Inversion Principle](https://web.archive.org/web/20150906155800/http://www.objectmentor.com/resources/articles/dip.pdf).\
    \ C++ Report.\n- Buschmann, F., et al. (1996). *Pattern-Oriented Software Architecture,\
    \ Volume 1*. Wiley.\n- Martin, R. C. (2012). *Clean Architecture: A Craftsman's\
    \ Guide to Software Structure and Design*. Prentice Hall."
