  description: Prose for Source Attribution.
  body: 'Require every AI-generated conclusion to trace to specific, identifiable
    source nodes in the knowledge layer, so that any claim can be verified, any error
    can be traced, and any decision can be audited.


    :::caution Early Stage

    This method is still being validated through observations.

    :::


    ## Overview


    An AI agent that says "the vendor is compliant" is producing a claim. A claim
    without a source is an assertion. In regulated environments, financial decisions,
    and any context where consequential actions follow from AI outputs, assertions
    are insufficient. The agent must show its work.


    Source Attribution requires that every substantive claim in an AI response be
    traceable to a specific node in the knowledge graph or a specific retrieved artifact.
    The agent doesn''t just produce an answer — it produces an answer with citations.
    Those citations must point to real, retrievable artifacts, not to generic "based
    on the documents I retrieved."


    This is the AI equivalent of footnotes in academic work, and it serves the same
    functions: it enables verification, it limits the blast radius of errors, and
    it builds justified confidence in the output. It is also the ethical foundation
    for agentic systems — an agent that can''t show its work shouldn''t be trusted
    to act.


    ## When to Use


    Use this method when:


    - Agents produce outputs that will be used for consequential decisions

    - Operating in regulated environments where auditability is required

    - Building systems where trust must be earned incrementally (attribution enables
    verification which builds trust)

    - Agent errors must be traceable and correctable (you can''t fix what you can''t
    locate)


    ## When NOT to Use


    Avoid this method when:


    - The task is so exploratory that requiring sources would paralyze useful brainstorming
    (distinguish clearly between exploratory and authoritative outputs)

    - Sources are unavailable (don''t fake attribution — better to be explicit that
    the claim is unsupported)


    ## How It Works


    ### Prerequisites


    Before starting:

    - Every artifact in the knowledge layer must have a unique, stable identifier

    - Retrieval pipeline must return source identifiers alongside content (not just
    content)

    - Output format must include a structured citations section


    ### Step 1: Preserve Source IDs Through the Retrieval Pipeline


    When the retriever ensemble (M303) returns chunks, each chunk must carry its source
    document ID, the chunk position within that document, and the context contract
    (M300) metadata. This provenance data must survive through context assembly and
    into the LLM prompt.


    ### Step 2: Instruct the Agent to Cite


    In the system prompt and domain layer (M301 Instruction Layering), explicitly
    instruct the agent:

    - Every factual claim must include a citation in the form `[source: DOC-ID, section:
    X]`

    - Claims without citations must be marked as `[inference]` to distinguish from
    sourced facts

    - Inferences that are material to a decision must be flagged for human review


    ### Step 3: Validate Citations Post-Generation


    After the agent produces a response, validate that cited source IDs exist in the
    knowledge layer and that the cited content actually supports the claim. Automated
    validation catches hallucinated citations; human review catches misattributed
    claims.


    ### Step 4: Surface Citations in the UI


    Present citations as accessible links to source documents, not just identifiers.
    Users should be able to click a citation and see the exact passage the agent cited.
    This closes the verification loop — attribution is only useful if it''s verifiable.


    ## Example


    Without source attribution:

    "Based on my analysis, the vendor DataFlow Inc. meets your 2025 security standards."


    With source attribution:

    "DataFlow Inc. meets your 2025 security standards [source: VAR-2025-0089, section:
    Executive Summary, authority: official-assessment, dated: 2025-03-15]. Three remediation
    items from the 2024 assessment were verified as closed [source: AUDIT-2024-0441,
    section: Closure Report]. One minor finding remains open [source: VAR-2025-0089,
    section: Open Items, item #3] — this does not affect overall compliance status
    per your policy [source: SEC-POL-2025, section: 4.2]."


    The second response is verifiable, auditable, and actionable. The first is a black
    box.


    ## Common Pitfalls


    1. **Hallucinated citations** — agents may generate plausible-looking but non-existent
    source IDs. Validate all citations against the knowledge layer index before presenting
    to users.

    2. **Over-citing** — requiring citations on every sentence fragments the response
    and obscures the reasoning. Require citations for factual claims; allow inference
    synthesis without per-sentence citations.

    3. **Citation without accessibility** — a citation that points to a document the
    user can''t access or navigate defeats the purpose. Surface the specific passage,
    not just the document.


    ## How You Can Help


    If you''re testing this method:


    1. Measure the hallucinated citation rate and document what validation approach
    reduced it

    2. Document the citation format that worked best for your domain and user interface

    3. Note which claim types were most often cited vs. left as inferences'
