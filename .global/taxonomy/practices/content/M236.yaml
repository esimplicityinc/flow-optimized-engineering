  description: Prose for Gradual Extraction Strategy.
  body: "**Pillar:** Evolution\n\nThe Gradual Extraction Strategy provides a low-risk\
    \ path for evolving a modular monolith into distributed services—if and when that\
    \ becomes necessary. Rather than betting everything on an early microservices\
    \ architecture, this method lets you validate boundaries and business needs before\
    \ paying the operational costs of distribution.\n\n## Definition\n\n> Gradual\
    \ extraction is the practice of deferring service boundary decisions until there\
    \ is clear evidence that distribution is necessary, then extracting modules incrementally\
    \ while maintaining system stability and enabling rollback.\n\n## Why It Matters\n\
    \nThe microservices trade-off is often misunderstood:\n\n| Aspect | Monolith |\
    \ Microservices |\n|--------|----------|---------------|\n| **Operational Complexity**\
    \ | Low | High |\n| **Development Complexity** | Low (with modularity) | High\
    \ |\n| **Network Latency** | None | Significant |\n| **Deployment Independence**\
    \ | No | Yes |\n| **Team Autonomy** | Limited | High |\n| **Debugging** | Straightforward\
    \ | Complex |\n\nThe gradual extraction strategy preserves the benefits of monoliths\
    \ while keeping the option to extract when specific conditions warrant it.\n\n\
    ## The Decision Framework\n\n### When to Extract\n\nExtract a module when you\
    \ have clear evidence for multiple criteria:\n\n1. **Independent Scaling Requirements**\n\
    \   - The module has significantly different resource needs\n   - Current: 10%\
    \ of traffic uses 70% of resources\n   - Need: Scale the 10% independently\n\n\
    2. **Team Autonomy Requirements**\n   - Teams are blocked waiting for other teams\n\
    \   - Deployment coordination is a bottleneck\n   - Different release cadences\
    \ are needed\n\n3. **Technology Diversity Needs**\n   - Module requires different\
    \ runtime (e.g., ML inference)\n   - Specific performance characteristics needed\n\
    \   - Regulatory constraints on technology stack\n\n4. **Fault Isolation Requirements**\n\
    \   - Module failures must not impact core functionality\n   - Different SLAs\
    \ are required\n   - Circuit breaker patterns insufficient\n\n### When NOT to\
    \ Extract\n\nDon't extract for these reasons alone:\n\n- **Code organization**\
    \ (use modules instead)\n- **Database separation** (use schemas instead)\n- **Team\
    \ structure** (may change; boundaries shouldn't)\n- **Hype or \"best practices\"\
    ** (needs evidence)\n- **Premature optimization** (measure first)\n\n## The Extraction\
    \ Process\n\n### Phase 0: Preparation (Before Extraction)\n\n**Validate Module\
    \ Boundaries:**\n\n1. **Ensure clean module separation** (M235)\n   - No shared\
    \ database tables\n   - Clear public API\n   - No circular dependencies\n\n2.\
    \ **Verify independence**\n   - Module tests pass in isolation\n   - No shared\
    \ libraries with business logic\n   - Can deploy module changes independently\n\
    \n3. **Document current state**\n   - Baseline performance metrics\n   - Dependency\
    \ graph\n   - Integration points\n\n**Prepare Infrastructure:**\n\n- Set up deployment\
    \ pipeline for new service\n- Configure monitoring and observability\n- Establish\
    \ service discovery (if needed)\n- Prepare database migration strategy\n\n###\
    \ Phase 1: Strangler Fig Pattern\n\nExtract gradually using the Strangler Fig\
    \ pattern—grow the new service while the monolith still runs:\n\n```\nClient Request\n\
    \    |\n    v\n[API Gateway / Router]\n    |\n    +---> [New Service] (extracted\
    \ module)\n    |\n    +---> [Modular Monolith] (remaining modules)\n```\n\n**Step-by-Step:**\n\
    \n1. **Create Facade**\n   ```python\n   # Router decides where to route requests\n\
    \   class ModuleRouter:\n       def route(self, request):\n           if self.should_use_new_service(request):\n\
    \               return self.new_service.handle(request)\n           return self.monolith.handle(request)\n\
    \   ```\n\n2. **Shadow Traffic** (Optional but recommended)\n   - Send read requests\
    \ to both old and new\n   - Compare responses\n   - Log discrepancies without\
    \ affecting users\n\n3. **Migrate Reads First**\n   - Lower risk than writes\n\
    \   - Caching can mitigate latency\n   - Easy to rollback\n\n4. **Migrate Writes\
    \ Gradually**\n   - Start with low-risk operations\n   - Use feature flags for\
    \ control\n   - Maintain data consistency\n\n### Phase 2: Data Migration\n\n**Dual-Write\
    \ Strategy:**\n\n```\nWrite Request\n    |\n    v\n[Monolith Module]\n    |---->\
    \ [New Service Database]\n    |\n    +----> [Monolith Database]\n```\n\n1. **Write\
    \ to both systems** temporarily\n2. **Verify consistency** with reconciliation\
    \ jobs\n3. **Switch reads** to new service\n4. **Remove old writes** once confident\n\
    \n**Database Options:**\n\n| Strategy | When to Use | Trade-offs |\n|----------|-------------|------------|\n\
    | **Shared Database** | Short-term migration | Coupling remains temporarily |\n\
    | **Database per Service** | Long-term target | Full independence, data sync complexity\
    \ |\n| **Event Sourcing** | Complex domains | Audit trail, eventual consistency\
    \ |\n\n### Phase 3: Cleanup\n\n1. **Remove code** from monolith\n2. **Update routing**\
    \ to direct 100% traffic\n3. **Archive old data** (with retention policy)\n4.\
    \ **Update documentation**\n\n## Rollback Strategy\n\nAlways maintain the ability\
    \ to roll back:\n\n```python\n# Feature flag with automatic rollback\n@feature_flag('new-service-checkout',\
    \ \n              fallback=lambda: monolith.checkout)\ndef process_checkout(order):\n\
    \    return new_service.checkout.process(order)\n```\n\n**Rollback Triggers:**\n\
    - Error rate exceeds threshold\n- Latency increases beyond SLO\n- Business metrics\
    \ degradation\n- Manual emergency switch\n\n## Case Study: Amazon Prime Video's\
    \ Reverse Migration\n\nIn 2023, Amazon Prime Video shared their experience of\
    \ moving from microservices back to a monolith—a dramatic validation of the gradual\
    \ extraction strategy in reverse.\n\n### The Original Architecture\n\nPrime Video's\
    \ audio/video monitoring service was built as distributed serverless functions:\n\
    \n```\n[S3 Media Files]\n    |\n    v\n[Step Functions Orchestration]\n    |\n\
    \    +---> [Lambda: Media Analysis]\n    +---> [Lambda: Quality Detection]\n \
    \   +---> [Lambda: Alert Generation]\n    +---> [Lambda: S3 Storage]\n```\n\n\
    ### The Problems\n\n1. **High costs**: Running thousands of Lambda invocations\
    \ for each media file\n2. **Latency**: Step Functions overhead added significant\
    \ processing time\n3. **Complexity**: Debugging across 15+ services was difficult\n\
    4. **Scaling limits**: Hitting AWS service limits at high scale\n\n### The Solution:\
    \ Monolith Extraction (in reverse)\n\nThey consolidated the distributed services\
    \ into a single application:\n\n```\n[S3 Media Files]\n    |\n    v\n[Monolith\
    \ Service (EC2)]\n    |----> Media Analysis\n    |----> Quality Detection\n  \
    \  |----> Alert Generation\n```\n\n### Key Decisions\n\n- **Kept S3 for storage**:\
    \ External storage was the right boundary\n- **Consolidated compute**: All processing\
    \ in one service\n- **Preserved observability**: Added instrumentation to the\
    \ monolith\n- **Horizontal scaling**: EC2 auto-scaling instead of function-per-request\n\
    \n### Results\n\n- **90% cost reduction**: Eliminated per-invocation costs\n-\
    \ **Faster processing**: Removed orchestration overhead\n- **Simpler operations**:\
    \ Single service to monitor and debug\n- **Better scaling**: Predictable resource\
    \ usage\n\n### Lessons for Extraction Strategy\n\nThis case illustrates that:\n\
    \n1. **Distribution has costs** that must be justified\n2. **The decision can\
    \ be reversed** when wrong\n3. **Boundaries matter more than deployment topology**\n\
    4. **Start modular, extract only when needed**\n\n## FOE Alignment\n\nThis method\
    \ embodies all three FOE principles:\n\n### Understanding\n- **Deferring decisions**\
    \ until you have evidence\n- **Clear extraction criteria** make decisions objective\n\
    - **Rollback capability** means mistakes are recoverable\n\n### Fast Feedback\n\
    - **Shadow traffic** provides feedback before users are affected\n- **Dual-write\
    \ verification** catches issues early\n- **Gradual rollout** limits blast radius\n\
    \n### Confidence\n- **Preparation phase** ensures boundaries are solid before\
    \ extraction\n- **Feature flags** enable instant rollback\n- **Validated learning**\
    \ through metrics before commitment\n\n## Common Mistakes\n\n### 1. **Extracting\
    \ Too Early**\nPremature extraction based on anticipated needs rather than proven\
    \ requirements.\n\n**Solution**: Use the decision framework. Require evidence,\
    \ not speculation.\n\n### 2. **Big Bang Extraction**\nTrying to extract everything\
    \ at once instead of gradual strangler fig approach.\n\n**Solution**: Use progressive\
    \ strangulation. Start with reads, migrate writes gradually.\n\n### 3. **Ignoring\
    \ Data Gravity**\nUnderestimating the difficulty of data migration and consistency.\n\
    \n**Solution**: Plan data migration as a first-class concern. Budget significant\
    \ time for it.\n\n### 4. **No Rollback Plan**\nAssuming extraction will succeed\
    \ without preparation for failure.\n\n**Solution**: Always maintain rollback capability.\
    \ Test rollback procedures.\n\n### 5. **Wrong Boundaries**\nExtracting modules\
    \ that have high coupling, creating distributed monolith anti-pattern.\n\n**Solution**:\
    \ Validate boundaries first. If modules can't be tested independently, they're\
    \ not ready for extraction.\n\n## References\n\n- [Amazon Prime Video - Scaling\
    \ up the audio/video monitoring service](https://www.primevideotech.com/video-streaming/scaling-up-the-prime-video-audio-video-monitoring-service-and-reducing-costs-by-90)\n\
    - [Martin Fowler - Strangler Fig Application](https://martinfowler.com/bliki/StranglerFigApplication.html)\n\
    - [Kamil Grzybek - Gradual Extraction Approach](https://github.com/kgrzybek/modular-monolith-with-ddd#extraction)\n\
    - [Martin Fowler - Monolith First](https://martinfowler.com/bliki/MonolithFirst.html)\n\
    - [Segment - Goodbye Microservices](https://segment.com/blog/goodbye-microservices/)"
