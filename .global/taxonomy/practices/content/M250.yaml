  description: Prose for Definitive Deployment Pipeline.
  body: '**Pillar:** Patterns


    A definitive deployment pipeline is both the **sole path to production** and the
    **verification authority** that determines whether the system is healthy after
    deployment. It is not just automation — it is the single source of truth for what
    reaches production and whether it works.


    Where [Deployment Pipeline](./M112-deployment-pipeline) describes the structure
    and stages of an automated build-test-deploy process, this method describes the
    *standard* that pipeline must meet: every change, without exception, passes through
    the same automated process, and the pipeline itself confirms the deployment succeeded.


    ## Definition


    > "The deployment pipeline is the sole mechanism by which changes make their way
    into production. Every change — whether to code, configuration, infrastructure,
    or database — must go through the same automated process."

    >

    > — Jez Humble, *Continuous Delivery*


    ## Why It Matters


    ### Sole Path to Production


    No manual deployments. No SSH into production. No skipping stages. No "just this
    once."


    Every change — code, configuration, infrastructure, database migration — enters
    production through the same automated process. This eliminates the class of incidents
    caused by ad-hoc changes that bypass testing, review, and audit:


    - **No special cases** — Emergency fixes go through the pipeline. If the pipeline
    is too slow for emergencies, fix the pipeline.

    - **Complete audit trail** — Every production change is traceable to a commit,
    a build, and a set of test results.

    - **Reproducibility** — Any deployment can be reproduced exactly, because the
    pipeline defines the process, not a person''s memory.


    ### Verification Authority


    The pipeline doesn''t just deploy — it determines whether the deployment is healthy.
    After pushing code to production, the pipeline runs automated verification: smoke
    tests, health checks, canary analysis, and SLO monitoring. If verification fails,
    the pipeline rolls back automatically.


    This closes the loop. A pipeline that deploys but doesn''t verify is only half
    the job. A definitive pipeline owns the full lifecycle: deploy, verify, and act
    on the result.


    ## FOE Framing


    **Primary: Confidence to Act**


    Teams trust the pipeline because nothing bypasses it and it verifies everything
    works. When the pipeline is the sole authority, there are no surprises — no one
    pushed a hotfix at 2 AM that nobody knows about, no configuration was changed
    manually and forgotten. The pipeline''s green status means production is in a
    known, verified state. This trust compounds: teams deploy more often because they
    know the system will catch problems and roll back automatically.


    **Secondary: Fast Feedback Loops**


    Post-deployment verification creates a closed feedback loop: deploy, verify, act.
    Teams learn within minutes whether a deployment is healthy, not hours later when
    a customer reports a problem. Automatic rollback means the feedback loop includes
    the corrective action — the system heals itself without waiting for a human to
    notice.


    ## How It Works


    ### Pre-Deployment Gates


    Before code reaches production, the pipeline enforces automated gates:


    1. **Automated tests** — Unit, integration, and acceptance tests must pass. No
    manual overrides.

    2. **Security scans** — Static analysis, dependency vulnerability checks, and
    container image scanning.

    3. **Compliance checks** — Policy-as-code validates that changes meet organizational
    requirements.

    4. **Artifact integrity** — The exact artifact that passed testing is the artifact
    that deploys. No rebuilding.


    ### Post-Deployment Verification


    After deployment, the pipeline confirms the system is healthy:


    1. **Smoke tests** — Critical user journeys execute against the live deployment.

    2. **Health checks** — Application and infrastructure health endpoints return
    expected results.

    3. **Canary analysis** — Compare error rates, latency, and resource usage between
    the new version and the baseline.

    4. **SLO monitoring** — Verify that error budgets remain within acceptable thresholds.


    ### Automatic Rollback


    When post-deployment verification fails, the pipeline rolls back without human
    intervention. The rollback itself is verified — the pipeline confirms the previous
    version is healthy after reverting.


    ### SLO/Error Budget-Driven Decisions


    Mature pipelines use error budgets to govern deployment velocity. When the error
    budget is healthy, deployments proceed automatically. When the budget is exhausted,
    the pipeline can pause deployments until reliability recovers. This replaces subjective
    "is it safe to deploy?" decisions with objective, data-driven ones.


    ### Why Manual Approval Boards Are Anti-Patterns


    Change Advisory Boards (CABs) and manual approval gates slow delivery without
    improving outcomes. The DORA research in *Accelerate* found that external approval
    processes are negatively correlated with lead time and deployment frequency, with
    no improvement in change failure rate. The definitive pipeline replaces human
    gatekeeping with automated verification — faster, more consistent, and always
    awake.


    ## Cautionary Example: Knight Capital


    On August 1, 2012, Knight Capital Group deployed new trading software to production
    using a manual process that bypassed their normal controls. An operator failed
    to update one of eight servers. The old code on that server interacted with the
    new code on the other seven, generating millions of erroneous trades. In 45 minutes,
    Knight Capital lost $440 million.


    There was no automated deployment process to ensure consistency. There was no
    post-deployment verification to detect the misconfigured server. A definitive
    deployment pipeline — one that deployed all servers identically and verified the
    result — would have prevented the failure or caught it in seconds.


    ## Relationship to DORA Metrics


    All four DORA metrics depend on a definitive pipeline:


    | DORA Metric | How a Definitive Pipeline Helps |

    |-------------|-------------------------------|

    | **Deployment Frequency** | When the pipeline is trusted and fast, teams deploy
    more often |

    | **Lead Time for Changes** | No manual approvals or ad-hoc processes slow the
    path to production |

    | **Change Failure Rate** | Pre-deployment gates and post-deployment verification
    catch failures |

    | **Time to Restore Service** | Automatic rollback restores service without waiting
    for human response |


    ## Relationship to Other Methods


    - **[Deployment Pipeline](./M112-deployment-pipeline)** — Describes the structure
    and stages of an automated pipeline. This method adds the requirement that the
    pipeline is *definitive*: the only path to production and the verification authority.

    - **[Blue-Green Deployment](./M102-blue-green-deployment)** — A deployment strategy
    the definitive pipeline can use, with built-in rollback capability.

    - **[Canary Release](./M104-canary-release)** — Provides the post-deployment verification
    data the pipeline uses to decide whether to proceed or roll back.

    - **[Feature Flags](./M125-feature-flags)** — Enable deploying code through the
    pipeline without releasing it to users, reducing the blast radius of any deployment.

    - **[Decouple Deployment from Release](./M249-decouple-deployment-from-release)**
    — The definitive pipeline handles the deployment side; feature flags and progressive
    delivery handle the release side.

    - **[Infrastructure as Code](./M128-infrastructure-as-code)** — Infrastructure
    changes go through the same pipeline as application code — no exceptions.

    - **[Trunk-Based Development](./M140-trunk-based-development)** — Every commit
    to trunk triggers the pipeline, keeping the path to production short and well-exercised.


