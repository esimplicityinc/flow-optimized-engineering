  body: 'A collection of flow-optimized methods for AI-assisted software development.


    ## What This Guide Covers


    Agentic coding -- working with AI coding assistants -- changes how we write software.
    But not all approaches are equal. This guide collects methods that have been tested
    and refined through real observations.


    ### Agent Governance & Safety


    Constrained autonomy patterns, version pinning, governed agent architectures,
    and practices for maintaining control over AI-assisted workflows.


    ### Feedback & Verification


    Test-driven agent development, verification-before-completion, early feedback
    loops, and practices for building confidence in AI-generated code.


    ### Collaboration & Knowledge


    Knowledge distribution, agent-mediated access, planning state management, and
    practices for effective human-agent collaboration.


    ## Getting Started


    1. Browse the methods in the table above

    2. Start with the **Essential** methods -- they form the foundation for safe,
    effective agentic coding

    3. Review the supporting observations to understand the evidence

    4. Try the methods that fit your context

    5. Consider [contributing your own observations](../contributing-observations)'
