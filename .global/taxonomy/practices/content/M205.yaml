spec:
  description: Prose for Use Case Implementation.
  body: "**Pillar:** Layer Organization\n\nUse cases (also called Interactors or Application\
    \ Services) contain application-specific business rules. They orchestrate the\
    \ flow of data to and from entities, and direct those entities to use their enterprise-wide\
    \ business rules to achieve the goals of the use case.\n\n## Definition\n\n> The\
    \ software in this layer contains application-specific business rules. It encapsulates\
    \ and implements all of the use cases of the system. These use cases orchestrate\
    \ the flow of data to and from the entities, and direct those entities to use\
    \ their enterprise-wide business rules to achieve the goals of the use case.\n\
    >\n> — Robert C. Martin, Clean Architecture\n\n## Why It Matters\n\nUse cases\
    \ provide:\n\n- **Clear boundaries** - Each use case represents a specific user\
    \ goal\n- **Orchestration** - Coordinates entities and external services\n- **Transaction\
    \ boundaries** - Defines where transactions begin and end\n- **Decoupling** -\
    \ UI and database don't know about each other\n- **Testability** - Business processes\
    \ can be tested without infrastructure\n\n## Structure of a Use Case\n\n### 1.\
    \ Input/Output Boundaries\n\nDefine clear contracts for what goes in and out:\n\
    \n```typescript\n// Input (Command or Query)\ninterface CreateOrderInput {\n \
    \ customerId: string;\n  items: Array<{\n    productId: string;\n    quantity:\
    \ number;\n  }>;\n  shippingAddress: AddressDto;\n}\n\n// Output (Result)\ninterface\
    \ CreateOrderOutput {\n  orderId: string;\n  total: MoneyDto;\n  itemCount: number;\n\
    \  estimatedDelivery: Date;\n}\n```\n\n### 2. Use Case Class\n\n```typescript\n\
    class CreateOrderUseCase {\n  constructor(\n    private orderRepository: OrderRepository,\n\
    \    private productRepository: ProductRepository,\n    private customerRepository:\
    \ CustomerRepository,\n    private inventoryService: InventoryService,\n    private\
    \ pricingEngine: PricingEngine,\n    private eventPublisher: DomainEventPublisher\n\
    \  ) {}\n  \n  async execute(input: CreateOrderInput): Promise<CreateOrderOutput>\
    \ {\n    // 1. Validate and load dependencies\n    const customer = await this.customerRepository.findById(\n\
    \      new CustomerId(input.customerId)\n    );\n    if (!customer) {\n      throw\
    \ new CustomerNotFoundError(input.customerId);\n    }\n    \n    // 2. Create\
    \ and populate the aggregate\n    const order = new Order(customer.id);\n    \n\
    \    for (const itemInput of input.items) {\n      const product = await this.productRepository.findById(\n\
    \        new ProductId(itemInput.productId)\n      );\n      if (!product) {\n\
    \        throw new ProductNotFoundError(itemInput.productId);\n      }\n     \
    \ \n      // Check inventory\n      const available = await this.inventoryService.checkAvailability(\n\
    \        product.id,\n        itemInput.quantity\n      );\n      if (!available)\
    \ {\n        throw new InsufficientInventoryError(product.id, itemInput.quantity);\n\
    \      }\n      \n      // Calculate price\n      const price = await this.pricingEngine.calculatePrice(\n\
    \        product,\n        customer,\n        itemInput.quantity\n      );\n \
    \     \n      order.addItem(product, itemInput.quantity, price);\n    }\n    \n\
    \    // 3. Set shipping address\n    order.setShippingAddress(this.mapAddress(input.shippingAddress));\n\
    \    \n    // 4. Validate the order\n    order.validate();\n    \n    // 5. Reserve\
    \ inventory\n    for (const item of order.items) {\n      await this.inventoryService.reserve(item.productId,\
    \ item.quantity);\n    }\n    \n    // 6. Save the order\n    await this.orderRepository.save(order);\n\
    \    \n    // 7. Publish events\n    for (const event of order.domainEvents) {\n\
    \      await this.eventPublisher.publish(event);\n    }\n    order.clearEvents();\n\
    \    \n    // 8. Return result\n    return {\n      orderId: order.id.value,\n\
    \      total: this.mapMoney(order.total),\n      itemCount: order.items.length,\n\
    \      estimatedDelivery: this.calculateDeliveryDate(order)\n    };\n  }\n  \n\
    \  private mapAddress(dto: AddressDto): Address {\n    return new Address(dto.street,\
    \ dto.city, dto.zipCode, dto.country);\n  }\n  \n  private mapMoney(money: Money):\
    \ MoneyDto {\n    return { amount: money.amount, currency: money.currency };\n\
    \  }\n  \n  private calculateDeliveryDate(order: Order): Date {\n    // Business\
    \ logic for delivery estimation\n    const baseDays = 3;\n    const itemDelay\
    \ = Math.max(0, order.items.length - 5);\n    const deliveryDate = addBusinessDays(new\
    \ Date(), baseDays + itemDelay);\n    return deliveryDate;\n  }\n}\n```\n\n##\
    \ Use Case Patterns\n\n### Command Use Cases\n\nModify state and return minimal\
    \ data:\n\n```typescript\ninterface CancelOrderUseCase {\n  execute(command: CancelOrderCommand):\
    \ Promise<void>;\n}\n\nclass CancelOrderCommand {\n  constructor(\n    readonly\
    \ orderId: string,\n    readonly reason: string,\n    readonly cancelledBy: string\n\
    \  ) {}\n}\n```\n\n### Query Use Cases\n\nRead-only operations that return data:\n\
    \n```typescript\ninterface GetOrderDetailsUseCase {\n  execute(query: GetOrderQuery):\
    \ Promise<OrderDetailsDto>;\n}\n\nclass GetOrderQuery {\n  constructor(readonly\
    \ orderId: string) {}\n}\n\ninterface OrderDetailsDto {\n  id: string;\n  status:\
    \ string;\n  items: OrderItemDto[];\n  total: MoneyDto;\n  customer: CustomerSummaryDto;\n\
    \  timeline: OrderEventDto[];\n}\n```\n\n### Process Use Cases\n\nLong-running\
    \ operations with progress tracking:\n\n```typescript\ninterface ProcessBulkImportUseCase\
    \ {\n  execute(command: BulkImportCommand): Promise<ImportJobId>;\n  getProgress(jobId:\
    \ ImportJobId): Promise<ImportProgress>;\n}\n```\n\n## Use Case Responsibilities\n\
    \n### ✅ Do\n\n- Orchestrate entities to accomplish a goal\n- Coordinate multiple\
    \ repositories\n- Call external services through ports\n- Handle transactions\n\
    - Map between DTOs and domain objects\n- Publish domain events\n- Validate input\
    \ at the boundary\n\n### ❌ Don't\n\n- Contain business rules (belongs in entities)\n\
    - Depend on frameworks (HTTP, database, etc.)\n- Access infrastructure directly\n\
    - Contain presentation logic\n- Implement cross-cutting concerns (logging, auth)\n\
    \n## Common Mistakes\n\n### ❌ Business Logic in Use Case\n\n```typescript\n//\
    \ WRONG: Business rule in use case\nclass CreateOrderUseCase {\n  async execute(input:\
    \ CreateOrderInput) {\n    if (input.items.length > 50) { // ❌ Business rule\n\
    \      throw new Error('Too many items');\n    }\n    // ...\n  }\n}\n\n// CORRECT:\
    \ Business rule in entity\nclass Order {\n  addItem(product: Product, quantity:\
    \ number) {\n    if (this.items.length >= 50) { // ✅ Business rule in entity\n\
    \      throw new DomainError('Maximum 50 items per order');\n    }\n    // ...\n\
    \  }\n}\n```\n\n### ❌ Framework Dependencies\n\n```typescript\n// WRONG: Use case\
    \ depends on Express\n\nclass CreateOrderUseCase {\n  async execute(req: Request,\
    \ res: Response) { // ❌ Framework types\n    // ...\n  }\n}\n```\n\n### ❌ Direct\
    \ Database Access\n\n```typescript\n// WRONG: Use case bypasses repository\nclass\
    \ CreateOrderUseCase {\n  constructor(private db: Database) {} // ❌ Direct DB\
    \ dependency\n  \n  async execute(input: CreateOrderInput) {\n    await this.db.query('INSERT\
    \ INTO orders ...'); // ❌ SQL in use case\n  }\n}\n```\n\n### ❌ Anemic Use Case\n\
    \n```typescript\n// WRONG: Use case just passes through to repository\nclass CreateOrderUseCase\
    \ {\n  constructor(private orderRepository: OrderRepository) {}\n  \n  async execute(input:\
    \ CreateOrderInput) {\n    const order = new Order(); // ❌ No validation, no orchestration\n\
    \    await this.orderRepository.save(order);\n  }\n}\n```\n\n## Testing Use Cases\n\
    \n### Unit Tests with Mocks\n\n```typescript\ndescribe('CreateOrderUseCase', ()\
    \ => {\n  let useCase: CreateOrderUseCase;\n  let orderRepository: jest.Mocked<OrderRepository>;\n\
    \  let productRepository: jest.Mocked<ProductRepository>;\n  let inventoryService:\
    \ jest.Mocked<InventoryService>;\n  \n  beforeEach(() => {\n    orderRepository\
    \ = {\n      save: jest.fn()\n    } as any;\n    \n    productRepository = {\n\
    \      findById: jest.fn()\n    } as any;\n    \n    inventoryService = {\n  \
    \    checkAvailability: jest.fn()\n    } as any;\n    \n    useCase = new CreateOrderUseCase(\n\
    \      orderRepository,\n      productRepository,\n      inventoryService\n  \
    \  );\n  });\n  \n  it('should create order with valid input', async () => {\n\
    \    const product = createTestProduct();\n    productRepository.findById.mockResolvedValue(product);\n\
    \    inventoryService.checkAvailability.mockResolvedValue(true);\n    \n    const\
    \ input = createTestInput();\n    const result = await useCase.execute(input);\n\
    \    \n    expect(orderRepository.save).toHaveBeenCalled();\n    expect(result.orderId).toBeDefined();\n\
    \    expect(result.total.amount).toBeGreaterThan(0);\n  });\n  \n  it('should\
    \ throw when product not found', async () => {\n    productRepository.findById.mockResolvedValue(null);\n\
    \    \n    await expect(useCase.execute(createTestInput()))\n      .rejects\n\
    \      .toThrow(ProductNotFoundError);\n  });\n});\n```\n\n## FOE Alignment\n\n\
    Use Case Implementation supports FOE principles:\n\n- **Understanding** - Each\
    \ use case represents a clear user goal; the flow of data is explicit and traceable\n\
    - **Confidence** - Use cases define transaction boundaries; operations are atomic\
    \ and consistent\n- **Fast Feedback** - Use cases can be tested with in-memory\
    \ repositories; no need for real databases\n\n## Related Methods\n\n- [M201-layer-organization](/docs/external-frameworks/clean-architecture/methods/M201-layer-organization)\
    \ - Use cases as the second layer\n- [M204-entity-design](/docs/external-frameworks/clean-architecture/methods/M204-entity-design)\
    \ - Entities orchestrated by use cases\n- [M101-application-service](/docs/external-frameworks/domain-driven-design/methods/M101-application-service)\
    \ - Similar concept in DDD\n\n## References\n\n- Martin, R. C. (2017). *Clean\
    \ Architecture: A Craftsman's Guide to Software Structure and Design*. Prentice\
    \ Hall.\n- Cockburn, A. (2005). [Hexagonal Architecture](https://alistair.cockburn.us/hexagonal-architecture/)."
