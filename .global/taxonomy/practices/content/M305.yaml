  description: Prose for Lexical Precision Search.
  body: 'Use BM25 or exact-match algorithms to guarantee retrieval of specific identifiers,
    legal codes, serial numbers, and regulated terminology where semantic approximation
    is unacceptable.


    :::caution Early Stage

    This method is still being validated through observations.

    :::


    ## Overview


    Semantic vector search is powerful but probabilistic. When a system must retrieve
    contract number "MSA-2026-0042" or regulation "17 CFR 240.10b-5," a "close enough"
    match is a failure. Lexical search — term frequency weighted retrieval — provides
    the precision layer that semantic search cannot.


    BM25 (Best Match 25) is the standard algorithm: it scores documents by term frequency
    and inverse document frequency, rewarding documents that contain the exact terms
    in the query at meaningful frequency. For identifiers and codes, it functions
    as exact-match retrieval.


    In regulated industries, compliance, legal, and financial domains, the majority
    of high-stakes queries involve exact identifiers. The lexical layer is not a fallback
    — it is a required component of any production-grade semantic layer.


    ## When to Use


    Use this method when:


    - Queries contain specific identifiers, contract numbers, regulation codes, or
    serial numbers

    - Operating in regulated environments where exact terminology must be retrieved
    accurately

    - Users know the precise term they''re looking for and semantic approximation
    would surface wrong results

    - Auditability requires showing the exact document retrieved, not an approximation


    ## When NOT to Use


    Avoid this method when:


    - Queries are entirely conceptual and no exact terms appear in the corpus

    - As a standalone retrieval method for natural language queries (pair with semantic
    search via M303 Retriever Ensemble)


    ## How It Works


    ### Prerequisites


    Before starting:

    - Identify the identifier patterns and regulated term vocabularies in your domain

    - Set up a BM25-capable search index (Elasticsearch, OpenSearch, or a lightweight
    library like rank_bm25)


    ### Step 1: Index Documents with Full Text


    Ingest documents into the lexical index with full text preserved (not just embeddings).
    Normalize identifiers to canonical forms during ingestion (e.g., strip whitespace
    from contract numbers, normalize case for regulation codes).


    ### Step 2: Detect Identifier Patterns in Queries


    Before routing to the ensemble, detect whether the query contains identifier-like
    patterns (regex for contract numbers, regulation codes, etc.). Flag identifier-heavy
    queries for lexical-first routing.


    ### Step 3: Execute BM25 Query


    Issue the query to the BM25 index. For identifier queries, exact match scoring
    will surface the correct document in top results with high confidence.


    ### Step 4: Pass Results to Ensemble


    Return results with BM25 scores to the retriever ensemble (M303) for merging with
    semantic results.


    ## Example


    Query: "Show me the current status of vendor assessment VAR-2025-0089."


    - Semantic search: may return vendor assessment documents generally, probably
    including VAR-2025-0089 but not guaranteed at top position

    - Lexical search: returns the exact document containing "VAR-2025-0089" as the
    top result with high confidence


    In a compliance context, the lexical result is definitive. The semantic results
    provide supporting context.


    ## Common Pitfalls


    1. **Identifier normalization failures** — "VAR-2025-0089" and "VAR 2025 0089"
    and "var20250089" are the same identifier stored differently. Normalize at ingestion
    and at query time.

    2. **BM25 for conceptual queries** — running BM25 against a natural language query
    like "what are our risk exposures?" produces poor results. Use lexical search
    for identifiers; semantic search for concepts.

    3. **Missing from index** — identifiers that appear only in structured data (databases,
    spreadsheets) won''t be in a text index. Ensure structured sources are indexed
    as text artifacts.


    ## How You Can Help


    If you''re testing this method:


    1. Document the identifier patterns in your domain

    2. Measure precision for identifier-based queries with vs. without lexical search

    3. Share any normalization patterns you found necessary'
