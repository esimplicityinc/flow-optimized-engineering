  description: Prose for Adapter Implementation.
  body: "**Pillar:** Dependency Management\n\nAdapters implement the ports defined\
    \ by the application core, translating between the application's domain language\
    \ and the specific protocols or APIs of external systems. They bridge the gap\
    \ between the technology-agnostic core and the concrete technologies of the outside\
    \ world.\n\n## Definition\n\n> An adapter translates between the application's\
    \ internal model and the external model of some other system. It implements a\
    \ port using a specific technology.\n>\n> — Alistair Cockburn, Hexagonal Architecture\n\
    \n## Why It Matters\n\nAdapters provide critical flexibility:\n\n- **Technology\
    \ isolation** - The core remains unaware of external technologies\n- **Swappable\
    \ implementations** - Change databases, frameworks, or services without touching\
    \ business logic\n- **Testing support** - Replace real adapters with test doubles\n\
    - **Multiple implementations** - Support different technologies for different\
    \ environments\n\n## Types of Adapters\n\n### Primary Adapters (Driving Adapters)\n\
    \nPrimary adapters translate external inputs into calls on the application's primary\
    \ ports. They drive the application.\n\n**Examples:**\n- HTTP controllers (REST\
    \ API)\n- CLI command handlers\n- Message queue consumers\n- Scheduled job triggers\n\
    - GraphQL resolvers\n\n```typescript\n// HTTP Controller Adapter\n\nclass HttpOrderController\
    \ {\n  constructor(private orderService: OrderService) {}\n  \n  async createOrder(req:\
    \ Request, res: Response): Promise<void> {\n    try {\n      // Translate HTTP\
    \ request to domain command\n      const command = new CreateOrderCommand(\n \
    \       req.body.customerId,\n        req.body.items.map((item: any) => ({\n \
    \         productId: item.productId,\n          quantity: item.quantity\n    \
    \    }))\n      );\n      \n      // Call application core\n      const result\
    \ = await this.orderService.createOrder(command);\n      \n      // Translate\
    \ domain result to HTTP response\n      res.status(201).json({\n        orderId:\
    \ result.orderId,\n        total: result.total.toString(),\n        status: result.status\n\
    \      });\n    } catch (error) {\n      // Translate domain errors to HTTP status\
    \ codes\n      if (error instanceof ValidationError) {\n        res.status(400).json({\
    \ error: error.message });\n      } else if (error instanceof ProductNotFoundError)\
    \ {\n        res.status(404).json({ error: 'Product not found' });\n      } else\
    \ {\n        res.status(500).json({ error: 'Internal server error' });\n     \
    \ }\n    }\n  }\n}\n```\n\n### Secondary Adapters (Driven Adapters)\n\nSecondary\
    \ adapters implement the application's secondary ports, translating core requests\
    \ into external system calls.\n\n**Examples:**\n- Database repositories\n- External\
    \ API clients\n- Email service implementations\n- File storage adapters\n- Message\
    \ publishers\n\n```typescript\n// Database Repository Adapter\n\nclass PostgresOrderRepository\
    \ implements OrderRepository {\n  constructor(private db: Pool) {}\n  \n  async\
    \ findById(id: OrderId): Promise<Order | null> {\n    const result = await this.db.query(\n\
    \      'SELECT * FROM orders WHERE id = $1',\n      [id.value]\n    );\n    \n\
    \    if (result.rows.length === 0) {\n      return null;\n    }\n    \n    return\
    \ this.mapToDomain(result.rows[0]);\n  }\n  \n  async save(order: Order): Promise<void>\
    \ {\n    const client = await this.db.connect();\n    try {\n      await client.query('BEGIN');\n\
    \      \n      // Save order header\n      await client.query(\n        `INSERT\
    \ INTO orders (id, customer_id, status, created_at)\n         VALUES ($1, $2,\
    \ $3, $4)\n         ON CONFLICT (id) DO UPDATE SET\n         status = EXCLUDED.status`,\n\
    \        [order.id.value, order.customerId.value, order.status, order.createdAt]\n\
    \      );\n      \n      // Save order items\n      for (const item of order.items)\
    \ {\n        await client.query(\n          `INSERT INTO order_items (order_id,\
    \ product_id, quantity, price)\n           VALUES ($1, $2, $3, $4)`,\n       \
    \   [order.id.value, item.productId.value, item.quantity, item.price.amount]\n\
    \        );\n      }\n      \n      await client.query('COMMIT');\n    } catch\
    \ (error) {\n      await client.query('ROLLBACK');\n      throw error;\n    }\
    \ finally {\n      client.release();\n    }\n  }\n  \n  private mapToDomain(row:\
    \ any): Order {\n    // Map database row to domain entity\n    const order = new\
    \ Order(\n      new CustomerId(row.customer_id),\n      new OrderId(row.id)\n\
    \    );\n    // ... map other fields\n    return order;\n  }\n}\n```\n\n## Adapter\
    \ Responsibilities\n\n### 1. Translation\n\nConvert between domain types and external\
    \ types:\n\n```typescript\nclass StripePaymentAdapter implements PaymentGateway\
    \ {\n  constructor(private stripe: Stripe) {}\n  \n  async charge(amount: Money,\
    \ cardToken: string): Promise<PaymentResult> {\n    // Translate domain Money\
    \ to Stripe's smallest currency unit (cents)\n    const stripeAmount = amount.toCents();\n\
    \    \n    try {\n      const charge = await this.stripe.charges.create({\n  \
    \      amount: stripeAmount,\n        currency: amount.currency.toLowerCase(),\n\
    \        source: cardToken\n      });\n      \n      // Translate Stripe response\
    \ to domain result\n      return {\n        success: true,\n        transactionId:\
    \ charge.id,\n        amount: Money.fromCents(charge.amount, charge.currency)\n\
    \      };\n    } catch (error) {\n      // Translate Stripe error to domain error\n\
    \      throw new PaymentFailedError(this.mapStripeError(error));\n    }\n  }\n\
    \  \n  private mapStripeError(error: any): string {\n    if (error.type === 'StripeCardError')\
    \ {\n      return `Card declined: ${error.message}`;\n    }\n    return 'Payment\
    \ processing failed';\n  }\n}\n```\n\n### 2. Error Handling\n\nTranslate external\
    \ errors into domain errors:\n\n```typescript\nclass SendGridEmailAdapter implements\
    \ EmailService {\n  constructor(private sendgrid: SendGridClient) {}\n  \n  async\
    \ send(to: EmailAddress, subject: string, body: string): Promise<void> {\n   \
    \ try {\n      await this.sendgrid.send({\n        to: to.value,\n        from:\
    \ 'noreply@example.com',\n        subject,\n        text: body\n      });\n  \
    \  } catch (error) {\n      // Translate SendGrid error to domain error\n    \
    \  if (error.code === 401) {\n        throw new EmailConfigurationError('Invalid\
    \ API key');\n      } else if (error.response?.statusCode === 400) {\n       \
    \ throw new InvalidEmailError(to.value);\n      }\n      throw new EmailDeliveryError('Failed\
    \ to send email', error);\n    }\n  }\n}\n```\n\n### 3. Transaction Management\n\
    \nHandle transactions that span multiple adapters:\n\n```typescript\nclass UnitOfWorkOrderRepository\
    \ implements OrderRepository {\n  constructor(\n    private db: DatabaseConnection,\n\
    \    private eventPublisher: DomainEventPublisher\n  ) {}\n  \n  async save(order:\
    \ Order): Promise<void> {\n    await this.db.transaction(async (trx) => {\n  \
    \    // Save order\n      await trx.orders.insert(this.mapToDb(order));\n    \
    \  \n      // Publish domain events\n      for (const event of order.domainEvents)\
    \ {\n        await this.eventPublisher.publish(event);\n      }\n      \n    \
    \  order.clearEvents();\n    });\n  }\n}\n```\n\n## Testing Adapters\n\n### Integration\
    \ Tests\n\nTest adapters against real (but isolated) external systems:\n\n```typescript\n\
    describe('PostgresOrderRepository', () => {\n  let repository: PostgresOrderRepository;\n\
    \  let testDb: TestDatabase;\n  \n  beforeEach(async () => {\n    testDb = await\
    \ TestDatabase.create();\n    repository = new PostgresOrderRepository(testDb.pool);\n\
    \  });\n  \n  afterEach(async () => {\n    await testDb.cleanup();\n  });\n  \n\
    \  it('should save and retrieve orders', async () => {\n    const order = createTestOrder();\n\
    \    \n    await repository.save(order);\n    const retrieved = await repository.findById(order.id);\n\
    \    \n    expect(retrieved).toEqual(order);\n  });\n});\n```\n\n### Contract\
    \ Tests\n\nVerify adapters conform to port contracts:\n\n```typescript\ndescribe('OrderRepository\
    \ Contract', () => {\n  const implementations = [\n    { name: 'Postgres', factory:\
    \ () => new PostgresOrderRepository(testDb) },\n    { name: 'InMemory', factory:\
    \ () => new InMemoryOrderRepository() }\n  ];\n  \n  implementations.forEach(({\
    \ name, factory }) => {\n    describe(name, () => {\n      let repository: OrderRepository;\n\
    \      \n      beforeEach(() => {\n        repository = factory();\n      });\n\
    \      \n      it('should return null for non-existent order', async () => {\n\
    \        const result = await repository.findById(new OrderId('non-existent'));\n\
    \        expect(result).toBeNull();\n      });\n      \n      it('should find\
    \ saved orders', async () => {\n        const order = createTestOrder();\n   \
    \     await repository.save(order);\n        \n        const found = await repository.findById(order.id);\n\
    \        expect(found?.id).toEqual(order.id);\n      });\n    });\n  });\n});\n\
    ```\n\n## Common Mistakes\n\n### ❌ Business Logic in Adapters\n\n```typescript\n\
    // WRONG: Business logic in adapter\nclass PostgresOrderRepository {\n  async\
    \ save(order: Order): Promise<void> {\n    if (order.total.amount > 10000) { //\
    \ ❌ Business rule in adapter\n      throw new Error('Order too large');\n    }\n\
    \    // ...\n  }\n}\n```\n\n### ❌ Leaking External Types Through Ports\n\n```typescript\n\
    // WRONG: Port returns external type\ninterface OrderRepository {\n  findById(id:\
    \ OrderId): Promise<PrismaOrder | null>; // ❌ Prisma type\n}\n```\n\n### ❌ Adapter\
    \ Calling Adapter\n\n```typescript\n// WRONG: Adapter depends on another adapter\n\
    class OrderController {\n  constructor(\n    private orderService: OrderService,\n\
    \    private emailService: SendGridEmailAdapter // ❌ Should depend on port\n \
    \ ) {}\n}\n```\n\n## FOE Alignment\n\nAdapter Implementation supports FOE principles:\n\
    \n- **Understanding** - Adapters isolate technology complexity; the core remains\
    \ focused on business logic\n- **Confidence** - Adapters can be thoroughly tested\
    \ in isolation; swapping implementations is low-risk\n- **Fast Feedback** - In-memory\
    \ adapters enable fast unit tests; integration tests verify real behavior\n\n\
    ## Related Methods\n\n- [M202-port-definition](/docs/external-frameworks/clean-architecture/methods/M202-port-definition)\
    \ - Defining the interfaces adapters implement\n- [M206-boundary-crossing](/docs/external-frameworks/clean-architecture/methods/M206-boundary-crossing)\
    \ - Mechanisms for crossing between layers\n- [M207-test-isolation](/docs/external-frameworks/clean-architecture/methods/M207-test-isolation)\
    \ - Testing core without external dependencies\n\n## References\n\n- Cockburn,\
    \ A. (2005). [Hexagonal Architecture](https://alistair.cockburn.us/hexagonal-architecture/).\n\
    - Martin, R. C. (2017). *Clean Architecture: A Craftsman's Guide to Software Structure\
    \ and Design*. Prentice Hall."
