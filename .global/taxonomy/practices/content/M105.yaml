  description: Prose for Change Failure Rate.
  body: '**Pillar:** Stability


    Change Failure Rate measures the percentage of deployments that result in degraded
    service or require remediation. It is a key DORA stability metric that balances
    the throughput metrics.


    ## Definition


    > The percentage of changes to production that result in degraded service (e.g.,
    service impairment, outage) and subsequently require remediation (e.g., hotfix,
    rollback, patch).


    ## Why It Matters


    Low change failure rate indicates:


    - **High quality** of changes being deployed

    - **Effective testing** catching issues before production

    - **Good architectural practices** limiting blast radius

    - **Confidence to deploy** frequently without fear


    ## Performance Benchmarks


    | Performance Level | Change Failure Rate |

    |-------------------|---------------------|

    | Elite | 0-15% |

    | High | 16-30% |

    | Medium | 16-30% |

    | Low | 16-30% |


    Note: DORA research shows even low performers can maintain moderate change failure
    rates - what differentiates high performers is their ability to maintain low rates
    while deploying frequently.


    ## How to Measure


    1. **Count deployments** in a time period

    2. **Count failures** requiring rollback, hotfix, or incident response

    3. **Calculate percentage**: (failures / deployments) × 100

    4. **Define "failure" clearly** for your context


    ## What Counts as a Failure?


    Include:

    - Deployments that were rolled back

    - Deployments requiring immediate hotfixes

    - Deployments causing service degradation or outages

    - Deployments requiring incident response


    Exclude:

    - Planned rollbacks (feature flag disables)

    - Issues found before production (caught in staging)

    - Unrelated incidents


    ## Improving Change Failure Rate


    Common practices that reduce change failure rate:


    - **Comprehensive Testing** - Unit, integration, E2E, contract tests

    - **Code Review** - Catch issues before merge

    - **Gradual Rollouts** - Canary, blue-green deployments

    - **Feature Flags** - Quickly disable problematic features

    - **Observability** - Catch issues quickly before widespread impact


    ## Relationship to Other Metrics


    - **Deployment Frequency** - High performers maintain low CFR with high frequency

    - **Time to Restore** - Fast recovery reduces impact of failures

    - **Lead Time** - Thorough testing may add time but reduces failures


    ## FOE Alignment


    Change Failure Rate directly measures **Confidence** - the ability to deploy knowing
    the change is safe. It''s the quality gate that enables fast iteration.'
