  description: Prose for Semantic Observability.
  body: 'Instrument the agent''s retrieval-reasoning chain with distributed tracing
    so that every span of a request — query, retrieval, re-ranking, reasoning, output
    — is logged, attributable, and analyzable for semantic failures.


    :::caution Early Stage

    This method is still being validated through observations.

    :::


    ## Overview


    A semantic layer failure is rarely visible at the surface. The agent produces
    an answer that looks plausible. But beneath the surface, it retrieved 20 chunks
    and used 2. It cited a document that was 18 months old. It produced an answer
    that contradicts the most authoritative source because that source was ranked
    11th in the retrieved set.


    Without observability, these failures are invisible until a user reports a bad
    decision. With observability, they are detectable, measurable, and correctable
    before they cause harm.


    Semantic observability applies distributed tracing — the same technique used to
    debug microservices — to the retrieval-reasoning pipeline. Each logical step is
    a span: query preprocessing, retrieval, re-ranking, context assembly, LLM reasoning,
    output validation, gate decisions. Every span is logged with timing, inputs, outputs,
    and key metrics.


    This creates the forensic evidence needed to diagnose exactly where meaning breaks
    down.


    ## When to Use


    Use this method when:


    - Deploying agents to production where output quality must be monitored continuously

    - Diagnosing retrieval or reasoning failures reported by users

    - Identifying systematic patterns in agent failures (e.g., consistently poor performance
    on a specific query type)

    - Building the production-to-eval pipeline (M320) — traces are the raw material
    for evals


    ## When NOT to Use


    Avoid this method when:


    - Still in early prototyping where observability overhead isn''t justified

    - Privacy constraints prohibit logging query content (design privacy-safe tracing
    with anonymization)


    ## How It Works


    ### Prerequisites


    Before starting:

    - Choose an observability platform: LangSmith, Arize Phoenix, Braintrust, or a
    general APM tool with custom spans

    - Instrument your retrieval and LLM calls with the platform''s SDK

    - Define what metadata to capture at each span (query, retrieved chunk IDs, scores,
    gate decisions, latency)


    ### Step 1: Instrument the Retrieval Span


    For each retrieval call, log:

    - Query text (or anonymized hash for privacy)

    - Retrieval mode (semantic, lexical, graph)

    - Retrieved chunk IDs and relevance scores

    - Context contract metadata for each chunk (authority, recency)

    - Retrieval latency


    ### Step 2: Instrument the Reasoning Span


    For each LLM call, log:

    - Model and version

    - Token counts (prompt and completion)

    - Context window utilization percentage

    - Citations produced by the model

    - Reasoning latency


    ### Step 3: Instrument Gate Decisions


    For each quality gate (M317), log:

    - Gate type and input artifact

    - Pass/fail decision and score

    - Action taken on failure (retry, reset, hard fail)

    - Gate latency


    ### Step 4: Build Dashboards for Semantic Health


    Aggregate traces into operational dashboards:

    - **Over-fetching detector**: queries where context window utilization > 80% but
    faithfulness < 0.7 (retrieving a lot, using little)

    - **Precision degradation**: queries where fewer than 50% of retrieved chunks
    appear in the agent''s citations

    - **Stale context alerts**: queries where retrieved chunks have recency scores
    below threshold

    - **Gate failure rates**: which gates fail most often, and on which query types


    ### Step 5: Use Traces for Failure Investigation


    When a user reports a bad answer, retrieve the trace for that request. Walk the
    spans:

    1. What was retrieved? Were the right documents included?

    2. What was the context precision score? Was there noise?

    3. Did any gates fire? What actions were taken?

    4. What did the model actually use from the context?


    This forensic capability transforms debugging from "the AI gave a wrong answer"
    to "retrieval ranked the 2019 policy above the 2023 amendment because the recency
    gate wasn''t enforced on this query path."


    ## Example


    Trace analysis reveals: the agent is consistently retrieving 15 chunks but only
    citing 2-3 in its answers. Context window utilization is at 94%, but faithfulness
    scores are 0.71 — well below target.


    Diagnosis: over-fetching. The agent is overwhelmed by context volume and producing
    partially hallucinated answers to fill in what it can''t synthesize.


    Intervention: reduce K from 15 to 6, add a re-ranker to improve precision, increase
    relevance gate threshold from 0.5 to 0.65.


    Result: faithfulness improves to 0.89, latency decreases by 30% (fewer tokens
    to process), and user-reported answer quality improves.


    ## Common Pitfalls


    1. **Logging everything, observing nothing** — traces without dashboards and alerting
    are archaeological data, not operational intelligence. Build the dashboards.

    2. **Privacy leaks in traces** — logging raw query text may expose PII or confidential
    information. Design a privacy policy for trace data before instrumenting production.

    3. **Span granularity mismatch** — spans that are too coarse miss the detail needed
    for diagnosis; spans that are too fine create noise. Start with the 5 core spans
    (query, retrieval, rerank, reason, gate) and add detail where investigation reveals
    gaps.


    ## How You Can Help


    If you''re testing this method:


    1. Document which observability platform you used and what custom spans you added

    2. Share the over-fetching patterns you found and how you addressed them

    3. Measure how often trace-driven diagnosis correctly identified the root cause
    of a reported failure'
