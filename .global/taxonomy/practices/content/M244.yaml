  description: Prose for Snapshotting.
  body: "**Pillar:** Operational Patterns\n\nSnapshotting is the practice of periodically\
    \ saving aggregate state to avoid replaying all events during reconstruction.\
    \ This optimization reduces load time for aggregates with long event histories.\n\
    \n## Definition\n\n> A snapshot is a serialized representation of an aggregate's\
    \ state at a specific version. Snapshots allow reconstruction to start from the\
    \ snapshot version rather than from event zero, reducing the number of events\
    \ that must be replayed.\n\n## Why It Matters\n\nWithout snapshots:\n- Long-lived\
    \ aggregates take longer to load as they accumulate events\n- Performance degrades\
    \ over time\n- Memory usage grows with event count\n\nWith snapshots:\n- Reconstruction\
    \ reads snapshot + recent events only\n- Performance remains constant regardless\
    \ of aggregate age\n- Older events can be archived\n\n## How Snapshotting Works\n\
    \n```\nWithout Snapshotting:\nEvents: [1, 2, 3, ..., 997, 998, 999, 1000]\nLoad:\
    \ Replay all 1000 events\n\nWith Snapshotting:\nSnapshot: State at version 900\n\
    Events: [901, 902, ..., 999, 1000] \nLoad: Deserialize snapshot + replay 100 events\n\
    ```\n\n## Snapshot Structure\n\n```typescript\ninterface Snapshot {\n  aggregateId:\
    \ string;\n  aggregateType: string;\n  version: number;          // Version of\
    \ aggregate when snapshot taken\n  state: SerializedState;   // Serialized aggregate\
    \ state\n  timestamp: Date;          // When snapshot was created\n}\n```\n\n\
    ## Implementation\n\n### Taking Snapshots\n\n```typescript\nclass SnapshotManager\
    \ {\n  constructor(\n    private eventStore: EventStore,\n    private snapshotStore:\
    \ SnapshotStore,\n    private snapshotFrequency: number = 100  // Every N events\n\
    \  ) {}\n\n  async shouldTakeSnapshot(aggregate: Aggregate): Promise<boolean>\
    \ {\n    const lastSnapshot = await this.snapshotStore.read(aggregate.id);\n \
    \   const eventsSinceSnapshot = aggregate.version - (lastSnapshot?.version ??\
    \ 0);\n    return eventsSinceSnapshot >= this.snapshotFrequency;\n  }\n\n  async\
    \ takeSnapshot(aggregate: Aggregate): Promise<void> {\n    const snapshot: Snapshot\
    \ = {\n      aggregateId: aggregate.id,\n      aggregateType: aggregate.constructor.name,\n\
    \      version: aggregate.version,\n      state: this.serialize(aggregate),\n\
    \      timestamp: new Date()\n    };\n\n    await this.snapshotStore.save(snapshot);\n\
    \  }\n\n  private serialize(aggregate: Aggregate): Buffer {\n    // Use efficient\
    \ serialization (protobuf, msgpack, etc.)\n    return serialize(aggregate);\n\
    \  }\n}\n```\n\n### Loading with Snapshots\n\n```typescript\nasync function loadAggregate(aggregateId:\
    \ string): Promise<Aggregate> {\n  // Try to load snapshot first\n  const snapshot\
    \ = await snapshotStore.read(aggregateId);\n  \n  let aggregate: Aggregate;\n\
    \  let fromVersion: number;\n  \n  if (snapshot) {\n    // Start from snapshot\n\
    \    aggregate = deserialize(snapshot.state);\n    fromVersion = snapshot.version\
    \ + 1;\n  } else {\n    // No snapshot - start from beginning\n    aggregate =\
    \ createEmptyAggregate(aggregateId);\n    fromVersion = 1;\n  }\n  \n  // Load\
    \ events after snapshot\n  const events = await eventStore.readStream(aggregateId,\
    \ { \n    fromVersion \n  });\n  \n  // Apply remaining events\n  for (const event\
    \ of events) {\n    aggregate = applyEvent(aggregate, event);\n  }\n  \n  return\
    \ aggregate;\n}\n```\n\n## Snapshot Storage Options\n\n### 1. Same Database as\
    \ Events\n\nStore snapshots in the same database:\n\n```sql\nCREATE TABLE snapshots\
    \ (\n    aggregate_id VARCHAR(255) PRIMARY KEY,\n    version BIGINT NOT NULL,\n\
    \    state BYTEA NOT NULL,\n    created_at TIMESTAMP NOT NULL\n);\n```\n\n**Pros:**\
    \ Transactional consistency, simple backup  \n**Cons:** Database size grows with\
    \ snapshots\n\n### 2. Separate Storage\n\nStore snapshots in a different system\
    \ (S3, Redis, etc.):\n\n**Pros:** Cheaper storage, can use specialized systems\
    \  \n**Cons:** Eventual consistency between events and snapshots\n\n### 3. In-Memory\
    \ with Persistence\n\nKeep recent snapshots in memory, persist periodically:\n\
    \n**Pros:** Fast access  \n**Cons:** Risk of data loss if not persisted\n\n##\
    \ Snapshot Strategies\n\n### 1. Version-Based\n\nTake snapshot every N events:\n\
    \n```typescript\nif (aggregate.version % 100 === 0) {\n  await snapshotManager.takeSnapshot(aggregate);\n\
    }\n```\n\n**Pros:** Predictable frequency  \n**Cons:** May snapshot unnecessarily\
    \ for small aggregates\n\n### 2. Time-Based\n\nTake snapshot if last snapshot\
    \ is older than threshold:\n\n```typescript\nif (Date.now() - lastSnapshot.timestamp\
    \ > ONE_HOUR) {\n  await snapshotManager.takeSnapshot(aggregate);\n}\n```\n\n\
    **Pros:** Adapts to access patterns  \n**Cons:** May miss high-activity periods\n\
    \n### 3. On-Demand\n\nTake snapshot when loading takes too long:\n\n```typescript\n\
    async function loadAggregate(aggregateId: string): Promise<Aggregate> {\n  const\
    \ startTime = Date.now();\n  const aggregate = await loadWithOptionalSnapshot(aggregateId);\n\
    \  \n  if (Date.now() - startTime > 100) {  // Took > 100ms\n    await snapshotManager.takeSnapshot(aggregate);\n\
    \  }\n  \n  return aggregate;\n}\n```\n\n**Pros:** Only snapshots when needed\
    \  \n**Cons:** First slow load isn't prevented\n\n## Snapshot Frequency Trade-offs\n\
    \n| Frequency | Pros | Cons |\n|-----------|------|------|\n| **High** (every\
    \ 10 events) | Fast reconstruction | More storage, overhead |\n| **Medium** (every\
    \ 100 events) | Balanced | Occasional slow loads |\n| **Low** (every 1000 events)\
    \ | Less overhead | Slower reconstruction |\n\n**Recommendation:** Start with\
    \ 100 events and adjust based on performance metrics.\n\n## Snapshot Versioning\n\
    \nWhen aggregate structure changes, snapshots may become incompatible:\n\n```typescript\n\
    interface Snapshot {\n  aggregateId: string;\n  aggregateType: string;\n  version:\
    \ number;\n  state: SerializedState;\n  timestamp: Date;\n  schemaVersion: number;\
    \  // Add schema version for migrations\n}\n\nasync function loadSnapshot(id:\
    \ string): Promise<Aggregate | null> {\n  const snapshot = await snapshotStore.read(id);\n\
    \  \n  if (!snapshot) return null;\n  \n  // Migrate if old schema version\n \
    \ if (snapshot.schemaVersion < CURRENT_SCHEMA_VERSION) {\n    snapshot.state =\
    \ migrateSnapshot(snapshot.state, snapshot.schemaVersion);\n  }\n  \n  return\
    \ deserialize(snapshot.state);\n}\n```\n\n## Common Mistakes\n\n### 1. Not Handling\
    \ Missing Snapshots\n\nCode must work whether snapshots exist or not. Don't assume\
    \ snapshots are always present.\n\n### 2. Snapshot/Event Mismatch\n\nEnsure snapshot\
    \ version aligns with events. If snapshot is at v100, load events from v101.\n\
    \n### 3. Stale Snapshots\n\nDon't use snapshots if events have been deleted or\
    \ the event store has been reset.\n\n### 4. Snapshotting Too Often\n\nFrequent\
    \ snapshots add overhead. Find the right balance for your access patterns.\n\n\
    ## When NOT to Use Snapshots\n\n- **Short-lived aggregates** - Shopping carts,\
    \ sessions that don't accumulate many events\n- **Small domains** - If aggregates\
    \ rarely exceed 50-100 events, snapshots add complexity without benefit\n- **Debugging\
    \ scenarios** - Sometimes you want to see the full event history\n\n## Relationship\
    \ to CQRS\n\nSnapshotting is **independent of CQRS**:\n- Used in the write model\
    \ to speed up aggregate loading\n- Read models (projections) don't typically use\
    \ snapshots\n- Can be used with or without CQRS\n\n## FOE Alignment\n\nSnapshotting\
    \ supports **Fast Feedback Loops** by maintaining consistent response times as\
    \ the system grows. Without snapshots, performance degrades over time as aggregates\
    \ accumulate events, eventually impacting user experience.\n\nThe optimization\
    \ also demonstrates **Understanding** - by measuring and addressing performance\
    \ characteristics, teams make informed decisions about when and how to snapshot."
