spec:
  description: Prose for CQRS Integration.
  body: "**Pillar:** Advanced Patterns\n\nCQRS Integration describes how to effectively\
    \ separate command (write) and query (read) responsibilities when using Event\
    \ Sourcing. While CQRS and Event Sourcing are independent patterns, they complement\
    \ each other powerfully.\n\n## Definition\n\n> CQRS (Command Query Responsibility\
    \ Segregation) is the pattern of separating read operations from write operations.\
    \ In event-sourced systems, the write model persists events while the read model\
    \ is built from projections of those events.\n\n## Why CQRS + Event Sourcing Work\
    \ Together\n\n| Challenge | Event Sourcing Alone | With CQRS |\n|-----------|---------------------|-----------|\n\
    | **Querying** | Event stores are bad for queries | Read models optimized for\
    \ queries |\n| **Performance** | Reconstructing state is slow | Read models provide\
    \ fast access |\n| **Flexibility** | Single data model | Multiple optimized read\
    \ models |\n| **Scaling** | Write and read coupled | Independent scaling |\n\n\
    ## The Architecture\n\n```\n┌──────────────┐     ┌──────────────┐\n│   Command\
    \    │────▶│  Aggregate   │\n│   Handler    │     │  (Write Model)│\n└──────────────┘\
    \     └──────┬───────┘\n                            │\n                      \
    \      ▼\n                     ┌──────────────┐\n                     │  Event\
    \ Store │\n                     │ (Append-Only)│\n                     └──────┬───────┘\n\
    \                            │\n              ┌─────────────┼─────────────┐\n\
    \              │             │             │\n              ▼             ▼  \
    \           ▼\n       ┌──────────┐  ┌──────────┐  ┌──────────┐\n       │Projection│\
    \  │Projection│  │Projection│\n       │   API    │  │ Analytics│  │Reporting │\n\
    \       └────┬─────┘  └────┬─────┘  └────┬─────┘\n            │             │\
    \             │\n            ▼             ▼             ▼\n       ┌──────────┐\
    \  ┌──────────┐  ┌──────────┐\n       │  Read    │  │  Read    │  │  Read    │\n\
    \       │  Model   │  │  Model   │  │  Model   │\n       │ (SQL/No) │  │ (Search)\
    \ │  │  (OLAP)  │\n       └────┬─────┘  └────┬─────┘  └────┬─────┘\n         \
    \   │             │             │\n            └─────────────┼─────────────┘\n\
    \                          ▼\n                   ┌──────────────┐\n          \
    \         │    Query     │\n                   │   Handler    │\n            \
    \       └──────────────┘\n```\n\n## Write Model (Command Side)\n\nThe write model\
    \ uses Event Sourcing:\n\n```typescript\n// Command Handler\nclass OrderCommandHandler\
    \ {\n  constructor(\n    private eventStore: EventStore,\n    private eventBus:\
    \ EventBus\n  ) {}\n\n  async handle(command: SubmitOrderCommand): Promise<void>\
    \ {\n    // Load aggregate\n    const events = await this.eventStore.readStream(command.orderId);\n\
    \    let order = new Order();\n    \n    for (const event of events) {\n     \
    \ order = order.applyEvent(event);\n    }\n    \n    // Execute business logic\n\
    \    const newEvents = order.submit(command);\n    \n    // Store events\n   \
    \ await this.eventStore.append(command.orderId, newEvents, {\n      expectedVersion:\
    \ events.length\n    });\n    \n    // Publish to event bus\n    for (const event\
    \ of newEvents) {\n      await this.eventBus.publish(event);\n    }\n  }\n}\n\
    ```\n\nCharacteristics of the write model:\n- **Validates commands** - Business\
    \ rules enforced here\n- **Produces events** - Only output is domain events\n\
    - **Optimized for consistency** - ACID transactions\n- **Not for querying** -\
    \ No query methods on aggregates\n\n## Read Model (Query Side)\n\nThe read model\
    \ is built from projections:\n\n```typescript\n// Query Handler\nclass OrderQueryHandler\
    \ {\n  constructor(private readModel: OrderReadModel) {}\n\n  async getOrderSummary(orderId:\
    \ string): Promise<OrderSummary> {\n    // Direct query on optimized read model\n\
    \    return await this.readModel.findById(orderId);\n  }\n\n  async getOrdersByCustomer(customerId:\
    \ string): Promise<OrderSummary[]> {\n    // Uses index on read model\n    return\
    \ await this.readModel.findByCustomer(customerId);\n  }\n\n  async searchOrders(criteria:\
    \ SearchCriteria): Promise<OrderSearchResult> {\n    // Full-text search on read\
    \ model\n    return await this.readModel.search(criteria);\n  }\n}\n```\n\nCharacteristics\
    \ of the read model:\n- **Optimized for queries** - Denormalized, indexed\n- **Multiple\
    \ representations** - Different views for different use cases\n- **Eventually\
    \ consistent** - May lag behind writes\n- **No business logic** - Pure data retrieval\n\
    \n## Projection Options\n\n### 1. In-Process Projections\n\nUpdate projections\
    \ in the same process as commands:\n\n```typescript\nasync function handleCommand(command)\
    \ {\n  const events = aggregate.process(command);\n  \n  await transaction.begin();\n\
    \  try {\n    await eventStore.append(events);\n    await projection.update(events);\
    \  // Same transaction\n    await transaction.commit();\n  } catch (e) {\n   \
    \ await transaction.rollback();\n  }\n}\n```\n\n**Pros:** Strong consistency \
    \ \n**Cons:** Slower writes, coupled availability\n\n### 2. Out-of-Process Projections\n\
    \nSeparate services subscribe to events:\n\n```typescript\n// Projection Service\n\
    class OrderProjectionService {\n  async consume(event: DomainEvent): Promise<void>\
    \ {\n    switch (event.type) {\n      case 'OrderCreated':\n        await this.orderReadModel.insert({\n\
    \          orderId: event.orderId,\n          customerId: event.customerId,\n\
    \          status: 'pending',\n          total: 0\n        });\n        break;\n\
    \        \n      case 'OrderSubmitted':\n        await this.orderReadModel.update(\n\
    \          event.orderId,\n          { status: 'submitted' }\n        );\n   \
    \     break;\n    }\n  }\n}\n```\n\n**Pros:** Independent scaling, better performance\
    \  \n**Cons:** Eventual consistency\n\n## Consistency Models\n\n### Strong Consistency\n\
    \nRead model updated in same transaction as events:\n\n```typescript\n// Client\
    \ sees their own writes immediately\nawait commandHandler.handle(command);\nconst\
    \ result = await queryHandler.getById(id);  // Up to date\n```\n\n**Use when:**\
    \ Users expect immediate consistency (e.g., after submitting a form)\n\n### Eventual\
    \ Consistency\n\nRead model updated asynchronously:\n\n```typescript\n// Client\
    \ may see stale data briefly\nawait commandHandler.handle(command);\nconst result\
    \ = await queryHandler.getById(id);  // May be stale\n```\n\n**Use when:** Real-time\
    \ consistency isn't critical\n\n## Handling Eventual Consistency in UI\n\n###\
    \ 1. Optimistic Updates\n\nUpdate UI immediately, sync with server in background:\n\
    \n```typescript\nfunction submitOrder() {\n  // Update UI immediately\n  updateUI({\
    \ status: 'submitted' });\n  \n  // Send command\n  await commandApi.submitOrder(orderId);\n\
    \  \n  // Poll for confirmation\n  await pollForUpdate(orderId);\n}\n```\n\n###\
    \ 2. Loading States\n\nShow loading state while read model catches up:\n\n```\n\
    [Submit Order]\n  ↓\n[Processing...]\n  ↓\n[Order Submitted!]\n  ↓\n[Loading order\
    \ details...]\n  ↓\n[Show order details]\n```\n\n### 3. Command Result Returns\
    \ Data\n\nReturn read model data in command response:\n\n```typescript\ninterface\
    \ SubmitOrderResult {\n  success: boolean;\n  orderId: string;\n  orderSummary:\
    \ OrderSummary;  // Return read model data\n}\n```\n\n## Multiple Read Models\n\
    \nDifferent read models for different use cases:\n\n```typescript\n// API Query\
    \ Model - Fast lookups\ninterface OrderApiModel {\n  orderId: string;\n  customerId:\
    \ string;\n  status: string;\n  total: Money;\n  itemCount: number;\n}\n\n// Search\
    \ Model - Full-text search\ninterface OrderSearchModel {\n  orderId: string;\n\
    \  customerName: string;\n  customerEmail: string;\n  items: string[];  // Searchable\
    \ item names\n  total: number;\n}\n\n// Reporting Model - Analytics\ninterface\
    \ OrderReportingModel {\n  orderId: string;\n  customerSegment: string;\n  orderDate:\
    \ Date;\n  total: Money;\n  shippingCost: Money;\n  profit: Money;\n}\n```\n\n\
    ## When NOT to Use CQRS\n\n:::caution CQRS Complexity Warning\n\nCQRS adds significant\
    \ complexity. Don't use when:\n\n1. **Simple CRUD** - System has simple read/write\
    \ patterns\n2. **Small team** - Team can't manage separate models\n3. **Tight\
    \ deadlines** - Learning curve is significant\n4. **No scalability needs** - Simple\
    \ system with low load\n5. **Strong consistency required everywhere** - Eventual\
    \ consistency is complex\n\n:::\n\n## Common Mistakes\n\n### 1. Putting Query\
    \ Logic in Aggregates\n\n**Bad:**\n```typescript\nclass Order {\n  getTotalSpentByCustomer(customerId:\
    \ string): Money {\n    // Query logic in aggregate!\n  }\n}\n```\n\n**Good:**\n\
    ```typescript\nclass Order {\n  // Only command methods\n  submit(): DomainEvent[]\
    \ { }\n  addLineItem(): DomainEvent[] { }\n}\n\n// Query in read model\nclass\
    \ OrderReadModel {\n  async getTotalSpentByCustomer(customerId: string): Promise<Money>\
    \ { }\n}\n```\n\n### 2. Direct Database Access from Commands\n\nCommands should\
    \ only interact with aggregates, not query databases directly.\n\n### 3. Ignoring\
    \ Eventual Consistency\n\nUsers will see stale data. Design the UI to handle it\
    \ gracefully.\n\n### 4. Too Many Read Models\n\nStart with one read model. Add\
    \ more only when needed.\n\n## CQRS Without Event Sourcing\n\nCQRS can be used\
    \ with traditional CRUD:\n\n```typescript\n// Write model\nclass OrderWriteModel\
    \ {\n  async createOrder(data: CreateOrderData): Promise<void> {\n    await db.orders.insert(data);\n\
    \    await publish('OrderCreated', data);\n  }\n}\n\n// Read model - separate\
    \ table\nclass OrderReadModel {\n  async getOrder(id: string): Promise<OrderDto>\
    \ {\n    return await db.orderViews.findById(id);\n  }\n}\n```\n\n**Trade-offs:**\n\
    - Simpler than Event Sourcing\n- But: Two sources of truth (write DB and read\
    \ DB)\n- Data synchronization challenges\n- No event history\n\n## FOE Alignment\n\
    \nCQRS Integration supports **Fast Feedback Loops** by enabling optimized read\
    \ models that respond quickly to queries. Users see results immediately rather\
    \ than waiting for complex queries to execute.\n\nThe separation also enhances\
    \ **Understanding** - having distinct models for reads and writes makes each model\
    \ simpler and more focused. Teams can reason about the write model (business rules)\
    \ separately from read models (query optimization).\n\n## Further Reading\n\n\
    - [Martin Fowler - CQRS](https://martinfowler.com/bliki/CQRS.html)\n- [Greg Young\
    \ - CQRS Documents](https://cqrs.wordpress.com/documents/)\n- [Microsoft - CQRS\
    \ Pattern](https://docs.microsoft.com/en-us/azure/architecture/patterns/cqrs)"
