spec:
  description: Prose for Ontology-First Design.
  body: "Design the formal ontology of a domain — its entity types, relationship types,\
    \ properties, and constraints — before building retrieval pipelines or agent prompts,\
    \ so that the semantic architecture has a stable, principled foundation.\n\n:::caution\
    \ Early Stage\nThis method is still being validated through observations.\n:::\n\
    \n## Overview\n\nData by itself is inert. Files, rows, tables, tickets, docs,\
    \ logs, embeddings, chunks — an agent can retrieve and summarize this material,\
    \ but without a formal ontology, it doesn't know what the data *means* inside\
    \ the organization.\n\nOntology is the layer that says:\n- This thing is a dataset\n\
    - This dataset is owned by this team\n- This team serves this mission\n- This\
    \ job transforms this source into this product\n- This control protects this risk\n\
    - This requirement is satisfied by this evidence\n- This agent may use this tool,\
    \ but not mutate that resource\n- This output is not just a file — it is a regulated\
    \ deliverable\n\nOntology-First Design means making these definitions explicit\
    \ before building anything. The ontology becomes the contract that all other semantic\
    \ layer components — retrieval pipelines, context contracts, entity resolution,\
    \ graph structure, agent prompts — must conform to.\n\nThis is the same principle\
    \ as domain modeling in DDD (Domain-Driven Design), applied to the knowledge layer:\
    \ define the ubiquitous language and entity model before writing code.\n\n## When\
    \ to Use\n\nUse this method when:\n\n- Starting a new semantic layer project —\
    \ establish the ontology before the first document is ingested\n- The domain has\
    \ complex entity relationships that will determine retrieval quality\n- Multiple\
    \ teams will contribute to or consume the semantic layer — the ontology is the\
    \ shared contract\n- Agent reasoning quality is poor despite good retrieval —\
    \ often a symptom of missing ontological structure\n\n## When NOT to Use\n\nAvoid\
    \ this method when:\n\n- Rapid prototyping where ontology formalism is premature\
    \ (use a lightweight schema; formalize later)\n- The domain is genuinely unstructured\
    \ and entity relationships can't be meaningfully pre-defined\n- The ontology already\
    \ exists in another form (data catalog, CMDB) — integrate rather than duplicate\n\
    \n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Identify the domain\
    \ owner(s) who can validate entity definitions\n- Have taxonomy anchoring (M308)\
    \ in place — the taxonomy provides the vocabulary the ontology uses\n- Scope the\
    \ ontology to a single domain — full enterprise ontology is a multi-year project\n\
    \n### Step 1: Define Entity Classes\n\nFor the target domain, enumerate the entity\
    \ classes and their core properties:\n\n```yaml\nentity_classes:\n  Dataset:\n\
    \    properties: [name, owner, classification, schema, update_cadence]\n    description:\
    \ \"A named collection of data with defined ownership and schema\"\n  \n  Team:\n\
    \    properties: [name, mission, lead, members, systems_owned]\n    description:\
    \ \"An organizational unit responsible for a set of systems and datasets\"\n \
    \ \n  Control:\n    properties: [id, type, description, owner, applicable_standards]\n\
    \    description: \"A policy or procedure that governs behavior to mitigate risk\"\
    \n```\n\n### Step 2: Define Relationship Types\n\nFor each pair of entity classes\
    \ that can be related, define the relationship:\n\n```yaml\nrelationships:\n \
    \ owns:\n    from: Team\n    to: [Dataset, System]\n    description: \"The team\
    \ is accountable for this asset\"\n  \n  satisfies:\n    from: Evidence\n    to:\
    \ Control\n    description: \"This artifact demonstrates compliance with this\
    \ control\"\n  \n  governs:\n    from: Control\n    to: [Dataset, System, Action]\n\
    \    description: \"This control applies rules to this entity\"\n```\n\n### Step\
    \ 3: Define Constraints\n\nExpress the rules that make the ontology useful for\
    \ reasoning:\n- A Dataset must have exactly one owning Team\n- An Action that\
    \ modifies a Dataset classified as CUI requires an Authority entity with `can_approve_cui_actions:\
    \ true`\n- A Control without any Evidence entities is flagged as `unattested`\n\
    \n### Step 4: Validate the Ontology with Real Queries\n\nBefore building anything\
    \ on top of the ontology, validate it by attempting to answer the real queries\
    \ agents will face:\n- \"Can I answer 'what datasets does Team X own?' with this\
    \ ontology?\" → yes, via `Team -owns-> Dataset`\n- \"Can I answer 'what evidence\
    \ exists for Control Z?' with this ontology?\" → yes, via `Control <-satisfies-\
    \ Evidence`\n- \"Can I answer 'who needs to approve sharing Dataset Y externally?'\
    \ with this ontology?\" → requires checking authority chain\n\nIf a critical query\
    \ can't be answered, the ontology is incomplete. Add the missing entities, relationships,\
    \ or constraints before proceeding.\n\n## Example\n\nDomain: data engineering\
    \ platform\n\nWithout ontology-first design: The semantic layer ingests pipeline\
    \ documentation, data dictionaries, and Jira tickets. Agents can find documents\
    \ about pipelines. They cannot answer \"what is the data lineage for the customer_360\
    \ dataset?\" because lineage relationships were never modeled.\n\nWith ontology-first\
    \ design: Before ingestion, the ontology defines:\n- `PipelineJob` entities with\
    \ `reads_from` and `writes_to` Dataset relationships\n- `Dataset` entities with\
    \ `derived_from` Dataset relationships\n- `DataProduct` entities with `produced_by`\
    \ PipelineJob relationships\n\nNow \"what is the data lineage for customer_360?\"\
    \ traverses: `customer_360 Dataset <-writes_to- CustomerMergeJob PipelineJob -reads_from-\
    \ crm_contacts Dataset, erp_accounts Dataset`.\n\nThe answer is computable because\
    \ the ontology made the relationships explicit.\n\n## Common Pitfalls\n\n1. **Ontology\
    \ as academic exercise** — an ontology that isn't used by retrieval, agents, or\
    \ governance is a documentation artifact. The ontology must be the backbone of\
    \ the semantic layer, not a side document.\n2. **Over-specification upfront**\
    \ — defining every possible entity class and relationship before validation produces\
    \ a complex, wrong ontology. Start minimal, validate with real queries, expand\
    \ iteratively.\n3. **Ontology without ownership** — an ontology that no one is\
    \ responsible for maintaining becomes stale rapidly. Assign ontology stewardship\
    \ to a named role (Knowledge Architect or equivalent).\n\n## How You Can Help\n\
    \nIf you're testing this method:\n\n1. Document the entity classes and relationship\
    \ types you defined for your domain\n2. Share which queries were impossible without\
    \ the ontology and became possible with it\n3. Measure how often ontology-guided\
    \ retrieval (via graph traversal) outperformed flat retrieval for relational queries"
