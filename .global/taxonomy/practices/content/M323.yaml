spec:
  description: Prose for Responsibility-Action Linking.
  body: "Explicitly connect meaning to responsibility and responsibility to permitted\
    \ action in the semantic model, so agents can reason about what they are allowed\
    \ to do — not just what data says — before taking consequential actions.\n\n:::caution\
    \ Early Stage\nThis method is still being validated through observations.\n:::\n\
    \n## Overview\n\nAI systems do not become trustworthy because they can access\
    \ more data. They become trustworthy when data is organized into meaning, meaning\
    \ is connected to responsibility, and responsibility is connected to action.\n\
    \nThis is the governance chain that makes agentic systems safe. Without it, an\
    \ agent that can retrieve and reason is also an agent that can act on incomplete\
    \ authority, violate access controls, or trigger downstream effects it wasn't\
    \ authorized to trigger.\n\nResponsibility-Action Linking makes the chain explicit\
    \ in the semantic model:\n\n1. **Meaning**: what this data represents (ontology,\
    \ M322)\n2. **Responsibility**: who owns it, who governs it, who is accountable\
    \ (operating model, M321)\n3. **Action**: what an agent can do with it, under\
    \ what conditions, with what authorization (action graph)\n\nThe action graph\
    \ is the new element: a formal model of which entity types support which actions,\
    \ what authority is required for each action, and what preconditions must be satisfied.\n\
    \n## When to Use\n\nUse this method when:\n\n- Agents will take actions with organizational\
    \ consequences (not just answer questions)\n- Operating in environments with explicit\
    \ authorization requirements (government, regulated industry, enterprise security)\n\
    - Multiple agents with different permission levels will operate against the same\
    \ semantic layer\n- Building auditable AI systems where \"why did the agent do\
    \ that?\" must be answerable\n\n## When NOT to Use\n\nAvoid this method when:\n\
    \n- Agents are read-only (answering questions, not taking actions) — simpler authority\
    \ checks suffice\n- The permission model is so simple that a harness gate (M316)\
    \ covers it without formal modeling\n- Still in early prototyping where action\
    \ governance is premature\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n\
    - Semantic operating model (M321) must be in place — it defines the entities and\
    \ responsibilities\n- Identify all actions agents will be permitted to take\n\
    - Map existing authorization policies to the action model\n\n### Step 1: Enumerate\
    \ Agent Actions\n\nFor each agent deployment, enumerate all possible actions:\n\
    - Read actions: retrieve, summarize, compare, report\n- Write actions: create,\
    \ update, annotate, classify\n- Workflow actions: notify, assign, approve, escalate\n\
    - Integration actions: call external API, trigger pipeline, submit to system\n\
    \n### Step 2: Model Action Permissions\n\nFor each action, define:\n```yaml\n\
    action: share_dataset_externally\n  target_entity: Dataset\n  required_authority:\
    \ [ISSO, DataOwner]\n  preconditions:\n    - dataset.classification != \"TOP_SECRET\"\
    \n    - data_use_agreement.status == \"executed\"\n    - recipient.clearance >=\
    \ dataset.classification\n  requires_human_approval: true\n  audit_required: true\n\
    ```\n\n### Step 3: Implement Authority Resolution\n\nAt action time, the agent\
    \ must resolve whether it has authority to act:\n1. Identify the target entity\n\
    2. Look up the action permissions for that entity type\n3. Check whether the agent's\
    \ context (session, user, role) satisfies the required authority\n4. Verify preconditions\
    \ against the operating model\n5. If human approval is required, surface the request\
    \ rather than acting\n\n### Step 4: Log All Authorization Decisions\n\nEvery authorization\
    \ check — granted or denied — must be logged with:\n- The agent, the action, the\
    \ target entity\n- The authority check performed\n- The preconditions evaluated\n\
    - The outcome (granted, denied, escalated)\n\nThis creates the audit trail that\
    \ demonstrates responsible agent behavior.\n\n## Example\n\nAgent is asked: \"\
    Send the Q2 financial results to the external board members.\"\n\nWithout responsibility-action\
    \ linking: Agent composes the email and sends it. The financial results are material\
    \ non-public information. Sending to external parties before the earnings call\
    \ is an SEC violation.\n\nWith responsibility-action linking:\n1. Action: `send_document_externally`,\
    \ target: Q2 financial results document\n2. Operating model: document classified\
    \ as `MNPI` (Material Non-Public Information)\n3. Action permission check: `send_document_externally`\
    \ on `MNPI` documents requires `IR_APPROVED: true` and `TRADING_WINDOW_OPEN: true`\n\
    4. Precondition check: `IR_APPROVED: false` (no IR approval on file for this distribution)\n\
    5. Agent response: \"I cannot send these materials externally without IR approval.\
    \ This document is classified as MNPI and requires IR sign-off before external\
    \ distribution. I've flagged this request for review by the IR team.\"\n\nThe\
    \ agent's refusal is principled, explainable, and auditable.\n\n## Common Pitfalls\n\
    \n1. **Action permissions as a prompt** — telling the agent \"don't send MNPI\
    \ externally\" in a prompt is probabilistic. The permission model must be enforced\
    \ by the harness (M316), not by instruction.\n2. **Incomplete action enumeration**\
    \ — agents that can compose and send emails have an `email` action whether or\
    \ not it's been formally modeled. Enumerate all integration capabilities the agent\
    \ has access to.\n3. **Authority model lag** — when org structures change, the\
    \ authority model must update. Stale authority models either block legitimate\
    \ actions or allow unauthorized ones.\n\n## How You Can Help\n\nIf you're testing\
    \ this method:\n\n1. Document the action types you modeled and the most complex\
    \ authority chains\n2. Share instances where the action permission model prevented\
    \ an incorrect agent action\n3. Measure the false denial rate — legitimate actions\
    \ blocked by overly restrictive permissions"
