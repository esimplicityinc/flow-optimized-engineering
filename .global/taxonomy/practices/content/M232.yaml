spec:
  description: Prose for Bulkhead Pattern.
  body: "**Pillar:** Operational Patterns\n\nThe Bulkhead pattern isolates failures\
    \ by partitioning resources (threads, connections, memory) into separate pools.\
    \ If one partition fails or becomes overloaded, it cannot consume all available\
    \ resources, preserving capacity for other partitions. The name comes from ship\
    \ bulkheads—compartments that prevent flooding from spreading throughout the vessel.\n\
    \n## Definition\n\n> \"The bulkhead pattern isolates elements of an application\
    \ into pools so that if one fails, the others will continue to function. It's\
    \ named after the sectioned partitions (bulkheads) of a ship's hull—if the hull\
    \ is compromised, only the damaged section fills with water, preventing the ship\
    \ from sinking.\"\n> — Microsoft Azure Architecture Center\n\n## Why It Matters\n\
    \nWithout resource isolation, a single failing service can exhaust shared resources:\n\
    \n```\nWITHOUT BULKHEADS:\n┌─────────────────────────────────────────┐\n│    \
    \   Shared Thread Pool (100 threads)  │\n│                                   \
    \      │\n│  Service A (failing) uses 95 threads    │\n│  Service B (healthy)\
    \ gets 5 threads     │\n│  Service C (healthy) gets 0 threads ←─── Starved!\n\
    └─────────────────────────────────────────┘\n         ↓\n    Entire system degraded\n\
    \nWITH BULKHEADS:\n┌─────────────────────────────────────────┐\n│  Pool A (30)\
    \ │ Pool B (30) │ Pool C (30)│\n│  ┌────────┐  │  ┌────────┐  │  ┌────────┐│\n\
    │  │Service │  │  │Service │  │  │Service ││\n│  │  A     │  │  │  B     │  │\
    \  │  C     ││\n│  │(fails) │  │  │(works) │  │  │(works) ││\n│  └────────┘  │\
    \  └────────┘  │  └────────┘│\n│  Uses 30/30  │  Uses 5/30   │  Uses 10/30│\n\
    └─────────────────────────────────────────┘\n         ↓\n    Only Service A affected\n\
    ```\n\n**Common scenarios where bulkheads help:**\n- One slow service exhausts\
    \ the HTTP client connection pool\n- A memory leak in one component consumes all\
    \ available RAM\n- A thread-hungry operation blocks all request processing\n-\
    \ Database connection pool exhaustion from one service\n\n## Types of Bulkheads\n\
    \n### 1. Thread Pool Bulkheads\n\nIsolate thread pools per service or operation\
    \ type:\n\n```javascript\nclass ThreadPoolBulkhead {\n  constructor(name, options)\
    \ {\n    this.name = name;\n    this.maxConcurrent = options.maxConcurrent ||\
    \ 10;\n    this.maxWait = options.maxWait || 1000;\n    this.queue = new AsyncQueue();\n\
    \    this.active = 0;\n  }\n  \n  async execute(fn) {\n    if (this.active >=\
    \ this.maxConcurrent) {\n      // Queue or reject based on policy\n      if (this.queue.size\
    \ >= this.maxWait) {\n        throw new BulkheadFullError(\n          `Bulkhead\
    \ ${this.name} is full`\n        );\n      }\n      await this.queue.waitForSpace(this.maxWait);\n\
    \    }\n    \n    this.active++;\n    try {\n      return await fn();\n    } finally\
    \ {\n      this.active--;\n      this.queue.notifySpaceAvailable();\n    }\n \
    \ }\n}\n\n// Usage: Separate bulkheads for different services\nconst paymentBulkhead\
    \ = new ThreadPoolBulkhead('payment', {\n  maxConcurrent: 10\n});\n\nconst inventoryBulkhead\
    \ = new ThreadPoolBulkhead('inventory', {\n  maxConcurrent: 20\n});\n\nconst analyticsBulkhead\
    \ = new ThreadPoolBulkhead('analytics', {\n  maxConcurrent: 5  // Lower priority,\
    \ fewer resources\n});\n\nasync function processPayment(data) {\n  return await\
    \ paymentBulkhead.execute(async () => {\n    return await paymentService.charge(data);\n\
    \  });\n}\n```\n\n### 2. Connection Pool Bulkheads\n\nSeparate connection pools\
    \ per dependency:\n\n```yaml\n# Database connection pool configuration\nconnectionPools:\n\
    \  orderDb:\n    maxConnections: 20\n    minIdle: 5\n    \n  productDb:\n    maxConnections:\
    \ 15\n    minIdle: 3\n    \n  analyticsDb:\n    maxConnections: 5\n    minIdle:\
    \ 1\n```\n\n```javascript\n// HTTP client connection pool bulkheads\nconst httpClients\
    \ = {\n  critical: new HttpClient({\n    maxSockets: 50,\n    maxFreeSockets:\
    \ 10,\n    timeout: 5000\n  }),\n  \n  standard: new HttpClient({\n    maxSockets:\
    \ 20,\n    maxFreeSockets: 5,\n    timeout: 10000\n  }),\n  \n  background: new\
    \ HttpClient({\n    maxSockets: 5,\n    maxFreeSockets: 1,\n    timeout: 30000\n\
    \  })\n};\n\nasync function callCriticalService(request) {\n  return await httpClients.critical.request(request);\n\
    }\n\nasync function callBackgroundJob(request) {\n  return await httpClients.background.request(request);\n\
    }\n```\n\n### 3. Semaphore Bulkheads\n\nLimit concurrent access with semaphores:\n\
    \n```javascript\nclass SemaphoreBulkhead {\n  constructor(name, permits) {\n \
    \   this.name = name;\n    this.semaphore = new Semaphore(permits);\n  }\n  \n\
    \  async execute(fn, timeout = 1000) {\n    const acquired = await this.semaphore.acquire(timeout);\n\
    \    if (!acquired) {\n      throw new BulkheadFullError(\n        `Could not\
    \ acquire permit for ${this.name}`\n      );\n    }\n    \n    try {\n      return\
    \ await fn();\n    } finally {\n      this.semaphore.release();\n    }\n  }\n\
    }\n\n// Priority-based bulkheads\nconst criticalBulkhead = new SemaphoreBulkhead('critical',\
    \ 100);\nconst normalBulkhead = new SemaphoreBulkhead('normal', 50);\nconst lowPriorityBulkhead\
    \ = new SemaphoreBulkhead('low', 10);\n```\n\n### 4. Resource-Based Bulkheads\n\
    \nIsolate memory, CPU, or other resources:\n\n```javascript\nclass MemoryBulkhead\
    \ {\n  constructor(name, maxMemoryMB) {\n    this.name = name;\n    this.maxMemory\
    \ = maxMemoryMB * 1024 * 1024;\n    this.currentMemory = 0;\n  }\n  \n  allocate(size)\
    \ {\n    if (this.currentMemory + size > this.maxMemory) {\n      throw new MemoryLimitExceeded(\n\
    \        `Bulkhead ${this.name} memory limit exceeded`\n      );\n    }\n    this.currentMemory\
    \ += size;\n    return new Allocation(this, size);\n  }\n}\n```\n\n## Implementation\n\
    \n### Complete Example\n\n```javascript\nconst { Resilience4j } = require('resilience4js');\n\
    \n// Configure multiple bulkheads\nconst resilience = new Resilience4j();\n\n\
    // Payment service bulkhead - critical, needs resources\nresilience.registerBulkhead('payment',\
    \ {\n  maxConcurrentCalls: 20,\n  maxWaitDuration: 500, // ms\n  queueCapacity:\
    \ 50\n});\n\n// Analytics bulkhead - background, limited resources\nresilience.registerBulkhead('analytics',\
    \ {\n  maxConcurrentCalls: 5,\n  maxWaitDuration: 100,\n  queueCapacity: 10\n\
    });\n\n// Third-party API bulkhead - unreliable, isolate tightly\nresilience.registerBulkhead('external-api',\
    \ {\n  maxConcurrentCalls: 3,\n  maxWaitDuration: 200,\n  queueCapacity: 5\n});\n\
    \n// Usage with fallback\nasync function processPayment(paymentData) {\n  return\
    \ await resilience.bulkhead('payment').execute(\n    async () => {\n      return\
    \ await paymentService.process(paymentData);\n    },\n    {\n      fallback: async\
    \ (error) => {\n        logger.warn('Payment bulkhead full, using queue', { error\
    \ });\n        await paymentQueue.enqueue(paymentData);\n        return { queued:\
    \ true };\n      }\n    }\n  );\n}\n```\n\n### Combining with Circuit Breaker\n\
    \nUse bulkheads with circuit breakers for layered protection:\n\n```javascript\n\
    async function callExternalService(request) {\n  // Layer 1: Bulkhead - limit\
    \ concurrent calls\n  return await bulkhead.execute(async () => {\n    \n    //\
    \ Layer 2: Circuit Breaker - fail fast if service is down\n    return await circuitBreaker.execute(async\
    \ () => {\n      \n      // Layer 3: Retry - handle transient failures\n     \
    \ return await retry.execute(async () => {\n        return await externalApi.call(request);\n\
    \      });\n    });\n  });\n}\n```\n\n## FOE Alignment\n\n**Primary: Confidence\
    \ to Act**\n\nBulkheads provide confidence that failures will be contained. When\
    \ a service fails or becomes slow, it cannot consume all available resources and\
    \ take down the entire system. This containment enables teams to deploy with confidence,\
    \ knowing that problems won't cascade.\n\n**Secondary: Optimize for Understanding**\n\
    \nBulkheads make resource allocation explicit and visible. By partitioning resources,\
    \ the architecture's priorities and dependencies become clear. Teams can see which\
    \ services are considered critical (more resources) vs. background (fewer resources).\n\
    \n## Benefits\n\n- ✅ **Failure isolation** - One failing component doesn't exhaust\
    \ all resources\n- ✅ **Predictable behavior** - Guaranteed capacity for critical\
    \ paths\n- ✅ **Prioritization** - Allocate more resources to critical services\n\
    - ✅ **Graceful degradation** - Non-critical work can be queued or rejected\n-\
    \ ✅ **Resource transparency** - Clear visibility into resource allocation\n\n\
    ## Trade-offs\n\n- ⚠️ **Resource underutilization** - Reserved capacity might\
    \ sit idle\n- ⚠️ **Configuration complexity** - Tuning bulkhead sizes is challenging\n\
    - ⚠️ **Rejection handling** - Must handle \"bulkhead full\" scenarios\n- ⚠️ **Sizing\
    \ difficulty** - Wrong sizes cause artificial bottlenecks\n\n## When to Use\n\n\
    ✅ **Use when:**\n- Services have different criticality levels\n- Resources are\
    \ constrained and must be allocated\n- Failure isolation is critical\n- Mix of\
    \ synchronous and asynchronous workloads\n- Third-party APIs with rate limits\n\
    \n❌ **Avoid when:**\n- System is simple with few dependencies\n- Resources are\
    \ abundant\n- All services have equal priority\n- Additional complexity isn't\
    \ justified\n\n## Configuration Guidelines\n\n### Sizing Bulkheads\n\n| Factor\
    \ | Recommendation |\n|--------|---------------|\n| **Critical services** | 50-70%\
    \ of available resources |\n| **Standard services** | 20-30% of available resources\
    \ |\n| **Background jobs** | 5-10% of available resources |\n| **External APIs**\
    \ | Match rate limits + headroom |\n\n### Tuning Process\n\n1. **Start conservative**\
    \ - Allocate less than you think needed\n2. **Monitor utilization** - Track actual\
    \ usage vs. limits\n3. **Adjust based on data** - Increase limits if hitting them\
    \ regularly\n4. **Test failure scenarios** - Verify isolation during failures\n\
    \n### Example Configuration\n\n```yaml\nbulkheads:\n  # Critical path - user-facing\
    \ checkout\n  checkout:\n    maxThreads: 50\n    queueSize: 100\n    timeout:\
    \ 2000ms\n    \n  # Important but can queue\n  orderProcessing:\n    maxThreads:\
    \ 20\n    queueSize: 500  # Can queue more\n    timeout: 10000ms\n    \n  # Background,\
    \ can reject\n  emailSending:\n    maxThreads: 5\n    queueSize: 50\n    timeout:\
    \ 500ms\n    rejectWhenFull: true\n    \n  # Third-party API - limit to avoid\
    \ rate limiting\n  paymentGateway:\n    maxThreads: 3\n    queueSize: 10\n   \
    \ timeout: 5000ms\n```\n\n## Monitoring\n\nTrack these metrics for each bulkhead:\n\
    \n```javascript\n// Metrics to collect\nconst bulkheadMetrics = {\n  // Utilization\n\
    \  'bulkhead.available_permits': bulkhead.availablePermits(),\n  'bulkhead.active_calls':\
    \ bulkhead.activeCalls(),\n  'bulkhead.queued_calls': bulkhead.queueSize(),\n\
    \  \n  // Throughput\n  'bulkhead.calls_accepted': counter,\n  'bulkhead.calls_rejected':\
    \ counter,\n  'bulkhead.calls_completed': counter,\n  \n  // Performance\n  'bulkhead.wait_time':\
    \ histogram, // Time waiting for permit\n  'bulkhead.execution_time': histogram\n\
    };\n```\n\n### Alerting Thresholds\n\n| Metric | Warning | Critical |\n|--------|---------|----------|\n\
    | Utilization | > 80% | > 95% |\n| Rejection rate | > 1% | > 5% |\n| Queue wait\
    \ time | > 100ms | > 500ms |\n\n## Anti-Patterns\n\n### ❌ Single Shared Pool\n\
    \n```javascript\n// WRONG: All services share one pool\nconst sharedPool = new\
    \ ThreadPool(100);\n\n// All services compete for same threads\nawait sharedPool.execute(()\
    \ => analyticsService.report());\nawait sharedPool.execute(() => paymentService.process());\n\
    ```\n\n### ❌ Oversized Bulkheads\n\n```javascript\n// WRONG: Bulkhead so large\
    \ it provides no protection\nconst looseBulkhead = new Bulkhead({\n  maxConcurrent:\
    \ 10000  // Effectively unlimited\n});\n```\n\n### ❌ No Fallback\n\n```javascript\n\
    // WRONG: Rejection causes cascade failure\nasync function processOrder(order)\
    \ {\n  try {\n    return await bulkhead.execute(() => orderService.process(order));\n\
    \  } catch (error) {\n    if (error instanceof BulkheadFullError) {\n      throw\
    \ error; // Propagates to caller - cascade!\n    }\n  }\n}\n\n// RIGHT: Graceful\
    \ fallback\nasync function processOrder(order) {\n  try {\n    return await bulkhead.execute(()\
    \ => orderService.process(order));\n  } catch (error) {\n    if (error instanceof\
    \ BulkheadFullError) {\n      // Queue for later processing\n      await orderQueue.enqueue(order);\n\
    \      return { status: 'queued' };\n    }\n    throw error;\n  }\n}\n```\n\n\
    ### ❌ Wrong Granularity\n\n```javascript\n// WRONG: Too granular - overhead exceeds\
    \ benefit\nconst bulkheadPerEndpoint = {\n  'GET /users': new Bulkhead(10),\n\
    \  'POST /users': new Bulkhead(10),\n  'GET /orders': new Bulkhead(10),\n  //\
    \ ... hundreds more\n};\n\n// RIGHT: Per service or per domain\nconst bulkheadPerService\
    \ = {\n  'user-service': new Bulkhead(50),\n  'order-service': new Bulkhead(50)\n\
    };\n```\n\n## Known Uses\n\n- **Netflix** - Hystrix bulkheads for dependency isolation\n\
    - **Resilience4j** - Java library with bulkhead implementations\n- **Polly** -\
    \ .NET resilience library with bulkhead support\n- **AWS** - Lambda concurrency\
    \ limits as bulkheads\n- **Kubernetes** - Resource quotas as bulkheads\n\n## Integration\
    \ with Container Orchestration\n\n### Kubernetes Resource Quotas\n\n```yaml\n\
    apiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name: compute-quota\nspec:\n\
    \  hard:\n    requests.cpu: \"10\"\n    requests.memory: 20Gi\n    limits.cpu:\
    \ \"20\"\n    limits.memory: 40Gi\n---\napiVersion: v1\nkind: LimitRange\nmetadata:\n\
    \  name: default-limits\nspec:\n  limits:\n  - default:\n      cpu: 500m\n   \
    \   memory: 512Mi\n    defaultRequest:\n      cpu: 100m\n      memory: 128Mi\n\
    \    type: Container\n```\n\n## References\n\n- Nygard, M. T. (2018). *Release\
    \ It!* (2nd ed.). Pragmatic Bookshelf. Chapter 5: Stability Patterns.\n- [Bulkhead\
    \ Pattern - Microsoft](https://docs.microsoft.com/en-us/azure/architecture/patterns/bulkhead)\n\
    - [Bulkhead - microservices.io](https://microservices.io/patterns/reliability/bulkhead.html)\n\
    - [Resilience4j Documentation](https://resilience4j.readme.io/docs/bulkhead)\n\
    - [Polly Bulkhead](https://github.com/App-vNext/Polly/wiki/Bulkhead)\n- [AWS Bulkhead\
    \ Pattern](https://docs.aws.amazon.com/whitepapers/latest/modern-application-development-on-aws/bulkhead.html)"
