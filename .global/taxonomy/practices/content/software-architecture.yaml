  body: 'A collection of flow-optimized methods for internal code design, data architecture,
    and architecture decision-making.


    ## What This Guide Covers


    Software architecture shapes how code is organized within applications and services.
    Design patterns, layering strategies, data modeling, and API design all determine
    how easily code can be understood, tested, and modified. This guide collects methods
    for making these internal design decisions in ways that optimize for flow.


    Good software architecture isn''t about following trends -- it''s about choosing
    patterns that make code intention clear, dependencies explicit, and changes safe
    through well-defined boundaries and testable components.


    ### Internal Code Architecture


    Design patterns, SOLID principles, clean architecture, hexagonal architecture,
    and modular monolith patterns that organize code for maintainability and testability.


    ### Data & API Architecture


    Database design principles, API design (REST, GraphQL, RPC trade-offs), event-driven
    patterns, and caching strategies that balance performance with simplicity.


    ### Architecture Decision Making


    Architecture Decision Records (ADRs), C4 diagrams, documentation practices, and
    technical debt management approaches that capture and communicate architectural
    choices.


    ## Getting Started


    1. Browse the methods in the table above

