  description: Prose for Red-Green-Refactor.
  body: "**Pillar:** Red-Green-Refactor\n\nRed-Green-Refactor is the fundamental rhythm\
    \ of Test-Driven Development. It's a disciplined cycle that guides developers\
    \ through writing tests first, implementing minimal code to pass them, and then\
    \ improving the design—all while maintaining a safety net of passing tests.\n\n\
    ## Definition\n\n> A three-phase development cycle: (1) Red - write a test that\
    \ fails, (2) Green - write minimal code to make it pass, (3) Refactor - improve\
    \ the code while keeping tests green. Repeat for each new behavior.\n\n## Why\
    \ It Matters\n\nThe Red-Green-Refactor cycle provides:\n\n- **Immediate feedback**\
    \ - Know within minutes if your code works\n- **Design pressure** - Writing tests\
    \ first forces better interfaces\n- **Safe refactoring** - Tests catch regressions\
    \ instantly\n- **Incremental progress** - Small steps reduce risk and cognitive\
    \ load\n- **Documentation** - Tests describe what the code should do\n\n## The\
    \ Cycle in Detail\n\n### Phase 1: Red (Write a Failing Test)\n\nWrite a test for\
    \ the next piece of functionality. The test must fail—this proves it's actually\
    \ testing something new.\n\n```javascript\n// Red: Test for functionality that\
    \ doesn't exist\ntest('should calculate total with tax', () => {\n  const cart\
    \ = new ShoppingCart();\n  cart.addItem({ price: 100 });\n  \n  expect(cart.totalWithTax(0.1)).toBe(110);\n\
    });\n// Fails: ShoppingCart doesn't have totalWithTax method\n```\n\n**Key points:**\n\
    - Test should fail for the right reason (missing functionality, not syntax error)\n\
    - Test name should describe the behavior\n- Keep tests focused on one behavior\n\
    \n### Phase 2: Green (Make It Pass)\n\nWrite the simplest code that makes the\
    \ test pass. Don't over-engineer—just make it work.\n\n```javascript\n// Green:\
    \ Minimal implementation\nclass ShoppingCart {\n  constructor() {\n    this.items\
    \ = [];\n  }\n  \n  addItem(item) {\n    this.items.push(item);\n  }\n  \n  totalWithTax(taxRate)\
    \ {\n    const subtotal = this.items.reduce((sum, item) => sum + item.price, 0);\n\
    \    return subtotal * (1 + taxRate);\n  }\n}\n// Test passes!\n```\n\n**Key points:**\n\
    - Resist the urge to add features not required by tests\n- \"Fake it till you\
    \ make it\" is acceptable—hardcode if needed\n- Speed matters—get to green quickly\n\
    \n### Phase 3: Refactor (Improve the Design)\n\nWith tests passing, improve the\
    \ code. Remove duplication, improve names, extract methods. Run tests after each\
    \ change.\n\n```javascript\n// Refactor: Extract subtotal calculation\nclass ShoppingCart\
    \ {\n  constructor() {\n    this.items = [];\n  }\n  \n  addItem(item) {\n   \
    \ this.items.push(item);\n  }\n  \n  subtotal() {\n    return this.items.reduce((sum,\
    \ item) => sum + item.price, 0);\n  }\n  \n  totalWithTax(taxRate) {\n    return\
    \ this.subtotal() * (1 + taxRate);\n  }\n}\n// Tests still pass!\n```\n\n**Key\
    \ points:**\n- Only refactor when tests are green\n- Make small changes, run tests\
    \ frequently\n- Refactor both production code AND test code\n- Don't add new functionality\
    \ during refactor\n\n## Common Patterns\n\n### Triangulation\n\nWhen unsure how\
    \ to generalize, add more specific test cases until the pattern becomes clear:\n\
    \n```javascript\ntest('tax on $100 at 10%', () => {\n  expect(calculateTax(100,\
    \ 0.1)).toBe(10);\n});\n\ntest('tax on $200 at 10%', () => {\n  expect(calculateTax(200,\
    \ 0.1)).toBe(20);  // Forces generalization\n});\n\ntest('tax on $100 at 20%',\
    \ () => {\n  expect(calculateTax(100, 0.2)).toBe(20);  // Confirms formula\n});\n\
    ```\n\n### Obvious Implementation\n\nWhen the solution is clear, just write it:\n\
    \n```javascript\ntest('should add two numbers', () => {\n  expect(add(2, 3)).toBe(5);\n\
    });\n\n// Obvious implementation - no need to fake it\nfunction add(a, b) {\n\
    \  return a + b;\n}\n```\n\n### Fake It Till You Make It\n\nWhen unsure, start\
    \ with a hardcoded value and generalize:\n\n```javascript\n// First test\ntest('fibonacci\
    \ of 0 is 0', () => {\n  expect(fib(0)).toBe(0);\n});\n\n// Fake it\nfunction\
    \ fib(n) {\n  return 0;  // Hardcoded!\n}\n\n// Second test forces generalization\n\
    test('fibonacci of 1 is 1', () => {\n  expect(fib(1)).toBe(1);\n});\n\n// Now\
    \ generalize\nfunction fib(n) {\n  return n;  // Still simple\n}\n\n// Third test\
    \ forces real implementation\ntest('fibonacci of 2 is 1', () => {\n  expect(fib(2)).toBe(1);\n\
    });\n```\n\n## Anti-Patterns\n\n| Anti-Pattern | Problem | Solution |\n|--------------|---------|----------|\n\
    | Skipping Red | Test might not test anything | Always see the test fail first\
    \ |\n| Gold-plating in Green | Over-engineering, wasted effort | Write minimum\
    \ code to pass |\n| Skipping Refactor | Technical debt accumulates | Refactor\
    \ is not optional |\n| Big steps | Hard to debug failures | Smaller increments\
    \ |\n| Testing implementation | Brittle tests | Test behavior, not internals |\n\
    \n## Cycle Duration\n\nA single Red-Green-Refactor cycle should take **minutes,\
    \ not hours**:\n\n| Phase | Typical Duration |\n|-------|------------------|\n\
    | Red | 1-2 minutes |\n| Green | 2-5 minutes |\n| Refactor | 2-5 minutes |\n|\
    \ **Total** | **5-12 minutes** |\n\nIf cycles take longer, you're taking steps\
    \ that are too big.\n\n## FOE Alignment\n\nRed-Green-Refactor directly supports\
    \ FOE principles:\n\n- **Fast Feedback Loops** - Each cycle provides immediate\
    \ feedback. You know within minutes if your approach works.\n- **Build Confidence**\
    \ - The growing test suite proves the code works. Refactoring becomes safe.\n\
    - **Optimize for Understanding** - Small steps keep cognitive load low. Tests\
    \ document intent.\n\n## References\n\n- Beck, K. (2002). *Test-Driven Development:\
    \ By Example*. Addison-Wesley.\n- Beck, K. (2023). \"Canon TDD.\" https://tidyfirst.substack.com/p/canon-tdd\n\
    - Fowler, M. (2023). \"Test Driven Development.\" https://martinfowler.com/bliki/TestDrivenDevelopment.html"
