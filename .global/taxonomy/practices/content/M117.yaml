  description: Prose for Domain Service.
  body: "**Pillar:** Tactical Design\n\nA Domain Service is a stateless operation\
    \ that represents a significant domain concept but doesn't naturally belong to\
    \ an Entity or Value Object. Domain services encapsulate domain logic that operates\
    \ across multiple aggregates or requires external information.\n\n## Definition\n\
    \n> When a significant process or transformation in the domain is not a natural\
    \ responsibility of an Entity or Value Object, add an operation to the model as\
    \ a standalone interface declared as a Service. Define the interface in terms\
    \ of the language of the model and make sure the operation name is part of the\
    \ Ubiquitous Language.\n>\n> — Eric Evans, DDD Reference\n\n## Why It Matters\n\
    \nDomain Services are essential because:\n\n- **Capture cross-aggregate logic**\
    \ - Some operations span multiple aggregates\n- **Avoid bloated entities** - Not\
    \ all behavior belongs on entities\n- **Express domain concepts** - Services can\
    \ represent domain processes\n- **Maintain single responsibility** - Keep entities\
    \ focused on their core purpose\n- **Enable coordination** - Orchestrate complex\
    \ domain operations\n\n## Characteristics\n\n| Characteristic | Description |\n\
    |----------------|-------------|\n| **Stateless** | No instance state between\
    \ calls |\n| **Domain-focused** | Named in terms of the ubiquitous language |\n\
    | **Operation-centric** | Represents a domain operation, not a thing |\n| **Interface-defined**\
    \ | Defined by what it does, not how |\n\n## When to Use Domain Services\n\nUse\
    \ a domain service when:\n\n- The operation involves multiple aggregates\n- The\
    \ operation doesn't naturally belong to any entity\n- The operation requires information\
    \ from outside the aggregate\n- Placing the logic on an entity would create awkward\
    \ dependencies\n\n## Example: Transfer Funds\n\nTransferring money between accounts\
    \ involves two aggregates:\n\n```typescript\n// Domain Service\nclass FundsTransferService\
    \ {\n  transfer(\n    from: Account,\n    to: Account,\n    amount: Money\n  ):\
    \ TransferResult {\n    // Domain logic that spans aggregates\n    if (!from.canWithdraw(amount))\
    \ {\n      return TransferResult.insufficientFunds();\n    }\n    \n    from.withdraw(amount);\n\
    \    to.deposit(amount);\n    \n    return TransferResult.success(\n      new\
    \ TransferCompleted(from.id, to.id, amount)\n    );\n  }\n}\n```\n\nThis logic\
    \ doesn't belong on either Account—it's a domain concept in its own right.\n\n\
    ## Example: Pricing Calculation\n\nComplex pricing that requires external data:\n\
    \n```typescript\nclass PricingService {\n  constructor(\n    private readonly\
    \ discountPolicy: DiscountPolicy,\n    private readonly taxCalculator: TaxCalculator\n\
    \  ) {}\n\n  calculatePrice(\n    product: Product,\n    customer: Customer,\n\
    \    quantity: Quantity\n  ): Money {\n    const basePrice = product.priceFor(quantity);\n\
    \    const discount = this.discountPolicy.calculateDiscount(\n      customer,\
    \ \n      product, \n      quantity\n    );\n    const discountedPrice = basePrice.subtract(discount);\n\
    \    const tax = this.taxCalculator.calculate(\n      discountedPrice, \n    \
    \  customer.taxJurisdiction\n    );\n    \n    return discountedPrice.add(tax);\n\
    \  }\n}\n```\n\n## Domain Service vs Application Service\n\n| Aspect | Domain\
    \ Service | Application Service |\n|--------|----------------|---------------------|\n\
    | **Contains** | Domain logic | Use case orchestration |\n| **Knows about** |\
    \ Domain model | Application concerns |\n| **Stateless** | Yes | Yes |\n| **Example**\
    \ | FundsTransferService | TransferFundsUseCase |\n\nDomain services contain business\
    \ rules; application services coordinate the use case.\n\n## Common Mistakes\n\
    \n- **Anemic domain model** - Putting all logic in services instead of entities\n\
    - **Stateful services** - Domain services should be stateless\n- **Technical naming**\
    \ - Services should use ubiquitous language, not technical terms\n- **Too many\
    \ services** - First consider if logic belongs on an entity\n\n## Signs You Need\
    \ a Domain Service\n\n- You're passing an entity to itself to perform an operation\n\
    - An operation requires multiple aggregates as input\n- You're tempted to add\
    \ a dependency to an entity that doesn't fit\n- The operation is a recognized\
    \ domain concept (transfer, allocation, matching)\n\n## Relationship to Other\
    \ Patterns\n\n- **Entity** - Domain services operate on entities\n- **Aggregate**\
    \ - Services often coordinate across aggregates\n- **Application Service** - Calls\
    \ domain services as part of use cases\n- **Repository** - Domain services may\
    \ use repositories (injected)\n\n## FOE Alignment\n\nDomain Services support **Optimize\
    \ for Understanding** by making implicit domain concepts explicit. When a significant\
    \ domain operation exists as a named service using ubiquitous language, it's visible\
    \ and understandable to both developers and domain experts. This explicitness\
    \ improves code comprehension and ensures important business logic isn't hidden\
    \ inside entities where it doesn't belong."
  lead: A Domain Service is a stateless operation that represents a significant domain
    concept but doesn't naturally belong to an Entity or Value Object. Domain services
    encapsulate domain logic that operates across multiple aggregates or requires
    external information.
