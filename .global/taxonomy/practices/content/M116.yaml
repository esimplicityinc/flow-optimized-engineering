  description: Prose for Domain Event.
  body: "**Pillar:** Tactical Design\n\nA Domain Event is a record of something significant\
    \ that happened in the domain. Events capture facts about the past and are named\
    \ in past tense to reflect that they describe something that has already occurred.\n\
    \n## Definition\n\n> A domain event is a full-fledged part of the domain model,\
    \ a representation of something that happened in the domain. Ignore irrelevant\
    \ domain activity while making explicit the events that the domain experts want\
    \ to track or be notified of, or which are associated with state change in the\
    \ other model objects.\n>\n> — Eric Evans, DDD Reference\n\n## Why It Matters\n\
    \nDomain Events are essential because:\n\n- **Capture business significance**\
    \ - Events represent what matters to the business\n- **Enable loose coupling**\
    \ - Publishers don't need to know about subscribers\n- **Support eventual consistency**\
    \ - Events can trigger updates across bounded contexts\n- **Provide audit trail**\
    \ - Events are a natural record of what happened\n- **Enable event sourcing**\
    \ - State can be reconstructed from event history\n\n## Naming Conventions\n\n\
    Events are named in **past tense** because they describe something that already\
    \ happened:\n\n| Good (Past Tense) | Bad (Present/Imperative) |\n|-------------------|--------------------------|\n\
    | OrderPlaced | PlaceOrder |\n| PaymentReceived | ReceivePayment |\n| CustomerRegistered\
    \ | RegisterCustomer |\n| ShipmentDelivered | DeliverShipment |\n\n## Event Structure\n\
    \nA domain event typically contains:\n\n```typescript\ninterface OrderPlaced {\n\
    \  // Identity\n  eventId: EventId;\n  occurredAt: Timestamp;\n  \n  // Aggregate\
    \ reference\n  orderId: OrderId;\n  \n  // Relevant data at time of event\n  customerId:\
    \ CustomerId;\n  orderTotal: Money;\n  lineItems: OrderLineSnapshot[];\n  \n \
    \ // Metadata\n  correlationId?: CorrelationId;\n  causationId?: EventId;\n}\n\
    ```\n\n## Event Characteristics\n\n| Characteristic | Description |\n|----------------|-------------|\n\
    | **Immutable** | Events never change once created |\n| **Past tense** | Named\
    \ as something that happened |\n| **Self-contained** | Contains all data needed\
    \ to understand what happened |\n| **Timestamped** | Records when the event occurred\
    \ |\n| **Identified** | Has a unique event ID |\n\n## Publishing Events\n\nEvents\
    \ are typically published by aggregates after state changes:\n\n```typescript\n\
    class Order {\n  private events: DomainEvent[] = [];\n\n  place(): void {\n  \
    \  // Change state\n    this.status = OrderStatus.Placed;\n    this.placedAt =\
    \ Timestamp.now();\n    \n    // Record event\n    this.events.push(new OrderPlaced({\n\
    \      orderId: this.id,\n      customerId: this.customerId,\n      orderTotal:\
    \ this.calculateTotal(),\n      lineItems: this.lineItems.map(li => li.toSnapshot())\n\
    \    }));\n  }\n\n  pullEvents(): DomainEvent[] {\n    const events = [...this.events];\n\
    \    this.events = [];\n    return events;\n  }\n}\n```\n\n## Event Handling Patterns\n\
    \n| Pattern | Description | Use Case |\n|---------|-------------|----------|\n\
    | **In-process** | Handlers in same process | Updating read models, sending notifications\
    \ |\n| **Message queue** | Events published to queue | Cross-service communication\
    \ |\n| **Event store** | Events persisted as source of truth | Event sourcing\
    \ |\n\n## Common Mistakes\n\n- **Present tense naming** - Events describe the\
    \ past, not commands\n- **Missing data** - Events should be self-contained\n-\
    \ **Mutable events** - Events are facts and cannot change\n- **Too granular**\
    \ - Not every state change needs an event\n- **Coupling to handlers** - Publishers\
    \ shouldn't know about subscribers\n\n## Relationship to Other Patterns\n\n- **Aggregate**\
    \ - Aggregates publish domain events\n- **Bounded Context** - Events often cross\
    \ context boundaries\n- **Context Mapping** - Events are a form of Published Language\n\
    - **Application Service** - Often responsible for dispatching events\n\n## FOE\
    \ Alignment\n\nDomain Events strongly support **Fast Feedback Loops**. Events\
    \ enable reactive architectures where changes propagate immediately to interested\
    \ parties. Instead of polling or batch processing, systems can respond to events\
    \ in real-time. Events also support understanding by making implicit domain concepts\
    \ explicit—if something is important enough to be an event, it's visible in the\
    \ codebase."
  lead: A Domain Event is a record of something significant that happened in the domain.
    Events capture facts about the past and are named in past tense to reflect that
    they describe something that has already occurred.
