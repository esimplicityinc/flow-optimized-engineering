  description: Prose for Platform Team.
  body: '**Pillar:** Team Types


    A Platform Team provides internal services and capabilities that accelerate stream-aligned
    teams by reducing their cognitive load. They treat their platform as a product
    with internal customers, focusing on self-service, reliability, and developer
    experience.


    ## Definition


    > "The purpose of a platform team is to enable stream-aligned teams to deliver
    work with substantial autonomy. The stream-aligned team maintains full ownership
    of building, running, and fixing their application in production. The platform
    team provides internal services to reduce the cognitive load that would be required
    from stream-aligned teams to develop these underlying services."

    >

    > — Skelton & Pais, Team Topologies


    ## Why It Matters


    Platform teams are essential for scaling engineering organizations because they:


    - **Reduce duplication** - Common capabilities built once, consumed by many

    - **Lower cognitive load** - Stream-aligned teams don''t need deep infrastructure
    expertise

    - **Enable self-service** - Teams can move fast without waiting for platform changes

    - **Improve reliability** - Centralized expertise in critical infrastructure

    - **Accelerate onboarding** - New teams get capabilities instantly


    ## FOE Framing


    **Primary: Confidence to Act**


    Platform teams provide stable, well-tested capabilities that stream-aligned teams
    can rely on. When the deployment pipeline, observability stack, or authentication
    system "just works," teams have confidence to ship changes. Platform stability
    enables product velocity.


    **Secondary: Fast Feedback Loops**


    By providing self-service capabilities, platform teams remove bottlenecks. Stream-aligned
    teams don''t need to wait for infrastructure changes—they can iterate independently.
    Good platforms reduce time-to-first-deployment for new services.


    ## When to Use


    - **Scaling organizations** - When multiple stream-aligned teams need similar
    capabilities

    - **Complex infrastructure** - When infrastructure requires specialized expertise

    - **Self-service opportunities** - When stream-aligned teams shouldn''t need to
    understand implementation details

    - **Reliability requirements** - When capabilities are critical enough to warrant
    dedicated ownership


    ## How It Works


    ### Characteristics of Effective Platform Teams


    1. **Product mindset** - Treats platform as a product with internal customers

    2. **Self-service focus** - Stream-aligned teams can consume without waiting

    3. **Clear APIs** - Well-documented, stable interfaces

    4. **Thinnest viable platform** - Provides just enough, not a complex empire

    5. **Dedicated ownership** - Full responsibility for platform reliability


    ### What Platform Teams Typically Provide


    | Capability | Examples |

    |------------|----------|

    | Deployment | CI/CD pipelines, container orchestration |

    | Observability | Logging, metrics, tracing, alerting |

    | Runtime | Kubernetes, serverless, service mesh |

    | Data | Databases, caching, messaging |

    | Security | Authentication, authorization, secrets management |

    | Developer experience | Local development, documentation, templates |


    ### Platform Team Anti-Patterns


    - **Empire building** - Platform becomes too large and complex

    - **Ticket-driven** - Teams must wait for platform team to make changes

    - **Forcing adoption** - Mandating platform use rather than making it compelling

    - **Ignoring DX** - Poor developer experience reduces adoption

    - **No product management** - Building features no one needs


    ## Relationship to Other Methods


    - **Stream-Aligned Team** - Primary consumers of platform capabilities

    - **Enabling Team** - May help stream-aligned teams adopt platform capabilities

    - **X-as-a-Service Mode** - How platform teams interact with stream-aligned teams

    - **Thinnest Viable Platform** - Principle for platform scope

    - **Team Cognitive Load** - Platform reduces cognitive load on consumers


