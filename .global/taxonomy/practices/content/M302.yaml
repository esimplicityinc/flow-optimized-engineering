  description: Prose for Global Context Assembly.
  body: 'Synthesize distributed, cross-domain information into a coherent contextual
    picture before retrieval, rather than relying on single-query retrieval to surface
    meaning that is inherently scattered.


    :::caution Early Stage

    This method is still being validated through observations.

    :::


    ## Overview


    The central failure of flat RAG is its assumption that meaning is localized. "What
    is the projected risk of the 2026 portfolio?" is not answered by any single document.
    The answer lives across financial statements, risk policy documents, historical
    performance data, and forward-looking analysis — distributed across departments,
    systems, and time.


    Global Context Assembly is the practice of pre-computing or dynamically assembling
    a coherent contextual picture for a domain or question type before the retrieval
    query is issued. Rather than asking "what chunks are similar to this query?",
    it asks "what is the complete context a reasoning agent needs to answer questions
    in this domain?"


    This may involve pre-building domain snapshots (assembled views of a domain''s
    current state), entity-centric context graphs (everything known about a specific
    entity), or temporal context windows (the evolution of a concept over time). The
    assembled context becomes the substrate for retrieval, not an afterthought.


    ## When to Use


    Use this method when:


    - Answering questions that require synthesizing information from multiple data
    sources or domains

    - Building agents that reason about entities with rich, distributed histories

    - Operating in domains where "current state" requires assembling facts from multiple
    authoritative sources

    - Retrieval quality is poor despite good individual chunks — the problem is often
    missing relational context, not missing content


    ## When NOT to Use


    Avoid this method when:


    - Questions are genuinely localized — the answer really does live in a single
    document

    - Pre-assembly cost is prohibitive (very large, rapidly-changing corpora with
    unpredictable query patterns)

    - The domain is so exploratory that pre-defining assembly patterns is premature


    ## How It Works


    ### Prerequisites


    Before starting:

    - Map the domain''s key entities and their distributed information sources

    - Understand the question types the agent will face and what cross-domain joins
    they require

    - Establish entity resolution (M307) so distributed references can be unified


    ### Step 1: Identify Assembly Patterns


    For each major question type or entity type in your domain, define an assembly
    pattern: what sources need to be consulted, in what order, and how they relate.
    This is essentially a query plan for context, not data.


    ### Step 2: Build Context Assemblers


    Implement assemblers — processes that execute the assembly pattern and produce
    a coherent context artifact. Assemblers may be synchronous (assembled at query
    time) or asynchronous (pre-computed and cached as domain snapshots).


    ### Step 3: Layer Assembly on Top of Retrieval


    Global context provides the frame; retrieval provides the details. The assembled
    context establishes what entities are in play and their known relationships; retrieval
    then fills in specific evidence, quotes, and data points within that frame.


    ### Step 4: Invalidate Assembled Contexts on Source Change


    Assembled contexts are derived artifacts. When source data changes, dependent
    assemblies must be invalidated and rebuilt. Design explicit invalidation triggers
    — don''t rely on TTL alone for domains where currency matters.


    ## Example


    **Without global context assembly:**

    Query: "What are the risks to Project Phoenix in Q3?"

    Retrieval returns: 3 chunks mentioning "Phoenix" by name, but none from the risk
    register because it uses the project code "PHX-2026-Q3". The answer is incomplete
    because entity resolution and cross-source assembly didn''t happen.


    **With global context assembly:**

    Before retrieval, the Phoenix entity context is assembled: all known aliases (Phoenix,
    PHX-2026-Q3, PHX-Init), owning team, current status, linked budget documents,
    linked risk register entries, recent status updates. Retrieval then operates within
    this assembled frame, and the risk register entries are surfaced because the entity
    graph connected them.


    ## Common Pitfalls


    1. **Assembly as a retrieval replacement** — assembly frames the context; it doesn''t
    replace retrieval. Don''t pre-load so much context that the context window is
    exhausted before the actual query is processed.

    2. **Stale assemblies** — cached domain snapshots that aren''t invalidated when
    sources change silently serve outdated context. Build invalidation as carefully
    as you build assembly.

    3. **Over-broad assembly patterns** — assembling "everything about finance" for
    a question about one project wastes context budget. Keep assembly patterns scoped
    to the question type.


    ## How You Can Help


    If you''re testing this method:


    1. Identify a question type in your domain that flat RAG answers poorly

    2. Map what sources the "correct" answer would need to draw from

    3. Try building an assembler and document whether query quality improved'
