  description: Prose for Entity.
  body: "**Pillar:** Tactical Design\n\nAn Entity is a domain object that is defined\
    \ by its identity rather than its attributes. Entities have continuity through\
    \ time—they can change their attributes while remaining the same entity.\n\n##\
    \ Definition\n\n> An object fundamentally defined not by its attributes, but by\
    \ a thread of continuity and identity.\n>\n> — Eric Evans, DDD Reference\n\n##\
    \ Why It Matters\n\nEntities are essential because:\n\n- **Model real-world identity**\
    \ - Many domain concepts have persistent identity (customers, orders, accounts)\n\
    - **Enable tracking over time** - The same entity can be referenced across transactions\n\
    - **Support business processes** - Workflows often track entities through state\
    \ changes\n- **Clarify equality semantics** - Two entities with the same attributes\
    \ are not equal unless they have the same identity\n\n## Characteristics\n\n|\
    \ Characteristic | Description |\n|----------------|-------------|\n| **Unique\
    \ identity** | Has an identifier that distinguishes it from all other entities\
    \ |\n| **Mutable** | Attributes can change over time |\n| **Equality by identity**\
    \ | Two entities are equal if they have the same ID, regardless of attributes\
    \ |\n| **Lifecycle** | Has a lifecycle from creation to (possibly) deletion |\n\
    \n## Identity Strategies\n\n| Strategy | Example | When to Use |\n|----------|---------|-------------|\n\
    | **Natural key** | Social Security Number, ISBN | When domain provides unique\
    \ identifier |\n| **Surrogate key** | UUID, auto-increment ID | When no natural\
    \ key exists |\n| **Composite key** | (TenantId, OrderNumber) | Multi-tenant or\
    \ partitioned systems |\n\n## Example\n\n```typescript\nclass Customer {\n  private\
    \ readonly id: CustomerId;\n  private name: string;\n  private email: Email;\n\
    \  private status: CustomerStatus;\n\n  constructor(id: CustomerId, name: string,\
    \ email: Email) {\n    this.id = id;\n    this.name = name;\n    this.email =\
    \ email;\n    this.status = CustomerStatus.Active;\n  }\n\n  // Identity-based\
    \ equality\n  equals(other: Customer): boolean {\n    return this.id.equals(other.id);\n\
    \  }\n\n  // Attributes can change, identity remains\n  changeName(newName: string):\
    \ void {\n    this.name = newName;\n  }\n}\n```\n\n## Entity vs Value Object\n\
    \n| Aspect | Entity | Value Object |\n|--------|--------|--------------|\n| Identity\
    \ | Has unique identity | No identity |\n| Equality | By identity | By attributes\
    \ |\n| Mutability | Mutable | Immutable |\n| Lifecycle | Tracked over time | Created\
    \ and discarded |\n\n## Common Mistakes\n\n- **Identity crisis** - Not clearly\
    \ defining what makes an entity unique\n- **Over-using entities** - Making everything\
    \ an entity when value objects would suffice\n- **Mutable identity** - Allowing\
    \ the identity to change\n- **Ignoring lifecycle** - Not considering creation,\
    \ modification, and deletion\n\n## When to Use Entities\n\nUse an entity when:\n\
    - The object must be tracked over time\n- The object has a lifecycle with state\
    \ changes\n- Two objects with identical attributes should be distinguishable\n\
    - The domain explicitly identifies this concept (e.g., \"Customer #12345\")\n\n\
    Use a value object instead when:\n- The object is defined entirely by its attributes\n\
    - Instances are interchangeable if attributes match\n- Immutability is desirable\n\
    \n## Relationship to Other Patterns\n\n- **Aggregate** - Entities are often aggregate\
    \ roots\n- **Value Object** - Entities often contain value objects as attributes\n\
    - **Repository** - Retrieves and persists entities\n- **Factory** - Creates entities\
    \ with valid initial state\n\n## FOE Alignment\n\nEntities support **Optimize\
    \ for Understanding** by providing clear classification of domain objects. When\
    \ developers understand that an object is an entity, they immediately know it\
    \ has identity, can change over time, and should be compared by ID. This shared\
    \ understanding reduces confusion and makes code intent clearer."
  lead: An Entity is a domain object that is defined by its identity rather than its
    attributes. Entities have continuity through time—they can change their attributes
    while remaining the same entity.
