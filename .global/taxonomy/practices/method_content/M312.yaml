spec:
  description: Prose for Stateful Agent Design.
  body: "Architect agents as stateful systems that maintain persistent understanding\
    \ across sessions and tasks, rather than stateless query-response machines that\
    \ lose all context between interactions.\n\n:::caution Early Stage\nThis method\
    \ is still being validated through observations.\n:::\n\n## Overview\n\nThe default\
    \ model for AI agents is stateless: each interaction starts fresh, retrieves context\
    \ from the knowledge layer, produces a response, and discards all working state.\
    \ This is adequate for simple Q&A but fails for agents that must act with the\
    \ \"full weight of the organization's intelligence.\"\n\nA stateful agent maintains\
    \ three kinds of persistent state:\n- **Interaction state** — what has been discussed,\
    \ decided, and discovered across sessions (via memory objects, M310)\n- **Task\
    \ state** — the current status of multi-step tasks, including progress, blockers,\
    \ and next actions (via explicit state documents)\n- **Learning state** — patterns,\
    \ preferences, and domain-specific insights accumulated across many interactions\
    \ (via consolidation cycles, M311)\n\nStateful design is the architectural prerequisite\
    \ for agents that feel like colleagues rather than search engines.\n\n## When\
    \ to Use\n\nUse this method when:\n\n- Agents support ongoing relationships (account\
    \ management, project support, advisory roles)\n- Tasks span multiple sessions\
    \ and require continuity of context\n- Agent effectiveness is expected to improve\
    \ over time through accumulated experience\n- Users should not have to re-establish\
    \ context on every interaction\n\n## When NOT to Use\n\nAvoid this method when:\n\
    \n- Privacy requirements prohibit persistent state across sessions\n- Each interaction\
    \ is genuinely independent (transaction processing, one-shot lookups)\n- The overhead\
    \ of state management isn't justified by the interaction pattern\n\n## How It\
    \ Works\n\n### Prerequisites\n\nBefore starting:\n- Define the state scope: what\
    \ is the unit of stateful context (user, project, organization, conversation thread)?\n\
    - Choose a state persistence mechanism (vector DB for memory objects, document\
    \ store for task state)\n- Establish state lifecycle rules (how long is state\
    \ retained, when is it archived, when is it deleted)\n\n### Step 1: Define State\
    \ Schema\n\nFor each state type, define an explicit schema:\n\nInteraction state:\n\
    ```json\n{\n  \"scope_id\": \"project-aurora-user-1042\",\n  \"last_interaction\"\
    : \"2026-05-28T14:30:00Z\",\n  \"summary\": \"...\",\n  \"open_items\": [],\n\
    \  \"key_facts\": {}\n}\n```\n\nTask state:\n```json\n{\n  \"task_id\": \"compliance-review-q2\"\
    ,\n  \"status\": \"in-progress\",\n  \"completed_steps\": [],\n  \"current_step\"\
    : \"...\",\n  \"blockers\": [],\n  \"next_actions\": []\n}\n```\n\n### Step 2:\
    \ Load State at Session Start\n\nAt the beginning of each agent session, retrieve\
    \ relevant state objects. This primes the agent's working memory (M310) with accumulated\
    \ context before the user's first message.\n\n### Step 3: Update State During\
    \ Interaction\n\nAs the interaction proceeds, update state continuously — not\
    \ just at session end. Key decision points, discovered facts, completed steps,\
    \ and new open items should be persisted incrementally. A crashed session should\
    \ lose minimal state.\n\n### Step 4: Archive and Transition State\n\nDefine explicit\
    \ lifecycle transitions: active state → consolidated memory objects → archived\
    \ history. Don't grow state indefinitely — apply consolidation cycles (M311) to\
    \ compress and archive.\n\n## Example\n\nStateless agent:\nUser (Monday): \"Can\
    \ you help me prepare for the client review on Friday? Here's the context: [5\
    \ paragraphs of background]\"\nUser (Wednesday): \"Following up — what were the\
    \ key risks we identified?\"\nStateless agent: \"I don't have context from our\
    \ Monday conversation. Could you re-share the background?\"\n\nStateful agent:\n\
    User (Monday): Agent stores session state: project background, identified risks,\
    \ prep plan, Friday agenda.\nUser (Wednesday): Agent loads state at session start.\
    \ Responds: \"Based on our Monday discussion, the three key risks were: [list].\
    \ We had planned to address [X] before Friday. Two of the prep tasks are complete\
    \ — [Y] and [Z] still need attention. Want to work through those now?\"\n\n##\
    \ Common Pitfalls\n\n1. **State bloat** — accumulating all state without compression\
    \ or archival makes retrieval slow and context noisy. Apply consolidation cycles\
    \ (M311) aggressively.\n2. **Stale state as authoritative** — state that hasn't\
    \ been updated may reflect an outdated picture. Always timestamp state and surface\
    \ recency when presenting state-derived information.\n3. **Missing state isolation**\
    \ — in multi-user or multi-tenant systems, state isolation is a security requirement.\
    \ Enforce scope boundaries at the persistence layer, not just the application\
    \ layer.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Measure\
    \ the reduction in context re-establishment overhead across sessions\n2. Document\
    \ your state schema and what triggered state updates\n3. Note any state management\
    \ edge cases (crashes, concurrent sessions, long-dormant accounts)"
