  description: Prose for Knowledge Distribution as Reliability.
  body: 'Treat concentrated knowledge as a system reliability risk to be actively
    addressed—when only 2-3 people understand a system, that''s not a compliment to
    those people, it''s a fragility to fix.


    ## Overview


    When only 2-3 people understand a complex system, the team becomes dependent on
    "heroes" for debugging and support. This isn''t just a "bus factor" risk—it''s
    an active reliability problem that creates bottlenecks, burnout, and low team
    confidence.


    Knowledge Distribution as Reliability treats concentrated knowledge as a system
    risk to be actively addressed, not a fact to accept. The pattern is predictable:
    low understanding → low confidence → heroics → fragility. The solution isn''t
    just documentation—it''s deliberate knowledge distribution through pairing, rotation,
    and teaching.


    The Prima observation captured this directly: "The main limitation was understanding
    and lack of confidence, not technical capability." The team struggled to support
    their first clients because knowledge was concentrated in the few people who could
    navigate the large forked codebases. Those heroes became bottlenecks, and even
    they lacked confidence because no single person fully understood the system.


    ## When to Use


    Use this method when:


    - Only 2-3 people can debug production issues

    - Team members say "ask [name], they understand that part"

    - Support burden falls on the same people repeatedly

    - Onboarding new team members feels impossible


    ## When NOT to Use


    Avoid this method when:


    - Very early stage (1-2 person team) where concentration is inevitable

    - Temporary specialists brought in for specific expertise

    - Knowledge is already well-distributed across the team


    ## How It Works


    ### Prerequisites


    Before starting:

    - A system complex enough that understanding is non-trivial

    - More than 2-3 people who need to support or extend it


    ### Step 1: Identify Knowledge Concentration


    Ask: "Who do we go to when [X] breaks?" If the same 2-3 names come up repeatedly,
    you have concentration. Map which parts of the system are understood by whom.


    Create a simple matrix: system components on one axis, team members on the other.
    Mark who can debug each component. Gaps and concentrations become visible.


    ### Step 2: Treat Concentration as a Risk


    Add knowledge concentration to your risk register alongside technical debt. "Only
    Alice understands the MCP integration" is a reliability risk, not a compliment
    to Alice.


    This reframes the conversation: it''s not about Alice''s value (which is high),
    it''s about system fragility (which is also high).


    ### Step 3: Pair on Production Issues


    When heroes debug production issues, require pairing. The goal isn''t just to
    fix the issue—it''s to transfer understanding. Rotate who pairs.


    This is expensive in the short term but essential for distribution. The Prima
    team''s support burden fell on the few who understood the system; pairing would
    have spread that load.


    ### Step 4: Rotate Ownership Deliberately


    Assign different people to different parts of the system over time. Short-term
    velocity may decrease; long-term resilience increases. The team''s confidence
    grows as understanding spreads.


    Consider: "Who hasn''t worked on this component recently?" as a factor in task
    assignment.


    ### Step 5: Validate Distribution


    Periodically test: "Could someone other than the usual person debug this?" If
    not, distribution hasn''t happened yet.


    Run a "fire drill": have someone who doesn''t usually handle a component investigate
    an issue (real or simulated) while the expert observes but doesn''t intervene.


    ## Example


    From the Prima observation:


    **The concentration pattern:**

    - Large forked codebases (OpenAI Codex CLI, AnythingLLM) that few people understood

    - MCP integration understood by even fewer

    - When first clients onboarded, support burden fell on the same 2-3 people

    - Team reflection: "The main limitation was understanding and lack of confidence,
    not technical capability"


    **What knowledge distribution would have looked like:**

    1. Map who understands which components (prima-code, prima-web, MCP integration,
    Control Tower)

    2. Identify gaps: "Only Tom understands the MCP hypervisor"

    3. Require pairing on MCP issues: Tom + rotating team member

    4. Rotate ownership: different people lead different components each sprint

    5. Validate: "Can someone other than Tom debug an MCP issue?"


    **The outcome:** Instead of heroes becoming bottlenecks, understanding spreads.
    Team confidence increases. Support burden is shared.


    ## Common Pitfalls


    1. **Treating documentation as distribution** - Documentation helps but doesn''t
    replace hands-on experience. Pairing and rotation are essential.


    2. **Waiting until heroes burn out** - By then, you''ve lost institutional knowledge
    and team morale. Address concentration proactively.


    3. **Accepting concentration as inevitable** - "Only Alice understands that" should
    trigger action, not acceptance.


    4. **Optimizing only for short-term velocity** - Pairing and rotation slow you
    down today but speed you up over time. The Prima team''s support burden was a
    velocity tax they paid repeatedly.


    ## How You Can Help


    If you''re testing this method:


    1. Review the current approach

    2. Map knowledge concentration in your team

    3. Try deliberate distribution (pairing, rotation)

    4. Document your observation—especially the relationship between distribution
    and team confidence'
