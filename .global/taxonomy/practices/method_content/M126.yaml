spec:
  description: Prose for Gherkin.
  body: "**Pillar:** Formulation\n\nGherkin is a domain-specific language (DSL) for\
    \ writing executable specifications in a human-readable format. Created for the\
    \ Cucumber testing framework by Aslak Hellesøy, Gherkin provides the syntax that\
    \ makes BDD scenarios both readable by stakeholders and executable by automation\
    \ tools.\n\n## Definition\n\n> A business-readable, domain-specific language that\
    \ uses a structured syntax of keywords (Feature, Scenario, Given, When, Then)\
    \ to describe software behavior in a way that can be automatically parsed and\
    \ executed as tests.\n\n## Why It Matters\n\nGherkin provides:\n\n- **Single source\
    \ of truth** - Specifications that are both documentation and tests\n- **Stakeholder\
    \ accessibility** - Non-technical team members can read and write specs\n- **Tool\
    \ ecosystem** - Supported by Cucumber, SpecFlow, Behave, and many others\n- **Internationalization**\
    \ - Available in 70+ languages\n\n## Gherkin Keywords\n\n### Feature\n\nDescribes\
    \ a feature of the system. One feature per `.feature` file.\n\n```gherkin\nFeature:\
    \ Shopping Cart\n  As a customer\n  I want to manage items in my cart\n  So that\
    \ I can purchase what I need\n```\n\n### Scenario\n\nA concrete example of the\
    \ feature's behavior.\n\n```gherkin\nScenario: Add item to empty cart\n  Given\
    \ the cart is empty\n  When I add \"Blue T-Shirt\" to the cart\n  Then the cart\
    \ contains 1 item\n```\n\n### Given / When / Then / And / But\n\nThe steps that\
    \ make up a scenario (see [Given-When-Then](./M127-given-when-then.md) for details).\n\
    \n### Background\n\nSteps that run before each scenario in a feature. Use for\
    \ common setup.\n\n```gherkin\nFeature: Checkout Process\n\n  Background:\n  \
    \  Given a registered user is logged in\n    And the cart contains at least one\
    \ item\n\n  Scenario: Successful checkout\n    When the user completes checkout\n\
    \    Then an order confirmation is displayed\n\n  Scenario: Failed payment\n \
    \   When the payment is declined\n    Then an error message is shown\n```\n\n\
    ### Scenario Outline\n\nA template for running the same scenario with different\
    \ data.\n\n```gherkin\nScenario Outline: Discount tiers\n  Given an order totaling\
    \ <amount>\n  When the discount is calculated\n  Then the discount should be <discount>\n\
    \n  Examples:\n    | amount | discount |\n    | $50    | $0       |\n    | $100\
    \   | $10      |\n    | $200   | $30      |\n    | $500   | $100     |\n```\n\n\
    ### Tags\n\nMetadata for organizing and filtering scenarios.\n\n```gherkin\n@smoke\
    \ @checkout\nFeature: Checkout Process\n\n  @happy-path\n  Scenario: Successful\
    \ checkout\n    ...\n\n  @edge-case @payment\n  Scenario: Expired credit card\n\
    \    ...\n```\n\nCommon tag uses:\n- `@smoke` - Quick sanity tests\n- `@wip` -\
    \ Work in progress\n- `@slow` - Long-running tests\n- `@manual` - Cannot be automated\n\
    - `@feature-name` - Group by feature area\n\n## File Structure\n\n```\nfeatures/\n\
    ├── shopping_cart.feature\n├── checkout.feature\n├── user_authentication.feature\n\
    └── step_definitions/\n    ├── cart_steps.js\n    ├── checkout_steps.js\n    └──\
    \ auth_steps.js\n```\n\n## Complete Example\n\n```gherkin\n@shopping\nFeature:\
    \ Shopping Cart Management\n  As an online shopper\n  I want to manage items in\
    \ my shopping cart\n  So that I can review and modify my purchases before checkout\n\
    \n  Background:\n    Given I am logged in as \"customer@example.com\"\n\n  @smoke\n\
    \  Scenario: Add item to cart\n    Given my cart is empty\n    When I add \"Wireless\
    \ Mouse\" to my cart\n    Then my cart should contain 1 item\n    And the cart\
    \ total should be $29.99\n\n  @smoke\n  Scenario: Remove item from cart\n    Given\
    \ my cart contains \"Wireless Mouse\"\n    When I remove \"Wireless Mouse\" from\
    \ my cart\n    Then my cart should be empty\n\n  Scenario Outline: Quantity limits\n\
    \    Given my cart contains <initial> \"USB Cable\"\n    When I change the quantity\
    \ to <requested>\n    Then the quantity should be <result>\n    And I should see\
    \ \"<message>\"\n\n    Examples:\n      | initial | requested | result | message\
    \              |\n      | 1       | 5         | 5      |                     \
    \ |\n      | 1       | 0         | 0      | Item removed         |\n      | 1\
    \       | 100       | 10     | Maximum quantity: 10 |\n      | 1       | -1  \
    \      | 1      | Invalid quantity     |\n```\n\n## Best Practices\n\n### Do\n\
    \n| Practice | Rationale |\n|----------|-----------|\n| Use declarative steps\
    \ | \"Given I am logged in\" not \"Given I enter username and password and click\
    \ login\" |\n| Keep scenarios independent | Each scenario should run in isolation\
    \ |\n| Use meaningful names | Scenario titles should describe the behavior |\n\
    | Leverage Background | Reduce duplication for common setup |\n| Use tags strategically\
    \ | Enable flexible test execution |\n\n### Don't\n\n| Anti-Pattern | Problem\
    \ |\n|--------------|---------|\n| Imperative steps | Too detailed, brittle, hard\
    \ to read |\n| Scenario dependencies | Tests that must run in order |\n| Too many\
    \ steps | Scenarios become hard to understand |\n| Incidental details | Including\
    \ data that doesn't affect the outcome |\n\n## Internationalization\n\nGherkin\
    \ supports 70+ languages. Example in French:\n\n```gherkin\n# language: fr\nFonctionnalité:\
    \ Panier d'achat\n  \n  Scénario: Ajouter un article\n    Soit un panier vide\n\
    \    Quand j'ajoute \"T-shirt bleu\" au panier\n    Alors le panier contient 1\
    \ article\n```\n\n## Relationship to Other Methods\n\n- **Given-When-Then** -\
    \ The template that Gherkin implements\n- **Executable Specifications** - Gherkin\
    \ files become executable through step definitions\n- **Example Mapping** - Output\
    \ from mapping sessions is formulated in Gherkin\n\n## FOE Alignment\n\nGherkin\
    \ supports the FOE principle of **Optimize for Understanding**:\n\n- Plain language\
    \ syntax is accessible to all team members\n- Structured format ensures consistency\
    \ across the codebase\n- Living documentation stays in sync with system behavior\n\
    \n## References\n\n- Cucumber Documentation. \"Gherkin Reference.\" https://cucumber.io/docs/gherkin/reference/\n\
    - Hellesøy, A. \"The Cucumber Book.\" Pragmatic Bookshelf.\n- Smart, J.F. (2014).\
    \ \"BDD in Action.\" Manning Publications."
