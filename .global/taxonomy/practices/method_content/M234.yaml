  description: Prose for Decompose by Business Capability.
  body: "**Pillar:** Foundational Patterns\n\nDecompose by Business Capability is\
    \ the primary strategy for identifying microservice boundaries. Instead of decomposing\
    \ by technical layers (frontend, backend, database) or features, services are\
    \ organized around business capabilities—the things an organization does to generate\
    \ value. This aligns software architecture with business architecture, creating\
    \ services that match how the business operates.\n\n## Definition\n\n> \"A business\
    \ capability is something a business does to generate value. Examples include\
    \ sales, marketing, inventory management, and customer support. A business capability\
    \ often corresponds to a business object, e.g., sales corresponds to orders, inventory\
    \ management corresponds to inventory.\"\n> — Chris Richardson, Microservices\
    \ Patterns\n\n## Why It Matters\n\nIncorrect service boundaries create problems:\n\
    \n**Decomposing by Technical Layer:**\n```\n❌ WRONG: Layer-based decomposition\n\
    ┌─────────────────────────────────────┐\n│           UI Layer                \
    \  │  ← \"Frontend Team\"\n│   (all services share)              │\n├─────────────────────────────────────┤\n\
    │         Business Logic              │  ← \"Backend Team\"\n│   (all services\
    \ share)              │\n├─────────────────────────────────────┤\n│         Data\
    \ Layer                  │  ← \"DBA Team\"\n│   (shared database)            \
    \     │\n└─────────────────────────────────────┘\n\nProblems:\n- Tight coupling\
    \ through shared database\n- Changes require coordinating all teams\n- No clear\
    \ ownership boundaries\n- Can't deploy services independently\n```\n\n**Decomposing\
    \ by Business Capability:**\n```\n✅ RIGHT: Capability-based decomposition\n┌───────────┐\
    \ ┌───────────┐ ┌───────────┐ ┌───────────┐\n│   Order   │ │  Product  │ │  Customer\
    \ │ │ Inventory │\n│  Service  │ │  Service  │ │  Service  │ │  Service  │\n│\
    \  (Orders) │ │ (Catalog) │ │  (Users)  │ │ (Stock)   │\n├───────────┤ ├───────────┤\
    \ ├───────────┤ ├───────────┤\n│ Order DB  │ │ Product DB│ │ Customer  │ │ Inventory\
    \ │\n│           │ │           │ │    DB     │ │    DB     │\n└───────────┘ └───────────┘\
    \ └───────────┘ └───────────┘\n    Order        Product       Customer     Inventory\n\
    \     Team         Team          Team         Team\n\nBenefits:\n- Loose coupling\
    \ through APIs\n- Independent deployment\n- Clear ownership (Conway's Law)\n-\
    \ Teams aligned to business domains\n```\n\n## Identifying Business Capabilities\n\
    \n### Capability Mapping Process\n\n1. **Understand the Business Model**\n   -\
    \ What does the business do?\n   - What are the core value streams?\n   - Who\
    \ are the stakeholders?\n\n2. **Identify Top-Level Capabilities**\n   - List major\
    \ business functions\n   - Group related activities\n   - Look for natural boundaries\n\
    \n3. **Decompose into Sub-Capabilities**\n   - Break coarse capabilities into\
    \ finer ones\n   - Identify common patterns\n   - Validate with domain experts\n\
    \n4. **Map to Services**\n   - Each capability becomes a service candidate\n \
    \  - Evaluate coupling and cohesion\n   - Apply bounded context analysis (DDD)\n\
    \n### Example: E-Commerce Capabilities\n\n```\nBusiness Capabilities:\n├── Sales\n\
    │   ├── Order Management\n│   ├── Pricing\n│   └── Promotion\n├── Product Management\n\
    │   ├── Catalog\n│   ├── Inventory\n│   └── Product Information\n├── Customer\
    \ Management\n│   ├── Customer Profile\n│   ├── Authentication\n│   └── Preferences\n\
    ├── Fulfillment\n│   ├── Shipping\n│   ├── Delivery Tracking\n│   └── Returns\n\
    ├── Marketing\n│   ├── Campaigns\n│   ├── Recommendations\n│   └── Reviews\n└──\
    \ Finance\n    ├── Payment Processing\n    ├── Invoicing\n    └── Refunds\n\n\
    Service Boundaries:\n┌──────────────┬──────────────┬──────────────┬──────────────┐\n\
    │   Order      │   Product    │   Customer   │   Payment    │\n│   Service   \
    \ │   Service    │   Service    │   Service    │\n├──────────────┼──────────────┼──────────────┼──────────────┤\n\
    │ • Create     │ • Catalog    │ • Profile    │ • Process    │\n│   orders    \
    \ │ • Search     │ • Auth       │   payment    │\n│ • Pricing    │ • Inventory\
    \  │ • Preferences│ • Refund     │\n│ • Promotions │ • Details    │ • History\
    \    │ • Fraud check│\n└──────────────┴──────────────┴──────────────┴──────────────┘\n\
    ```\n\n## Capability vs Subdomain\n\nBusiness capabilities closely align with\
    \ Domain-Driven Design subdomains:\n\n| Business Capability | DDD Subdomain |\
    \ Service |\n|---------------------|---------------|---------|\n| Order Management\
    \ | Core Domain | Order Service |\n| Customer Profile | Core Domain | Customer\
    \ Service |\n| Product Catalog | Core Domain | Product Service |\n| Authentication\
    \ | Generic Subdomain | Auth Service |\n| Payment Processing | Supporting | Payment\
    \ Service |\n| Email Notifications | Generic | Notification Service |\n\n**Key\
    \ differences:**\n- **Business Capability** - What the business does (business-centric)\n\
    - **Subdomain** - Area of domain expertise (modeling-centric)\n- **Service** -\
    \ Software implementation of both\n\n## Service Boundary Heuristics\n\n### Good\
    \ Boundaries\n\n✅ **Single Responsibility**\n```\nOrder Service: Manages order\
    \ lifecycle\n- Create order\n- Update status\n- Cancel order\n- Query order history\n\
    \nNOT responsible for:\n- Payment processing (Payment Service)\n- Inventory (Product\
    \ Service)\n- Shipping (Fulfillment Service)\n```\n\n✅ **Independent Deployability**\n\
    ```\nCan deploy Order Service without:\n- Deploying Product Service\n- Deploying\
    \ Customer Service\n- Deploying Payment Service\n\nChanges to pricing don't require\
    \ Order Service deployment\n```\n\n✅ **Loose Coupling**\n```\nOrder Service communicates\
    \ via:\n- Async events: \"OrderCreated\" → other services react\n- Sync APIs:\
    \ Call Payment Service for processing\n\nNOT coupled via:\n- Shared database tables\n\
    - Shared code libraries\n- Direct database access\n```\n\n### Bad Boundaries\n\
    \n❌ **Chatty Services**\n```\nWRONG: Order Service calls Product Service for every\
    \ field\nOrder → Product API × 10 fields = 10 calls\n\nRIGHT: Product Service\
    \ provides aggregated data\nOrder → Product API × 1 = 1 call with all needed data\n\
    ```\n\n❌ **Distributed Monolith**\n```\nWRONG: Changes require deploying 5 services\
    \ together\n- Schema changes cascade through all services\n- Tight coupling through\
    \ shared libraries\n- Database changes require coordination\n\nRIGHT: Services\
    \ evolve independently\n- Backward compatible APIs\n- Shared nothing architecture\n\
    - Database per service\n```\n\n❌ **Wrong Granularity**\n```\nTOO FINE: Every entity\
    \ is a service\n- Order Service, OrderLine Service, OrderStatus Service\n- Excessive\
    \ network overhead\n- Distributed transaction hell\n\nTOO COARSE: One service\
    \ does everything\n- \"ECommerce Service\" with 500 endpoints\n- Becomes the new\
    \ monolith\n- No independent scaling\n```\n\n## Conway's Law Alignment\n\nConway's\
    \ Law states:\n> \"Organizations which design systems are constrained to produce\
    \ designs which are copies of the communication structures of these organizations.\"\
    \n\n**Implications:**\n- Service boundaries should align with team structures\n\
    - Services should match organizational capabilities\n- Team ownership drives service\
    \ boundaries\n\n### Team Topologies Integration\n\nAlign services with Team Topologies\
    \ team types:\n\n| Team Type | Service Ownership | Scope |\n|-----------|------------------|-------|\n\
    | **Stream-aligned** | 1-3 related capabilities | End-to-end value stream |\n\
    | **Platform** | Platform capabilities | Infrastructure, APIs |\n| **Enabling**\
    \ | Transitional | Helps extract services |\n| **Complicated Subsystem** | Complex\
    \ domains | Specialized expertise |\n\n## Practical Decomposition Steps\n\n###\
    \ 1. Event Storming\n\nUse Event Storming to discover capabilities:\n\n```\nWorkshop\
    \ Output:\n┌──────────────────────────────────────────────────────┐\n│  Domain\
    \ Events (Orange sticky notes)                 │\n│  • OrderCreated  • PaymentProcessed\
    \  • ItemShipped  │\n│  • UserRegistered • ProductAdded • InventoryUpdated │\n\
    ├──────────────────────────────────────────────────────┤\n│  Commands (Blue) \
    \         │  Aggregates (Yellow)    │\n│  • Create Order           │  • Order\
    \                │\n│  • Process Payment        │  • Payment              │\n\
    │  • Register User          │  • User                 │\n├──────────────────────────────────────────────────────┤\n\
    │  Policies (Purple)        │  External Systems (Pink)│\n│  • When order created,\
    \    │  • Payment Gateway      │\n│    reserve inventory      │  • Shipping Provider\
    \    │\n└──────────────────────────────────────────────────────┘\n\nResult: Natural\
    \ groupings emerge as service boundaries\n```\n\n### 2. Bounded Context Analysis\n\
    \nMap Event Storming output to bounded contexts:\n\n| Events | Commands | Aggregate\
    \ | Bounded Context |\n|--------|----------|-----------|-----------------|\n|\
    \ OrderCreated, OrderCancelled | CreateOrder, CancelOrder | Order | Order Management\
    \ |\n| PaymentProcessed, PaymentFailed | ProcessPayment | Payment | Payment Processing\
    \ |\n| UserRegistered, UserUpdated | RegisterUser, UpdateProfile | User | Customer\
    \ Management |\n\n### 3. Context Mapping\n\nDefine relationships between contexts:\n\
    \n```\nOrder Management ──[Customer-Supplier]──▶ Payment Processing\n       │\
    \                                         ▲\n       │[Partnership]           \
    \                 │\n       ▼                                         │\nInventory\
    \ Management ──[Conformist]──────────────┘\n```\n\nRelationship types:\n- **Partnership**\
    \ - Teams collaborate on integration\n- **Customer-Supplier** - Upstream prioritizes\
    \ downstream needs\n- **Conformist** - Downstream conforms to upstream model\n\
    - **Anti-Corruption Layer** - Downstream translates upstream model\n\n## FOE Alignment\n\
    \n**Primary: Optimize for Understanding**\n\nDecomposing by business capability\
    \ creates services that mirror how the business actually works. This alignment\
    \ means:\n- Domain experts understand service boundaries intuitively\n- New developers\
    \ learn the business by learning the architecture\n- Service names and responsibilities\
    \ match business language\n- Mental models align between code and business\n\n\
    **Secondary: Confidence to Act**\n\nWhen services align with business capabilities\
    \ and team structures, ownership is clear. Teams can confidently make changes\
    \ within their domain without extensive coordination. The Conway's Law alignment\
    \ ensures that the architecture supports rather than hinders organizational flow.\n\
    \n## Migration Strategy\n\n### From Monolith to Services\n\n```\nPhase 1: Identify\
    \ boundaries (Event Storming)\nMonolith ──[Analysis]──▶ Capability Map\n\nPhase\
    \ 2: Extract first service (low risk)\nMonolith + Order Service (via Strangler\
    \ Fig)\n\nPhase 3: Incremental extraction\nMonolith + Order Service + Customer\
    \ Service\n\nPhase 4: Continue until monolith retired\nOrder + Customer + Product\
    \ + Payment + ... Services\n```\n\n### Prioritization Criteria\n\nExtract services\
    \ in this order:\n\n1. **High-value, low-risk** - Start here\n   - Clear boundaries\n\
    \   - Independent of complex dependencies\n   - High deployment pain in monolith\n\
    \n2. **Platform capabilities** - Enable other services\n   - Authentication\n\
    \   - Notifications\n   - Audit logging\n\n3. **Core domain** - Business differentiation\n\
    \   - Order processing\n   - Pricing engine\n   - Recommendations\n\n4. **Complex\
    \ integrations** - Last\n   - Payment processing\n   - External APIs\n   - Legacy\
    \ system integration\n\n## Benefits\n\n- ✅ **Business alignment** - Architecture\
    \ mirrors business structure\n- ✅ **Team autonomy** - Services match team responsibilities\n\
    - ✅ **Loose coupling** - Boundaries follow natural business seams\n- ✅ **Clear\
    \ ownership** - Each service has clear business owner\n- ✅ **Evolutionary** -\
    \ Business changes drive service evolution\n- ✅ **Organizational scaling** - Add\
    \ teams by adding capabilities\n\n## Trade-offs\n\n- ⚠️ **Requires domain knowledge**\
    \ - Need to understand business deeply\n- ⚠️ **Organizational constraints** -\
    \ May conflict with existing structures\n- ⚠️ **Boundary disputes** - Capabilities\
    \ can overlap\n- ⚠️ **Analysis paralysis** - Can spend too long on perfect boundaries\n\
    \n## Anti-Patterns\n\n### ❌ Entity Services\n\n```\nWRONG: CRUD services for each\
    \ entity\n- Order Service (just CRUD)\n- OrderLine Service (just CRUD)\n- OrderStatus\
    \ Service (just CRUD)\n\nThese are database tables, not services!\n```\n\n###\
    \ ❌ Shared Libraries for Domain Logic\n\n```\nWRONG: Shared \"Order Domain\" library\n\
    - Order Service and Payment Service both use Order library\n- Changes require\
    \ updating both services\n- Coupling through shared code\n\nRIGHT: Each service\
    \ owns its domain model\n- Order Service has Order aggregate\n- Payment Service\
    \ has Payment aggregate\n- Integration through APIs, not shared libraries\n```\n\
    \n### ❌ Premature Decomposition\n\n```\nWRONG: Extract 50 microservices from day\
    \ one\n- Team of 5 people\n- 50 services to deploy\n- Operational nightmare\n\n\
    RIGHT: Start with monolith, extract as needed\n- Monolith with clear module boundaries\n\
    - Extract services when pain emerges\n- Grow services with team growth\n```\n\n\
    ## Case Studies\n\n### Amazon\n\n- Decomposed by business capability (retail,\
    \ AWS, devices)\n- Two-pizza teams own services end-to-end\n- Each service has\
    \ clear business metric ownership\n- Organizational structure enables service\
    \ ownership\n\n### Netflix\n\n- Started with DVD-by-mail monolith\n- Decomposed\
    \ by capability as streaming grew\n- Playback, Content Delivery, Recommendations\
    \ as separate services\n- Team organization follows service boundaries\n\n###\
    \ Spotify\n\n- Squads aligned to business capabilities\n- Features, Monetization,\
    \ Platform as high-level capabilities\n- Services map to squad responsibilities\n\
    - Enables autonomous squad operation\n\n## References\n\n- Richardson, C. (2018).\
    \ *Microservices Patterns*. Chapter 2: Decomposition Strategies.\n- Newman, S.\
    \ (2021). *Building Microservices* (2nd ed.). Chapter 3: Splitting the Monolith.\n\
    - Conway, M. E. (1968). \"How Do Committees Invent?\" *Datamation*.\n- Evans,\
    \ E. (2003). *Domain-Driven Design*. Addison-Wesley.\n- Vernon, V. (2016). *Domain-Driven\
    \ Design Distilled*. Addison-Wesley.\n- [Decompose by Business Capability - microservices.io](https://microservices.io/patterns/decomposition/decompose-by-business-capability.html)\n\
    - [Event Storming - Alberto Brandolini](https://www.eventstorming.com/)\n- Skelton,\
    \ M., & Pais, M. (2019). *Team Topologies*. IT Revolution Press."
