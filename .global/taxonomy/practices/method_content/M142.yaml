spec:
  description: Prose for User Story Template.
  body: "**Pillar:** Discovery\n\nThe User Story Template is a structured format for\
    \ expressing requirements from the user's perspective. While originating from\
    \ Extreme Programming (XP) through Rachel Davies at Connextra, it has been widely\
    \ adopted in BDD as the starting point for discovery conversations.\n\n## Definition\n\
    \n> A template for expressing a requirement in the form \"As a [role], I want\
    \ [feature], so that [benefit]\" that emphasizes who needs the feature, what they\
    \ need, and why they need it.\n\n## Why It Matters\n\nThe User Story Template\
    \ provides:\n\n- **User focus** - Centers requirements on who benefits\n- **Value\
    \ clarity** - The \"so that\" clause forces articulation of business value\n-\
    \ **Conversation starter** - Stories are placeholders for conversations, not complete\
    \ specs\n- **Right-sized chunks** - Encourages breaking work into user-valuable\
    \ increments\n\n## The Template\n\n```\nAs a [role/persona]\nI want [feature/capability]\n\
    So that [benefit/value]\n```\n\n### Role (Who)\n\nThe user or stakeholder who\
    \ will benefit from this feature.\n\n**Good examples:**\n- As a **first-time visitor**\n\
    - As a **premium subscriber**\n- As a **warehouse manager**\n- As a **system administrator**\n\
    \n**Avoid:**\n- As a **user** (too generic)\n- As a **the system** (not a user)\n\
    - As a **developer** (unless building developer tools)\n\n### Feature (What)\n\
    \nThe capability or functionality the user needs.\n\n**Good examples:**\n- I want\
    \ to **filter search results by price**\n- I want to **export my data as CSV**\n\
    - I want to **receive notifications when inventory is low**\n\n**Avoid:**\n- I\
    \ want **the database to be faster** (implementation detail)\n- I want **a button**\
    \ (UI element, not capability)\n\n### Benefit (Why)\n\nThe value or outcome the\
    \ user gains from this feature.\n\n**Good examples:**\n- So that **I can find\
    \ products within my budget**\n- So that **I can analyze data in my preferred\
    \ tools**\n- So that **I can reorder before stockouts occur**\n\n**Avoid:**\n\
    - So that **I can use the feature** (circular)\n- So that **the system is better**\
    \ (vague)\n\n## Examples\n\n### E-commerce\n\n```\nAs a returning customer\nI\
    \ want to save items to a wishlist\nSo that I can purchase them later when I'm\
    \ ready\n```\n\n### SaaS Application\n\n```\nAs a team administrator\nI want to\
    \ set role-based permissions\nSo that I can control what team members can access\n\
    ```\n\n### Internal Tool\n\n```\nAs a support agent\nI want to see a customer's\
    \ order history\nSo that I can quickly resolve their inquiries\n```\n\n## The\
    \ Story is Not the Requirement\n\nA critical BDD insight: **the story is a placeholder\
    \ for a conversation, not a complete specification**.\n\n```\n┌─────────────────────────────────────────────────────────┐\n\
    │                                                         │\n│   User Story (Card)\
    \                                     │\n│        ↓                          \
    \                      │\n│   Conversation (Discovery Workshop, Three Amigos)\
    \       │\n│        ↓                                                │\n│   Confirmation\
    \ (Examples, Acceptance Criteria)          │\n│                              \
    \                           │\n└─────────────────────────────────────────────────────────┘\n\
    ```\n\nThe story invites the conversation; the examples (in Given-When-Then format)\
    \ capture what was learned.\n\n## Acceptance Criteria vs. User Stories\n\nUser\
    \ stories describe **what** and **why**. Acceptance criteria describe **how we'll\
    \ know it's done**.\n\n**Story:**\n```\nAs a customer\nI want to apply discount\
    \ codes\nSo that I can save money on my purchases\n```\n\n**Acceptance Criteria\
    \ (discovered through conversation):**\n```gherkin\nScenario: Valid discount code\n\
    \  Given a 20% discount code \"SAVE20\"\n  When I apply \"SAVE20\" to my $100\
    \ order\n  Then my total becomes $80\n\nScenario: Expired discount code\n  Given\
    \ an expired code \"OLD10\"\n  When I apply \"OLD10\"\n  Then I see \"This code\
    \ has expired\"\n  And my total is unchanged\n```\n\n## INVEST Criteria\n\nGood\
    \ user stories follow the INVEST criteria:\n\n| Criterion | Description | Example\
    \ Check |\n|-----------|-------------|---------------|\n| **I**ndependent | Can\
    \ be developed in any order | No dependencies on other stories |\n| **N**egotiable\
    \ | Details can be discussed | Not a contract, a conversation starter |\n| **V**aluable\
    \ | Delivers value to users | Clear \"so that\" benefit |\n| **E**stimable | Team\
    \ can estimate effort | Understood well enough to size |\n| **S**mall | Fits in\
    \ a sprint | Can be completed in days, not weeks |\n| **T**estable | Can verify\
    \ completion | Clear acceptance criteria |\n\n## Common Anti-Patterns\n\n| Anti-Pattern\
    \ | Problem | Better Approach |\n|--------------|---------|-----------------|\n\
    | Technical stories | \"As a developer, I want to refactor...\" | Frame as user\
    \ benefit or use different format |\n| Missing \"so that\" | No clear value articulated\
    \ | Always include the benefit |\n| Epic disguised as story | Too large to complete\
    \ in a sprint | Split into smaller stories |\n| Solution in the story | \"I want\
    \ a dropdown menu...\" | Focus on capability, not implementation |\n\n## Relationship\
    \ to Other Methods\n\n- **Discovery Workshops** - Stories are the input; examples\
    \ are the output\n- **Three Amigos** - Stories are explored by the three perspectives\n\
    - **Example Mapping** - Story goes on the yellow card\n- **Given-When-Then** -\
    \ Examples discovered from stories use this format\n\n## FOE Alignment\n\nThe\
    \ User Story Template supports the FOE principle of **Optimize for Understanding**:\n\
    \n- Forces articulation of who benefits and why\n- Creates shared vocabulary around\
    \ user needs\n- Serves as a conversation starter, not a specification endpoint\n\
    \n## References\n\n- Cohn, M. (2004). \"User Stories Applied.\" Addison-Wesley.\n\
    - Wake, B. (2003). \"INVEST in Good Stories.\" https://xp123.com/articles/invest-in-good-stories-and-smart-tasks/\n\
    - Connextra. Original user story template format.\n- North, D. (2006). \"Introducing\
    \ BDD.\" https://dannorth.net/introducing-bdd/"
