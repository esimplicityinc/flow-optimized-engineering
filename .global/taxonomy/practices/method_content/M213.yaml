spec:
  description: Prose for Repository Pattern.
  body: "## Why This Matters for Software Architecture\n\nDatabase access code scattered\
    \ throughout business logic creates unmaintainable code that's hard to test and\
    \ impossible to switch storage technologies. The Repository pattern provides a\
    \ clean abstraction that makes persistence look like an in-memory collection,\
    \ hiding query complexity and enabling test substitution.\n\n**Architecture Benefits:**\n\
    - Domain code is persistence-ignorant\n- Easy to swap databases (Postgres to MongoDB)\n\
    - Test business logic with in-memory repositories\n- Query optimization centralized\n\
    - Transaction boundaries are clear\n\n**FOE Alignment:**\n- **Understanding**\
    \ - Repositories collect all data access in one place\n- **Confidence** - Can\
    \ test domain without database setup\n- **Fast Feedback** - Unit tests run fast\
    \ with mock repositories\n\n## Definition\n\n> Mediates between the domain and\
    \ data mapping layers using a collection-like interface for accessing domain objects.\
    \ A Repository encapsulates the set of objects persisted in a data store and the\
    \ operations performed over them, providing a more object-oriented view of the\
    \ persistence layer.\n>\n> — Fowler, Patterns of Enterprise Application Architecture\
    \ (2002)\n\n## The Repository Contract\n\n### Collection-Like Interface\n```java\n\
    // Defined in domain layer\npublic interface OrderRepository {\n    // Collection-like\
    \ operations\n    Order save(Order order);\n    void delete(Order order);\n  \
    \  \n    // Query methods\n    Optional<Order> findById(OrderId id);\n    List<Order>\
    \ findAll();\n    List<Order> findByCustomer(CustomerId customerId);\n    \n \
    \   // Specification-based queries\n    List<Order> findBySpecification(OrderSpecification\
    \ spec);\n    \n    // Existence check\n    boolean exists(OrderId id);\n    \n\
    \    // Count\n    long count();\n}\n```\n\n### Key Characteristics\n- Interface\
    \ defined in domain layer\n- Implementation in infrastructure layer\n- Works with\
    \ full aggregates only\n- Returns domain objects, not database rows\n- Method\
    \ names use domain language\n\n## Implementation Strategies\n\n### 1. Simple CRUD\
    \ Repository\nBasic operations for simple entities:\n\n```java\n@Repository\n\
    public class PostgresOrderRepository implements OrderRepository {\n    private\
    \ final JdbcTemplate jdbc;\n    private final OrderMapper mapper;\n    \n    @Override\n\
    \    public Order save(Order order) {\n        if (order.isNew()) {\n        \
    \    return insert(order);\n        } else {\n            return update(order);\n\
    \        }\n    }\n    \n    @Override\n    public Optional<Order> findById(OrderId\
    \ id) {\n        String sql = \"SELECT * FROM orders WHERE id = ?\";\n       \
    \ return jdbc.query(sql, mapper, id.value())\n                   .stream()\n \
    \                  .findFirst();\n    }\n    \n    @Override\n    public List<Order>\
    \ findByCustomer(CustomerId customerId) {\n        String sql = \"SELECT * FROM\
    \ orders WHERE customer_id = ?\";\n        return jdbc.query(sql, mapper, customerId.value());\n\
    \    }\n}\n```\n\n### 2. Spring Data JPA\nLeverage framework capabilities:\n\n\
    ```java\n// Interface only - Spring generates implementation\npublic interface\
    \ OrderJpaRepository extends JpaRepository<OrderJpaEntity, Long> {\n    \n   \
    \ // Derived query method\n    List<OrderJpaEntity> findByCustomerIdAndStatus(\n\
    \        Long customerId, OrderStatus status\n    );\n    \n    // Custom JPQL\n\
    \    @Query(\"\"\"\n        SELECT o FROM Order o \n        WHERE o.customer.id\
    \ = :customerId \n        AND o.createdAt > :since\n        \"\"\")\n    List<OrderJpaEntity>\
    \ findRecentByCustomer(\n        @Param(\"customerId\") Long customerId,\n   \
    \     @Param(\"since\") LocalDateTime since\n    );\n    \n    // Projection for\
    \ performance\n    @Query(\"SELECT o.id as orderId, o.total as total FROM Order\
    \ o WHERE o.customer.id = :id\")\n    List<OrderSummary> findSummariesByCustomer(@Param(\"\
    id\") Long customerId);\n}\n```\n\n### 3. Manual Implementation with Full Control\n\
    Complete control over mapping and queries:\n\n```java\n@Repository\n@RequiredArgsConstructor\n\
    public class OrderRepositoryImpl implements OrderRepository {\n    private final\
    \ EntityManager em;\n    private final OrderDomainMapper domainMapper;\n    \n\
    \    @Override\n    public Order save(Order order) {\n        OrderJpaEntity entity\
    \ = domainMapper.toEntity(order);\n        \n        if (entity.getId() == null)\
    \ {\n            em.persist(entity);\n        } else {\n            em.merge(entity);\n\
    \        }\n        \n        return domainMapper.toDomain(entity);\n    }\n \
    \   \n    @Override\n    public Optional<Order> findById(OrderId id) {\n     \
    \   OrderJpaEntity entity = em.find(OrderJpaEntity.class, id.value());\n     \
    \   return Optional.ofNullable(entity)\n                       .map(domainMapper::toDomain);\n\
    \    }\n    \n    @Override\n    public List<Order> findByCustomer(CustomerId\
    \ customerId) {\n        TypedQuery<OrderJpaEntity> query = em.createQuery(\n\
    \            \"SELECT o FROM Order o WHERE o.customerId = :customerId\",\n   \
    \         OrderJpaEntity.class\n        );\n        query.setParameter(\"customerId\"\
    , customerId.value());\n        \n        return query.getResultList()\n     \
    \               .stream()\n                    .map(domainMapper::toDomain)\n\
    \                    .toList();\n    }\n}\n```\n\n## Aggregate Persistence\n\n\
    ### Loading Full Aggregates\n```java\npublic class OrderRepositoryImpl implements\
    \ OrderRepository {\n    \n    @Override\n    public Optional<Order> findById(OrderId\
    \ id) {\n        // Load order with all items (aggregate boundary)\n        String\
    \ sql = \"\"\"\n            SELECT o.*, i.* \n            FROM orders o \n   \
    \         LEFT JOIN order_items i ON o.id = i.order_id \n            WHERE o.id\
    \ = ?\n            \"\"\";\n        \n        return jdbc.query(sql, new OrderExtractor(),\
    \ id.value())\n                   .stream()\n                   .findFirst();\n\
    \    }\n}\n\n// Mapper reconstructs full aggregate\npublic class OrderExtractor\
    \ implements ResultSetExtractor<Order> {\n    @Override\n    public Order extractData(ResultSet\
    \ rs) throws SQLException {\n        Order order = null;\n        while (rs.next())\
    \ {\n            if (order == null) {\n                order = mapOrder(rs);\n\
    \            }\n            OrderItem item = mapItem(rs);\n            if (item\
    \ != null) {\n                order.addItem(item);\n            }\n        }\n\
    \        return order;\n    }\n}\n```\n\n### Persisting Aggregate Changes\n```java\n\
    @Service\n@Transactional\npublic class OrderService {\n    private final OrderRepository\
    \ orderRepository;\n    \n    public void addItemToOrder(OrderId orderId, ProductId\
    \ productId, int qty) {\n        Order order = orderRepository.findById(orderId)\n\
    \            .orElseThrow(() -> new OrderNotFoundException(orderId));\n      \
    \  \n        // Domain logic modifies aggregate\n        order.addItem(productId,\
    \ qty);\n        \n        // Repository persists entire aggregate\n        orderRepository.save(order);\n\
    \    }\n}\n```\n\n## Advanced Patterns\n\n### Specification Pattern\nEncapsulate\
    \ query criteria:\n\n```java\n// Specification interface\npublic interface OrderSpecification\
    \ {\n    Predicate toPredicate(Root<Order> root, \n                          CriteriaQuery<?>\
    \ query, \n                          CriteriaBuilder cb);\n}\n\n// Concrete specifications\n\
    public class RecentOrdersSpec implements OrderSpecification {\n    private final\
    \ Duration maxAge;\n    \n    @Override\n    public Predicate toPredicate(Root<Order>\
    \ root, \n                                  CriteriaQuery<?> query, \n       \
    \                           CriteriaBuilder cb) {\n        Instant cutoff = Instant.now().minus(maxAge);\n\
    \        return cb.greaterThan(root.get(\"createdAt\"), cutoff);\n    }\n}\n\n\
    // Repository uses specifications\npublic interface OrderRepository {\n    List<Order>\
    \ findBySpecification(OrderSpecification spec);\n}\n```\n\n### Repository Decorator\n\
    Add cross-cutting concerns:\n\n```java\n@Repository\n@Primary\n@RequiredArgsConstructor\n\
    public class CachingOrderRepository implements OrderRepository {\n    private\
    \ final OrderRepository delegate;\n    private final CacheManager cacheManager;\n\
    \    \n    @Override\n    public Optional<Order> findById(OrderId id) {\n    \
    \    Cache cache = cacheManager.getCache(\"orders\");\n        \n        Order\
    \ cached = cache.get(id.value(), Order.class);\n        if (cached != null) {\n\
    \            return Optional.of(cached);\n        }\n        \n        Optional<Order>\
    \ result = delegate.findById(id);\n        result.ifPresent(order -> cache.put(id.value(),\
    \ order));\n        return result;\n    }\n    \n    @Override\n    public Order\
    \ save(Order order) {\n        Order saved = delegate.save(order);\n        cacheManager.getCache(\"\
    orders\").evict(order.getId().value());\n        return saved;\n    }\n    \n\
    \    // Delegate other methods...\n}\n```\n\n## Testing with Repositories\n\n\
    ### In-Memory Test Repository\n```java\npublic class InMemoryOrderRepository implements\
    \ OrderRepository {\n    private final Map<OrderId, Order> orders = new HashMap<>();\n\
    \    \n    @Override\n    public Order save(Order order) {\n        orders.put(order.getId(),\
    \ order);\n        return order;\n    }\n    \n    @Override\n    public Optional<Order>\
    \ findById(OrderId id) {\n        return Optional.ofNullable(orders.get(id));\n\
    \    }\n    \n    @Override\n    public List<Order> findByCustomer(CustomerId\
    \ customerId) {\n        return orders.values().stream()\n            .filter(o\
    \ -> o.getCustomerId().equals(customerId))\n            .toList();\n    }\n  \
    \  \n    // ... other methods\n}\n```\n\n### Unit Test Example\n```java\n@ExtendWith(MockitoExtension.class)\n\
    class OrderServiceTest {\n    @Mock\n    private OrderRepository orderRepository;\n\
    \    \n    @Mock\n    private PaymentGateway paymentGateway;\n    \n    @InjectMocks\n\
    \    private OrderService orderService;\n    \n    @Test\n    void shouldCreateOrder()\
    \ {\n        // Given\n        CreateOrderRequest request = new CreateOrderRequest(...);\n\
    \        when(paymentGateway.process(any())).thenReturn(successfulPayment());\n\
    \        when(orderRepository.save(any())).thenAnswer(i -> i.getArgument(0));\n\
    \        \n        // When\n        OrderResult result = orderService.createOrder(request);\n\
    \        \n        // Then\n        assertThat(result.getStatus()).isEqualTo(CONFIRMED);\n\
    \        verify(orderRepository).save(any(Order.class));\n    }\n}\n```\n\n##\
    \ Common Mistakes\n\n### Repository per Entity\n```java\n// WRONG: Repository\
    \ for each entity\nOrderItemRepository  // Items are part of Order aggregate\n\
    OrderStatusRepository // Status is a value object\n```\n\n**Solution:** One repository\
    \ per aggregate root:\n```java\n// CORRECT: Only aggregate roots have repositories\n\
    OrderRepository  // Order is the aggregate root\n// OrderItem accessed through\
    \ Order\n```\n\n### Business Logic in Repository\n```java\n// WRONG: Business\
    \ logic in repository\npublic class OrderRepository {\n    public void processOrder(Order\
    \ order) {\n        if (order.getTotal().compareTo(Money.ZERO) > 0) {\n      \
    \      order.setStatus(CONFIRMED);\n        }\n        save(order);\n    }\n}\n\
    ```\n\n**Solution:** Keep business logic in domain:\n```java\n// CORRECT: Repository\
    \ only persists\npublic class OrderService {\n    public void processOrder(OrderId\
    \ id) {\n        Order order = repository.findById(id);\n        order.process();\
    \  // Domain logic\n        repository.save(order);\n    }\n}\n```\n\n### Generic\
    \ Repository Abuse\n```java\n// WRONG: Too generic, loses domain intent\npublic\
    \ interface GenericRepository<T, ID> {\n    T save(T entity);\n    Optional<T>\
    \ findById(ID id);\n    void deleteById(ID id);\n}\n```\n\n**Solution:** Domain-specific\
    \ methods:\n```java\n// CORRECT: Expressive, domain-specific\npublic interface\
    \ OrderRepository {\n    Order save(Order order);\n    Optional<Order> findById(OrderId\
    \ id);\n    List<Order> findPendingOrdersOlderThan(Duration duration);\n    List<Order>\
    \ findByCustomer(CustomerId customerId);\n    Money calculateTotalRevenueForPeriod(DateRange\
    \ range);\n}\n```\n\n## FOE Alignment\n\nThis method supports **Optimize for Understanding**\
    \ by:\n- Centralizing data access logic\n- Using domain language in persistence\n\
    - Hiding database complexity\n\nIt supports **Fast Feedback Loops** through:\n\
    - Fast in-memory repository implementations for tests\n- Clear transaction boundaries\n\
    - Immediate persistence feedback\n\nIt supports **Confidence Through Evidence**\
    \ by:\n- Enabling database technology swaps\n- Supporting test isolation\n- Centralizing\
    \ query optimization\n\n## References\n\n- Fowler, M. (2002). *Patterns of Enterprise\
    \ Application Architecture*. Addison-Wesley.\n- Evans, E. (2003). *Domain-Driven\
    \ Design*. Addison-Wesley.\n- Microsoft (n.d.). [Repository Pattern](https://docs.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/infrastructure-persistence-layer-design)"
