spec:
  description: Prose for Conceptual Debt Prevention.
  body: 'Teams accumulate *conceptual debt* when they adopt technologies without understanding
    their underlying models. Like technical debt, conceptual debt compounds -- each
    misunderstanding produces architectural decisions that produce bugs that produce
    hotfixes that produce more complexity. Unlike technical debt, conceptual debt
    is psychologically invisible: you feel like you understand while your assumptions
    silently diverge from reality.


    :::tip Validated

    This method has been validated through 6 independent observations from diverse
    sources including academic research, industry reports, and practitioner data.

    :::


    ## Overview


    When teams adopt a new technology -- a protocol, framework, AI tool, or OSS codebase
    -- they tend to learn the API and start building. They skip the harder question:
    *how does this technology think about the world?* What does it assume about isolation,
    state, identity, and boundaries?


    This gap between what you think you understand and what you actually understand
    is conceptual debt. It has a higher interest rate than technical debt because
    it corrupts your ability to interpret feedback. A failing test tells you something
    is wrong; a conceptual misunderstanding tells you everything is fine until production
    proves otherwise.


    The Prima team demonstrated this pattern when they adopted MCP without understanding
    its workspace isolation model. They learned the API -- how to make MCP calls --
    but missed the protocol''s assumptions about what can cross workspace boundaries.
    The result was Issue #156: headers leaking between workspaces, a security vulnerability
    that required emergency fixes. The team later reflected: "The main limitation
    was understanding and lack of confidence, not technical capability."


    The same pattern appears at larger scales. The METR study found developers estimated
    they were 20% faster with AI but measured 19% slower -- a 40% perception-reality
    gap that Rachel Thomas connected to "dark flow," a state of absorbed engagement
    that feels productive while creating shallow comprehension. At the organizational
    level, Fortune''s analysis of AI adoption mirrors Solow''s productivity paradox:
    tools are visible everywhere but not in the productivity statistics, because organizations
    adopt tools without restructuring around them.


    Conceptual Debt Prevention inverts the pattern: understand the technology''s model
    before depending on it, verify that understanding through objective mechanisms,
    and restructure your work around what you learn.


    ## When to Use


    - Adopting an emerging or unfamiliar protocol (MCP, gRPC, GraphQL federation)

    - Integrating AI coding tools into team workflows

    - Forking or depending on a large OSS codebase

    - Building architecture that depends on technology assumptions about isolation,
    state, or identity

    - Evaluating AI tool productivity claims where perception may diverge from measurement


    ## When NOT to Use


    - Using mature, well-documented technologies the team already understands

    - Prototyping or spiking where no architectural decisions are being committed

    - The technology is a thin wrapper with no meaningful conceptual model

    - The team has deep prior experience with the specific technology


    ## How It Works


    ### Step 1: Map the Conceptual Model Before Using the API


    Before writing code that depends on a technology, document your understanding
    of its conceptual model -- not its API. Answer these questions:


    - **What are the core abstractions?** (For MCP: workspaces, isolation boundaries,
    tool registrations)

    - **What assumptions does it make about state, identity, and boundaries?** (What
    can cross a workspace boundary? Who owns session state?)

    - **How does it expect errors to be handled?**


    If you cannot articulate these answers, you do not yet understand the model.


    The Prima team learned MCP''s API but not its workspace isolation model, which
    led directly to the header leakage security incident (O102). In contrast, Anthropic''s
    research found that Opus''s surgical git-first investigation strategy -- building
    understanding incrementally rather than dumping everything into context -- was
    15x more efficient than brute-force approaches (O214). The principle is the same
    whether the learner is human or machine: understanding should guide investigation,
    not volume.


    ### Step 2: Verify Understanding Through Objective Mechanisms


    Do not trust subjective feelings of comprehension. The METR study showed a 40%
    gap between perceived and actual productivity (O212). Dark flow -- absorbed engagement
    that feels like understanding -- actively masks conceptual debt.


    Verify your understanding through:


    - **Spike tests** that exercise your assumptions about boundaries. Build a minimal
    prototype that tests specifically what you think the technology isolates, shares,
    and restricts.

    - **Explain-to-a-teammate sessions.** If you cannot explain *why* the technology
    is designed a certain way (not just *how* to call it), your understanding is shallow.

    - **Measurable outcomes.** Tests passing, tasks completing, time tracking. "It
    works on my machine" is not verification -- for the Prima team, it masked the
    fact that no one understood the full system well enough to specify what "working"
    meant (O102).


    ### Step 3: Build Understanding Incrementally


    Understanding develops through progressive calibration, not a single upfront study
    session.


    Anthropic''s empirical study of millions of agent interactions found that experienced
    users shift from approval-based to interrupt-based oversight (O210). They auto-approve
    more (40% vs 20%) but also interrupt more (9% vs 5%) -- they have built a mental
    model of *when* intervention matters. New users lack this model and must develop
    it through staged exposure.


    Apply the same principle to technology adoption:


    - **Start with constrained use.** Limit your dependency on the technology to a
    narrow, well-understood scope.

    - **Expand scope as understanding deepens.** Let demonstrated comprehension --
    verified through Step 2 -- drive expansion, not schedule pressure.

    - **Let understanding guide investigation, not volume.** Read documentation surgically.
    A targeted question about isolation boundaries teaches more than reading the entire
    API reference.


    ### Step 4: Restructure Workflows Around the Technology''s Model


    Do not layer new technology on existing workflows. Adapt your processes to match
    the technology''s conceptual model.


    The original Solow productivity paradox lasted roughly 15 years. It resolved when
    organizations restructured around computers, not when computers got better (O216).
    IBM tripled its entry-level hiring after discovering that AI adoption alone did
    not produce the expected gains. The historical parallel suggests the same resolution
    applies: productivity comes from understanding how to restructure around new tools,
    not from the tools themselves.


    Concretely:


    - **Distribute understanding across the team.** If only 2-3 people understand
    the system, that concentrated knowledge is a reliability risk (O102). Document
    your model understanding as a team reference.

    - **Change your processes to reflect the technology''s model.** If the technology
    assumes workspace isolation, your deployment process should enforce it. If it
    assumes statelessness, your architecture should not smuggle state through side
    channels.

    - **Accept that restructuring takes time.** The Solow paradox was not resolved
    by impatience. Budget time for organizational learning alongside technical adoption.


    ## Example


    The Prima team adopted MCP for integrating their AI platform components. They
    learned the API but not the protocol''s workspace isolation model.


    **What they missed:** MCP workspaces have isolation boundaries. Headers and tokens
    should not leak between workspaces.


    **What happened:** Issue #156 -- "Hotfix: Stop token/workspace inheritance in
    MCP hypervisor to prevent header leakage." A security vulnerability that required
    emergency fixes on the first day of production, alongside 6 other bugs.


    **What conceptual debt prevention would have looked like:**


    1. Before integrating MCP, document: "What is a workspace? What can cross workspace
    boundaries? What does isolation mean in this protocol?"

    2. Build a spike that tests workspace isolation specifically -- try to pass a
    header from one workspace to another and confirm it fails.

    3. Have two team members independently explain their understanding of MCP''s isolation
    model. Where their explanations diverge, investigate.

    4. Structure the integration to enforce the isolation model the protocol assumes,
    rather than layering MCP on top of existing shared-state patterns.


    ## Common Pitfalls


    1. **Confusing API familiarity with model understanding.** Being able to make
    calls does not mean you understand the technology''s assumptions. The test: could
    you explain *why* it is designed this way?


    2. **Skipping this under velocity pressure.** The Prima observation shows the
    time "saved" gets consumed by debugging and hotfixes. Seven production bugs on
    day one is not velocity -- it is conceptual debt coming due.


    3. **Trusting subjective comprehension.** Developers in the METR study were confident
    they were faster. They were not. Use objective verification, not feelings.


    4. **Assuming documentation is complete.** Emerging protocols often have gaps.
    Budget time to discover the model through experimentation, not just reading.


    ## How You Can Help


    If you are testing this method:


    1. Review the steps above and try them when adopting a new technology

    2. Document what you learned about the technology''s model that was not obvious
    from the API

    3. Note whether the perception-reality gap (dark flow) appeared in your experience

    4. Share your observation -- especially whether the time invested in understanding
    paid off'
