  description: Prose for Thinnest Viable Platform.
  body: '**Pillar:** Core Concepts


    The Thinnest Viable Platform (TVP) is a principle for platform design: create
    platforms that provide just enough capability to accelerate stream-aligned teams
    without unnecessary complexity. A good platform should make teams move faster,
    not generate more dependencies to manage.


    ## Definition


    > "A ''thinnest viable platform'' is a platform that is ''just enough'' to accelerate
    and simplify software delivery for teams building on the platform."

    >

    > — Skelton & Pais, Team Topologies


    ## Why It Matters


    The Thinnest Viable Platform principle matters because:


    - **Platforms grow** - Without discipline, platforms become bloated complexity
    monsters

    - **Adoption barriers** - Complex platforms are hard to adopt and use

    - **Maintenance burden** - More features means more maintenance for platform teams

    - **Cognitive load** - Complex platforms increase consumer cognitive load

    - **Opportunity cost** - Building unnecessary features delays valuable ones


    ## FOE Framing


    **Primary: Fast Feedback Loops**


    Thin platforms enable faster feedback by reducing adoption friction and complexity.
    Stream-aligned teams can start using the platform quickly without lengthy onboarding.
    Platform teams can iterate faster on smaller, focused capabilities.


    **Secondary: Confidence to Act**


    Simpler platforms are more reliable and easier to understand. Teams have confidence
    using them because there''s less that can go wrong. Platform teams have confidence
    maintaining them because the scope is manageable.


    ## When to Use


    - **Platform design** - Deciding what capabilities to build

    - **Platform evolution** - Evaluating whether to add new features

    - **Platform evaluation** - Assessing if existing platform is too complex

    - **Buy vs. build** - Deciding whether to adopt external services

    - **Deprecation decisions** - Identifying capabilities to remove


    ## How It Works


    ### TVP Design Principles


    1. **Start with nothing** - Only add capabilities when clearly needed

    2. **Prove demand** - Require evidence that teams need a capability

    3. **Prefer external** - Use managed services over building when possible

    4. **Self-service first** - If it can''t be self-service, question if it''s needed

    5. **Measure adoption** - Track what''s actually used, deprecate what isn''t


    ### What''s "Viable"?


    A platform is viable when it provides clear value to consuming teams:


    | Viable | Not Viable |

    |--------|------------|

    | Reduces team cognitive load | Adds complexity teams must understand |

    | Enables self-service | Requires platform team involvement |

    | Accelerates delivery | Slows teams down with overhead |

    | Has clear documentation | Requires tribal knowledge |

    | Solves real problems | Solves hypothetical future problems |


    ### TVP Evolution


    1. **Start small** - Begin with minimal capabilities

    2. **Listen to consumers** - Understand actual needs

    3. **Add incrementally** - One capability at a time

    4. **Validate adoption** - Ensure new capabilities are used

    5. **Prune regularly** - Remove underused capabilities


    ### Anti-Patterns


    - **Platform empire** - Building capabilities because you can, not because they''re
    needed

    - **Premature platforming** - Building platform before demand exists

    - **Feature creep** - Continuously adding without removing

    - **Not-invented-here** - Building when good external options exist

    - **Ignoring DX** - Complex interfaces that slow consumers down


    ## Relationship to Other Methods


    - **Platform Team** - The team responsible for implementing TVP

    - **Stream-Aligned Team** - Primary consumers who define "viable"

    - **X-as-a-Service Mode** - How platform capabilities are delivered

    - **Team Cognitive Load** - TVP reduces cognitive load on consumers

    - **Service Boundary Extraction (FOE)** - May add to platform when justified


    ## TVP Assessment Questions


    When evaluating whether to add a capability:


    1. Is there demonstrated demand from multiple teams?

    2. Will teams self-serve, or will they need platform team help?

    3. Does a managed service exist that could meet this need?

    4. Does this reduce or increase cognitive load for consumers?

    5. Can we measure whether this capability is used?


