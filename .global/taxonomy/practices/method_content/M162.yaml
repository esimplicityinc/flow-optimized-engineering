  description: Prose for Worktree-Based Agent Isolation.
  body: "Give each parallel agent its own git worktree to prevent file conflicts and\
    \ enable true concurrent development on the same repository.\n\n## Overview\n\n\
    When running multiple AI coding agents in parallel (whether Claude Code instances,\
    \ Codex agents, or mixed tools), they inevitably conflict if they share a working\
    \ directory. One agent's uncommitted changes collide with another's. File locks\
    \ cause failures. Merge conflicts accumulate faster than they can be resolved.\n\
    \n**Worktree-Based Agent Isolation** uses git's built-in worktree feature to give\
    \ each agent a completely separate working directory, all backed by the same repository.\
    \ Each agent works in isolation, commits independently, and conflicts are resolved\
    \ through normal git merging rather than runtime collisions.\n\nThis pattern has\
    \ converged across multiple tools simultaneously:\n- **OpenAI Codex App** (Feb\
    \ 2026) ships with built-in worktree support\n- **Claude Code parallel instances**\
    \ tutorials recommend worktrees\n- **Production workflows** increasingly rely\
    \ on this for agent farms\n\nThe key insight: *Treat each agent like a developer\
    \ on their own branch, not like multiple cursors in the same file.*\n\n## When\
    \ to Use\n\nUse this method when:\n\n- Running 2+ AI coding agents on the same\
    \ repository simultaneously\n- Agents are working on independent tasks that don't\
    \ require real-time coordination\n- You want to maximize parallel throughput without\
    \ agent-to-agent blocking\n- Tasks are naturally decomposable (e.g., \"fix these\
    \ 5 bugs\" = 5 worktrees)\n\n## When NOT to Use\n\nAvoid this method when:\n\n\
    - Agents need to see each other's uncommitted changes in real-time\n- Tasks are\
    \ tightly coupled and require sequential handoffs\n- Your repository is too large\
    \ for multiple worktrees (disk space)\n- You only run one agent at a time anyway\n\
    \n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Understand basic\
    \ git worktree commands\n- Have sufficient disk space (each worktree is a full\
    \ checkout)\n- Know how your project handles dependencies across worktrees (node_modules,\
    \ venv, etc.)\n\n### Step 1: Create Worktrees for Parallel Tasks\n\nFor each parallel\
    \ agent, create a dedicated worktree:\n\n```bash\n# Create worktrees for parallel\
    \ work\ngit worktree add ../project-agent-1 -b feature/task-1\ngit worktree add\
    \ ../project-agent-2 -b feature/task-2\ngit worktree add ../project-agent-3 -b\
    \ feature/task-3\n```\n\nEach worktree gets:\n- Its own directory with full file\
    \ checkout\n- Its own branch for isolated commits\n- Shared git history with the\
    \ main repo\n\n### Step 2: Assign Agents to Worktrees\n\nLaunch each agent instance\
    \ pointing to its dedicated worktree:\n\n```bash\n# Terminal 1\ncd ../project-agent-1\n\
    claude-code \"Implement the user authentication feature\"\n\n# Terminal 2\ncd\
    \ ../project-agent-2\nclaude-code \"Add the payment processing module\"\n\n# Terminal\
    \ 3\ncd ../project-agent-3\nclaude-code \"Create the admin dashboard\"\n```\n\n\
    Each agent now operates in complete isolation.\n\n### Step 3: Handle Dependencies\n\
    \nMost projects need per-worktree dependencies:\n\n```bash\n# For Node.js projects\
    \ - each worktree needs its own node_modules\ncd ../project-agent-1 && npm install\n\
    cd ../project-agent-2 && npm install\ncd ../project-agent-3 && npm install\n\n\
    # For Python projects - use separate venvs or let each agent manage its own\n\
    cd ../project-agent-1 && python -m venv .venv && source .venv/bin/activate &&\
    \ pip install -r requirements.txt\n```\n\n**Tip:** Add dependency installation\
    \ to your agent's startup instructions.\n\n### Step 4: Merge Completed Work\n\n\
    As agents complete their tasks:\n\n```bash\n# Return to main repo\ncd ../project\n\
    \n# Merge completed work\ngit merge feature/task-1  # Agent 1's work\ngit merge\
    \ feature/task-2  # Agent 2's work\ngit merge feature/task-3  # Agent 3's work\n\
    \n# Clean up worktrees\ngit worktree remove ../project-agent-1\ngit worktree remove\
    \ ../project-agent-2\ngit worktree remove ../project-agent-3\n```\n\nConflicts\
    \ are resolved through normal git merging, not runtime file collisions.\n\n##\
    \ Example\n\n**Scenario:** Parallelize fixing 3 independent bugs\n\n```bash\n\
    # Setup\ngit worktree add ../fix-login-bug -b fix/login-validation\ngit worktree\
    \ add ../fix-search-bug -b fix/search-pagination  \ngit worktree add ../fix-export-bug\
    \ -b fix/csv-export-encoding\n\n# Launch agents (in separate terminals)\ncd ../fix-login-bug\
    \ && claude-code \"Fix the login validation bug in auth.ts - see issue #234\"\n\
    cd ../fix-search-bug && claude-code \"Fix pagination in search results - see issue\
    \ #235\"\ncd ../fix-export-bug && claude-code \"Fix CSV export encoding issue\
    \ - see issue #236\"\n\n# All three agents work simultaneously without conflicts\n\
    # Each commits to their own branch\n# Merge when complete\n```\n\n**Result:**\
    \ 3 bugs fixed in parallel in ~1x time instead of 3x time.\n\n## Common Pitfalls\n\
    \n1. **Forgetting dependency installation** - Each worktree needs its own node_modules,\
    \ venv, etc. Agents will fail mysteriously without them.\n\n2. **Worktree sprawl**\
    \ - Clean up worktrees after merging. Use `git worktree list` to track them.\n\
    \n3. **Shared state outside git** - Databases, caches, or external services may\
    \ still conflict. Consider per-worktree environment variables.\n\n4. **Branch\
    \ naming collisions** - Use a naming convention like `agent-1/task-name` to avoid\
    \ conflicts.\n\n5. **Merging too late** - Don't let worktrees diverge too far\
    \ from main. Merge frequently to reduce conflict size.\n\n## FOE Alignment\n\n\
    This method supports multiple FOE principles:\n\n**Build Confidence Through Evidence:**\n\
    - Each agent's work is isolated and testable before merging\n- Conflicts surface\
    \ at merge time, not runtime\n- You can verify each agent's branch independently\n\
    \n**Optimize for Fast Feedback:**\n- Parallel execution dramatically reduces total\
    \ time\n- No blocking on file locks or uncommitted changes\n- Each agent gets\
    \ immediate feedback in its own context\n\n**Optimize for Understanding:**\n-\
    \ Clean separation makes it easier to understand what each agent did\n- Git history\
    \ shows exactly which changes came from which task\n- No tangled commits mixing\
    \ multiple features\n\n## External Evidence\n\n- **OpenAI Codex App** (Feb 2026):\
    \ Ships with built-in worktree support for parallel agents\n- **YouTube tutorials**\
    \ (multiple, Jan-Feb 2026): Claude Code parallel workflows increasingly recommend\
    \ worktrees\n- **Production practice**: Multiple teams reporting 2-4x throughput\
    \ with worktree-isolated agent pools\n- **Git documentation**: Worktrees designed\
    \ for exactly this use case (parallel development)\n\n## How You Can Help\n\n\
    If you're testing this method:\n\n1. Set up 2-3 parallel agents using worktrees\n\
    2. Track time-to-completion vs sequential execution\n3. Note any friction points\
    \ (dependency management, merge conflicts)\n4. Document your experience as an\
    \ observation"
