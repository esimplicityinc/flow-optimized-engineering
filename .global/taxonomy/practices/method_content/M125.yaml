  description: Prose for Feature Flags.
  body: "**Pillar:** Patterns\n\nFeature Flags (also called Feature Toggles) are configuration\
    \ options that allow teams to modify system behavior without changing code. They\
    \ enable deploying incomplete features to production while keeping them hidden\
    \ from users, decoupling deployment from release.\n\n## Definition\n\n> \"Feature\
    \ Toggles (often also referred to as Feature Flags) are a powerful technique,\
    \ allowing teams to modify system behavior without changing code.\"\n>\n> — Pete\
    \ Hodgson, Martin Fowler's site\n\n## Why It Matters\n\nFeature flags are essential\
    \ for Continuous Delivery because they:\n\n- **Decouple deployment from release**\
    \ - Deploy code without exposing features\n- **Enable trunk-based development**\
    \ - Incomplete features can be merged safely\n- **Provide instant rollback** -\
    \ Turn off problematic features without redeploying\n- **Enable experimentation**\
    \ - A/B test features with real users\n- **Control feature exposure** - Release\
    \ to specific users, regions, or percentages\n\n## FOE Framing\n\n**Primary: Confidence\
    \ to Act**\n\nFeature flags provide confidence by offering instant rollback capability.\
    \ If a feature causes problems, it can be disabled in seconds without a deployment.\
    \ Teams can deploy more frequently because the risk of any individual deployment\
    \ is lower.\n\n**Secondary: Fast Feedback Loops**\n\nFlags enable progressive\
    \ rollouts (canary releases) that provide real production feedback before full\
    \ exposure. Teams can test features with a small percentage of users and gradually\
    \ increase exposure based on feedback.\n\n## Types of Feature Flags\n\n| Type\
    \ | Purpose | Lifespan |\n|------|---------|----------|\n| **Release Toggles**\
    \ | Hide partly-built features | Days to weeks |\n| **Experiment Toggles** | A/B\
    \ testing | Days to weeks |\n| **Ops Toggles** | Operational controls (kill switches)\
    \ | Permanent |\n| **Permission Toggles** | User access control | Permanent |\n\
    \n## How It Works\n\n### Basic Implementation\n\n```python\nif feature_flags.is_enabled(\"\
    new_checkout_flow\"):\n    return new_checkout_flow(user)\nelse:\n    return legacy_checkout_flow(user)\n\
    ```\n\n### Best Practices\n\n1. **Minimize toggle points** - Toggle at entry points,\
    \ not throughout code\n2. **Retire flags promptly** - Remove flags after features\
    \ are stable\n3. **Use a toggle system** - Don't hardcode flag values\n4. **Test\
    \ both paths** - Automated tests should cover flag on AND off\n5. **Document flags**\
    \ - Track what each flag does and when to remove it\n\n### Flag Lifecycle\n\n\
    1. **Create** - Add flag for new feature (default: off)\n2. **Deploy** - Code\
    \ goes to production with flag off\n3. **Enable** - Turn on for testing/canary\
    \ users\n4. **Roll out** - Gradually increase exposure\n5. **Full release** -\
    \ Enable for all users\n6. **Clean up** - Remove flag and dead code path\n\n###\
    \ Anti-Patterns\n\n- **Flag accumulation** - Leaving old flags in the codebase\n\
    - **Nested flags** - Complex flag logic that's hard to reason about\n- **Testing\
    \ one path** - Only testing with flag on or off, not both\n- **Flag in every function**\
    \ - Too many toggle points create complexity\n\n## Relationship to DORA Metrics\n\
    \nFeature flags enable:\n\n- **Time to Restore Service** - Instant rollback by\
    \ disabling a flag\n- **Change Failure Rate** - Progressive rollout catches problems\
    \ early\n\n## Relationship to Other Methods\n\n- **Trunk-Based Development** -\
    \ Flags enable merging incomplete features\n- **Canary Release** - Flags control\
    \ which users see new features\n- **Blue-Green Deployment** - Flags provide feature-level\
    \ control beyond environment switching\n- **Deployment Pipeline** - Flags are\
    \ configured separately from deployment\n\n## Citations\n\n- Humble, J., & Farley,\
    \ D. (2010). *Continuous Delivery*. Addison-Wesley.\n- [Feature Toggles](https://martinfowler.com/articles/feature-toggles.html)\
    \ - Pete Hodgson\n- [Feature Flags Best Practices](https://www.atlassian.com/continuous-delivery/principles/feature-flags)"
