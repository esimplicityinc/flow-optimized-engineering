spec:
  description: Prose for Integration Styles.
  body: "**Pillar:** Modularity\n\nIntegration styles define how modules communicate\
    \ within a modular monolith. The choice between synchronous and asynchronous patterns,\
    \ direct calls and events, significantly impacts coupling, consistency, and the\
    \ ability to evolve modules independently.\n\n## Definition\n\n> Integration style\
    \ refers to the mechanism by which modules exchange information and coordinate\
    \ actions, ranging from synchronous direct calls to asynchronous event-driven\
    \ communication, each with different trade-offs in coupling, consistency, and\
    \ latency.\n\n## Integration Patterns Overview\n\n| Style | Coupling | Consistency\
    \ | Latency | Use Case |\n|-------|----------|-------------|---------|----------|\n\
    | **Direct Call** | Tight | Strong | Low | Queries, simple operations |\n| **Domain\
    \ Events** | Loose | Eventual | Low | State changes, notifications |\n| **Outbox\
    \ Pattern** | Loose | Strong | Medium | Critical state changes |\n| **CQRS** |\
    \ Loose | Eventual | Low | Read-heavy, complex queries |\n\n## Pattern 1: Direct\
    \ Method Calls\n\nThe simplest integration—modules call each other's APIs directly.\n\
    \n### When to Use\n\n- **Query operations**: \"Get me the product details\"\n\
    - **Simple commands**: \"Reserve inventory\" (when immediate confirmation needed)\n\
    - **Same transaction requirements**: Both operations must succeed or fail together\n\
    \n### Implementation\n\n```typescript\n// Orders module calls Catalog module directly\n\
    class OrderService {\n  constructor(\n    private catalogAPI: CatalogAPI,  //\
    \ Injected interface\n    private inventoryAPI: InventoryAPI\n  ) {}\n  \n  async\
    \ createOrder(command: CreateOrderCommand): Promise<Order> {\n    // Synchronous\
    \ call to Catalog\n    const product = await this.catalogAPI.getProduct(command.productId);\n\
    \    \n    // Synchronous call to Inventory (same transaction)\n    await this.inventoryAPI.reserveStock(\n\
    \      command.productId, \n      command.quantity\n    );\n    \n    // Create\
    \ order within same unit of work\n    return this.orderRepository.save(new Order({\n\
    \      productId: product.id,\n      productName: product.name,\n      quantity:\
    \ command.quantity,\n      price: product.currentPrice\n    }));\n  }\n}\n```\n\
    \n### Trade-offs\n\n**Pros:**\n- Simple to implement and understand\n- Immediate\
    \ feedback\n- Easy to debug (stack traces)\n- Can share transaction\n\n**Cons:**\n\
    - Tight coupling (caller knows about callee)\n- Temporal coupling (both must be\
    \ available)\n- Cascade failures possible\n- Harder to scale independently\n\n\
    ## Pattern 2: Domain Events\n\nModules communicate through events representing\
    \ business occurrences.\n\n### When to Use\n\n- **State changes**: \"Order was\
    \ placed\", \"Payment completed\"\n- **Loose coupling needed**: Publisher doesn't\
    \ know about subscribers\n- **Multiple consumers**: Several modules need to react\n\
    - **Eventual consistency acceptable**\n\n### Implementation\n\n```typescript\n\
    // Event definition (in shared kernel or publisher's domain)\nclass OrderPlacedEvent\
    \ {\n  constructor(\n    public readonly orderId: string,\n    public readonly\
    \ customerId: string,\n    public readonly items: OrderItem[],\n    public readonly\
    \ totalAmount: Money,\n    public readonly occurredAt: Date\n  ) {}\n}\n\n// Publishing\
    \ module (Orders)\nclass OrderService {\n  async placeOrder(command: PlaceOrderCommand):\
    \ Promise<Order> {\n    const order = Order.create(command);\n    await this.orderRepository.save(order);\n\
    \    \n    // Publish event after successful save\n    await this.eventBus.publish(new\
    \ OrderPlacedEvent(\n      order.id,\n      order.customerId,\n      order.items,\n\
    \      order.total,\n      new Date()\n    ));\n    \n    return order;\n  }\n\
    }\n\n// Subscribing module (Shipping)\nclass ShippingEventHandlers {\n  @EventHandler(OrderPlacedEvent)\n\
    \  async onOrderPlaced(event: OrderPlacedEvent): Promise<void> {\n    await this.shippingService.createShipment(\n\
    \      event.orderId,\n      event.items\n    );\n  }\n}\n\n// Subscribing module\
    \ (Analytics)\nclass AnalyticsEventHandlers {\n  @EventHandler(OrderPlacedEvent)\n\
    \  async onOrderPlaced(event: OrderPlacedEvent): Promise<void> {\n    await this.analytics.trackOrder(event);\n\
    \  }\n}\n```\n\n### Transaction Consistency\n\nCritical question: Should event\
    \ publishing be in the same transaction as the business operation?\n\n**Option\
    \ A: Same Transaction (Two-Phase Commit)**\n```typescript\n// Using Outbox Pattern\n\
    @Transactional\nasync placeOrder(command: PlaceOrderCommand): Promise<Order> {\n\
    \  const order = Order.create(command);\n  await this.orderRepository.save(order);\n\
    \  \n  // Save event to outbox table (same transaction)\n  await this.outboxRepository.save(new\
    \ OutboxEvent({\n    type: 'OrderPlaced',\n    payload: serialize(order)\n  }));\n\
    \  // Event relay processes outbox asynchronously\n}\n```\n\n**Option B: Separate\
    \ Transaction (At-Least-Once)**\n```typescript\nasync placeOrder(command: PlaceOrderCommand):\
    \ Promise<Order> {\n  const order = Order.create(command);\n  await this.orderRepository.save(order);\n\
    \  \n  // Fire and forget - separate transaction\n  // Risk: Event may not be\
    \ published if this fails\n  this.eventBus.publish(new OrderPlacedEvent(...));\n\
    \  \n  return order;\n}\n```\n\n### Trade-offs\n\n**Pros:**\n- Loose coupling\
    \ (publisher unaware of subscribers)\n- Easy to add new consumers\n- Better availability\
    \ (asynchronous)\n- Natural audit trail\n\n**Cons:**\n- Eventual consistency complexity\n\
    - Harder to trace (distributed tracing needed)\n- Risk of event loss\n- Duplicate\
    \ event handling (idempotency required)\n\n## Pattern 3: Outbox Pattern\n\nSolves\
    \ the dual-write problem (database + message broker) by using an outbox table.\n\
    \n### The Problem\n\n```typescript\n// This has a consistency problem\nasync placeOrder(command):\
    \ Promise<Order> {\n  await db.save(order);           // Transaction 1\n  await\
    \ eventBus.publish(event);  // Network call - may fail\n  // If publish fails,\
    \ DB is updated but event is lost\n  // If publish succeeds but process crashes\
    \ before commit,\n  // event is sent but DB rolled back\n}\n```\n\n### The Solution\n\
    \n```typescript\n// Outbox table schema\ninterface OutboxEvent {\n  id: string;\
    \           // UUID\n  type: string;         // Event type\n  payload: string;\
    \      // JSON payload\n  occurredAt: Date;\n  processedAt?: Date;   // Null until\
    \ processed\n}\n\n// Business operation\n@Transactional\nasync placeOrder(command):\
    \ Promise<Order> {\n  const order = Order.create(command);\n  await this.orderRepository.save(order);\n\
    \  \n  // Write to outbox (same transaction as business data)\n  await this.outboxRepository.save({\n\
    \    id: generateUUID(),\n    type: 'OrderPlaced',\n    payload: JSON.stringify({\n\
    \      orderId: order.id,\n      // ... other fields\n    }),\n    occurredAt:\
    \ new Date()\n  });\n}\n\n// Separate relay process (outbox publisher)\nclass\
    \ OutboxPublisher {\n  @Scheduled(every: '5s')\n  async publishEvents(): Promise<void>\
    \ {\n    const events = await this.outboxRepository.findUnprocessed(100);\n  \
    \  \n    for (const event of events) {\n      try {\n        await this.eventBus.publish(event);\n\
    \        await this.outboxRepository.markProcessed(event.id);\n      } catch (error)\
    \ {\n        // Will retry on next cycle\n        this.logger.error('Failed to\
    \ publish event', { eventId: event.id, error });\n      }\n    }\n  }\n}\n```\n\
    \n### When to Use\n\n- **Critical business events** that must not be lost\n- **Exactly-once\
    \ semantics** required\n- **Complex transaction boundaries**\n\n## Pattern 4:\
    \ CQRS (Command Query Responsibility Segregation)\n\nSeparates read and write\
    \ models, often with different integration patterns for each.\n\n### When to Use\n\
    \n- **Read-heavy domains** with complex queries\n- **Different access patterns**\
    \ for reads vs writes\n- **Query performance** is critical\n- **Event sourcing**\
    \ combined with projections\n\n### Implementation\n\n```typescript\n// Command\
    \ side (write model)\nclass OrderCommandService {\n  async placeOrder(command:\
    \ PlaceOrderCommand): Promise<void> {\n    const order = Order.create(command);\n\
    \    await this.orderRepository.save(order);\n    await this.eventStore.append(order.uncommittedEvents);\n\
    \  }\n}\n\n// Query side (read model) - separate module or optimized view\nclass\
    \ OrderQueryService {\n  async getOrderDetails(orderId: string): Promise<OrderDetailsDTO>\
    \ {\n    // Optimized query, may use different database\n    return this.orderReadModel.findById(orderId);\n\
    \  }\n  \n  async searchOrders(criteria: SearchCriteria): Promise<OrderListDTO>\
    \ {\n    // Complex query with joins, aggregations\n    return this.orderReadModel.search(criteria);\n\
    \  }\n}\n\n// Event handler updates read model\nclass OrderProjectionHandler {\n\
    \  @EventHandler(OrderPlacedEvent)\n  async onOrderPlaced(event: OrderPlacedEvent):\
    \ Promise<void> {\n    await this.orderReadModel.insert({\n      id: event.orderId,\n\
    \      customerId: event.customerId,\n      total: event.totalAmount,\n      status:\
    \ 'placed',\n      // ... denormalized data for queries\n    });\n  }\n  \n  @EventHandler(OrderShippedEvent)\n\
    \  async onOrderShipped(event: OrderShippedEvent): Promise<void> {\n    await\
    \ this.orderReadModel.updateStatus(event.orderId, 'shipped');\n  }\n}\n```\n\n\
    ## Choosing the Right Style\n\n### Decision Tree\n\n```\nIs the operation a query?\n\
    ├── YES → Direct Call (or CQRS for complex queries)\n└── NO (it's a command)\n\
    \    └── Must complete immediately?\n        ├── YES → Direct Call\n        └──\
    \ NO (can be async)\n            └── Must not be lost?\n                ├── YES\
    \ → Outbox Pattern\n                └── NO → Simple Domain Events\n```\n\n###\
    \ Practical Guidelines\n\n**Start with Direct Calls** when:\n- Building the first\
    \ version\n- Team is learning the domain\n- Transaction boundaries are unclear\n\
    \n**Move to Events** when:\n- Multiple modules need to react\n- You need loose\
    \ coupling\n- Eventual consistency is acceptable\n\n**Use Outbox** when:\n- Events\
    \ are critical to business\n- You can't afford to lose events\n- Exactly-once\
    \ semantics required\n\n## Common Mistakes\n\n### 1. **Everything Async**\n\n\
    Making everything event-driven creates unnecessary complexity.\n\n**Solution**:\
    \ Use direct calls for queries and simple operations. Reserve events for true\
    \ state changes that need decoupling.\n\n### 2. **Wrong Granularity Events**\n\
    \nEvents that are too fine-grained create chattiness:\n\n```typescript\n// Bad:\
    \ Too granular\nclass ProductNameChangedEvent { ... }\nclass ProductPriceChangedEvent\
    \ { ... }\nclass ProductDescriptionChangedEvent { ... }\n\n// Good: Business meaningful\n\
    class ProductUpdatedEvent { \n  changes: Array<{field: string, oldValue: any,\
    \ newValue: any}>\n}\n```\n\n### 3. **No Idempotency**\n\nEvent handlers that\
    \ fail when receiving duplicate events:\n\n```typescript\n// Bad: Will double-process\n\
    @EventHandler(OrderPlacedEvent)\nasync onOrderPlaced(event: OrderPlacedEvent):\
    \ Promise<void> {\n  await this.inventoryService.reserveStock(event.orderId);\n\
    \  // If event redelivered, stock reserved twice!\n}\n\n// Good: Idempotent\n\
    @EventHandler(OrderPlacedEvent)\nasync onOrderPlaced(event: OrderPlacedEvent):\
    \ Promise<void> {\n  // Check if already processed\n  if (await this.processedEvents.has(event.eventId))\
    \ {\n    return;\n  }\n  \n  await this.inventoryService.reserveStock(event.orderId);\n\
    \  await this.processedEvents.markProcessed(event.eventId);\n}\n```\n\n### 4.\
    \ **Ignoring Failure Modes**\n\nNot considering what happens when integrations\
    \ fail:\n\n**Solution**: Design for failure:\n- Timeouts on sync calls\n- Retry\
    \ policies for async\n- Circuit breakers\n- Dead letter queues\n\n### 5. **Wrong\
    \ Consistency Model**\n\nUsing eventual consistency when strong consistency is\
    \ required:\n\n**Example**: Payment authorization must be strongly consistent\
    \ with order state. Don't use async events for this—use direct calls with shared\
    \ transaction or saga pattern.\n\n## FOE Alignment\n\n### Understanding\n- **Explicit\
    \ integration patterns** make communication visible\n- **Clear contracts** (M237)\
    \ document how modules interact\n- **Choice of style** reflects coupling and consistency\
    \ requirements\n\n### Fast Feedback\n- **Direct calls** provide immediate feedback\n\
    - **Events** enable parallel processing\n- **Outbox pattern** ensures eventual\
    \ delivery\n\n### Confidence\n- **Idempotency** makes retries safe\n- **Proper\
    \ error handling** makes failures predictable\n- **Clear patterns** reduce integration\
    \ bugs\n\n## References\n\n- [Kamil Grzybek - Communication Between Modules](https://github.com/kgrzybek/modular-monolith-with-ddd#communication)\n\
    - [Chris Richardson - Pattern: Transactional Outbox](https://microservices.io/patterns/data/transactional-outbox.html)\n\
    - [Martin Fowler - Domain Event](https://martinfowler.com/eaaDev/DomainEvent.html)\n\
    - [Udi Dahan - Clarified CQRS](http://udidahan.com/2009/12/09/clarified-cqrs/)\n\
    - [Enterprise Integration Patterns](https://www.enterpriseintegrationpatterns.com/)"
