spec:
  description: Prose for State Reconstruction.
  body: "**Pillar:** Core Concepts\n\nState Reconstruction is the process of rebuilding\
    \ an aggregate's current state by reading all events from its event stream and\
    \ applying them in sequence. This is fundamentally a **left fold** (or reduce)\
    \ operation over the event history.\n\n## Definition\n\n> State reconstruction\
    \ is the process of deriving current state by applying a sequence of state transition\
    \ functions (events) to an initial state. Each event represents a function that\
    \ transforms the state from one version to the next.\n\n```\nCurrentState = foldl(applyEvent,\
    \ InitialState, [Event1, Event2, ..., EventN])\n```\n\n## Why It Matters\n\nState\
    \ reconstruction is the core mechanism of Event Sourcing:\n\n- **Derives current\
    \ state** - The state is not stored, it's computed\n- **Enables temporal queries**\
    \ - Can reconstruct state at any point in time\n- **Supports debugging** - Replay\
    \ events to understand how state evolved\n- **Allows state evolution** - Aggregate\
    \ logic can change while preserving history\n\n## The Reconstruction Process\n\
    \n### 1. Load Event Stream\n\n```typescript\nasync function loadAggregate(aggregateId:\
    \ string): Promise<Aggregate> {\n  // Read all events for this aggregate\n  const\
    \ events = await eventStore.readStream(aggregateId);\n  \n  // Start with empty\
    \ aggregate\n  let aggregate = createEmptyAggregate(aggregateId);\n  \n  // Apply\
    \ each event in order\n  for (const event of events) {\n    aggregate = applyEvent(aggregate,\
    \ event);\n  }\n  \n  return aggregate;\n}\n```\n\n### 2. Apply Each Event\n\n\
    ```typescript\nfunction applyEvent(aggregate: Order, event: DomainEvent): Order\
    \ {\n  switch (event.type) {\n    case 'OrderCreated':\n      return new Order({\n\
    \        id: event.orderId,\n        customerId: event.customerId,\n        status:\
    \ OrderStatus.Pending,\n        lineItems: []\n      });\n      \n    case 'OrderLineAdded':\n\
    \      return new Order({\n        ...aggregate,\n        lineItems: [...aggregate.lineItems,\
    \ event.lineItem]\n      });\n      \n    case 'OrderSubmitted':\n      return\
    \ new Order({\n        ...aggregate,\n        status: OrderStatus.Submitted,\n\
    \        submittedAt: event.occurredAt\n      });\n      \n    default:\n    \
    \  return aggregate;\n  }\n}\n```\n\n## Implementation Patterns\n\n### Pattern\
    \ 1: Aggregate Methods\n\nEach event type has a corresponding method on the aggregate:\n\
    \n```typescript\nclass Order {\n  applyEvent(event: DomainEvent): void {\n   \
    \ switch (event.type) {\n      case 'OrderCreated':\n        this.applyOrderCreated(event);\n\
    \        break;\n      case 'OrderLineAdded':\n        this.applyOrderLineAdded(event);\n\
    \        break;\n      // ... etc\n    }\n  }\n  \n  private applyOrderCreated(event:\
    \ OrderCreated): void {\n    this.id = event.orderId;\n    this.customerId = event.customerId;\n\
    \    this.status = OrderStatus.Pending;\n  }\n  \n  private applyOrderLineAdded(event:\
    \ OrderLineAdded): void {\n    this.lineItems.push(new LineItem(event));\n  }\n\
    }\n```\n\n### Pattern 2: External Reducer Function\n\nPure function that takes\
    \ state and event, returns new state:\n\n```typescript\nfunction orderReducer(order:\
    \ Order | null, event: DomainEvent): Order {\n  switch (event.type) {\n    case\
    \ 'OrderCreated':\n      return createOrder(event);\n    case 'OrderLineAdded':\n\
    \      return addLineItem(order!, event);\n    case 'OrderSubmitted':\n      return\
    \ submitOrder(order!, event);\n    default:\n      return order!;\n  }\n}\n\n\
    // Usage\nconst order = events.reduce(orderReducer, null);\n```\n\n### Pattern\
    \ 3: Event Handlers Registry\n\nRegister handlers for each event type:\n\n```typescript\n\
    class AggregateRebuilder {\n  private handlers = new Map<string, EventHandler>();\n\
    \  \n  register(eventType: string, handler: EventHandler): void {\n    this.handlers.set(eventType,\
    \ handler);\n  }\n  \n  rebuild(events: DomainEvent[]): Aggregate {\n    return\
    \ events.reduce((aggregate, event) => {\n      const handler = this.handlers.get(event.type);\n\
    \      return handler ? handler(aggregate, event) : aggregate;\n    }, createEmptyAggregate());\n\
    \  }\n}\n```\n\n## Reconstruction at Specific Points\n\n### Historical State\n\
    \nTo get state at a specific point in time:\n\n```typescript\nasync function loadAggregateAtTime(\n\
    \  aggregateId: string, \n  timestamp: Date\n): Promise<Aggregate> {\n  const\
    \ events = await eventStore.readStream(aggregateId);\n  \n  // Filter events up\
    \ to timestamp\n  const relevantEvents = events.filter(e => e.occurredAt <= timestamp);\n\
    \  \n  return relevantEvents.reduce(applyEvent, createEmptyAggregate());\n}\n\
    ```\n\n### Specific Version\n\nTo get state at a specific version:\n\n```typescript\n\
    async function loadAggregateAtVersion(\n  aggregateId: string, \n  version: number\n\
    ): Promise<Aggregate> {\n  const events = await eventStore.readStream(aggregateId,\
    \ { \n    maxVersion: version \n  });\n  \n  return events.reduce(applyEvent,\
    \ createEmptyAggregate());\n}\n```\n\n## Performance Considerations\n\n### The\
    \ Problem\n\nLong-lived aggregates may have thousands of events. Replaying all\
    \ events becomes slow.\n\n### Solutions\n\n1. **Snapshotting** - Periodically\
    \ save aggregate state (see M244)\n2. **Lazy loading** - Only load events when\
    \ needed\n3. **Caching** - Cache reconstructed aggregates\n4. **Event stream size\
    \ limits** - Consider aggregate boundaries if streams grow too large\n\n## Common\
    \ Mistakes\n\n### 1. Side Effects in Apply Methods\n\n**Bad:**\n```typescript\n\
    applyOrderSubmitted(event) {\n  this.status = OrderStatus.Submitted;\n  sendEmailToCustomer();\
    \ // Side effect!\n}\n```\n\n**Good:**\n```typescript\napplyOrderSubmitted(event)\
    \ {\n  this.status = OrderStatus.Submitted; // Only state changes\n  this.submittedAt\
    \ = event.occurredAt;\n}\n```\n\nApply methods must be pure functions that only\
    \ mutate state. Side effects happen after reconstruction.\n\n### 2. Conditional\
    \ Logic in Apply Methods\n\n**Bad:**\n```typescript\napplyOrderSubmitted(event)\
    \ {\n  if (this.lineItems.length > 0) { // Conditional!\n    this.status = OrderStatus.Submitted;\n\
    \  }\n}\n```\n\n**Good:**\n```typescript\napplyOrderSubmitted(event) {\n  this.status\
    \ = OrderStatus.Submitted; // Always apply\n}\n```\n\nBusiness validation happens\
    \ before events are created, not during apply. Events represent facts that already\
    \ passed validation.\n\n### 3. Missing Event Handlers\n\nWhen adding new event\
    \ types, ensure all aggregates that may receive them have handlers. Use exhaustive\
    \ switch statements with compile-time checks.\n\n## Relationship to CQRS\n\nState\
    \ reconstruction is **independent of CQRS**:\n- Reconstruction happens in the\
    \ write model to validate commands\n- Read models may use projections instead\
    \ of reconstruction\n- CQRS allows optimizing read models separately from the\
    \ event store\n\n## FOE Alignment\n\nState Reconstruction supports **Understanding**\
    \ by making the evolution of state completely transparent. Developers can trace\
    \ exactly how an aggregate reached its current state by examining the event sequence.\
    \ This eliminates mystery about data changes.\n\nThe explicit nature of state\
    \ transitions also supports **Confidence** - there's never ambiguity about how\
    \ state changed because every transition is recorded as an immutable event."
