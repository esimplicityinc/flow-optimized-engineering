spec:
  description: Prose for Context Mapping.
  body: "**Pillar:** Strategic Design\n\nContext Mapping is the practice of documenting\
    \ the relationships between bounded contexts. It makes explicit how different\
    \ parts of a system interact and what kind of relationship exists between teams\
    \ and their models.\n\n## Definition\n\n> A representation of the Bounded Contexts\
    \ involved in a project and the actual relationships between them and their models.\n\
    >\n> — Eric Evans, DDD Reference\n\n## Why It Matters\n\nContext Mapping is essential\
    \ because:\n\n- **Makes integration explicit** - No hidden dependencies between\
    \ contexts\n- **Guides team interactions** - Clarifies who depends on whom\n-\
    \ **Identifies risk** - Shows where model corruption might occur\n- **Supports\
    \ architecture decisions** - Informs microservices boundaries\n- **Documents reality**\
    \ - Captures how the system actually works, not how it should work\n\n## Relationship\
    \ Patterns\n\nContext Maps use specific patterns to describe relationships:\n\n\
    | Pattern | Description | Power Dynamic |\n|---------|-------------|---------------|\n\
    | **Partnership** | Two contexts succeed or fail together | Equal |\n| **Shared\
    \ Kernel** | Shared subset of the model | Equal |\n| **Customer-Supplier** | Downstream\
    \ has input to upstream priorities | Upstream leads |\n| **Conformist** | Downstream\
    \ adopts upstream model as-is | Upstream dominates |\n| **Anti-Corruption Layer**\
    \ | Downstream translates from upstream model | Downstream protects itself |\n\
    | **Open Host Service** | Upstream provides well-defined protocol | Upstream serves\
    \ many |\n| **Published Language** | Shared language for integration | Neutral\
    \ |\n| **Separate Ways** | No integration, contexts are independent | None |\n\
    \n## How to Create a Context Map\n\n1. **Identify all bounded contexts** in the\
    \ system\n2. **Document integration points** between contexts\n3. **Classify each\
    \ relationship** using the patterns above\n4. **Note the direction of dependency**\
    \ - who calls whom?\n5. **Identify team ownership** for each context\n6. **Update\
    \ as the system evolves**\n\n## Example Context Map\n\n```\n┌─────────────────┐\
    \     Customer-Supplier     ┌─────────────────┐\n│                 │ ─────────────────────────▶│\
    \                 │\n│   Order Taking  │                           │   Fulfillment\
    \   │\n│                 │◀───────────────────────── │                 │\n└─────────────────┘\
    \     (Domain Events)       └─────────────────┘\n        │                   \
    \                           │\n        │ Anti-Corruption Layer               \
    \         │ Conformist\n        ▼                                            \
    \  ▼\n┌─────────────────┐                           ┌─────────────────┐\n│  Legacy\
    \ Billing │                           │  Shipping API   │\n│    (External)   │\
    \                           │   (External)    │\n└─────────────────┘         \
    \                  └─────────────────┘\n```\n\n## When to Use Each Pattern\n\n\
    - **Partnership** - When two teams must coordinate closely and can commit to joint\
    \ planning\n- **Shared Kernel** - When overlap is small and both teams can agree\
    \ on shared code\n- **Customer-Supplier** - When downstream needs influence upstream\
    \ priorities\n- **Conformist** - When upstream won't change and translation cost\
    \ exceeds benefit\n- **Anti-Corruption Layer** - When you need to protect your\
    \ model from external corruption\n- **Open Host Service** - When serving multiple\
    \ downstream consumers\n- **Published Language** - When you need a stable, documented\
    \ integration format\n\n## FOE Alignment\n\nContext Mapping supports **Optimize\
    \ for Understanding** by making system architecture visible. When relationships\
    \ between contexts are documented, teams can understand how their work affects\
    \ others and where integration complexity lies. This visibility enables better\
    \ architectural decisions and reduces unexpected coupling."
  lead: Context Mapping is the practice of documenting the relationships between bounded
    contexts. It makes explicit how different parts of a system interact and what
    kind of relationship exists between teams and their models.
