  description: Prose for Domain Event Modeling.
  body: "**Pillar:** Core Concepts\n\nDomain Event Modeling is the practice of identifying\
    \ and defining business activities as discrete events using ubiquitous language\
    \ from Domain-Driven Design. These events represent facts about the domain that\
    \ have already occurred.\n\n## Definition\n\n> A domain event is a full-fledged\
    \ part of the domain model, a representation of something that happened in the\
    \ domain. Events capture facts about the past and are named in past tense to reflect\
    \ that they describe something that has already occurred.\n>\n> — Eric Evans,\
    \ Domain-Driven Design\n\nIn Event Sourcing, domain events are not just notifications—they\
    \ are the **fundamental building blocks** of the system. Every state change is\
    \ represented by one or more domain events.\n\n## Why It Matters\n\nDomain Event\
    \ Modeling is critical because:\n\n- **Captures business intent** - Events describe\
    \ *why* something happened, not just *what* changed\n- **Enables temporal reasoning**\
    \ - The sequence of events tells the story of the domain\n- **Supports audit requirements**\
    \ - Complete history of business activities\n- **Decouples systems** - Publishers\
    \ don't need to know about subscribers\n- **Enables event replay** - Events can\
    \ be reprocessed for various purposes\n\n## Naming Conventions\n\nEvents must\
    \ be named in **past tense** because they describe something that already happened:\n\
    \n| Good (Past Tense) | Bad (Present/Imperative) |\n|-------------------|--------------------------|\n\
    | OrderPlaced | PlaceOrder |\n| PaymentReceived | ReceivePayment |\n| CustomerRegistered\
    \ | RegisterCustomer |\n| InventoryAllocated | AllocateInventory |\n| ShipmentDelivered\
    \ | DeliverShipment |\n\n## Event Structure\n\nA well-modeled domain event contains:\n\
    \n```typescript\ninterface DomainEvent {\n  // Identity and timing\n  eventId:\
    \ UUID;           // Unique identifier for this event occurrence\n  occurredAt:\
    \ Timestamp;   // When the event happened in business time\n  \n  // Aggregate\
    \ reference\n  aggregateId: UUID;       // Which aggregate produced this event\n\
    \  aggregateVersion: number; // Version of aggregate after this event\n  \n  //\
    \ Event data (the payload)\n  // ... domain-specific attributes\n  \n  // Metadata\n\
    \  correlationId: UUID;     // Traces related operations\n  causationId: UUID;\
    \       // The event/command that caused this event\n}\n```\n\n## Identifying\
    \ Events\n\n### Event Storming\n\nEvent Storming is a collaborative workshop technique\
    \ for discovering domain events:\n\n1. **Gather domain experts and developers**\
    \ together\n2. **Write events on sticky notes** in past tense (orange stickies)\n\
    3. **Arrange chronologically** to discover process flow\n4. **Identify aggregates**\
    \ that produce events (yellow stickies)\n5. **Find commands** that trigger events\
    \ (blue stickies)\n\n### Event Discovery Questions\n\nAsk the business:\n- \"\
    What are the important things that happen in this process?\"\n- \"What would you\
    \ want to be notified about?\"\n- \"What do you need to track for compliance/audit?\"\
    \n- \"When would you say 'this has happened'?\"\n\n## Event Granularity\n\n| Granularity\
    \ | Description | Example |\n|-------------|-------------|---------|\n| **Fine-grained**\
    \ | Many small events | `ItemAddedToCart`, `QuantityChanged`, `CouponApplied`\
    \ |\n| **Coarse-grained** | Fewer, richer events | `CartModified` with full cart\
    \ state |\n| **Business-significant** | Events that matter to business | `OrderPlaced`,\
    \ `PaymentConfirmed` |\n\n**Recommendation:** Start with business-significant\
    \ events. Add finer-grained events only when needed for specific requirements.\n\
    \n## Event Content Guidelines\n\n### DO Include:\n\n- **All data needed to understand\
    \ what happened** - Events should be self-contained\n- **Identifiers, not full\
    \ objects** - Reference IDs rather than embedding full aggregates\n- **Values\
    \ at the time of the event** - Capture data as it was when the event occurred\n\
    - **Business timestamps** - When it happened in business time, not just system\
    \ time\n\n### DON'T Include:\n\n- **Derived data** - Can be calculated from other\
    \ event data\n- **External system state** - Don't embed data owned by other systems\n\
    - **Mutable references** - Never include objects that can change\n\n## Common\
    \ Mistakes\n\n### 1. CRUD Events\n\n**Bad:** `CustomerUpdated`, `OrderModified`\n\
    \n**Good:** `CustomerEmailChanged`, `ShippingAddressUpdated`, `OrderLineAdded`\n\
    \nCRUD events lose business intent. Always name events after the specific business\
    \ occurrence.\n\n### 2. Including Too Much Data\n\nEvents should be lean. Include\
    \ only what's needed to understand what happened. Large events:\n- Increase storage\
    \ costs (especially important in ES)\n- Make the system harder to understand\n\
    - Create coupling to data that may change\n\n### 3. Mutable Event Data\n\nEvents\
    \ must be immutable. Never design events where the payload can change after the\
    \ event is created.\n\n## Relationship to CQRS\n\nDomain Event Modeling is **independent\
    \ of CQRS**:\n- You can model domain events without Event Sourcing\n- You can\
    \ use Event Sourcing without separating read/write models\n- CQRS is often used\
    \ with Event Sourcing to optimize queries, but it's not required\n\n## FOE Alignment\n\
    \nDomain Event Modeling supports **Understanding** by making implicit domain concepts\
    \ explicit. When business activities are named and structured as events, the code\
    \ reflects the actual business process. This shared language between developers\
    \ and domain experts reduces miscommunication and makes the system more comprehensible.\n\
    \nThe explicit modeling of events also supports **Fast Feedback Loops** - when\
    \ events are well-defined, it's easier to build reactive systems that respond\
    \ immediately to business occurrences."
