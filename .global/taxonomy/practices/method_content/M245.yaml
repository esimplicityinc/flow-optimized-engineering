  description: Prose for Event Versioning.
  body: "**Pillar:** Operational Patterns\n\nEvent Versioning is the practice of managing\
    \ schema evolution of events over time. Since events are immutable and stored\
    \ forever, the system must handle reading old event formats while supporting new\
    \ event structures.\n\n## Definition\n\n> Event versioning is the set of practices\
    \ and patterns that allow event schemas to evolve over time without breaking existing\
    \ event streams. It ensures that events written in old formats can still be read\
    \ and processed by current code.\n\n## Why It Matters\n\nEvents are immutable\
    \ and stored forever:\n- **Can't update old events** - They're append-only\n-\
    \ **Can't delete events** - Would break event sourcing\n- **Long-lived systems**\
    \ - Events may be decades old\n- **Multiple consumers** - Different projections\
    \ may need different formats\n\nWithout proper versioning, schema changes break\
    \ the system.\n\n## Versioning Strategies\n\n### 1. Schema Evolution (Additive\
    \ Changes)\n\n**DO:** Add optional fields, don't remove or rename:\n\n```typescript\n\
    // Version 1\ninterface OrderCreated {\n  orderId: string;\n  customerId: string;\n\
    }\n\n// Version 2 - ADD optional field\ninterface OrderCreated {\n  orderId: string;\n\
    \  customerId: string;\n  orderTotal?: Money;  // Optional, null for old events\n\
    }\n```\n\n**Pros:** Simple, backward compatible  \n**Cons:** Can't remove fields,\
    \ limited evolution\n\n### 2. Upcasting (Transform on Read)\n\nTransform old events\
    \ to current format when reading:\n\n```typescript\ninterface EventUpcaster {\n\
    \  canUpcast(event: EventEnvelope): boolean;\n  upcast(event: EventEnvelope):\
    \ DomainEvent;\n}\n\nclass OrderCreatedUpcaster implements EventUpcaster {\n \
    \ canUpcast(event: EventEnvelope): boolean {\n    return event.type === 'OrderCreated'\
    \ && event.version === 1;\n  }\n  \n  upcast(event: EventEnvelope): DomainEvent\
    \ {\n    const oldData = event.data as OrderCreatedV1;\n    \n    // Transform\
    \ to current version\n    return new OrderCreated({\n      orderId: oldData.orderId,\n\
    \      customerId: oldData.customerId,\n      orderTotal: null,  // Default for\
    \ new field\n      currency: 'USD'    // Sensible default\n    });\n  }\n}\n\n\
    // Usage in event store\nasync function readEvent(envelope: EventEnvelope): Promise<DomainEvent>\
    \ {\n  for (const upcaster of upcasters) {\n    if (upcaster.canUpcast(envelope))\
    \ {\n      return upcaster.upcast(envelope);\n    }\n  }\n  return deserialize(envelope);\n\
    }\n```\n\n**Pros:** Events always in current format in application code  \n**Cons:**\
    \ Adds overhead on read, must maintain upcasters forever\n\n### 3. Event Migration\
    \ (Copy-on-Write)\n\nCreate new streams with migrated events:\n\n```typescript\n\
    async function migrateStream(streamId: string): Promise<void> {\n  const oldEvents\
    \ = await eventStore.readStream(streamId);\n  const newEvents = oldEvents.map(upcastEvent);\n\
    \  \n  // Write to new stream\n  await eventStore.createStream(streamId + '-v2',\
    \ newEvents);\n}\n```\n\n**Pros:** Clean separation, no read-time overhead  \n\
    **Cons:** Duplicates data, complex to manage\n\n### 4. Polyglot Persistence\n\n\
    Store different event formats separately:\n\n```typescript\ninterface EventEnvelope\
    \ {\n  type: string;\n  version: number;  // Schema version\n  data: unknown;\
    \    // Format depends on version\n  metadata: EventMetadata;\n}\n```\n\nApplication\
    \ code handles multiple versions:\n\n```typescript\nfunction applyOrderCreated(aggregate:\
    \ Order, event: OrderCreated): void {\n  // Handle both v1 and v2\n  const orderTotal\
    \ = 'orderTotal' in event \n    ? event.orderTotal \n    : calculateDefaultTotal();\n\
    \    \n  // ...\n}\n```\n\n**Pros:** Flexible, explicit versioning  \n**Cons:**\
    \ More complex application code\n\n## Best Practices\n\n### 1. Version Your Events\n\
    \nAlways include version information:\n\n```typescript\ninterface EventEnvelope\
    \ {\n  type: 'OrderCreated';\n  version: 2;  // Schema version\n  data: OrderCreatedData;\n\
    \  metadata: {\n    occurredAt: Date;\n    correlationId: string;\n  };\n}\n```\n\
    \n### 2. Prefer Additive Changes\n\nInstead of renaming:\n```typescript\n// BAD:\
    \ Rename field\n// Old: { customerName: string }\n// New: { customerFullName:\
    \ string }\n\n// GOOD: Add new, deprecate old\ninterface CustomerUpdated {\n \
    \ customerName?: string;      // Deprecated\n  customerFullName?: string;  //\
    \ New field\n}\n```\n\n### 3. Use Meaningful Defaults\n\nWhen adding required\
    \ fields, provide sensible defaults:\n\n```typescript\nfunction upcastOrderCreated(old:\
    \ OrderCreatedV1): OrderCreatedV2 {\n  return {\n    ...old,\n    currency: 'USD',\
    \  // Sensible default for existing data\n    orderTotal: calculateFromLineItems(old.lineItems)\n\
    \  };\n}\n```\n\n### 4. Test with Old Events\n\nMaintain test fixtures with old\
    \ event formats:\n\n```typescript\ndescribe('Event Versioning', () => {\n  it('should\
    \ handle OrderCreated v1', () => {\n    const oldEvent = loadFixture('order-created-v1.json');\n\
    \    const aggregate = rebuildAggregate([oldEvent]);\n    expect(aggregate.status).toBe('pending');\n\
    \  });\n  \n  it('should handle OrderCreated v2', () => {\n    const newEvent\
    \ = loadFixture('order-created-v2.json');\n    const aggregate = rebuildAggregate([newEvent]);\n\
    \    expect(aggregate.currency).toBe('EUR');\n  });\n});\n```\n\n## Common Breaking\
    \ Changes\n\n### Renaming Fields\n\n**Problem:** Old events have old field names\n\
    \n**Solution:** Keep old field as alias or use upcasting\n\n```typescript\n//\
    \ Store both names during transition\ninterface OrderCreated {\n  customerName:\
    \ string;      // Old name\n  customerFullName: string;  // New name (alias)\n\
    }\n```\n\n### Changing Field Types\n\n**Problem:** String to number, date format\
    \ changes, etc.\n\n**Solution:** Upcasting with conversion logic\n\n```typescript\n\
    // Old: timestamp: \"2024-01-15\"\n// New: timestamp: 1705276800000\n\nfunction\
    \ upcastTimestamp(old: string): number {\n  return new Date(old).getTime();\n\
    }\n```\n\n### Removing Fields\n\n**Problem:** Old events have data you no longer\
    \ need\n\n**Solution:** Mark as deprecated but keep in schema\n\n```typescript\n\
    interface OrderCreated {\n  orderId: string;\n  customerId: string;\n  legacyField?:\
    \ string;  // Deprecated, optional\n}\n```\n\n### Restructuring Events\n\n**Problem:**\
    \ Complete event structure changes\n\n**Solution:** Split into multiple events\
    \ or use complex upcasting\n\n```typescript\n// Old: Single OrderModified event\n\
    // New: OrderLineAdded, OrderLineRemoved, ShippingAddressChanged\n\nfunction upcastOrderModified(old:\
    \ OrderModifiedV1): DomainEvent[] {\n  // Split into multiple new events\n  return\
    \ [\n    new OrderLineAdded({...}),\n    new ShippingAddressChanged({...})\n \
    \ ];\n}\n```\n\n## Event Versioning Checklist\n\nWhen changing event schemas:\n\
    \n- [ ] Will old events still be readable?\n- [ ] Do all projections handle the\
    \ change?\n- [ ] Are upcasters written and tested?\n- [ ] Can I roll back if there's\
    \ a problem?\n- [ ] Are event consumers (other services) affected?\n\n## Relationship\
    \ to CQRS\n\nEvent Versioning is **independent of CQRS** but affects both sides:\n\
    - **Write model** - Must handle old events during reconstruction\n- **Read models**\
    \ - Projections may need to handle multiple event versions\n- **Integration**\
    \ - Events published to other systems need careful versioning\n\n## FOE Alignment\n\
    \nEvent Versioning supports **Understanding** by making schema evolution explicit\
    \ and manageable. Teams can reason about how their event schemas change over time\
    \ and plan for long-term maintenance.\n\nThe practice also provides **Confidence**\
    \ - knowing that old events can still be read and processed gives confidence to\
    \ evolve the domain model without fear of data loss or system breakage."
