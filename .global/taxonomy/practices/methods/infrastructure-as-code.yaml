apiVersion: katalyst.taxonomy/v2alpha
kind: method
metadata:
  name: "infrastructure-as-code"
  annotations:
    foe.source: "QDAS practices: DevOps - Strategy"
spec:
  title: "Infrastructure as code"
  pillar: "process"
  category: "automation"
  status: "active"
  definition: "Infrastructure is defined in code, and every environment is provisioned, changed and re-created from that code rather than by hand."
  rationale: "1. **Agility and speed.** Automation replaces manual, error-prone steps: resources are provisioned,\n   deployed and updated quickly and the same way every time.\n2. **Consistency and reproducibility.** The code is a record of the desired state; environments can\n   be re-created across stages without configuration drift.\n3. **Collaboration and version control.** Changes are tracked, reviewed and rolled back like any\n   other code.\n4. **Scalability and flexibility.** Adding capacity or replicating an environment is a code change.\n5. **Risk mitigation and compliance.** Fewer human errors, and security and compliance rules\n   applied the same way everywhere.\n6. **Cost optimisation.** Resources can be right-sized, and unnecessary ones found and removed.\n7. **Continuous delivery.** Infrastructure changes go through the same pipelines as application\n   changes: tested, delivered quickly, with minimal disruption.\n"
  description: "Define infrastructure in code, versioned and reviewed, and provision every environment from it."
  owners:
    - "aaron.west@esimplicity.com"
