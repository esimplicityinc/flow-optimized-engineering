spec:
  title: "Definitive Deployment Pipeline"
  status: "industry-standard"
  definition: "> \"The deployment pipeline is the sole mechanism by which changes make their way into production. Every change — whether to code, configuration, infrastructure, or database — must go through the same automated process.\"\n>\n> — Jez Humble, *Continuous Delivery*"
  body: "**Pillar:** Patterns\n\nA definitive deployment pipeline is both the **sole path to production** and the **verification authority** that determines whether the system is healthy after deployment. It is not just automation — it is the single source of truth for what reaches production and whether it works.\n\nWhere [Deployment Pipeline](./M112-deployment-pipeline) describes the structure and stages of an automated build-test-deploy process, this method describes the *standard* that pipeline must meet: every change, without exception, passes through the same automated process, and the pipeline itself confirms the deployment succeeded.\n\n## Why It Matters\n\n### Sole Path to Production\n\nNo manual deployments. No SSH into production. No skipping stages. No \"just this once.\"\n\nEvery change — code, configuration, infrastructure, database migration — enters production through the same automated process. This eliminates the class of incidents caused by ad-hoc changes that bypass testing, review, and audit:\n\n- **No special cases** — Emergency fixes go through the pipeline. If the pipeline is too slow for emergencies, fix the pipeline.\n- **Complete audit trail** — Every production change is traceable to a commit, a build, and a set of test results.\n- **Reproducibility** — Any deployment can be reproduced exactly, because the pipeline defines the process, not a person's memory.\n\n### Verification Authority\n\nThe pipeline doesn't just deploy — it determines whether the deployment is healthy. After pushing code to production, the pipeline runs automated verification: smoke tests, health checks, canary analysis, and SLO monitoring. If verification fails, the pipeline rolls back automatically.\n\nThis closes the loop. A pipeline that deploys but doesn't verify is only half the job. A definitive pipeline owns the full lifecycle: deploy, verify, and act on the result.\n\n## FOE Framing\n\n**Primary: Confidence to Act**\n\nTeams trust the pipeline because nothing bypasses it and it verifies everything works. When the pipeline is the sole authority, there are no surprises — no one pushed a hotfix at 2 AM that nobody knows about, no configuration was changed manually and forgotten. The pipeline's green status means production is in a known, verified state. This trust compounds: teams deploy more often because they know the system will catch problems and roll back automatically.\n\n**Secondary: Fast Feedback Loops**\n\nPost-deployment verification creates a closed feedback loop: deploy, verify, act. Teams learn within minutes whether a deployment is healthy, not hours later when a customer reports a problem. Automatic rollback means the feedback loop includes the corrective action — the system heals itself without waiting for a human to notice.\n\n## How It Works\n\n### Pre-Deployment Gates\n\nBefore code reaches production, the pipeline enforces automated gates:\n\n1. **Automated tests** — Unit, integration, and acceptance tests must pass. No manual overrides.\n2. **Security scans** — Static analysis, dependency vulnerability checks, and container image scanning.\n3. **Compliance checks** — Policy-as-code validates that changes meet organizational requirements.\n4. **Artifact integrity** — The exact artifact that passed testing is the artifact that deploys. No rebuilding.\n\n### Post-Deployment Verification\n\nAfter deployment, the pipeline confirms the system is healthy:\n\n1. **Smoke tests** — Critical user journeys execute against the live deployment.\n2. **Health checks** — Application and infrastructure health endpoints return expected results.\n3. **Canary analysis** — Compare error rates, latency, and resource usage between the new version and the baseline.\n4. **SLO monitoring** — Verify that error budgets remain within acceptable thresholds.\n\n### Automatic Rollback\n\nWhen post-deployment verification fails, the pipeline rolls back without human intervention. The rollback itself is verified — the pipeline confirms the previous version is healthy after reverting.\n\n### SLO/Error Budget-Driven Decisions\n\nMature pipelines use error budgets to govern deployment velocity. When the error budget is healthy, deployments proceed automatically. When the budget is exhausted, the pipeline can pause deployments until reliability recovers. This replaces subjective \"is it safe to deploy?\" decisions with objective, data-driven ones.\n\n### Why Manual Approval Boards Are Anti-Patterns\n\nChange Advisory Boards (CABs) and manual approval gates slow delivery without improving outcomes. The DORA research in *Accelerate* found that external approval processes are negatively correlated with lead time and deployment frequency, with no improvement in change failure rate. The definitive pipeline replaces human gatekeeping with automated verification — faster, more consistent, and always awake.\n\n## Cautionary Example: Knight Capital\n\nOn August 1, 2012, Knight Capital Group deployed new trading software to production using a manual process that bypassed their normal controls. An operator failed to update one of eight servers. The old code on that server interacted with the new code on the other seven, generating millions of erroneous trades. In 45 minutes, Knight Capital lost $440 million.\n\nThere was no automated deployment process to ensure consistency. There was no post-deployment verification to detect the misconfigured server. A definitive deployment pipeline — one that deployed all servers identically and verified the result — would have prevented the failure or caught it in seconds.\n\n## Relationship to DORA Metrics\n\nAll four DORA metrics depend on a definitive pipeline:\n\n| DORA Metric | How a Definitive Pipeline Helps |\n|-------------|-------------------------------|\n| **Deployment Frequency** | When the pipeline is trusted and fast, teams deploy more often |\n| **Lead Time for Changes** | No manual approvals or ad-hoc processes slow the path to production |\n| **Change Failure Rate** | Pre-deployment gates and post-deployment verification catch failures |\n| **Time to Restore Service** | Automatic rollback restores service without waiting for human response |\n\n## Relationship to Other Methods\n\n- **[Deployment Pipeline](./M112-deployment-pipeline)** — Describes the structure and stages of an automated pipeline. This method adds the requirement that the pipeline is *definitive*: the only path to production and the verification authority.\n- **[Blue-Green Deployment](./M102-blue-green-deployment)** — A deployment strategy the definitive pipeline can use, with built-in rollback capability.\n- **[Canary Release](./M104-canary-release)** — Provides the post-deployment verification data the pipeline uses to decide whether to proceed or roll back.\n- **[Feature Flags](./M125-feature-flags)** — Enable deploying code through the pipeline without releasing it to users, reducing the blast radius of any deployment.\n- **[Decouple Deployment from Release](./M249-decouple-deployment-from-release)** — The definitive pipeline handles the deployment side; feature flags and progressive delivery handle the release side.\n- **[Infrastructure as Code](./M128-infrastructure-as-code)** — Infrastructure changes go through the same pipeline as application code — no exceptions.\n- **[Trunk-Based Development](./M140-trunk-based-development)** — Every commit to trunk triggers the pipeline, keeping the path to production short and well-exercised.\n\n## Citations\n\n- Humble, J., & Farley, D. (2010). *Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation*. Addison-Wesley.\n- Forsgren, N., Humble, J., & Kim, G. (2018). *Accelerate: The Science of Lean Software and DevOps*. IT Revolution Press.\n- Beyer, B., Jones, C., Petoff, J., & Murphy, N. R. (2016). *Site Reliability Engineering: How Google Runs Production Systems*. O'Reilly Media.\n- U.S. Securities and Exchange Commission. (2013). [In the Matter of Knight Capital Americas LLC](https://www.sec.gov/litigation/admin/2013/34-70694.pdf). Administrative Proceeding File No. 3-15570."
  description: "The pipeline as sole path to production and verification authority — no bypasses, no exceptions, and automated post-deployment health confirmation."
  owners:
