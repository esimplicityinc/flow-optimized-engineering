apiVersion: katalyst.taxonomy/v2alpha
kind: method
metadata:
  name: shared-iac-modules
  annotations:
    foe.source: 'QDAS practices: DevOps - Strategy'
spec:
  title: Shared infrastructure modules
  pillar: process
  category: inner-source
  status: active
  definition: 'A module is a part of infrastructure code that many teams can use again.
    Make infrastructure from a shared library of tested modules. The teams that use
    the modules also keep them correct. This is inner source: teams share code inside
    the organisation as in an open-source project.'
  rationale: '1. **Faster development.** Modules that are ready, and that you can
    adjust, save time and effort.

    2. **Reliability.** Strict tests and real deployments tested the modules. Thus,
    they prevent usual errors and cause less downtime.

    3. **Shared knowledge.** Inner source gives reviews from other teams and continuous
    improvement. It shares the knowledge of the team.

    4. **Scale.** The modules already operate in many conditions. They are ready for
    the next condition.

    5. **Security and compliance.** Teams examined the modules for vulnerabilities
    and made them obey the standards. Each component that uses a module gets this
    work.

    '
  description: Make infrastructure from a shared library of tested modules. Do not
    write the infrastructure of each component from the start.
  owners:
  - aaron.west@esimplicity.com
  when_to_use: Use a shared module each time that one exists for the resource that
    you need. If none exists, make one and share it.
  body: '## Procedure


    1. Look in the shared module library for a module for the resource that you need.

    2. Use the module. Pin it to a stable version.

    3. If the module does not do what you need, change the module in the library.
    Do not copy it.

    4. If no module exists, write one, test it, and add it to the library.

    '
