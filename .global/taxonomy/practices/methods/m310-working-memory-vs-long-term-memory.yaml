spec:
  title: "Working Memory vs Long-Term Memory"
  when_to_use: "Use this method when:\n\n- Building agents that operate across multiple sessions or maintain context over time\n- Context window costs are a concern (filling the window with raw history is expensive)\n- Agent reasoning quality degrades as conversations grow longer (context window saturation)\n- Building multi-agent systems where memory isolation between agents matters"
  when_not_to_use: "Avoid this method when:\n\n- Building single-turn, stateless agents where memory architecture doesn't apply\n- The task scope is narrow enough that the context window never saturates"
  pitfalls: "1. **Over-stuffing the context window** — retrieving more than the window can handle thoughtfully. Budget allocations prevent this; enforce them.\n2. **Memory object proliferation** — creating a memory object for every micro-interaction creates a noisy, low-quality memory store. Consolidate aggressively (see M311 Consolidation Cycles).\n3. **Memory isolation failures** — in multi-user systems, memory objects from one user's session must not be retrievable by another user. Scope memory objects by user/session in metadata."
  definition: "An agent that tries to remember everything understands nothing. The context window is finite; flooding it with everything the agent might need guarantees that the most important information competes with noise for the model's attention."
  body: "Architect agent memory as three distinct tiers — context window (working memory), knowledge store (long-term memory), and synthesized cache (memory objects) — with explicit rules for what lives in each tier and how information moves between them.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nAn agent that tries to remember everything understands nothing. The context window is finite; flooding it with everything the agent might need guarantees that the most important information competes with noise for the model's attention.\n\nDrawing from von Neumann architecture, agent memory should be separated into three tiers:\n\n- **Context Window (RAM)** — the immediate information the agent is actively reasoning about. Fast, finite, expensive. Contains only what's needed for the current task.\n- **Knowledge Layer (Disk)** — the vast, persistent store of domain knowledge. Slow to access directly, but unlimited. Retrieved via the semantic layer (M303 Retriever Ensemble).\n- **Memory Objects (Cache)** — synthesized summaries of previous interactions and consolidated insights. Pre-computed, compact, high-density. Retrieved when a prior interaction or consolidated knowledge is relevant to the current task.\n\nThe key discipline is knowing what belongs in each tier and designing explicit flows between them.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Understand the context window limits of your chosen model\n- Decide on a storage backend for memory objects (vector DB, key-value store, or a dedicated memory system)\n- Define the \"unit of memory\" for your domain (session, project, entity, user)\n\n### Step 1: Define Tier Boundaries\n\nFor your specific agent, explicitly define what belongs in each tier:\n\n| Tier | Contents | Lifecycle | Access Pattern |\n|---|---|---|---|\n| Context Window | Current query, task instructions, retrieved chunks, immediate history | Per-turn | Direct (in prompt) |\n| Knowledge Layer | All domain documents, policies, data | Persistent | Via retrieval (M303) |\n| Memory Objects | Session summaries, user preferences, consolidated insights, learned patterns | Persistent, updated by consolidation | Via retrieval (by relevance) |\n\n### Step 2: Implement Context Window Budget Management\n\nAllocate the context window explicitly: X tokens for instructions, Y tokens for retrieved context, Z tokens for conversation history, W tokens for the response. When any allocation fills, apply a pruning strategy (summarize history, reduce retrieval K, etc.).\n\n### Step 3: Implement Memory Object Storage\n\nWhen interactions conclude (session end, task completion, periodic checkpoint), distill the interaction into a memory object: what was asked, what was found, what decisions were made, what was learned. Store as a retrievable artifact with appropriate metadata.\n\n### Step 4: Retrieve Memory Objects at Session Start\n\nAt the beginning of a new session or task, retrieve relevant memory objects alongside domain knowledge. A user returning to a project gets the session summary from their last interaction — they don't have to re-establish context.\n\n## Example\n\nWithout memory architecture:\nDay 1: User asks about vendor risk. Agent fetches 15 documents, fills context window, provides answer.\nDay 7: User follows up on vendor risk. Agent has no memory of Day 1. Fetches the same 15 documents again. Asks clarifying questions already answered on Day 1.\n\nWith memory architecture:\nDay 1: Agent processes query, stores memory object: \"User asked about DataFlow vendor risk. Key findings: three outstanding audit items, medium overall risk, next review due Q3. User's primary concern was the vendor's subcontractor exposure.\"\nDay 7: Memory object retrieved at session start. Agent immediately has Day 1 context. Follows up with updated information, not a fresh start.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Document your tier definitions and budget allocations\n2. Measure whether memory object retrieval reduced repeat-question rates\n3. Share what triggered memory object creation in your system"
  description: "Architect agent memory as three distinct tiers — context window (working memory), knowledge store (long-term memory), and synthesized cache (memory objects) — with explicit rules for what lives in each tier and how information moves between them."
