spec:
  title: "Semantic Observability"
  when_to_use: "Use this method when:\n\n- Deploying agents to production where output quality must be monitored continuously\n- Diagnosing retrieval or reasoning failures reported by users\n- Identifying systematic patterns in agent failures (e.g., consistently poor performance on a specific query type)\n- Building the production-to-eval pipeline (M320) — traces are the raw material for evals"
  when_not_to_use: "Avoid this method when:\n\n- Still in early prototyping where observability overhead isn't justified\n- Privacy constraints prohibit logging query content (design privacy-safe tracing with anonymization)"
  pitfalls: "1. **Logging everything, observing nothing** — traces without dashboards and alerting are archaeological data, not operational intelligence. Build the dashboards.\n2. **Privacy leaks in traces** — logging raw query text may expose PII or confidential information. Design a privacy policy for trace data before instrumenting production.\n3. **Span granularity mismatch** — spans that are too coarse miss the detail needed for diagnosis; spans that are too fine create noise. Start with the 5 core spans (query, retrieval, rerank, reason, gate) and add detail where investigation reveals gaps."
  definition: "A semantic layer failure is rarely visible at the surface. The agent produces an answer that looks plausible. But beneath the surface, it retrieved 20 chunks and used 2. It cited a document that was 18 months old. It produced an answer that contradicts the most authoritative source because that source was ranked 11th in the retrieved set."
  body: "Instrument the agent's retrieval-reasoning chain with distributed tracing so that every span of a request — query, retrieval, re-ranking, reasoning, output — is logged, attributable, and analyzable for semantic failures.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nA semantic layer failure is rarely visible at the surface. The agent produces an answer that looks plausible. But beneath the surface, it retrieved 20 chunks and used 2. It cited a document that was 18 months old. It produced an answer that contradicts the most authoritative source because that source was ranked 11th in the retrieved set.\n\nWithout observability, these failures are invisible until a user reports a bad decision. With observability, they are detectable, measurable, and correctable before they cause harm.\n\nSemantic observability applies distributed tracing — the same technique used to debug microservices — to the retrieval-reasoning pipeline. Each logical step is a span: query preprocessing, retrieval, re-ranking, context assembly, LLM reasoning, output validation, gate decisions. Every span is logged with timing, inputs, outputs, and key metrics.\n\nThis creates the forensic evidence needed to diagnose exactly where meaning breaks down.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Choose an observability platform: LangSmith, Arize Phoenix, Braintrust, or a general APM tool with custom spans\n- Instrument your retrieval and LLM calls with the platform's SDK\n- Define what metadata to capture at each span (query, retrieved chunk IDs, scores, gate decisions, latency)\n\n### Step 1: Instrument the Retrieval Span\n\nFor each retrieval call, log:\n- Query text (or anonymized hash for privacy)\n- Retrieval mode (semantic, lexical, graph)\n- Retrieved chunk IDs and relevance scores\n- Context contract metadata for each chunk (authority, recency)\n- Retrieval latency\n\n### Step 2: Instrument the Reasoning Span\n\nFor each LLM call, log:\n- Model and version\n- Token counts (prompt and completion)\n- Context window utilization percentage\n- Citations produced by the model\n- Reasoning latency\n\n### Step 3: Instrument Gate Decisions\n\nFor each quality gate (M317), log:\n- Gate type and input artifact\n- Pass/fail decision and score\n- Action taken on failure (retry, reset, hard fail)\n- Gate latency\n\n### Step 4: Build Dashboards for Semantic Health\n\nAggregate traces into operational dashboards:\n- **Over-fetching detector**: queries where context window utilization > 80% but faithfulness < 0.7 (retrieving a lot, using little)\n- **Precision degradation**: queries where fewer than 50% of retrieved chunks appear in the agent's citations\n- **Stale context alerts**: queries where retrieved chunks have recency scores below threshold\n- **Gate failure rates**: which gates fail most often, and on which query types\n\n### Step 5: Use Traces for Failure Investigation\n\nWhen a user reports a bad answer, retrieve the trace for that request. Walk the spans:\n1. What was retrieved? Were the right documents included?\n2. What was the context precision score? Was there noise?\n3. Did any gates fire? What actions were taken?\n4. What did the model actually use from the context?\n\nThis forensic capability transforms debugging from \"the AI gave a wrong answer\" to \"retrieval ranked the 2019 policy above the 2023 amendment because the recency gate wasn't enforced on this query path.\"\n\n## Example\n\nTrace analysis reveals: the agent is consistently retrieving 15 chunks but only citing 2-3 in its answers. Context window utilization is at 94%, but faithfulness scores are 0.71 — well below target.\n\nDiagnosis: over-fetching. The agent is overwhelmed by context volume and producing partially hallucinated answers to fill in what it can't synthesize.\n\nIntervention: reduce K from 15 to 6, add a re-ranker to improve precision, increase relevance gate threshold from 0.5 to 0.65.\n\nResult: faithfulness improves to 0.89, latency decreases by 30% (fewer tokens to process), and user-reported answer quality improves.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Document which observability platform you used and what custom spans you added\n2. Share the over-fetching patterns you found and how you addressed them\n3. Measure how often trace-driven diagnosis correctly identified the root cause of a reported failure"
  description: "Instrument the agent's retrieval-reasoning chain with distributed tracing so that every span of a request — query, retrieval, re-ranking, reasoning, output — is logged, attributable, and analyzable for semantic failures."
