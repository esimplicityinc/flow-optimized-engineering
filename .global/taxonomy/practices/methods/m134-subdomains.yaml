spec:
  title: "Subdomains"
  category: "strategic-design"
  definition: "> A portion of the domain, typically reflecting some organizational structure. A subdomain may encompass many bounded contexts.\n>\n> — Eric Evans, DDD Reference"
  pitfalls: "- **Treating everything as core** - Leads to over-investment and slow delivery\n- **Misidentifying core domains** - Building commodity solutions for differentiating capabilities\n- **Ignoring supporting domains** - They still need adequate attention\n- **Static classification** - Subdomain types can change as business strategy evolves"
  body: "**Pillar:** Strategic Design\n\nSubdomains are a way of categorizing different areas of a domain by their strategic importance to the business. This classification helps teams decide where to invest their modeling effort and what level of sophistication is appropriate for each area.\n\n## Types of Subdomains\n\n| Type | Description | Investment Level | Example |\n|------|-------------|------------------|---------|\n| **Core** | Competitive advantage, what makes you unique | High - custom development, deep modeling | Recommendation algorithm for Netflix |\n| **Supporting** | Necessary but not differentiating | Medium - custom but simpler | User profile management |\n| **Generic** | Commodity, same for everyone | Low - buy or use standard solutions | Email sending, payment processing |\n\n## Why It Matters\n\nSubdomain classification is essential because:\n\n- **Focuses investment** - Put your best developers and deepest modeling on core domains\n- **Avoids over-engineering** - Generic subdomains don't need sophisticated models\n- **Guides build vs. buy decisions** - Generic subdomains are candidates for third-party solutions\n- **Clarifies priorities** - When resources are limited, core domains come first\n- **Aligns with business strategy** - Technical investment matches business value\n\n## How to Identify Subdomain Types\n\n**Core Domain indicators:**\n- This is why customers choose you over competitors\n- Significant business investment in this area\n- Frequent changes driven by business strategy\n- Deep domain expertise required\n\n**Supporting Domain indicators:**\n- Necessary for the core domain to function\n- Could theoretically be outsourced\n- Changes less frequently than core\n- Important but not differentiating\n\n**Generic Domain indicators:**\n- Same solution would work for any company\n- Well-understood problem with existing solutions\n- Rarely changes\n- No competitive advantage from custom implementation\n\n## Example Classification\n\nFor an e-commerce company:\n\n| Subdomain | Type | Rationale |\n|-----------|------|-----------|\n| Product Recommendations | Core | Differentiates from competitors |\n| Inventory Management | Supporting | Necessary but not unique |\n| Order Processing | Supporting | Important but standard patterns |\n| Payment Processing | Generic | Use Stripe, not custom |\n| Email Notifications | Generic | Use SendGrid, not custom |\n\n## Relationship to Other Patterns\n\n- **Bounded Context** - A subdomain may contain one or more bounded contexts\n- **Context Mapping** - Relationships often differ by subdomain type\n- **Ubiquitous Language** - Core domains need the richest language\n\n## FOE Alignment\n\nSubdomains support **Optimize for Understanding** by helping teams focus their attention. By classifying domains, teams know where deep understanding is essential (core) versus where standard patterns suffice (generic). This focus prevents cognitive overload and ensures modeling effort creates maximum business value."
  description: "Categorizing domain areas by strategic importance to focus modeling effort."
  owners:
