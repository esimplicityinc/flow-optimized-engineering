spec:
  title: "Retriever Ensemble"
  when_to_use: "Use this method when:\n\n- Queries span multiple types of information (facts, identifiers, relationships)\n- The domain contains regulated content where exact-match accuracy is mandatory\n- Users ask questions that may or may not use canonical terminology\n- Retrieval failures are consequential (compliance, financial decisions, medical information)"
  when_not_to_use: "Avoid this method when:\n\n- The domain is so narrow that one retrieval mode demonstrably covers all query types\n- Latency constraints make multi-mode retrieval impractical (optimize later once quality is validated)\n- You don't yet have the infrastructure for more than one retrieval mode — start with the most important one for your domain"
  pitfalls: "1. **Equal weighting across modes** — semantic similarity scores and BM25 scores are not directly comparable. Normalize scores before merging or use rank-based fusion (Reciprocal Rank Fusion is a common approach).\n2. **Missing deduplication** — the same document may be returned by multiple modes. Without deduplication, it inflates the context window.\n3. **Ignoring query type signals** — running the full ensemble for every query wastes resources. Route simple identifier lookups to lexical only; save the full ensemble for complex queries."
  definition: "A single search method is a single point of failure. Semantic vector search finds intent but misses exact identifiers. Lexical search finds exact terms but misses paraphrases. Graph traversal finds relationships but requires entities to already be resolved."
  body: "Combine multiple retrieval strategies — semantic, lexical, and graph-based — into a unified retrieval pipeline so that no single mode's blind spots become system failures.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nA single search method is a single point of failure. Semantic vector search finds intent but misses exact identifiers. Lexical search finds exact terms but misses paraphrases. Graph traversal finds relationships but requires entities to already be resolved.\n\nThe Retriever Ensemble pattern treats retrieval as a pipeline, not a lookup. Each retrieval mode is a specialist that covers different ground. The ensemble combines their outputs, applies context contracts (M300) to weight results, and delivers a richer, more reliable context package than any single method could.\n\nThis is the architectural pattern that makes the difference between a RAG system that works in demos and one that works in production. Real enterprise queries — \"What are the downstream effects of changing our pricing model?\" — require all three retrieval modes to answer reliably.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Have at least two retrieval modes available (vector DB + keyword search is a common starting point)\n- Understand which query types are most critical for your domain\n- Have context contracts (M300) in place so retrieved results can be weighted by authority\n\n### Step 1: Categorize Query Types\n\nAnalyze the queries your system will face and assign them to retrieval mode strengths:\n- **Intent-based queries** (\"what do we think about X?\") → semantic vector\n- **Identifier-based queries** (\"what is the status of contract #A-2026-0042?\") → lexical\n- **Relational queries** (\"what projects does this vendor touch?\") → graph\n\n### Step 2: Run Retrieval Modes in Parallel\n\nIssue the query to all active retrieval modes simultaneously. Don't chain them sequentially — parallel execution is faster and avoids mode-ordering bias.\n\n### Step 3: Merge and Deduplicate Results\n\nCombine results from all modes. Deduplicate by document/chunk identity (not by text similarity). Assign a composite relevance score that weights each mode's contribution based on query type signals.\n\n### Step 4: Apply Context Contract Weighting\n\nBefore presenting results to the LLM, apply context contract (M300) weighting: boost recent, authoritative content; suppress superseded or restricted content for the requesting scope.\n\n### Step 5: Trim to Context Budget\n\nSelect the highest-weighted results that fit within the available context window. Log what was included and excluded for observability.\n\n## Example\n\nQuery: \"Is the vendor DataFlow Inc. compliant with our 2025 security standards?\"\n\n- **Semantic search** finds: general vendor assessment documents mentioning DataFlow in context, security evaluation frameworks\n- **Lexical search** finds: exact contract references \"DataFlow Inc. MSA-2024-0089\", the specific security standard document \"SEC-STD-2025-v2\"\n- **Graph traversal** finds: DataFlow Inc. node → linked compliance assessment → linked audit findings → linked remediation tickets\n\nThe ensemble delivers a complete picture: the contract, the standard, the assessment results, and the outstanding remediation items. Any single mode would have missed critical pieces.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Measure retrieval quality with a single mode vs. the ensemble on your actual query distribution\n2. Document which mode contributed the most critical context for each query type\n3. Share your rank fusion implementation approach"
  description: "Combine multiple retrieval strategies — semantic, lexical, and graph-based — into a unified retrieval pipeline so that no single mode's blind spots become system failures."
