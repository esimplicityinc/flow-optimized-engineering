apiVersion: katalyst.taxonomy/v2alpha
kind: method
metadata:
  name: "insight-areas"
  annotations:
    foe.source: "QDAS practices: Observability Framework"
spec:
  title: "Insight areas"
  pillar: "framework"
  category: "observability"
  status: "active"
  definition: "Insight areas are the areas of a system that need to be monitored."
  body: "| Insight area | What it covers | Examples |\n|---|---|---|\n| Infrastructure | The compute, storage and network resources an application runs on | Virtual machines, container clusters, databases, block and file storage, load balancers |\n| Application | The application's own metrics and health | APM metrics, service status, custom application metrics |\n| User experience | The system as an end user experiences it | Page load, journey success, synthetic checks |\n\nEach insight area is measured with [indicators](indicators). For example, per resource:\n\n| Resource | Availability/status | Performance/health | Capacity | Usage |\n|---|---|---|---|---|\n| Virtual machine | Status check | Synthetic ping latency | CPU %, memory % | |\n| Block storage | | Average read and write latency | | Read and write operations |\n| File storage | | Read and write round-trip time | Throughput utilisation | Client connections, filesystem size |\n"
  description: "The parts of a system that need to be monitored: infrastructure, application, and user experience."
  owners:
    - "aaron.west@esimplicity.com"
