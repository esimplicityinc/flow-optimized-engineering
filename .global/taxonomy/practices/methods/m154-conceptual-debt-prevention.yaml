spec:
  title: "Conceptual Debt Prevention"
  when_to_use: "- Adopting an emerging or unfamiliar protocol (MCP, gRPC, GraphQL federation)\n- Integrating AI coding tools into team workflows\n- Forking or depending on a large OSS codebase\n- Building architecture that depends on technology assumptions about isolation, state, or identity\n- Evaluating AI tool productivity claims where perception may diverge from measurement"
  when_not_to_use: "- Using mature, well-documented technologies the team already understands\n- Prototyping or spiking where no architectural decisions are being committed\n- The technology is a thin wrapper with no meaningful conceptual model\n- The team has deep prior experience with the specific technology"
  pitfalls: "1. **Confusing API familiarity with model understanding.** Being able to make calls does not mean you understand the technology's assumptions. The test: could you explain *why* it is designed this way?\n\n2. **Skipping this under velocity pressure.** The Prima observation shows the time \"saved\" gets consumed by debugging and hotfixes. Seven production bugs on day one is not velocity -- it is conceptual debt coming due.\n\n3. **Trusting subjective comprehension.** Developers in the METR study were confident they were faster. They were not. Use objective verification, not feelings.\n\n4. **Assuming documentation is complete.** Emerging protocols often have gaps. Budget time to discover the model through experimentation, not just reading."
  definition: "When teams adopt a new technology -- a protocol, framework, AI tool, or OSS codebase -- they tend to learn the API and start building. They skip the harder question: *how does this technology think about the world?* What does it assume about isolation, state, identity, and boundaries?"
  body: "Teams accumulate *conceptual debt* when they adopt technologies without understanding their underlying models. Like technical debt, conceptual debt compounds -- each misunderstanding produces architectural decisions that produce bugs that produce hotfixes that produce more complexity. Unlike technical debt, conceptual debt is psychologically invisible: you feel like you understand while your assumptions silently diverge from reality.\n\n:::tip Validated\nThis method has been validated through 6 independent observations from diverse sources including academic research, industry reports, and practitioner data.\n:::\n\n## Overview\n\nWhen teams adopt a new technology -- a protocol, framework, AI tool, or OSS codebase -- they tend to learn the API and start building. They skip the harder question: *how does this technology think about the world?* What does it assume about isolation, state, identity, and boundaries?\n\nThis gap between what you think you understand and what you actually understand is conceptual debt. It has a higher interest rate than technical debt because it corrupts your ability to interpret feedback. A failing test tells you something is wrong; a conceptual misunderstanding tells you everything is fine until production proves otherwise.\n\nThe Prima team demonstrated this pattern when they adopted MCP without understanding its workspace isolation model. They learned the API -- how to make MCP calls -- but missed the protocol's assumptions about what can cross workspace boundaries. The result was Issue #156: headers leaking between workspaces, a security vulnerability that required emergency fixes. The team later reflected: \"The main limitation was understanding and lack of confidence, not technical capability.\"\n\nThe same pattern appears at larger scales. The METR study found developers estimated they were 20% faster with AI but measured 19% slower -- a 40% perception-reality gap that Rachel Thomas connected to \"dark flow,\" a state of absorbed engagement that feels productive while creating shallow comprehension. At the organizational level, Fortune's analysis of AI adoption mirrors Solow's productivity paradox: tools are visible everywhere but not in the productivity statistics, because organizations adopt tools without restructuring around them.\n\nConceptual Debt Prevention inverts the pattern: understand the technology's model before depending on it, verify that understanding through objective mechanisms, and restructure your work around what you learn.\n\n## How It Works\n\n### Step 1: Map the Conceptual Model Before Using the API\n\nBefore writing code that depends on a technology, document your understanding of its conceptual model -- not its API. Answer these questions:\n\n- **What are the core abstractions?** (For MCP: workspaces, isolation boundaries, tool registrations)\n- **What assumptions does it make about state, identity, and boundaries?** (What can cross a workspace boundary? Who owns session state?)\n- **How does it expect errors to be handled?**\n\nIf you cannot articulate these answers, you do not yet understand the model.\n\nThe Prima team learned MCP's API but not its workspace isolation model, which led directly to the header leakage security incident (O102). In contrast, Anthropic's research found that Opus's surgical git-first investigation strategy -- building understanding incrementally rather than dumping everything into context -- was 15x more efficient than brute-force approaches (O214). The principle is the same whether the learner is human or machine: understanding should guide investigation, not volume.\n\n### Step 2: Verify Understanding Through Objective Mechanisms\n\nDo not trust subjective feelings of comprehension. The METR study showed a 40% gap between perceived and actual productivity (O212). Dark flow -- absorbed engagement that feels like understanding -- actively masks conceptual debt.\n\nVerify your understanding through:\n\n- **Spike tests** that exercise your assumptions about boundaries. Build a minimal prototype that tests specifically what you think the technology isolates, shares, and restricts.\n- **Explain-to-a-teammate sessions.** If you cannot explain *why* the technology is designed a certain way (not just *how* to call it), your understanding is shallow.\n- **Measurable outcomes.** Tests passing, tasks completing, time tracking. \"It works on my machine\" is not verification -- for the Prima team, it masked the fact that no one understood the full system well enough to specify what \"working\" meant (O102).\n\n### Step 3: Build Understanding Incrementally\n\nUnderstanding develops through progressive calibration, not a single upfront study session.\n\nAnthropic's empirical study of millions of agent interactions found that experienced users shift from approval-based to interrupt-based oversight (O210). They auto-approve more (40% vs 20%) but also interrupt more (9% vs 5%) -- they have built a mental model of *when* intervention matters. New users lack this model and must develop it through staged exposure.\n\nApply the same principle to technology adoption:\n\n- **Start with constrained use.** Limit your dependency on the technology to a narrow, well-understood scope.\n- **Expand scope as understanding deepens.** Let demonstrated comprehension -- verified through Step 2 -- drive expansion, not schedule pressure.\n- **Let understanding guide investigation, not volume.** Read documentation surgically. A targeted question about isolation boundaries teaches more than reading the entire API reference.\n\n### Step 4: Restructure Workflows Around the Technology's Model\n\nDo not layer new technology on existing workflows. Adapt your processes to match the technology's conceptual model.\n\nThe original Solow productivity paradox lasted roughly 15 years. It resolved when organizations restructured around computers, not when computers got better (O216). IBM tripled its entry-level hiring after discovering that AI adoption alone did not produce the expected gains. The historical parallel suggests the same resolution applies: productivity comes from understanding how to restructure around new tools, not from the tools themselves.\n\nConcretely:\n\n- **Distribute understanding across the team.** If only 2-3 people understand the system, that concentrated knowledge is a reliability risk (O102). Document your model understanding as a team reference.\n- **Change your processes to reflect the technology's model.** If the technology assumes workspace isolation, your deployment process should enforce it. If it assumes statelessness, your architecture should not smuggle state through side channels.\n- **Accept that restructuring takes time.** The Solow paradox was not resolved by impatience. Budget time for organizational learning alongside technical adoption.\n\n## Example\n\nThe Prima team adopted MCP for integrating their AI platform components. They learned the API but not the protocol's workspace isolation model.\n\n**What they missed:** MCP workspaces have isolation boundaries. Headers and tokens should not leak between workspaces.\n\n**What happened:** Issue #156 -- \"Hotfix: Stop token/workspace inheritance in MCP hypervisor to prevent header leakage.\" A security vulnerability that required emergency fixes on the first day of production, alongside 6 other bugs.\n\n**What conceptual debt prevention would have looked like:**\n\n1. Before integrating MCP, document: \"What is a workspace? What can cross workspace boundaries? What does isolation mean in this protocol?\"\n2. Build a spike that tests workspace isolation specifically -- try to pass a header from one workspace to another and confirm it fails.\n3. Have two team members independently explain their understanding of MCP's isolation model. Where their explanations diverge, investigate.\n4. Structure the integration to enforce the isolation model the protocol assumes, rather than layering MCP on top of existing shared-state patterns.\n\n## How You Can Help\n\nIf you are testing this method:\n\n1. Review the steps above and try them when adopting a new technology\n2. Document what you learned about the technology's model that was not obvious from the API\n3. Note whether the perception-reality gap (dark flow) appeared in your experience\n4. Share your observation -- especially whether the time invested in understanding paid off"
  description: "Teams accumulate *conceptual debt* when they adopt technologies without understanding their underlying models. Like technical debt, conceptual debt compounds -- each misunderstanding produces architectural decisions that produce bugs that produce hotfixes that produce more complexity. Unlike technical debt, conceptual debt is psychologically invisible: you feel like you understand while your assumptions silently diverge from reality."
