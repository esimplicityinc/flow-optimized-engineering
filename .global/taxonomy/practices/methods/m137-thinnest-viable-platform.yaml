spec:
  title: "Thinnest Viable Platform"
  status: "well-established"
  definition: "> \"A 'thinnest viable platform' is a platform that is 'just enough' to accelerate and simplify software delivery for teams building on the platform.\"\n>\n> — Skelton & Pais, Team Topologies"
  when_to_use: "- **Platform design** - Deciding what capabilities to build\n- **Platform evolution** - Evaluating whether to add new features\n- **Platform evaluation** - Assessing if existing platform is too complex\n- **Buy vs. build** - Deciding whether to adopt external services\n- **Deprecation decisions** - Identifying capabilities to remove"
  body: "**Pillar:** Core Concepts\n\nThe Thinnest Viable Platform (TVP) is a principle for platform design: create platforms that provide just enough capability to accelerate stream-aligned teams without unnecessary complexity. A good platform should make teams move faster, not generate more dependencies to manage.\n\n## Why It Matters\n\nThe Thinnest Viable Platform principle matters because:\n\n- **Platforms grow** - Without discipline, platforms become bloated complexity monsters\n- **Adoption barriers** - Complex platforms are hard to adopt and use\n- **Maintenance burden** - More features means more maintenance for platform teams\n- **Cognitive load** - Complex platforms increase consumer cognitive load\n- **Opportunity cost** - Building unnecessary features delays valuable ones\n\n## FOE Framing\n\n**Primary: Fast Feedback Loops**\n\nThin platforms enable faster feedback by reducing adoption friction and complexity. Stream-aligned teams can start using the platform quickly without lengthy onboarding. Platform teams can iterate faster on smaller, focused capabilities.\n\n**Secondary: Confidence to Act**\n\nSimpler platforms are more reliable and easier to understand. Teams have confidence using them because there's less that can go wrong. Platform teams have confidence maintaining them because the scope is manageable.\n\n## How It Works\n\n### TVP Design Principles\n\n1. **Start with nothing** - Only add capabilities when clearly needed\n2. **Prove demand** - Require evidence that teams need a capability\n3. **Prefer external** - Use managed services over building when possible\n4. **Self-service first** - If it can't be self-service, question if it's needed\n5. **Measure adoption** - Track what's actually used, deprecate what isn't\n\n### What's \"Viable\"?\n\nA platform is viable when it provides clear value to consuming teams:\n\n| Viable | Not Viable |\n|--------|------------|\n| Reduces team cognitive load | Adds complexity teams must understand |\n| Enables self-service | Requires platform team involvement |\n| Accelerates delivery | Slows teams down with overhead |\n| Has clear documentation | Requires tribal knowledge |\n| Solves real problems | Solves hypothetical future problems |\n\n### TVP Evolution\n\n1. **Start small** - Begin with minimal capabilities\n2. **Listen to consumers** - Understand actual needs\n3. **Add incrementally** - One capability at a time\n4. **Validate adoption** - Ensure new capabilities are used\n5. **Prune regularly** - Remove underused capabilities\n\n### Anti-Patterns\n\n- **Platform empire** - Building capabilities because you can, not because they're needed\n- **Premature platforming** - Building platform before demand exists\n- **Feature creep** - Continuously adding without removing\n- **Not-invented-here** - Building when good external options exist\n- **Ignoring DX** - Complex interfaces that slow consumers down\n\n## Relationship to Other Methods\n\n- **Platform Team** - The team responsible for implementing TVP\n- **Stream-Aligned Team** - Primary consumers who define \"viable\"\n- **X-as-a-Service Mode** - How platform capabilities are delivered\n- **Team Cognitive Load** - TVP reduces cognitive load on consumers\n- **Service Boundary Extraction (FOE)** - May add to platform when justified\n\n## TVP Assessment Questions\n\nWhen evaluating whether to add a capability:\n\n1. Is there demonstrated demand from multiple teams?\n2. Will teams self-serve, or will they need platform team help?\n3. Does a managed service exist that could meet this need?\n4. Does this reduce or increase cognitive load for consumers?\n5. Can we measure whether this capability is used?\n\n## Citations\n\n- Skelton, M., & Pais, M. (2019). *Team Topologies: Organizing Business and Technology Teams for Fast Flow*. IT Revolution Press.\n- [Team Topologies Key Concepts](https://teamtopologies.com/key-concepts)"
  description: "Creating platforms with just enough capability without unnecessary complexity."
