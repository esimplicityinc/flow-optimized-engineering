spec:
  title: "Semantic Operating Model"
  when_to_use: "Use this method when:\n\n- Building agents that must answer questions requiring cross-domain reasoning (\"what are all the risks to this project?\" requires joining projects, risks, controls, and evidence)\n- Deploying agents that take actions with organizational consequences (approvals, assignments, notifications)\n- Operating in regulated environments where authority, evidence, and responsibility must be traceable\n- Building a knowledge layer that must improve over time — the operating model provides the stable semantic backbone"
  when_not_to_use: "Avoid this method when:\n\n- The use case is narrow enough that a flat document corpus is sufficient\n- The organization doesn't yet have shared definitions of its core entities — build the taxonomy first (M308)\n- The operating model scope is so large that it becomes an indefinite infrastructure project — scope to a specific domain first"
  pitfalls: "1. **Model as documentation project** — an operating model that lives in a spreadsheet that no one updates is not a semantic operating model. It must be queryable, maintained by integration, and used by agents.\n2. **Over-modeling upfront** — attempting to model the entire organization before deploying any agents. Scope to a single domain, validate the model with real agent queries, then expand.\n3. **Static authority model** — authority structures change. An outdated authority model that grants or denies actions based on old org charts is worse than no authority model. Build authority model updates into org change processes."
  definition: "The central failure of first-generation enterprise AI is treating organizational intelligence as a retrieval problem. The organization's knowledge is not in its documents. It is in the relationships between things: who owns what, what controls what risk, what evidence satisfies what requirement, what authority governs what action."
  body: "Build a formal model of the organization's actors, systems, datasets, controls, risks, and authorities before deploying agents — transforming scattered data into a computable world model that agents can reason against rather than search through.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nThe central failure of first-generation enterprise AI is treating organizational intelligence as a retrieval problem. The organization's knowledge is not in its documents. It is in the relationships between things: who owns what, what controls what risk, what evidence satisfies what requirement, what authority governs what action.\n\nClassic RAG says: \"Here are some relevant chunks.\"\n\nA Semantic Operating Model says: \"Here is what this organization believes exists, how those things relate, who is responsible for them, what rules apply to them, and what evidence supports action.\"\n\nThe difference is the difference between a search engine and a colleague who understands the business.\n\nBuilding a semantic operating model means explicitly modeling:\n\n- **Actors**: teams, roles, individuals, agents — who does things\n- **Systems**: applications, services, platforms — what runs\n- **Datasets**: data products, tables, feeds, APIs — what data exists and what it represents\n- **Controls**: policies, procedures, access rules — what governs behavior\n- **Risks**: threats, vulnerabilities, liabilities — what can go wrong\n- **Evidence**: artifacts, reports, attestations — what demonstrates compliance or quality\n- **Authorities**: decision rights, approval chains, delegations — who can authorize what\n\nThis model is not a document. It is a queryable, computable artifact that agents traverse when answering questions and planning actions.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Have taxonomy anchoring (M308) in place — entity definitions are the raw material\n- Identify the domain to model first (a specific business unit, program, or process)\n- Identify the key question types agents will need to answer in that domain\n\n### Step 1: Identify the Entity Classes\n\nFor the target domain, enumerate the entity classes that matter:\n- What are the things that exist? (datasets, systems, teams, projects, policies)\n- What are the relationships between them? (owns, governs, depends-on, produces, satisfies)\n- What are the properties of each entity class? (owner, status, classification, last-updated)\n\n### Step 2: Populate the Model\n\nFeed the operating model from existing authoritative sources:\n- HR systems → actors and roles\n- CMDB / service catalog → systems\n- Data catalogs → datasets\n- GRC systems → controls, risks, policies\n- Project management → projects, milestones, deliverables\n\nThe operating model is not hand-authored — it is derived from existing systems and kept current by integration.\n\n### Step 3: Make the Model Queryable\n\nImplement the operating model as a graph (M306 Graph-Based Reasoning is the retrieval pattern for traversing it) or as a structured knowledge store with well-defined query patterns.\n\nAgents should be able to ask:\n- \"What datasets does Team X own?\"\n- \"What controls apply to Dataset Y?\"\n- \"What evidence exists for Control Z?\"\n- \"Who has authority to approve Action A?\"\n\n### Step 4: Gate Agent Actions on the Operating Model\n\nWhen an agent plans to take an action, validate it against the operating model:\n- Does the agent have authority to perform this action?\n- Are all preconditions satisfied per the model?\n- What downstream entities will be affected?\n- Is human approval required per the authority model?\n\n## Example\n\nWithout semantic operating model:\nAgent asked: \"Can we share the DataLink dataset with the external auditor?\"\n\nAgent searches for \"DataLink sharing policy\" and \"external auditor data access.\" Retrieves 6 chunks. Produces an answer that misses the key constraint: DataLink contains CUI (Controlled Unclassified Information) which requires specific handling agreements before external sharing.\n\nWith semantic operating model:\nAgent traverses: DataLink dataset → classification: CUI → applicable control: NIST SP 800-171 → required evidence before sharing: completed DUA → authority: ISSO must approve.\n\nAgent responds: \"DataLink is classified CUI. External sharing requires a completed Data Use Agreement and ISSO approval per NIST SP 800-171 control AC-3. No DUA is currently on file for this auditor. This action requires human authorization.\"\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Document the entity classes and relationship types you modeled for your domain\n2. Share which question types the operating model enabled that weren't possible with flat retrieval\n3. Measure how often the operating model prevented an incorrect or unauthorized agent action"
  description: "Build a formal model of the organization's actors, systems, datasets, controls, risks, and authorities before deploying agents — transforming scattered data into a computable world model that agents can reason against rather than search through."
