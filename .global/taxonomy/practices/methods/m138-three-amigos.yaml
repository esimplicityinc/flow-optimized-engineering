spec:
  title: "Three Amigos"
  category: "discovery"
  definition: "> A structured conversation involving at least three perspectives (Product Owner, Developer, Tester) that transforms a user story into a shared understanding of expected behavior through concrete examples."
  body: "**Pillar:** Discovery\n\nThree Amigos is a meeting format that brings together three essential perspectives—business, development, and testing—to collaboratively explore a user story and define its acceptance criteria through concrete examples.\n\n## Why It Matters\n\nThe Three Amigos approach ensures:\n\n- **Complete perspective coverage** - Business value, technical feasibility, and quality considerations\n- **Early defect prevention** - Issues found in conversation cost far less than issues found in code\n- **Shared ownership** - All three perspectives contribute to and understand the requirements\n- **Reduced handoff waste** - No \"throwing requirements over the wall\"\n\n## The Three Perspectives\n\n### Business (Product Owner)\n\n**Focus:** Scope and value\n\n- Explains the business context and user needs\n- Clarifies what's in scope and what's not\n- Prioritizes which scenarios matter most\n- Answers \"why\" questions about the feature\n\n### Development (Developer)\n\n**Focus:** Implementation and feasibility\n\n- Identifies technical constraints and dependencies\n- Suggests alternative approaches\n- Asks clarifying questions about behavior\n- Estimates complexity based on examples\n\n### Testing (Tester/QA)\n\n**Focus:** Edge cases and quality\n\n- Probes for boundary conditions\n- Asks \"what if\" questions\n- Identifies scenarios others might miss\n- Thinks about how to verify the behavior\n\n## How to Run a Three Amigos Session\n\n### Before the Meeting\n\n1. **Select a story** - Choose one that's ready for development\n2. **Share context** - Distribute any relevant background material\n3. **Schedule 30 minutes** - Keep it focused and time-boxed\n\n### During the Meeting\n\n1. **Product Owner presents** (5 min) - Story context and business value\n2. **Open discussion** (20 min) - Generate examples collaboratively\n3. **Capture outcomes** (5 min) - Document scenarios and open questions\n\n### Key Questions to Ask\n\n- \"Can you give me an example of that?\"\n- \"What happens when...?\"\n- \"What's the simplest case?\"\n- \"What could go wrong?\"\n- \"How will we know it's working?\"\n\n## Example Session Output\n\n**Story:** As a customer, I want to apply a discount code so that I can save money on my order.\n\n**Examples discovered:**\n\n| Scenario | Given | When | Then |\n|----------|-------|------|------|\n| Valid code | A 20% discount code \"SAVE20\" exists | Customer applies \"SAVE20\" to a $100 order | Order total becomes $80 |\n| Expired code | Code \"OLD10\" expired yesterday | Customer applies \"OLD10\" | Error message shown, price unchanged |\n| Already used | Customer already used \"ONCE\" | Customer applies \"ONCE\" again | Error message shown |\n| Minimum not met | Code requires $50 minimum | Customer applies to $30 order | Error message explains minimum |\n\n## Best Practices\n\n- **Rotate the \"Amigos\"** - Different developers and testers bring fresh perspectives\n- **Stay at behavior level** - Avoid implementation details\n- **Capture questions** - Don't let unknowns block the conversation\n- **One story at a time** - Maintain focus\n\n## Common Anti-Patterns\n\n- **Missing amigo** - Running without all three perspectives\n- **Monologue** - One person dominates the conversation\n- **Solution design** - Discussing how to build instead of what to build\n- **Skipping the session** - \"We already know what to do\"\n\n## FOE Alignment\n\nThree Amigos strongly supports the FOE principle of **Optimize for Understanding**:\n\n- Multiple perspectives ensure comprehensive understanding\n- Concrete examples create shared mental models\n- Questions surface assumptions before they become defects\n\n## References\n\n- North, D. (2006). \"Introducing BDD.\" https://dannorth.net/introducing-bdd/\n- Adzic, G. (2009). \"Bridging the Communication Gap.\" Neuri Limited.\n- Smart, J.F. (2014). \"BDD in Action.\" Manning Publications."
  description: "A meeting format where three key perspectives (business, development, testing) collaborate to turn user stories into clear scenarios."
  owners:
