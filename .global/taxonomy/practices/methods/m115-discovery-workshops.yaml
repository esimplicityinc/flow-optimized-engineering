spec:
  title: "Discovery Workshops"
  category: "discovery"
  definition: "> A structured, time-boxed conversation where team members collaboratively explore a user story by generating concrete examples of how the system should behave in different scenarios."
  body: "**Pillar:** Discovery\n\nDiscovery Workshops are collaborative sessions where business and technical team members explore the desired behavior of a feature through concrete examples. Also known as \"Specification Workshops\" or \"Example Workshops,\" these sessions are the foundation of BDD's discovery phase.\n\n## Why It Matters\n\nDiscovery Workshops provide critical benefits:\n\n- **Surface misunderstandings early** - Before any code is written, when changes are cheap\n- **Build shared understanding** - Everyone hears the same examples and can ask questions\n- **Reduce rework** - Clarify edge cases and acceptance criteria upfront\n- **Enable just-in-time requirements** - Explore stories right before implementation, not months ahead\n\n## How to Run a Discovery Workshop\n\n### Preparation\n\n1. **Select a user story** that's ready for development (refined, prioritized)\n2. **Invite the right people** - Product Owner, Developer(s), Tester(s), and relevant domain experts\n3. **Time-box strictly** - 25-30 minutes maximum per story\n4. **Prepare the space** - Whiteboard, sticky notes, or digital collaboration tool\n\n### During the Workshop\n\n1. **Read the story** - Product Owner presents the user story and its context\n2. **Ask clarifying questions** - Team members seek to understand the \"why\"\n3. **Generate examples** - Collaboratively create concrete scenarios\n4. **Identify edge cases** - Testers often excel at finding boundary conditions\n5. **Capture questions** - Note anything that can't be answered immediately\n\n### After the Workshop\n\n1. **Document examples** - Formulate scenarios in Given-When-Then format\n2. **Follow up on questions** - Research and resolve open items\n3. **Estimate with confidence** - The team now understands what they're building\n\n## Best Practices\n\n| Practice | Rationale |\n|----------|-----------|\n| Keep sessions short (25-30 min) | Maintains focus and energy |\n| One story per session | Prevents scope creep |\n| Just-in-time discovery | Information is fresh when development starts |\n| Include diverse perspectives | Different viewpoints surface different examples |\n| Focus on behavior, not implementation | Keep discussions at the right level |\n\n## Common Anti-Patterns\n\n- **Marathon sessions** - Long workshops lead to fatigue and diminishing returns\n- **Missing stakeholders** - Key perspectives are lost\n- **Too early discovery** - Details are forgotten by the time development starts\n- **Solution-focused discussion** - Jumping to \"how\" before understanding \"what\"\n\n## Relationship to Other Methods\n\n- **Three Amigos** - A specific format for discovery workshops\n- **Example Mapping** - A structured technique for organizing workshop output\n- **Given-When-Then** - The format used to document discovered examples\n\n## FOE Alignment\n\nDiscovery Workshops directly support the FOE principles of **Optimize for Understanding** and **Fast Feedback Loops**:\n\n- **Understanding**: The entire purpose is building shared understanding through concrete examples\n- **Fast Feedback**: Misunderstandings surface in minutes, not after code is written\n\n## References\n\n- North, D. (2006). \"Introducing BDD.\" Better Software Magazine. https://dannorth.net/introducing-bdd/\n- Wynne, M. & Hellesøy, A. \"The Cucumber Book.\" Pragmatic Bookshelf.\n- Nagy, G. & Rose, S. \"Discovery: Explore Behaviour Using Examples.\" Leanpub."
  description: "Collaborative conversations to explore, discover, and agree on the desired behavior for a user story through concrete examples."
  owners:
