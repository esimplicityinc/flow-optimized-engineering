spec:
  title: "Knowledge Distribution as Reliability"
  when_to_use: "Use this method when:\n\n- Only 2-3 people can debug production issues\n- Team members say \"ask [name], they understand that part\"\n- Support burden falls on the same people repeatedly\n- Onboarding new team members feels impossible"
  when_not_to_use: "Avoid this method when:\n\n- Very early stage (1-2 person team) where concentration is inevitable\n- Temporary specialists brought in for specific expertise\n- Knowledge is already well-distributed across the team"
  pitfalls: "1. **Treating documentation as distribution** - Documentation helps but doesn't replace hands-on experience. Pairing and rotation are essential.\n\n2. **Waiting until heroes burn out** - By then, you've lost institutional knowledge and team morale. Address concentration proactively.\n\n3. **Accepting concentration as inevitable** - \"Only Alice understands that\" should trigger action, not acceptance.\n\n4. **Optimizing only for short-term velocity** - Pairing and rotation slow you down today but speed you up over time. The Prima team's support burden was a velocity tax they paid repeatedly."
  definition: "When only 2-3 people understand a complex system, the team becomes dependent on \"heroes\" for debugging and support. This isn't just a \"bus factor\" risk—it's an active reliability problem that creates bottlenecks, burnout, and low team confidence."
  body: "Treat concentrated knowledge as a system reliability risk to be actively addressed—when only 2-3 people understand a system, that's not a compliment to those people, it's a fragility to fix.\n\n## Overview\n\nWhen only 2-3 people understand a complex system, the team becomes dependent on \"heroes\" for debugging and support. This isn't just a \"bus factor\" risk—it's an active reliability problem that creates bottlenecks, burnout, and low team confidence.\n\nKnowledge Distribution as Reliability treats concentrated knowledge as a system risk to be actively addressed, not a fact to accept. The pattern is predictable: low understanding → low confidence → heroics → fragility. The solution isn't just documentation—it's deliberate knowledge distribution through pairing, rotation, and teaching.\n\nThe Prima observation captured this directly: \"The main limitation was understanding and lack of confidence, not technical capability.\" The team struggled to support their first clients because knowledge was concentrated in the few people who could navigate the large forked codebases. Those heroes became bottlenecks, and even they lacked confidence because no single person fully understood the system.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- A system complex enough that understanding is non-trivial\n- More than 2-3 people who need to support or extend it\n\n### Step 1: Identify Knowledge Concentration\n\nAsk: \"Who do we go to when [X] breaks?\" If the same 2-3 names come up repeatedly, you have concentration. Map which parts of the system are understood by whom.\n\nCreate a simple matrix: system components on one axis, team members on the other. Mark who can debug each component. Gaps and concentrations become visible.\n\n### Step 2: Treat Concentration as a Risk\n\nAdd knowledge concentration to your risk register alongside technical debt. \"Only Alice understands the MCP integration\" is a reliability risk, not a compliment to Alice.\n\nThis reframes the conversation: it's not about Alice's value (which is high), it's about system fragility (which is also high).\n\n### Step 3: Pair on Production Issues\n\nWhen heroes debug production issues, require pairing. The goal isn't just to fix the issue—it's to transfer understanding. Rotate who pairs.\n\nThis is expensive in the short term but essential for distribution. The Prima team's support burden fell on the few who understood the system; pairing would have spread that load.\n\n### Step 4: Rotate Ownership Deliberately\n\nAssign different people to different parts of the system over time. Short-term velocity may decrease; long-term resilience increases. The team's confidence grows as understanding spreads.\n\nConsider: \"Who hasn't worked on this component recently?\" as a factor in task assignment.\n\n### Step 5: Validate Distribution\n\nPeriodically test: \"Could someone other than the usual person debug this?\" If not, distribution hasn't happened yet.\n\nRun a \"fire drill\": have someone who doesn't usually handle a component investigate an issue (real or simulated) while the expert observes but doesn't intervene.\n\n## Example\n\nFrom the Prima observation:\n\n**The concentration pattern:**\n- Large forked codebases (OpenAI Codex CLI, AnythingLLM) that few people understood\n- MCP integration understood by even fewer\n- When first clients onboarded, support burden fell on the same 2-3 people\n- Team reflection: \"The main limitation was understanding and lack of confidence, not technical capability\"\n\n**What knowledge distribution would have looked like:**\n1. Map who understands which components (prima-code, prima-web, MCP integration, Control Tower)\n2. Identify gaps: \"Only Tom understands the MCP hypervisor\"\n3. Require pairing on MCP issues: Tom + rotating team member\n4. Rotate ownership: different people lead different components each sprint\n5. Validate: \"Can someone other than Tom debug an MCP issue?\"\n\n**The outcome:** Instead of heroes becoming bottlenecks, understanding spreads. Team confidence increases. Support burden is shared.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Review the current approach\n2. Map knowledge concentration in your team\n3. Try deliberate distribution (pairing, rotation)\n4. Document your observation—especially the relationship between distribution and team confidence"
  description: "Treat concentrated knowledge as a system reliability risk to be actively addressed—when only 2-3 people understand a system, that's not a compliment to those people, it's a fragility to fix."
