spec:
  title: "Global Context Assembly"
  when_to_use: "Use this method when:\n\n- Answering questions that require synthesizing information from multiple data sources or domains\n- Building agents that reason about entities with rich, distributed histories\n- Operating in domains where \"current state\" requires assembling facts from multiple authoritative sources\n- Retrieval quality is poor despite good individual chunks — the problem is often missing relational context, not missing content"
  when_not_to_use: "Avoid this method when:\n\n- Questions are genuinely localized — the answer really does live in a single document\n- Pre-assembly cost is prohibitive (very large, rapidly-changing corpora with unpredictable query patterns)\n- The domain is so exploratory that pre-defining assembly patterns is premature"
  pitfalls: "1. **Assembly as a retrieval replacement** — assembly frames the context; it doesn't replace retrieval. Don't pre-load so much context that the context window is exhausted before the actual query is processed.\n2. **Stale assemblies** — cached domain snapshots that aren't invalidated when sources change silently serve outdated context. Build invalidation as carefully as you build assembly.\n3. **Over-broad assembly patterns** — assembling \"everything about finance\" for a question about one project wastes context budget. Keep assembly patterns scoped to the question type."
  definition: "The central failure of flat RAG is its assumption that meaning is localized. \"What is the projected risk of the 2026 portfolio?\" is not answered by any single document. The answer lives across financial statements, risk policy documents, historical performance data, and forward-looking analysis — distributed across departments, systems, and time."
  body: "Synthesize distributed, cross-domain information into a coherent contextual picture before retrieval, rather than relying on single-query retrieval to surface meaning that is inherently scattered.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nThe central failure of flat RAG is its assumption that meaning is localized. \"What is the projected risk of the 2026 portfolio?\" is not answered by any single document. The answer lives across financial statements, risk policy documents, historical performance data, and forward-looking analysis — distributed across departments, systems, and time.\n\nGlobal Context Assembly is the practice of pre-computing or dynamically assembling a coherent contextual picture for a domain or question type before the retrieval query is issued. Rather than asking \"what chunks are similar to this query?\", it asks \"what is the complete context a reasoning agent needs to answer questions in this domain?\"\n\nThis may involve pre-building domain snapshots (assembled views of a domain's current state), entity-centric context graphs (everything known about a specific entity), or temporal context windows (the evolution of a concept over time). The assembled context becomes the substrate for retrieval, not an afterthought.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Map the domain's key entities and their distributed information sources\n- Understand the question types the agent will face and what cross-domain joins they require\n- Establish entity resolution (M307) so distributed references can be unified\n\n### Step 1: Identify Assembly Patterns\n\nFor each major question type or entity type in your domain, define an assembly pattern: what sources need to be consulted, in what order, and how they relate. This is essentially a query plan for context, not data.\n\n### Step 2: Build Context Assemblers\n\nImplement assemblers — processes that execute the assembly pattern and produce a coherent context artifact. Assemblers may be synchronous (assembled at query time) or asynchronous (pre-computed and cached as domain snapshots).\n\n### Step 3: Layer Assembly on Top of Retrieval\n\nGlobal context provides the frame; retrieval provides the details. The assembled context establishes what entities are in play and their known relationships; retrieval then fills in specific evidence, quotes, and data points within that frame.\n\n### Step 4: Invalidate Assembled Contexts on Source Change\n\nAssembled contexts are derived artifacts. When source data changes, dependent assemblies must be invalidated and rebuilt. Design explicit invalidation triggers — don't rely on TTL alone for domains where currency matters.\n\n## Example\n\n**Without global context assembly:**\nQuery: \"What are the risks to Project Phoenix in Q3?\"\nRetrieval returns: 3 chunks mentioning \"Phoenix\" by name, but none from the risk register because it uses the project code \"PHX-2026-Q3\". The answer is incomplete because entity resolution and cross-source assembly didn't happen.\n\n**With global context assembly:**\nBefore retrieval, the Phoenix entity context is assembled: all known aliases (Phoenix, PHX-2026-Q3, PHX-Init), owning team, current status, linked budget documents, linked risk register entries, recent status updates. Retrieval then operates within this assembled frame, and the risk register entries are surfaced because the entity graph connected them.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Identify a question type in your domain that flat RAG answers poorly\n2. Map what sources the \"correct\" answer would need to draw from\n3. Try building an assembler and document whether query quality improved"
  description: "Synthesize distributed, cross-domain information into a coherent contextual picture before retrieval, rather than relying on single-query retrieval to surface meaning that is inherently scattered."
