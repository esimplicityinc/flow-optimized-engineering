apiVersion: katalyst.taxonomy/v2alpha
kind: method
metadata:
  name: observability-tabletop-exercise
  annotations:
    foe.source: 'QDAS practices: Observability Standards, Measures'
spec:
  title: Observability tabletop exercise
  pillar: process
  category: observability
  status: active
  definition: In a tabletop exercise, a facilitator gives a team a failure scenario.
    The team shows how it finds the failure, how it finds the cause, and how it recovers.
    It uses only its observability tools.
  when_to_use: Do the exercise one time in each planning period (for example, each
    quarter), at the same time as the observability assessment.
  body: 'The facilitator gives the exercise a score. The score is one of the measures
    of the practice. Record each gap that the exercise finds as work to do. For example:
    an incident that had no alert, or an alert that has no documented action.'
  description: One time in each planning period, a team examines a failure scenario.
    The team shows how its telemetry and alerts find the failure and explain it.
  owners:
  - aaron.west@esimplicity.com
  rationale: A team finds gaps in its observability during an incident, when it is
    too late. A tabletop exercise finds the same gaps when there is no pressure. It
    also lets the team practise the response.
