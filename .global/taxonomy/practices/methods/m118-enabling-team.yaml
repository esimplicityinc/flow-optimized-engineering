spec:
  title: "Enabling Team"
  status: "well-established"
  definition: "> \"An enabling team helps a stream-aligned team to overcome obstacles. An enabling team also helps to detect missing capabilities within stream-aligned teams.\"\n>\n> — Skelton & Pais, Team Topologies"
  when_to_use: "- **Technology adoption** - Introducing new tools, languages, or frameworks\n- **Practice improvement** - Spreading practices like TDD, observability, or security\n- **Capability building** - Building skills that teams will need long-term\n- **Obstacle removal** - Helping teams overcome specific blockers\n- **Detecting patterns** - Identifying common needs across multiple teams"
  body: "**Pillar:** Team Types\n\nAn Enabling Team helps stream-aligned teams overcome obstacles, detect missing capabilities, and build new skills. Unlike platform teams that provide ongoing services, enabling teams work with other teams temporarily to transfer knowledge and capabilities, then move on.\n\n## Why It Matters\n\nEnabling teams accelerate organizational learning because they:\n\n- **Transfer knowledge** - Skills spread across the organization\n- **Unblock teams** - Temporary expertise helps teams overcome obstacles\n- **Detect gaps** - Identify capability needs across multiple teams\n- **Avoid dependencies** - Help rather than do—teams become self-sufficient\n- **Enable adoption** - Smooth introduction of new technologies or practices\n\n## FOE Framing\n\n**Primary: Optimize for Understanding**\n\nEnabling teams exist to increase understanding across the organization. By teaching and mentoring rather than doing, they ensure that knowledge spreads. When an enabling team leaves, the receiving team understands how to continue independently.\n\n**Secondary: Confidence to Act**\n\nTeams that have received enabling team support have confidence to use new capabilities. They've been taught, they've practiced, and they know they can do it. This confidence enables faster adoption of new practices and technologies.\n\n## How It Works\n\n### Characteristics of Effective Enabling Teams\n\n1. **Teaching focus** - Helps teams learn, doesn't do the work for them\n2. **Time-boxed engagements** - Explicit end dates for each engagement\n3. **Success = independence** - Goal is receiving team's self-sufficiency\n4. **Cross-team visibility** - Works with multiple teams, sees patterns\n5. **Deep expertise** - Strong enough to teach effectively\n\n### Enabling Team Engagement Lifecycle\n\n| Phase | Activities |\n|-------|------------|\n| **Assessment** | Identify capability gaps and learning objectives |\n| **Engagement** | Work alongside team, demonstrate, teach, pair |\n| **Transition** | Gradually reduce involvement as team gains confidence |\n| **Exit** | Clear handoff, team is self-sufficient |\n| **Follow-up** | Check in periodically, available for questions |\n\n### Enabling Team Anti-Patterns\n\n- **Becoming a dependency** - Teams wait for enabling team instead of learning\n- **Doing instead of teaching** - Taking over work rather than transferring skills\n- **Permanent assignments** - Never moving on, becoming a shadow team\n- **No clear objectives** - Engagement without defined success criteria\n- **Spreading too thin** - Trying to help too many teams at once\n\n## Relationship to Other Methods\n\n- **Stream-Aligned Team** - Primary recipients of enabling team support\n- **Platform Team** - Enabling teams may help teams adopt platform capabilities\n- **Facilitating Mode** - The interaction mode enabling teams use\n- **Team Cognitive Load** - Enabling teams help manage cognitive load during transitions\n- **Collaboration Mode** - Sometimes used during intensive skill transfer\n\n## Citations\n\n- Skelton, M., & Pais, M. (2019). *Team Topologies: Organizing Business and Technology Teams for Fast Flow*. IT Revolution Press.\n- [Team Topologies Key Concepts](https://teamtopologies.com/key-concepts)"
  description: "Teams that help stream-aligned teams overcome obstacles and build capabilities, then move on."
