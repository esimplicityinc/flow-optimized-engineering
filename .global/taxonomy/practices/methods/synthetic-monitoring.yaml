apiVersion: katalyst.taxonomy/v2alpha
kind: method
metadata:
  name: synthetic-monitoring
  annotations:
    foe.source: 'QDAS practices: Testing Framework'
spec:
  title: Synthetic monitoring
  pillar: framework
  category: test-level
  status: active
  definition: A synthetic monitor is an automated test that examines the live system
    on a schedule, in the environment where it operates.
  when_to_use: Use synthetic monitors to examine each capability of each deployable
    component and each system, all the time.
  body: '## When and where it runs


    Synthetic monitors run all the time, on a schedule, in the monitoring service.


    ## Tools


    Use a synthetic monitoring service. The service runs scripted checks on a schedule
    against the live system.


    ## Dependencies


    Use the real dependencies. The monitor examines the live system.

    '
  description: A synthetic monitor is an automated test that examines the live system
    on a schedule, in the environment where it operates.
  owners:
  - aaron.west@esimplicity.com
  rationale: 'A system can fail when nobody changes it: a certificate expires, a dependency
    stops. Synthetic monitors find these failures all the time, also when no users
    are active.'
