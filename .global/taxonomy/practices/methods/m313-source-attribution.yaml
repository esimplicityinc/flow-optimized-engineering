spec:
  title: "Source Attribution"
  when_to_use: "Use this method when:\n\n- Agents produce outputs that will be used for consequential decisions\n- Operating in regulated environments where auditability is required\n- Building systems where trust must be earned incrementally (attribution enables verification which builds trust)\n- Agent errors must be traceable and correctable (you can't fix what you can't locate)"
  when_not_to_use: "Avoid this method when:\n\n- The task is so exploratory that requiring sources would paralyze useful brainstorming (distinguish clearly between exploratory and authoritative outputs)\n- Sources are unavailable (don't fake attribution — better to be explicit that the claim is unsupported)"
  pitfalls: "1. **Hallucinated citations** — agents may generate plausible-looking but non-existent source IDs. Validate all citations against the knowledge layer index before presenting to users.\n2. **Over-citing** — requiring citations on every sentence fragments the response and obscures the reasoning. Require citations for factual claims; allow inference synthesis without per-sentence citations.\n3. **Citation without accessibility** — a citation that points to a document the user can't access or navigate defeats the purpose. Surface the specific passage, not just the document."
  definition: "An AI agent that says \"the vendor is compliant\" is producing a claim. A claim without a source is an assertion. In regulated environments, financial decisions, and any context where consequential actions follow from AI outputs, assertions are insufficient. The agent must show its work."
  body: "Require every AI-generated conclusion to trace to specific, identifiable source nodes in the knowledge layer, so that any claim can be verified, any error can be traced, and any decision can be audited.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nAn AI agent that says \"the vendor is compliant\" is producing a claim. A claim without a source is an assertion. In regulated environments, financial decisions, and any context where consequential actions follow from AI outputs, assertions are insufficient. The agent must show its work.\n\nSource Attribution requires that every substantive claim in an AI response be traceable to a specific node in the knowledge graph or a specific retrieved artifact. The agent doesn't just produce an answer — it produces an answer with citations. Those citations must point to real, retrievable artifacts, not to generic \"based on the documents I retrieved.\"\n\nThis is the AI equivalent of footnotes in academic work, and it serves the same functions: it enables verification, it limits the blast radius of errors, and it builds justified confidence in the output. It is also the ethical foundation for agentic systems — an agent that can't show its work shouldn't be trusted to act.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Every artifact in the knowledge layer must have a unique, stable identifier\n- Retrieval pipeline must return source identifiers alongside content (not just content)\n- Output format must include a structured citations section\n\n### Step 1: Preserve Source IDs Through the Retrieval Pipeline\n\nWhen the retriever ensemble (M303) returns chunks, each chunk must carry its source document ID, the chunk position within that document, and the context contract (M300) metadata. This provenance data must survive through context assembly and into the LLM prompt.\n\n### Step 2: Instruct the Agent to Cite\n\nIn the system prompt and domain layer (M301 Instruction Layering), explicitly instruct the agent:\n- Every factual claim must include a citation in the form `[source: DOC-ID, section: X]`\n- Claims without citations must be marked as `[inference]` to distinguish from sourced facts\n- Inferences that are material to a decision must be flagged for human review\n\n### Step 3: Validate Citations Post-Generation\n\nAfter the agent produces a response, validate that cited source IDs exist in the knowledge layer and that the cited content actually supports the claim. Automated validation catches hallucinated citations; human review catches misattributed claims.\n\n### Step 4: Surface Citations in the UI\n\nPresent citations as accessible links to source documents, not just identifiers. Users should be able to click a citation and see the exact passage the agent cited. This closes the verification loop — attribution is only useful if it's verifiable.\n\n## Example\n\nWithout source attribution:\n\"Based on my analysis, the vendor DataFlow Inc. meets your 2025 security standards.\"\n\nWith source attribution:\n\"DataFlow Inc. meets your 2025 security standards [source: VAR-2025-0089, section: Executive Summary, authority: official-assessment, dated: 2025-03-15]. Three remediation items from the 2024 assessment were verified as closed [source: AUDIT-2024-0441, section: Closure Report]. One minor finding remains open [source: VAR-2025-0089, section: Open Items, item #3] — this does not affect overall compliance status per your policy [source: SEC-POL-2025, section: 4.2].\"\n\nThe second response is verifiable, auditable, and actionable. The first is a black box.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Measure the hallucinated citation rate and document what validation approach reduced it\n2. Document the citation format that worked best for your domain and user interface\n3. Note which claim types were most often cited vs. left as inferences"
  description: "Require every AI-generated conclusion to trace to specific, identifiable source nodes in the knowledge layer, so that any claim can be verified, any error can be traced, and any decision can be audited."
