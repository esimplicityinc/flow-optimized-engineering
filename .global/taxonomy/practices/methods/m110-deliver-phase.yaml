spec:
  title: "Deliver Phase"
  category: "problem-solving"
  when_to_use: "Use the Deliver phase when:\n- A solution has been selected from the Develop phase\n- The team is ready to move from prototype to production\n- Risk mitigation requires phased rollout\n- Success metrics need to be established and measured"
  pitfalls: "- **Big bang launch** — Skipping phased testing and launching to everyone at once\n- **Ignoring feedback** — Collecting feedback but not acting on it\n- **Premature celebration** — Declaring success before measuring actual outcomes\n- **Feature creep** — Adding unvalidated features during final refinement"
  definition: "The Deliver phase involves testing out different solutions at small-scale, rejecting those that will not work, and improving the ones that will. The goal is to arrive at a validated solution that's ready for launch, with confidence built through progressive testing."
  body: "**Pillar:** Problem Solving  \n**Thinking Mode:** Convergent (focusing narrowly)\n\nThe Deliver phase is the fourth and final phase of the Double Diamond, where teams validate and launch the chosen solution. This convergent phase involves testing at progressively larger scales, refining based on feedback, and preparing for full deployment.\n\n## What It Is\n\nThe Deliver phase involves testing out different solutions at small-scale, rejecting those that will not work, and improving the ones that will. The goal is to arrive at a validated solution that's ready for launch, with confidence built through progressive testing.\n\nKey activities in this phase include:\n- **Phased testing** — Testing with small groups before wider rollout\n- **Final refinement** — Polishing the solution based on test feedback\n- **Launch preparation** — Readying the solution for full deployment\n- **Feedback loops** — Establishing channels for ongoing user feedback\n- **Evaluation** — Measuring success against original objectives\n\n## How to Measure\n\n- **Validation success** — Did the solution pass testing with target users?\n- **Issue catch rate** — How many problems were found and fixed before full launch?\n- **User acceptance** — Do users adopt and value the solution?\n- **Business outcomes** — Does the solution achieve the intended goals?\n\n## FOE Alignment\n\nThe Deliver phase strongly supports **Confidence** through systematic validation before full commitment. By testing at progressively larger scales (5 users, then 50, then 100), teams build justified confidence that the solution works. It also supports **Fast Feedback** by creating feedback loops that continue after launch.\n\n## Further Reading\n\n- [Design Methods Step 4: Deliver](https://www.designcouncil.org.uk/our-work/news-opinion/design-methods-step-4-deliver/) — Design Council guide"
  description: "The second convergent phase where solutions are validated through testing before launch."
  owners:
