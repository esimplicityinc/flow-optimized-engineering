spec:
  description: 'Teams accumulate *conceptual debt* when they adopt technologies without
    understanding their underlying models. Like technical debt, conceptual debt compounds
    -- each misunderstanding produces architectural decisions that produce bugs that
    produce hotfixes that produce more complexity. Unlike technical debt, conceptual
    debt is psychologically invisible: you feel like you understand while your assumptions
    silently diverge from reality.'
