spec:
  title: "Quality Gates"
  when_to_use: "Use this method when:\n\n- Building agents that must meet quality standards consistently, not just on average\n- Retrieval quality is variable (some queries return excellent context, others return noise)\n- Output errors are consequential (wrong citations, out-of-scope claims, schema violations)\n- You need systematic quality measurement, not just observed user feedback"
  when_not_to_use: "Avoid this method when:\n\n- Latency requirements are so tight that even fast gate operations are prohibitive\n- The output domain is so open-ended that meaningful automated evaluation isn't feasible"
  pitfalls: "1. **Gates only at output** — placing all gates at the end catches failures late. Pre-reasoning gates are cheaper and prevent reasoning on bad context.\n2. **Hard-coded thresholds** — gates with thresholds set once and never revisited degrade as the knowledge layer evolves. Review thresholds monthly against gate decision logs.\n3. **Gate as trust signal** — a gate that always passes isn't providing signal, it's providing false confidence. Monitor pass rates; consistently high rates may indicate gates are too permissive."
  definition: "Quality gates are the enforcement mechanism of the harness (M316). Where harness engineering describes the overall pattern, quality gates are the individual checkpoints — each a discrete, deterministic function that receives a specific artifact (retrieved context, reasoning chain, output) and returns pass or fail."
  body: "Implement discrete, automated evaluation checkpoints between the agent's retrieval and reasoning steps and between reasoning and output delivery, so that quality failures are caught and corrected before they reach users or downstream systems.\n\n:::caution Early Stage\nThis method is still being validated through observations.\n:::\n\n## Overview\n\nQuality gates are the enforcement mechanism of the harness (M316). Where harness engineering describes the overall pattern, quality gates are the individual checkpoints — each a discrete, deterministic function that receives a specific artifact (retrieved context, reasoning chain, output) and returns pass or fail.\n\nThe key insight is that gates should be placed at the right moments in the agent pipeline, not just at the end. A gate that catches a retrieval failure before the LLM attempts to reason is far cheaper than a gate that catches a reasoning failure in the final output — both in token cost and in the compounding error risk of reasoning on bad context.\n\nThe gate placement strategy follows the \"shift-left\" principle from software testing: catch failures as early and cheaply as possible.\n\n## How It Works\n\n### Prerequisites\n\nBefore starting:\n- Have the harness structure (M316) in place\n- Define pass/fail criteria for each gate type\n- Identify which failure modes are most costly in your domain\n\n### Step 1: Place Gates at Three Pipeline Stages\n\n**Pre-reasoning gates** (run on retrieved context before LLM reasoning):\n- Relevance gate: are the retrieved chunks relevant to the query?\n- Coverage gate: does the retrieved context contain sufficient information to answer?\n- Freshness gate: are the retrieved sources current per their context contracts (M300)?\n\n**Post-reasoning gates** (run on LLM output before delivery):\n- Citation gate: do all cited sources exist in the knowledge layer?\n- Scope gate: does the answer stay within the declared domain of the agent?\n- Schema gate: does the output conform to the required structure?\n\n**Action gates** (run before any agentic action is executed):\n- Authorization gate: is the agent permitted to take this action?\n- Precondition gate: are the preconditions for this action satisfied?\n- Reversibility gate: if this action is irreversible, require explicit confirmation\n\n### Step 2: Score Rather Than Binary-Gate Where Possible\n\nSome gates benefit from a score rather than a hard pass/fail:\n- Relevance: return a score 0-1; gate fails below threshold (e.g., 0.6)\n- Coverage: return the fraction of query facets addressed\n- Freshness: return days since last update; gate fails above threshold\n\nScores enable better observability and threshold tuning than binary gates.\n\n### Step 3: Define Gate Failure Responses\n\nFor each gate, define what happens on failure:\n- **Soft fail**: log, continue, flag output for review\n- **Retry**: trigger a context reset and re-run the pipeline\n- **Hard fail**: return a structured error to the caller\n\n### Step 4: Log Every Gate Decision\n\nEvery gate invocation — pass or fail, score, the artifact evaluated, and the time taken — must be logged. This data feeds semantic observability (M319) and enables threshold calibration over time.\n\n## Example\n\nQuery: \"What is our current policy on third-party AI tool procurement?\"\n\nPipeline with gates:\n1. Retrieval returns 5 chunks\n2. **Relevance gate**: 3 of 5 chunks score above 0.6 → pass (3 relevant chunks proceed)\n3. **Freshness gate**: all 3 chunks are current per context contracts → pass\n4. LLM reasons and produces answer citing \"AI-POL-2025-v2\"\n5. **Citation gate**: \"AI-POL-2025-v2\" found in knowledge layer index → pass\n6. **Scope gate**: answer discusses procurement policy → pass\n7. **Schema gate**: output matches required JSON structure → pass\n8. Answer delivered\n\nIf step 2 had failed (0 relevant chunks): Context Reset triggered. Query reformulated. Pipeline retried.\n\n## How You Can Help\n\nIf you're testing this method:\n\n1. Document which gate types you implemented and at which pipeline stage\n2. Share your gate failure rates by type — which gates fail most often?\n3. Measure the pass rate before and after threshold calibration"
  description: "Implement discrete, automated evaluation checkpoints between the agent's retrieval and reasoning steps and between reasoning and output delivery, so that quality failures are caught and corrected before they reach users or downstream systems."
