spec:
  title: "Facilitating Mode"
  status: "well-established"
  definition: "> \"Facilitating: one team helps and mentors another team.\"\n>\n> — Skelton & Pais, Team Topologies"
  when_to_use: "- **Technology adoption** - Helping teams adopt new tools or frameworks\n- **Practice improvement** - Introducing testing, observability, or security practices\n- **Obstacle removal** - Helping teams overcome specific blockers\n- **Onboarding** - Helping new teams get up to speed\n- **Capability building** - Building skills for long-term independence"
  when_not_to_use: "Avoid facilitating mode when:\n\n- Both teams need to discover something new (use Collaboration)\n- The relationship should be ongoing service consumption (use X-as-a-Service)\n- The receiving team already has the capability\n- Neither team has capacity for the engagement"
  body: "**Pillar:** Interaction Modes\n\nFacilitating is a team interaction mode where one team helps and mentors another team, removing obstacles and building capabilities. Unlike collaboration (which is joint discovery), facilitation is directional—one team is helping another team grow.\n\n## Why It Matters\n\nFacilitating mode enables capability transfer across the organization:\n\n- **Knowledge transfer** - Skills spread from one team to another\n- **Obstacle removal** - Teams get help overcoming blockers\n- **Capability building** - Receiving teams become self-sufficient\n- **Temporary relationship** - Unlike X-as-a-Service, facilitation ends\n- **Multiplier effect** - Facilitating teams amplify organizational capability\n\n## FOE Framing\n\n**Primary: Optimize for Understanding**\n\nFacilitating mode is fundamentally about increasing understanding. The facilitating team helps the receiving team understand new technologies, practices, or approaches. Success is measured by what the receiving team learns, not what the facilitating team delivers.\n\n**Secondary: Confidence to Act**\n\nTeams that have received facilitation have confidence to continue independently. They've been taught, practiced, and validated. This confidence enables faster adoption of new capabilities.\n\n## How It Works\n\n### Characteristics of Effective Facilitating\n\n1. **Directional** - Clear helper/learner relationship\n2. **Time-boxed** - Defined duration with explicit end\n3. **Teaching focus** - Helps learn, doesn't do the work\n4. **Success = independence** - Goal is receiving team's self-sufficiency\n5. **Clear objectives** - Both teams know what capabilities to build\n\n### Facilitating Engagement Structure\n\n| Phase | Activities |\n|-------|------------|\n| **Assessment** | Identify gaps and learning objectives |\n| **Active facilitating** | Pairing, teaching, demonstrating |\n| **Guided practice** | Receiving team leads, facilitator supports |\n| **Independent practice** | Receiving team works alone, facilitator available |\n| **Exit** | Formal handoff, receiving team is self-sufficient |\n\n### Facilitating Anti-Patterns\n\n- **Permanent facilitation** - Never transitioning to independence\n- **Doing instead of teaching** - Completing work rather than building capability\n- **No clear objectives** - Facilitating without defined goals\n- **Skipping independence phase** - Not validating receiving team can continue alone\n- **Dependency creation** - Receiving team waits for facilitator instead of trying\n\n## Relationship to Other Methods\n\n- **Enabling Team** - Primary user of facilitating mode\n- **Stream-Aligned Team** - Typical receiver of facilitation\n- **Collaboration Mode** - Different: collaboration is joint discovery, facilitating is teaching\n- **X-as-a-Service Mode** - Sometimes follows facilitating (team learns to use service)\n- **Team Cognitive Load** - Facilitating helps manage load during capability transitions\n\n## Facilitating vs. Collaboration\n\n| Aspect | Facilitating | Collaboration |\n|--------|-------------|--------------|\n| **Direction** | One-way (helper → learner) | Bi-directional |\n| **Goal** | Transfer existing knowledge | Discover new things together |\n| **Outcome** | Receiving team gains capability | Both teams learn, API emerges |\n| **Typical teams** | Enabling team + stream-aligned | Two stream-aligned or stream + platform |\n\n## Citations\n\n- Skelton, M., & Pais, M. (2019). *Team Topologies: Organizing Business and Technology Teams for Fast Flow*. IT Revolution Press.\n- [Team Topologies Key Concepts](https://teamtopologies.com/key-concepts)"
  description: "One team helps and mentors another team, removing obstacles."
  owners:
    - "aaron.west@esimplicity.com"
