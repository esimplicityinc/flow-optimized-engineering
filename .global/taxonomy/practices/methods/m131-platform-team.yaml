spec:
  title: "Platform Team"
  status: "well-established"
  definition: "> \"The purpose of a platform team is to enable stream-aligned teams to deliver work with substantial autonomy. The stream-aligned team maintains full ownership of building, running, and fixing their application in production. The platform team provides internal services to reduce the cognitive load that would be required from stream-aligned teams to develop these underlying services.\"\n>\n> — Skelton & Pais, Team Topologies"
  when_to_use: "- **Scaling organizations** - When multiple stream-aligned teams need similar capabilities\n- **Complex infrastructure** - When infrastructure requires specialized expertise\n- **Self-service opportunities** - When stream-aligned teams shouldn't need to understand implementation details\n- **Reliability requirements** - When capabilities are critical enough to warrant dedicated ownership"
  body: "**Pillar:** Team Types\n\nA Platform Team provides internal services and capabilities that accelerate stream-aligned teams by reducing their cognitive load. They treat their platform as a product with internal customers, focusing on self-service, reliability, and developer experience.\n\n## Why It Matters\n\nPlatform teams are essential for scaling engineering organizations because they:\n\n- **Reduce duplication** - Common capabilities built once, consumed by many\n- **Lower cognitive load** - Stream-aligned teams don't need deep infrastructure expertise\n- **Enable self-service** - Teams can move fast without waiting for platform changes\n- **Improve reliability** - Centralized expertise in critical infrastructure\n- **Accelerate onboarding** - New teams get capabilities instantly\n\n## FOE Framing\n\n**Primary: Confidence to Act**\n\nPlatform teams provide stable, well-tested capabilities that stream-aligned teams can rely on. When the deployment pipeline, observability stack, or authentication system \"just works,\" teams have confidence to ship changes. Platform stability enables product velocity.\n\n**Secondary: Fast Feedback Loops**\n\nBy providing self-service capabilities, platform teams remove bottlenecks. Stream-aligned teams don't need to wait for infrastructure changes—they can iterate independently. Good platforms reduce time-to-first-deployment for new services.\n\n## How It Works\n\n### Characteristics of Effective Platform Teams\n\n1. **Product mindset** - Treats platform as a product with internal customers\n2. **Self-service focus** - Stream-aligned teams can consume without waiting\n3. **Clear APIs** - Well-documented, stable interfaces\n4. **Thinnest viable platform** - Provides just enough, not a complex empire\n5. **Dedicated ownership** - Full responsibility for platform reliability\n\n### What Platform Teams Typically Provide\n\n| Capability | Examples |\n|------------|----------|\n| Deployment | CI/CD pipelines, container orchestration |\n| Observability | Logging, metrics, tracing, alerting |\n| Runtime | Kubernetes, serverless, service mesh |\n| Data | Databases, caching, messaging |\n| Security | Authentication, authorization, secrets management |\n| Developer experience | Local development, documentation, templates |\n\n### Platform Team Anti-Patterns\n\n- **Empire building** - Platform becomes too large and complex\n- **Ticket-driven** - Teams must wait for platform team to make changes\n- **Forcing adoption** - Mandating platform use rather than making it compelling\n- **Ignoring DX** - Poor developer experience reduces adoption\n- **No product management** - Building features no one needs\n\n## Relationship to Other Methods\n\n- **Stream-Aligned Team** - Primary consumers of platform capabilities\n- **Enabling Team** - May help stream-aligned teams adopt platform capabilities\n- **X-as-a-Service Mode** - How platform teams interact with stream-aligned teams\n- **Thinnest Viable Platform** - Principle for platform scope\n- **Team Cognitive Load** - Platform reduces cognitive load on consumers\n\n## Citations\n\n- Skelton, M., & Pais, M. (2019). *Team Topologies: Organizing Business and Technology Teams for Fast Flow*. IT Revolution Press.\n- [Team Topologies Key Concepts](https://teamtopologies.com/key-concepts)"
  description: "Teams that provide a compelling internal product to accelerate delivery by stream-aligned teams."
