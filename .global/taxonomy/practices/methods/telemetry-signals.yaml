kind: method
metadata:
  name: "telemetry-signals"
  annotations:
    foe.source: "QDAS practices: Observability Primer"
spec:
  title: "Metrics, traces and logs"
  pillar: "framework"
  category: "observability"
  status: "active"
  definition: "Observability is the ability to monitor, measure and understand a system's internal state and behaviour from its external outputs: its metrics, traces and logs."
  body: "## Metrics\n\nNumeric measurements (counts, averages, percentiles) taken over intervals of time: a metric name, a\ntimestamp, and labels. They are cheap to store, so they can be kept long enough to show historical\ntrends, and they detect anomalies and drive dashboards of overall health. Alerting on metrics is far\nfaster than querying logs. Many distinct label values raise storage and query cost.\n\n## Traces\n\nThe path of one request through the system's components (application, proxy, middleware, library,\ndatabase, cache): the hops it makes across boundaries and the forks in its execution, and how much\nwork each layer does. A trace is a directed acyclic graph of spans, the units of work, joined by\nreferences.\n\n## Logs\n\nAn immutable record of a discrete event: a timestamp and a context payload, as plain text, structured\n(JSON) or binary, shipped to a central system. Logs give the granular detail averages and percentiles\ncannot.\n"
  pitfalls: "- **Excessive logging** raises storage cost and makes logs slower to search. Decide what to log.\n- **Missing context.** A log line should carry the context that makes the event meaningful.\n- **Blocking.** Log asynchronously; logging must never block request processing.\n- **Sensitive data.** Never log critical or sensitive data unmasked.\n- **No retention policy.** Most event logs matter for a short time; archive them.\n"
  description: "The three signals observability is built from, and what each is good for."
  owners:
    - "aaron.west@esimplicity.com"
