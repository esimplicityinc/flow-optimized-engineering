spec:
  title: "System integration tests"
  pillar: "framework"
  category: "test-level"
  status: "active"
  definition: "System integration tests test a system's functionality as a whole, after deploy."
  when_to_use: "To validate every capability of a system."
  body: "## When and where it runs\n\nAfter deploy, as the validation step of continuous delivery, run by the CI/CD system as part of the workflow.\n\n## Tooling\n\nA testing framework that drives the deployed system (for example, Selenium).\n\n## Dependencies\n\nNone are mocked: every dependency is tested end to end.\n"
  description: "System integration tests test a system's functionality as a whole, after deploy."
