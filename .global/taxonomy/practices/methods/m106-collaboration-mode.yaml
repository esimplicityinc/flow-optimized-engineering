spec:
  title: "Collaboration Mode"
  status: "well-established"
  definition: "> \"Collaboration: two teams work closely together for a defined period of time to discover new things (APIs, practices, technologies, etc.).\"\n>\n> — Skelton & Pais, Team Topologies"
  when_to_use: "- **New integrations** - Discovering how two systems should work together\n- **Technology adoption** - Learning new technologies together\n- **API design** - Finding the right boundaries and contracts\n- **Problem exploration** - Understanding complex problems jointly\n- **Innovation projects** - Creating something genuinely new"
  when_not_to_use: "Avoid collaboration mode when:\n\n- Clear APIs already exist (use X-as-a-Service)\n- One team is teaching another (use Facilitating)\n- The relationship should be ongoing service consumption\n- Neither team has capacity for high-bandwidth communication\n- Goals can be achieved through lower-cost interaction"
  body: "**Pillar:** Interaction Modes\n\nCollaboration is a team interaction mode where two teams work closely together for a defined period, typically to discover new things—APIs, practices, technologies, or approaches. It's high-bandwidth, high-cost communication that should be time-boxed.\n\n## Why It Matters\n\nCollaboration mode is essential for discovery and innovation:\n\n- **High bandwidth** - Rich communication enables rapid learning and problem-solving\n- **Discovery** - Best for exploring unknown territory together\n- **Boundary definition** - Helps teams find the right API boundaries\n- **Innovation** - New ideas emerge from close collaboration\n- **Trust building** - Teams develop stronger working relationships\n\nHowever, collaboration is expensive and should be used deliberately.\n\n## FOE Framing\n\n**Primary: Optimize for Understanding**\n\nCollaboration mode maximizes understanding through high-bandwidth communication. When teams work closely together, knowledge transfers rapidly. Both teams develop shared mental models of the problem space and solution.\n\n**Secondary: Fast Feedback Loops**\n\nDuring collaboration, feedback is immediate. Teams learn quickly what works and what doesn't. Misunderstandings are caught and corrected in real-time.\n\n## How It Works\n\n### Characteristics of Effective Collaboration\n\n1. **Time-boxed** - Clear start and end dates (weeks to months, not years)\n2. **Explicit goals** - Both teams know what they're discovering\n3. **Joint ownership** - Both teams contribute and take responsibility\n4. **High communication** - Frequent sync, shared channels, co-location (physical or virtual)\n5. **Transition plan** - Clear path to another interaction mode when done\n\n### Collaboration Lifecycle\n\n| Phase | Activities |\n|-------|------------|\n| **Kick-off** | Define goals, success criteria, and timeline |\n| **Deep collaboration** | Joint working sessions, shared ownership |\n| **Discovery** | Find the right boundaries, APIs, practices |\n| **Documentation** | Capture learnings, define contracts |\n| **Transition** | Move to X-as-a-Service or Facilitating mode |\n\n### Collaboration Anti-Patterns\n\n- **Indefinite collaboration** - No end date, becomes permanent coupling\n- **Asymmetric effort** - One team does all the work\n- **No clear goals** - Collaborating without knowing what to discover\n- **Avoiding difficult conversations** - Using \"collaboration\" to delay decisions\n- **Too many collaborations** - Teams spread too thin\n\n## Relationship to Other Methods\n\n- **X-as-a-Service Mode** - Common next step after collaboration defines APIs\n- **Facilitating Mode** - Alternative when one team is teaching another\n- **Enabling Team** - Often uses collaboration during intensive skill transfer\n- **Stream-Aligned Team** - May collaborate with platform or other stream-aligned teams\n- **Team Cognitive Load** - Collaboration is cognitively expensive\n\n## Citations\n\n- Skelton, M., & Pais, M. (2019). *Team Topologies: Organizing Business and Technology Teams for Fast Flow*. IT Revolution Press.\n- [Team Topologies Key Concepts](https://teamtopologies.com/key-concepts)"
  description: "Two teams working closely together for a defined period to discover new things."
