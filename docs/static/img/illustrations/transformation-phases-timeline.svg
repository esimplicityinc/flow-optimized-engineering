<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="8"/>
  
  <!-- Timeline line -->
  <line x1="40" y1="100" x2="760" y2="100" stroke="#cbd5e1" stroke-width="3"/>
  
  <!-- Phase boxes -->
  <rect x="30" y="60" width="100" height="80" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Phase 0</text>
  <text x="80" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">On-Prem</text>
  
  <rect x="150" y="60" width="100" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Phase 1</text>
  <text x="200" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Lift & Shift</text>
  
  <rect x="270" y="60" width="100" height="80" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#854d0e">Phase 2</text>
  <text x="320" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#854d0e">Awkward Middle</text>
  
  <!-- Phase 3 highlighted -->
  <rect x="390" y="50" width="110" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <text x="445" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Phase 3</text>
  <text x="445" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Cloud Native</text>
  <text x="445" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Infrastructure</text>
  
  <rect x="520" y="60" width="100" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="570" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Phase 4</text>
  <text x="570" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">Agentic Coding</text>
  
  <rect x="640" y="60" width="100" height="80" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
  <text x="690" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">Phase 5</text>
  <text x="690" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6">Cloud Native Code</text>
  
  <!-- Bottleneck indicator -->
  <text x="355" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">BOTTLENECK</text>
</svg>