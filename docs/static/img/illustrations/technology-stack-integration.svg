<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="450" fill="url(#bg)" rx="8"/>
  
  <!-- External Users -->
  <rect x="150" y="20" width="200" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="250" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4f46e5">External Users</text>
  
  <!-- Arrow -->
  <line x1="250" y1="60" x2="250" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway -->
  <rect x="100" y="80" width="300" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">API Gateway (auth, rate limiting)</text>
  
  <!-- Arrow -->
  <line x1="250" y1="120" x2="250" y2="140" stroke="#64748b" stroke-width="2"/>
  
  <!-- Service Mesh -->
  <rect x="50" y="140" width="400" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Service Mesh (mTLS, observability)</text>
  <rect x="80" y="175" width="80" height="35" rx="4" fill="white" stroke="#16a34a"/>
  <text x="120" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Service A</text>
  <rect x="210" y="175" width="80" height="35" rx="4" fill="white" stroke="#16a34a"/>
  <text x="250" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Service B</text>
  <rect x="340" y="175" width="80" height="35" rx="4" fill="white" stroke="#16a34a"/>
  <text x="380" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Service C</text>
  
  <!-- Arrow -->
  <line x1="250" y1="220" x2="250" y2="240" stroke="#64748b" stroke-width="2"/>
  
  <!-- Kubernetes -->
  <rect x="100" y="240" width="300" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">Kubernetes (orchestration)</text>
  
  <!-- Branches to tools -->
  <line x1="150" y1="280" x2="100" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="250" y1="280" x2="250" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="350" y1="280" x2="400" y2="310" stroke="#64748b" stroke-width="2"/>
  
  <!-- ArgoCD -->
  <rect x="50" y="310" width="100" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="100" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#be185d">ArgoCD</text>
  <text x="100" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#be185d">(GitOps)</text>
  
  <!-- OPA -->
  <rect x="200" y="310" width="100" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="250" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">OPA</text>
  <text x="250" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#b91c1c">(Policy)</text>
  
  <!-- OpenTelemetry -->
  <rect x="350" y="310" width="100" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4f46e5">OpenTelemetry</text>
  <text x="400" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4f46e5">(Observability)</text>
  
  <!-- Git -->
  <line x1="100" y1="360" x2="100" y2="390" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="390" width="100" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Git (Helm)</text>
</svg>