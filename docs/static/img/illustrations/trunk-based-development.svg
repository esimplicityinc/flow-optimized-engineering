<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="250" fill="url(#bg)" rx="8"/>
  
  <!-- Good example -->
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Good: Trunk-Based Development</text>
  
  <!-- Main branch -->
  <line x1="30" y1="70" x2="470" y2="70" stroke="#166534" stroke-width="3"/>
  
  <!-- Commits on main -->
  <circle cx="60" cy="70" r="6" fill="#166534"/>
  <circle cx="110" cy="70" r="6" fill="#166534"/>
  <circle cx="160" cy="70" r="6" fill="#166534"/>
  <circle cx="210" cy="70" r="6" fill="#166534"/>
  <circle cx="260" cy="70" r="6" fill="#166534"/>
  <circle cx="310" cy="70" r="6" fill="#166534"/>
  <circle cx="360" cy="70" r="6" fill="#166534"/>
  <circle cx="410" cy="70" r="6" fill="#166534"/>
  <circle cx="460" cy="70" r="6" fill="#166534"/>
  
  <!-- Short branches -->
  <path d="M60,70 Q85,50 110,70" fill="none" stroke="#86efac" stroke-width="2"/>
  <path d="M160,70 Q185,50 210,70" fill="none" stroke="#86efac" stroke-width="2"/>
  <path d="M260,70 Q285,50 310,70" fill="none" stroke="#86efac" stroke-width="2"/>
  <path d="M360,70 Q385,50 410,70" fill="none" stroke="#86efac" stroke-width="2"/>
  
  <text x="250" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Frequent, small commits merged quickly</text>
  
  <!-- Bad example -->
  <text x="20" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Bad: Long-Lived Feature Branches</text>
  
  <!-- Main branch -->
  <line x1="30" y1="190" x2="470" y2="190" stroke="#dc2626" stroke-width="3"/>
  
  <!-- Single commit at start and end -->
  <circle cx="60" cy="190" r="6" fill="#dc2626"/>
  <circle cx="460" cy="190" r="6" fill="#dc2626"/>
  
  <!-- Long branch -->
  <path d="M60,190 Q100,130 250,130 Q400,130 460,190" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="250" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Weeks of divergence</text>
  <text x="250" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">One painful merge at the end</text>
</svg>