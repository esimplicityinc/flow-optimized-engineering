<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="8"/>
  
  <!-- Pyramid layers -->
  <!-- E2E (top, smallest) -->
  <polygon points="200,30 160,90 240,90" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">E2E</text>
  
  <!-- Integration (middle) -->
  <polygon points="160,90 120,160 280,160 240,90" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">Integration</text>
  
  <!-- Unit (bottom, largest) -->
  <polygon points="120,160 60,260 340,260 280,160" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#166534">Unit Tests</text>
  
  <!-- Labels on right -->
  <text x="260" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">~10%</text>
  <text x="300" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">~20%</text>
  <text x="360" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">~70%</text>
  
  <!-- Description labels -->
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Fast, cheap at bottom; Slow, expensive at top</text>
</svg>