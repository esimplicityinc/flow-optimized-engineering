<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="350" fill="url(#bg)" rx="8"/>
  
  <!-- Triangle -->
  <polygon points="200,50 50,280 350,280" fill="none" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Bidirectional arrows -->
  <line x1="200" y1="70" x2="70" y2="260" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="260" x2="200" y2="70" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="200" y1="70" x2="330" y2="260" stroke="#7c3aed" stroke-width="2"/>
  <line x1="80" y1="280" x2="320" y2="280" stroke="#059669" stroke-width="2"/>
  
  <!-- Labels with colors -->
  <text x="200" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0891b2">Understanding</text>
  <text x="30" y="305" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#059669">Confidence</text>
  <text x="370" y="305" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Fast Feedback</text>
  
  <!-- Center text -->
  <text x="200" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">FOE</text>
</svg>