[project]
name = "foe-taxonomy"
version = "0.1.0"
description = "Flow Optimized Engineering as a Katalyst taxonomy bundle"
requires-python = ">=3.12"
dependencies = ["katalyst-engine>=4.1.0"]

[project.entry-points."katalyst_engine.bundles"]
foe = "foe_taxonomy:FoeBundle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foe_taxonomy"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.8"]
