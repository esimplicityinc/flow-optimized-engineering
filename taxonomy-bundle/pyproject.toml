[project]
name = "foe-taxonomy"
version = "0.3.0"
description = "Generate Katalyst taxonomy nodes from Flow Optimized Engineering docs"
requires-python = ">=3.12"
# No katalyst-engine dependency and no bundle entry point: this package declares no
# node types. FOE's field guides, frameworks and methods are Katalyst Forge's
# practice_area, practice and method kinds, prose included, so it only reads markdown
# and writes a change set for `kata tax import`.
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foe_taxonomy"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.8"]
