[project]
name = "foe-taxonomy"
version = "0.1.0"
description = "Generate Katalyst taxonomy nodes from Flow Optimized Engineering docs"
requires-python = ">=3.12"
# No katalyst-engine dependency: this package declares no node types and only
# reads markdown to write YAML. The kinds it emits belong to katalyst-forge,
# which the consuming taxonomy environment already provides.
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foe_taxonomy"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.8"]
