[project]
name = "foe-taxonomy"
version = "0.1.0"
description = "Generate Katalyst taxonomy nodes from Flow Optimized Engineering docs"
requires-python = ">=3.12"
# katalyst-engine only, per the bundle dependency contract. The practice_area,
# practice and method kinds come from katalyst-forge, which the consuming
# environment already provides; this declares one extension of `method`.
dependencies = ["katalyst-engine>=4.1.0", "pyyaml>=6.0"]

[project.entry-points."katalyst_engine.bundles"]
foe = "foe_taxonomy:FoeBundle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foe_taxonomy"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.8"]
