# ============================================
# TREND SYNTHESIS
# ============================================
trend_synthesis:
  new_trends:
    - id: multi-agent-orchestration-wave
      description: >
        Multi-agent orchestration has moved from theoretical to practical.
        Astro, Oh-My-OpenClaw, Gas Town, Anthropic Code Review, and
        Augment Intent all ship DAG-based or coordinator-based multi-agent
        systems. This is the dominant NEW signal in this period.
      evidence:
        - web-001  # Astro orchestrator
        - web-002  # Oh-My-OpenClaw
        - web-030  # Anthropic Agentic Coding Report
        - web-031  # Anthropic multi-agent code review
        - web-033  # Gas Town (Yegge)
        - web-036  # Augment Intent
      foe_relevance: method_candidate
      signal_strength: high

    - id: agent-memory-persistence
      description: >
        Agent memory and persistence is emerging as a critical concern.
        ClawMemory provides Git-based versioned memory, and Rudel provides
        session analytics. The field recognizes that stateless agents
        re-solve problems and lose context across sessions.
      evidence:
        - web-003  # ClawMemory
        - web-004  # Rudel session analytics
      foe_relevance: method_candidate
      signal_strength: high

    - id: agent-governance-layer
      description: >
        As multi-agent systems deploy, governance becomes necessary.
        Who approved this change? What agent made it? Can we roll back?
        Audit trails and approval workflows for agent actions.
      evidence:
        - web-010  # Governance layer for multi-agent
        - web-009  # MCP gateway with security scanning
        - web-011  # OpenClaw Exposure Watchboard
      foe_relevance: method_candidate
      signal_strength: medium

    - id: test-driven-agent-definition
      description: >
        TDAD applies TDD principles to agent design: define behavior
        through tests, compile the agent from specifications. Bridges
        proven SE methodology with agent development.
      evidence:
        - web-025  # TDAD paper
      foe_relevance: method_candidate
      signal_strength: medium

    - id: agent-reliability-science
      description: >
        Academic push toward a rigorous science of agent reliability,
        including consistency measurement, benchmark validity assessment,
        and real-world evaluation frameworks.
      evidence:
        - web-022  # Science of AI Agent Reliability
        - web-023  # Agent benchmarks vs real-world
        - web-019  # AI Code Review Agent evaluation
      foe_relevance: method_candidate
      signal_strength: high

  evolved_trends:
    - id: harness-over-model-v2
      evolved_from: harness-over-model
      description: >
        The harness-over-model thesis now includes model routing (different
        models for different subtasks), token efficiency optimization
        (mcp2cli), and platform-as-moat (Cursor vs Claude Code). The
        harness is becoming the primary competitive differentiator.
      evidence:
        - web-002  # Model routing in Oh-My-OpenClaw
        - web-005  # mcp2cli token efficiency
        - web-038  # Platform moat perspective
        - web-037  # Cost comparison
      signal_strength: high

    - id: mcp-maturation-and-skepticism
      evolved_from: harness-over-model
      description: >
        MCP is maturing (Skills, streamable HTTP, OAuth 2.1) but facing
        skepticism about overhead and value. Enterprise adoption is strong,
        but individual developers question the complexity. Protocol
        bifurcation: enterprise vs individual use cases.
      evidence:
        - web-005  # 96-99% token reduction without MCP
        - web-006  # MCP for enterprise, not solo
        - web-007  # MCP Skills spec evolution
        - web-008  # Best way to use MCP is not to
        - web-009  # MCP gateway pattern
        - web-035  # Microsoft A2A + MCP support
      signal_strength: high

    - id: dark-flow-crystallization
      evolved_from: dark-flow-productivity-illusion
      description: >
        The vibe coding backlash has crystallized into a clear distinction
        between "vibe coding" (low-skill, high-throughput, low-quality)
        and "professional agentic coding" (high-skill, high-throughput,
        high-quality). Academic evidence now supports this distinction.
      evidence:
        - web-012  # Breaking the spell of vibe coding
        - web-013  # Rat in a maze metaphor
        - web-016  # 500K lines of AI-generated code
        - web-024  # Novice developers create review overhead
      signal_strength: high

    - id: productivity-measurement-crisis
      evolved_from: dark-flow-productivity-illusion
      description: >
        METR's decision to revise their experimental design after the
        "20% slowdown" finding creates a measurement crisis. We don't
        yet have reliable methods to measure AI coding productivity.
        Resolution rates, benchmark scores, and self-reported metrics
        are all insufficient.
      evidence:
        - web-032  # METR redesigning experiments
        - web-019  # Resolution rates insufficient
        - web-023  # Benchmarks don't reflect real work
        - web-017  # GPT-5.3 benchmark skepticism
      signal_strength: high

    - id: supervisory-costs-empirical
      evolved_from: supervisory-programming-costs
      description: >
        Academic evidence now confirms that novice developers using AI
        create MORE review overhead, not less. The supervisory cost is
        real and measurable. Experienced users grant more autonomy but
        this may mask quality issues.
      evidence:
        - web-024  # Novice review overhead paper
        - web-028  # Anthropic autonomy measurement
        - web-013  # Rat in a maze experience
      signal_strength: high

    - id: production-hardening-v2
      evolved_from: production-hardening-wave
      description: >
        Production hardening now includes security scanning (Claude Code
        Security), CI/CD integration (Cline CLI headless mode), and
        agent governance layers. The focus has shifted from "can agents
        code" to "can agents code safely in production."
      evidence:
        - web-027  # Claude Code Security
        - web-034  # Cline CLI CI/CD mode
        - web-010  # Governance layer
        - web-011  # Exposure Watchboard
      signal_strength: high

  recurring_trends:
    - id: benchmark-skepticism
      description: >
        Community continues to fact-check vendor benchmark claims.
        SWE-Bench Pro and academic papers question ecological validity.
      evidence:
        - web-017
        - web-023
      signal_strength: medium

    - id: tool-migration-fatigue
      description: >
        Developers continue migrating between tools (Cursor -> Claude Code
        -> OpenCode -> etc). The market hasn't settled on a dominant
        paradigm. Configuration portability tools (rule-porter) emerge.
      evidence:
        - web-014
        - web-039
        - web-040
      signal_strength: medium

