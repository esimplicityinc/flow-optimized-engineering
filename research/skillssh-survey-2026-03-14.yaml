# ============================================
# PATTERN ANALYSIS
# ============================================

patterns_observed:

  skill_chaining:
    description: |
      Skills increasingly reference and invoke each other. obra/superpowers
      is the clearest example: brainstorming -> writing-plans -> executing-plans.
      Google's stitch-loop references design-md. This creates skill ecosystems
      rather than isolated capabilities.
    foe_relevance: high
    foe_notes: |
      FOE skills should be designed for chaining. Our observation-framework
      could invoke field-guide-linter. Method creation could invoke
      observation validation. This is the direction the ecosystem is heading.

  baton_pattern:
    description: |
      Google's stitch-loop introduces a "baton system" where each iteration
      writes instructions for the next. A file (.stitch/next-prompt.md)
      acts as a relay between agent invocations. This enables autonomous
      iterative development without maintaining session state.
    foe_relevance: medium
    foe_notes: |
      Interesting pattern for long-running FOE workflows. Could enable
      multi-session observation collection or method maturation tracking.
      The key insight: state lives in files, not in agent memory.

  verification_gates:
    description: |
      verification-before-completion has established a pattern where
      skills act as gates rather than tools. The skill doesn't DO anything -
      it prevents premature completion claims. This "negative skill" pattern
      (preventing bad behavior rather than enabling good behavior) is
      increasingly common.
    foe_relevance: very-high
    foe_notes: |
      FOE should adopt gate skills. A "verify-observation-evidence" gate
      could prevent observations from being created without supporting
      evidence. A "method-maturity-gate" could prevent premature promotion.

  enterprise_bulk_publishing:
    description: |
      Microsoft now has TWO collections totaling 3.25M installs across
      39 skills. This is enterprise-scale skills deployment. The azure-skills
      collection (751.7K) is entirely new since Feb 20.
    foe_relevance: low
    foe_notes: |
      Signals that skills.sh is becoming an enterprise distribution channel.
      FOE skills could eventually be published here for broader adoption.

  description_anti_pattern_update:
    description: |
      The Feb 20 report identified that descriptions summarizing workflow
      cause agents to skip reading the full body. Reviewing current top
      skills, the best-designed skills (obra/superpowers) use short
      descriptions that DON'T summarize the workflow. brainstorming's
      description is just "Help turn ideas into fully formed designs and
      specs through natural collaborative dialogue." The actual workflow
      is in the body.
    foe_relevance: high
    foe_notes: |
      Our existing skills follow this pattern correctly. Continue to
      keep descriptions as capability statements, not workflow summaries.

  agent_distribution_data:
    description: |
      Skills now show per-agent install counts. For obra/superpowers
      brainstorming: opencode (45.1K), gemini-cli (43.3K), codex (43.1K),
      github-copilot (40.8K), kimi-cli (37.2K), amp (37.1K).
      For anthropics webapp-testing: opencode (18.5K), gemini-cli (17.6K),
      codex (17.2K), claude-code (15.9K), cursor (15.7K).
    foe_relevance: medium
    foe_notes: |
      OpenCode and Gemini CLI are the top install targets, not Claude Code.
      This suggests skills are being installed across many agents, not just
      the one they were designed for. Cross-agent compatibility matters.

  marketing_skills_explosion:
    description: |
      coreyhaines31/marketingskills has expanded significantly with
      skills like seo-audit (42.1K), copywriting (35.1K), and many more.
      Total collection: ~160K installs across 15+ skills. This signals
      skills.sh expanding well beyond coding into business domains.
    foe_relevance: low

