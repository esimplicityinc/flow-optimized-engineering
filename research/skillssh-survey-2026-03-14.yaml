# ============================================
# KEY INSIGHTS & RECOMMENDATIONS
# ============================================

insights:

  - id: insight-001
    title: "Skills ecosystem is consolidating around major vendors"
    detail: |
      Platform list swapped 4 agents (removed indie tools, added Google/AWS/Factory).
      Microsoft dominates installs (3.25M). Anthropic has most GitHub stars (92.8K).
      Google entered with Stitch. This is becoming an enterprise distribution channel.
    foe_implication: |
      FOE skills should be designed for cross-agent compatibility. The platform
      is consolidating but skills work across all 18 agents.

  - id: insight-002
    title: "obra/superpowers defines the agentic development lifecycle"
    detail: |
      324.3K total installs, 81.8K GitHub stars, 14 skills that chain together
      into a complete workflow. From brainstorming through code review to branch
      completion. This is the de facto standard for agentic coding methodology.
    foe_implication: |
      FOE should study and potentially integrate with this workflow rather than
      competing. Our skills (observation-framework, method-framework, field-guide-linter)
      complement rather than overlap with superpowers.

  - id: insight-003
    title: "Verification gates are a proven pattern"
    detail: |
      verification-before-completion (17.8K, +120%) proves that "negative skills"
      (preventing bad behavior) are valued. The skill's growth rate matches
      the collection average, meaning users install it alongside productive skills.
    foe_implication: |
      FOE should create verification gate skills for observation quality,
      method maturity, and field guide completeness. The pattern works.

  - id: insight-004
    title: "Security auditing has matured but gaps remain"
    detail: |
      Three providers, community vetting skill, even Microsoft flagged.
      But 71-skill collections like inferen-sh still have questionable
      security posture. The ecosystem needs more user-side verification.
    foe_implication: |
      Any FOE skills published to skills.sh should pass all three audits.
      Consider adopting skill-vetter's permission scope analysis for
      evaluating third-party skills we recommend.

  - id: insight-005
    title: "Token efficiency patterns emerging in skill design"
    detail: |
      webapp-testing explicitly says "DO NOT read the source until you try
      running the script first" to preserve context window. brainstorming
      uses short descriptions that don't summarize workflow. These are
      deliberate context-efficiency patterns.
    foe_implication: |
      Continue following the description anti-pattern guidance from Feb 20.
      Consider adding explicit "don't read source, use --help" patterns
      for FOE skills that reference external scripts.

  - id: insight-006
    title: "File-based state persistence enables multi-session workflows"
    detail: |
      Google's stitch-loop baton system and obra's spec files both use
      file-based state to enable workflows that span multiple agent sessions.
      State lives in the repo, not in agent memory.
    foe_implication: |
      FOE already does this with frontmatter-based observation/method files.
      This validates our approach. Consider whether a "baton" pattern could
      enable automated field guide maintenance across sessions.

  - id: insight-007
    title: "Cross-agent install data reveals OpenCode as top target"
    detail: |
      Per-agent install counts show OpenCode, Gemini CLI, and Codex as
      top install targets - not Claude Code or Cursor. This suggests
      CLI-based agents are the primary skills consumers.
    foe_implication: |
      FOE skills are already OpenCode-native. This is the right target.
      Ensure skills also work well in Gemini CLI and Codex contexts.

recommendations:
  - priority: high
    action: "Validate FOE skills against latest obra/superpowers patterns"
    detail: |
      obra/superpowers has evolved significantly. Review our skills for
      alignment with their chaining pattern, verification gates, and
      process flow documentation (graphviz diagrams).

  - priority: high
    action: "Create FOE verification gate skills"
    detail: |
      Following the verification-before-completion pattern, create gates for:
      - observation-evidence-gate (prevent observations without evidence)
      - method-maturity-gate (prevent premature promotion)
      - field-guide-completeness-gate (prevent incomplete guides)

  - priority: medium
    action: "Study skill-vetter for FOE skill governance"
    detail: |
      Adapt the permission scope analysis and red flag detection for
      evaluating skills we recommend or install in FOE projects.

  - priority: medium
    action: "Consider publishing FOE skills to skills.sh"
    detail: |
      The ecosystem has matured enough for FOE skills to be published.
      Our observation-framework and method-framework skills would be
      unique offerings. Ensure they pass all three security audits first.

  - priority: low
    action: "Monitor stitch-loop baton pattern for FOE applicability"
    detail: |
      The file-based baton system could enable automated multi-session
      FOE workflows. Worth monitoring but not urgent to adopt.
