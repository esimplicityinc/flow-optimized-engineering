# ============================================
# CROSS-CUTTING PATTERNS & FOE INSIGHTS
# ============================================

cross_cutting_patterns:

  evidence_over_ceremony:
    description: |
      Multiple skills enforce "evidence before claims" patterns:
      - verification-before-completion: "NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE"
      - test-driven-development: "If you didn't watch the test fail, you don't know if it tests the right thing"
      - systematic-debugging: "ALWAYS find root cause before attempting fixes"
      - receiving-code-review: "Actions speak. Just fix it."
    foe_alignment: |
      This is FOE's core principle expressed across different domains.
      FOE should adopt these patterns wholesale for observation and
      method quality enforcement.

  rationalization_prevention:
    description: |
      obra/superpowers skills include comprehensive rationalization tables
      that anticipate and counter cognitive shortcuts. Each table maps
      common excuses to concrete rebuttals.
    foe_alignment: |
      FOE should adopt this pattern for observation quality. Common
      rationalizations like "this observation is obvious" or "we don't
      need evidence for this method" should have explicit counters.

  feedback_loop_architecture:
    description: |
      The two-stage review pattern (spec compliance THEN code quality)
      from subagent-driven-development creates layered feedback:
      1. Does it match the spec? (correctness)
      2. Is it well-built? (quality)
      This prevents conflating "does it work?" with "is it good?"
    foe_alignment: |
      FOE observation review could adopt this two-stage pattern:
      1. Does the observation match the evidence? (accuracy)
      2. Is the observation well-written and actionable? (quality)

  self_improvement_loop:
    description: |
      self-improving-agent implements a complete learning cycle:
      experience → pattern → skill update → memory consolidation.
      Confidence tracking determines when patterns become rules.
    foe_alignment: |
      This IS the FOE observation-to-method pipeline:
      experience → observation → method → maturity level.
      The confidence tracking maps to maturity levels
      (Emerging → Established → Validated).

  incremental_task_design:
    description: |
      writing-plans enforces 2-5 minute tasks with "no placeholders."
      Each task is independently testable and committable.
    foe_alignment: |
      FOE's incremental-development guide should reference this
      granularity standard. Observation creation could be decomposed
      into similarly bite-sized steps.

